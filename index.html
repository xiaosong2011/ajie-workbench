粗重的喘息\n```\n\n**组合一致性（每段必查）：**\n- 段间用 `hard cut →` 标记（或直接时间轴连续）\n- 跨段生成衔接：相邻段共用同一关键帧/资产编号引用，保证道具和粒子连续\n- **分段独立生成铁律（2026-08-11 用户确认）：** 分开生成时每段提示词**完全自包含**——【风格】【色卡参考】【镜头】逐段完整写全，**禁止写"延续上段/沿用/承接上镜/同上"等任何继承表述**（每段单独投喂，模型无跨段记忆）；同场景跨段的统一靠**色卡四色完全一致**+风格描述逐字一致实现，不靠文字引用\n- 资产锁/时间轴锁/空间锁/光影锁/风格锁/末态继承锁六重一致性（见三）\n- 结尾回到空间尺度对比形成视觉闭环（如开场爆炸火光 → 结尾窗外天光）\n\n**时间分配原则：**\n- 每个时间点 1.5-3s，钩子/高潮 1.5-2s 快切，情绪沉淀 2.5-3s\n- 每段时长由剧情内容量决定（对话段按台词量自然语速≈4字/s估算，动作段按动作密度；读取一层信息≈2-3s，每多一层+2-3s）\n- **对白戏时长硬规则（2026-08-10）**：台词没说完不许切镜。单镜 8-12字 → 该时间点 2.5-4s；15字以上 → 拆 2-3 个连续时间点（说着→听者反应/道具特写→继续说），台词连续说完，禁止为保 2s 快切而断句/口型错位。对话段节奏由台词量决定，2s 切镜仅作无台词动作段参考\n- 一段只做一个镜头运动，不复合\n- 画面内容与运镜绑定但不互抢\n- 物理细节锚定真实感（具体的外部物理事件）\n\n**门禁D：提示词门禁（生成段式，含三大考核标准）**\n- [ ] 每段完整五段式（风格/色卡参考/镜头/时间轴/声音）？（>60s 长内容才六段式：+【出场人物与场景】）\n- [ ] >60s 的段：出场人物与场景写清（@资产位）？≤60s 的段：无此模块（回归 V3 实测好的五段式）？\n- [ ] 色卡参考位于【风格】之后、【镜头】之前？主色相+辅助色+高亮色+暗部色四色齐全且附 HEX+RGB？\n- [ ] 时间轴连续叙述？段间无缝衔接？总时长参考目标（建议性，可弹性）？\n- [ ] **运镜内嵌（V4.0.6）：每时间点运镜跟随情绪弧线进化（建立→引入→聚焦→爆发→收束）？运镜有完整轨迹+景别变化？视觉调度有大-中-小-大层级或尺度对比收尾？**\n- [ ] 开场直接炸开？不解释来历？\n- [ ] 动作+物理反馈+括号音效嵌入描述？\n- [ ] 零心理描写？只写可见可听？无抽象情绪词？\n- [ ] 台词自然语速能说完？角色名："台词"格式？\n- [ ] **对白戏时长：台词没说完不许切镜**？单镜 8-12字 已拉长到 2.5-4s？15字以上已拆连续时间点且台词连续？\n- [ ] 宏大场景：景别+焦段+人物比例（§4.5）？\n- [ ] **站位锚定：每镜首句写清人物空间关系（方位/距离/面向/前后景）？跨时间点位置变化写明移动轨迹？**（2026-08-11 用户反馈新增）\n- [ ] **视线锚定：对话/对手戏每镜写清谁看谁、看哪里、何时移开？听者视线是否约束？**（2026-08-11 用户反馈新增）\n- [ ] **分段独立生成：每段【风格】【色卡参考】【镜头】完整自包含？无"延续/沿用/上段"等继承表述？同场景跨段色卡逐字一致？**（2026-08-11 用户确认新增）\n- [ ] **打斗段（§4.6.8）：动作动力链完整（意图→起手→重心→发力→接触→反馈→收招→下格继承）？攻防成对（攻击必有防守/闪避/格挡/反制）？无瞬移/无理由换边/穿模/空间重置？P15 类结尾不静止摆pose？**（2026-08-16 武打体系入库新增）\n\n- [ ] 每段纯中文为主？英文标签每镜2-4个且兼容？\n- [ ] 六重一致性锁（资产/时间轴/空间/光影/风格/末态继承）满足？\n- [ ] 段间 hard cut 标记或时间轴连续？\n- [ ] 结尾视觉闭环（意象回收）？\n- [ ] 中文输出最后一行"无字幕，无背景音乐"？\n\n---\n\n## 三、分镜组合一致性（V2核心升级·保留）\n\n**目标：多段视频拼接成一集，段间无缝衔接，整体分镜要求高。**\n\n### 3.1 双轨时间轴模型\n\n- **段级时间轴**：每段独立镜头组，**段长按剧情/场次自然切，3s~15s 不等，15s 是上限不是固定值**（一段戏讲完就收，可 7s/10s/12s 收尾，不硬凑 15s）\n- **集级时间轴**：多段首尾相接 = 连续总时长（前一镜结束=后一镜开始，无跳秒/重叠/留白）\n- 两轨并存：分段生成时用段级，成片拼接时用集级\n\n### 3.2 六重一致性锁\n\n| 锁 | 内容 | 检查项 |\n|----|------|--------|\n| 资产锁 | 角色/场景/道具编号跨段不得重置 | 服装/骨相/道具状态连续 |\n| 时间轴锁 | 段间时间连续 | 前段末=后段首，无跳秒 |\n| 空间锁 | 空间方向/位置连续 | 视线轴/走位方向/门窗位置不漂移 |\n| 光影锁 | 光源方向/色温/时间一致 | 同一场景光影不突变 |\n| 风格锁 | 渲染/色彩/质感一致 | VISUAL DNA 每段声明 |\n| **末态继承锁**（V4.0.2 新增） | **可变数据每段同步更新** | 后段继承前段结尾的人物站位/姿态/互动/构图，用分镜参考图锁死 |\n\n**末态继承锁详解（AI 视频多段拼接核心）**：AI 视频 2.0 单段上限 15s，每段生成时无前段记忆（人物站位/姿态/互动每 15s 归零）。**禁止用上段尾帧当下段首帧直接拼接**（无动态继承，跳切最重）。正确做法：每段生成前，按上段结尾人物状态绘制分镜参考图，固定姿态/位置/互动关系，同步更新提示词中的变动数据。\n\n### 3.3 段间衔接四重规则\n\n1. **资产衔接**：相邻段共用同一关键帧/资产编号，道具与粒子连续\n2. **动作衔接**：段尾动作与段首动作连贯（动作匹配转场优先）\n3. **情绪衔接**：段尾情绪 → 段首情绪递进或反转（有逻辑）\n4. **声音衔接**：SFX 跨段连续（环境音不中断）\n\n### 3.4 银幕轴线规则（2026-08-11 吸收小逻九宫格）\n\n- **主轴建立**：人物与人物、人物与道具、或人物运动方向形成主轴；默认将摄影机保持在轴线同一侧（一百八十度空间关系）\n- **正反打**：保持视线高度和方向匹配；不得因反打镜像人物服装、场景结构或左右配饰\n- **越轴处理**：必须越轴时，先加入中性正面、轴线上镜头或清晰运动过渡；不得直接硬越\n- **反向位**：人物看向画外目标时，后续镜头展示的目标必须位于合理反向位置\n- **空间稳定**：越轴反打时保持空间左右关系稳定，不得镜像房间\n- **人物移动**：人物从画面一侧移动时，后续镜头保持一致银幕方向；不得无过渡镜头瞬移到房间另一侧；门窗、家具、灯具和关键道具不得因换机位而漂移\n- 完整分镜九宫格规范见 references/小逻-视觉分镜九宫格生成.md\n\n### 3.5 四大无痕转场\n\n1. **遮挡转场**：前景全屏遮挡→切换。遮挡物：树木/墙体/路人\n2. **甩镜转场**：高速甩镜头运动模糊切点\n3. **动作匹配转场**：前后相同动作顶点切换\n4. **相似构图转场**：前后构图/形状高度匹配\n\n### 3.6 组合验证\n\n- 多段拼合后总时长 = 目标集长 ± 0.5s\n- 段间无黑屏/无转场断裂\n- 每集检查：钩子是否在开头、悬念是否在结尾\n- 考核标准①复核：衔接流畅（四重衔接+六重锁）+ 时长合理（内容量决定）\n\n### 3.7 AI视频多段拼接方法论（V4.0.2 新增·实操验证）\n\n> AI 视频 2.0 单段上限 15s，多段拼接成整集时最容易出现：画面跳切、人物动作断层、对白无气口。\n> **根源**：每一段生成无前段记忆，新片段不会继承上一段的人物站位、姿态、互动等动态信息，每 15s 数据归零。\n> **错误做法**：用上一段尾帧当下一段首帧拼接——完全没有动态继承，拼接痕迹最重。\n\n**数据两类划分（核心认知）：**\n\n| 类别 | 内容 | 处理方式 |\n| :--- | :--- | :--- |\n| **不变技术数据** | 人物资产图、场景图 | 全程固定导入，不变量 |\n| **可变变动数据** | 人物站位、姿态、人物间空间互动、画面构图 | **每段都要同步更新**——拼接流畅的关键 |\n\n**双方案搭配使用，缺一不可：**\n\n**方案A·技术手段（适配 AI 生成特性）：**\n1. **完善变动数据（重中之重）**：变动数据 = 提示词 + 参考图/分镜图 + 音视频素材，文字+参考图搭配使用（只靠提示词易反复抽卡）。每段生成前根据上一段结尾人物状态绘制分镜参考图，给 AI 明确人物姿态、位置、互动关系，同步更新提示词。\n2. **拼接处用"切近（换机位）"**：不强行做同一个连贯长镜头，拼接节点更换机位、拆成两个不同镜头，规避同机位直接衔接的跳切卡顿。\n\n**方案B·导演思维（观众视角优化观感）：** 从观感层面规避生硬拼接，与技术手段配合才能彻底解决——只靠单一方法无法应对所有剧情场景。\n\n**实操流程：**\n```\n找拼接问题 → 分析根源（AI 无长时序记忆 + 可变数据未同步）\n→ 双方案处理 → 核心操作：① 绘制分镜参考图  ② 拼接节点换机位\n```\n\n**与现有规则的衔接：**\n- 跨段生成时：先定上段尾帧人物状态 → 绘制分镜参考图（固定姿态/位置/互动）→ 提示词同步更新变动数据 → 拼接节点换机位\n- 硬切镜头建议单独生成后剪辑拼接\n- **段间衔接三手法六式（V5.0.1 强化·每段拼接节点必用，禁止首尾帧拼接）**：\n\n> 核心：**拼接节点=换机位节点**。每段尾和段首都预留衔接节点——段尾末镜不做完整收束（留动作中间态），段首首镜从动作承接点开始，且拼接节点必须满足三选一。\n\n**三手法（至少选一，换机位是基础必选）：**\n1. **换机位**：同一动作/状态换角度、换机位高度、换轴线方位（正→侧 / 平视→俯仰 / 远→近）——规避同机位直接衔接的跳切卡顿，最优先\n2. **切景别**：跨级跳切（全景↔特写 / 中景↔大特写），景别跨度越大拼接痕迹越弱\n3. **跨段反应**：段尾 A 的动作 → 段首 B 的反应镜头（动作-反应跨段成对）\n\n**六式（具体衔接手法）：**\n| 式 | 手法 | 用法 | 适用 |\n|---|------|------|------|\n| ① | 动作连续+换机位 | 段尾动作起始，段首同动作不同机位完成（match on action 跨机位） | 战斗/动作段之间·最佳 |\n| ② | 反应镜头衔接 | 段尾 A 动作 → 段首 B 可见生理应激反应 | 施压/信息揭示后 |\n| ③ | 景别跳切 | 段尾全景 → 段首特写（或反之），情绪断裂/强调时刻 | 情绪拐点/转场 |\n| ④ | 声音先入 | 段尾声音延续到段首画面（雨声/剑鸣/台词气音跨段） | 氛围连续段 |\n| ⑤ | 道具/细节衔接 | 段尾落点道具特写，段首同道具新角度 | 关键道具贯穿 |\n| ⑥ | 空镜过渡 | 段尾动作收，段首环境空镜（雨幕/烛火/尘土）再接新段 | 节奏喘息点 |\n\n**拼接节点设计规则：**\n- 段尾末镜：留动作中间态/未完成收束（挥剑到一半/转身到一半/台词没说完），不落到静止pose\n- 段首首镜：从动作承接点切入 + 换机位（必选）+ 按需叠加景别跳切/跨段反应/声音先入\n- 禁止：同机位直接接续 / 尾帧当首帧 / 静止画面衔接静止画面 / 段尾收束完整再切\n- 每个拼接节点在分镜剧本阶段就要标好（见 §2.2 分镜表"段间衔接"列）\n\n完整方法论见 references/AI视频拼接问题总结-多段拼接方法论.md\n\n---\n\n## 四、导演视听控制\n\n### 4.1 镜头运动词典（老李补充·运镜情绪）\n\n| 运镜 | 关键词 | 情绪 |\n|------|--------|------|\n| 推进 Dolly In | slow dolly in | 逼近审视、专注 |\n| 拉远 Dolly Out | slow dolly out | 疏离揭示、抽离 |\n| 横移 Tracking | side tracking | 漫游观察、跟随 |\n| 升降 Crane | crane up/down | 上帝视角、揭示规模 |\n| 环绕 Orbit | counter-clockwise orbit | 对峙张力、卷入 |\n| 甩镜 Whip Pan | fast whip pan | 混乱能量、速度感 |\n| 手持 Handheld | subtle handheld | 临场感、不安 |\n| 固定 Locked-off | tripod shot, locked-off | 稳定、仪式感、凝视 |\n\n> 小逻分级运镜为本（特写稳定/中近景轻微手持/全景呼吸感/斯坦尼康长镜），上表补充情绪语义。\n\n**真实手持三招（V2.2 新增·刺猬星球·消除摆拍感）：**\n1. 运动轨迹不过度平滑：推进时短暂减速、接近主体前轻微停顿（人为操作痕迹）\n2. 主体与镜头不同步：给运镜加微小滞后，模拟实拍反应延迟\n3. 低机位大透视：压低机位仰拍，放大前景尺度对比，广角透视畸变让线条向消失点汇聚（史诗感/压迫感/电商张力）\n\n#### 4.1.1 镜头选择决策表（V2.2 新增·来源：Cinematic World Generator）\n\n> 不记运镜清单，直接按「想表达什么情绪」选机位。景别/高度/遮挡都是叙事决策，不是随机切换。\n\n| 叙事意图 | 机位选择 | 画面组织 |\n|---------|---------|---------|\n| 巨物/敬畏/神圣尺度 | 低角度、地面机位、前景尺度、微小人物 | 巨型建筑/巨兽充满画面上部 |\n| 孤立/仪式/社会秩序 | 高角度、俯拍、留白负空间 | 人物如棋子在环境中 |\n| 亲密/劳动/情绪/张力 | 近景、局部（手/半脸）、浅景深 | 只露身体局部，聚焦细节 |\n| 秘密/窥视/层级/见证 | 过肩、门框构图、画中画、遮挡 | 通过前景框架看主体 |\n| 旅行/压力/神秘/记忆 | 纵深、剪影、反射、烟雾尘雨、火光 | 部分可见，环境参与叙事 |\n\n> 用法：写镜头前先问"这一镜想让观众感觉到什么？"，查表定机位，再配 §4.1 运镜词典选运动方式。\n\n#### 4.1.2 一镜到底长镜头六维控制（2026-08-10 吸收·奔跑/追逐/跟随叙事）\n\n> 用于奔跑追逐、跟随式一镜到底。核心：把抽象氛围词全换成可执行的物理流程。\n\n1. **镜头叙事目标**：动笔前定义运镜目的（示例：15s 一镜到底横向跟拍奔跑女主，营造紧张追逐压迫感；镜头短暂失焦偏移到追赶者，再快速抓回女主，构建空间层次）\n2. **空间三层分层（强制）**：前景层 / 主体层（奔跑主角）/ 中景层（街道桌椅、路人、追赶者，承载冲突）/ 远景层（街道消失点、尽头出口）。分层防 AI 空间混乱\n3. **物理惯性+不完美手持**：真实感来自镜头不完美抖动与惯性滞后——手持镜头自带呼吸微颤，撞击后镜头沉降\n4. **焦点叙事设计（模拟摄影师临场失误）**：短暂失焦增强纪实感——"焦点短暂偏移至追赶者面部，越过人群漂移到远处女主，0.3 秒后迅速对焦拉回主体"，复刻真人拍摄重新锁定目标的临场操作\n5. **分层声音空间**：声音随镜头景别同步变化构建立体声场——镜头转向追赶者时，女主喘息声退至声场远端，追赶者脚步声/粗重呼吸占据声场中心；镜头切回女主，她的喘息重新成为音频主体\n6. **负面约束必加**：禁止中途切镜、禁止镜头瞬移变焦、禁止人物肢体滑行/身体融合、禁止物体丢失重量感\n\n### 4.2 八种电影布光全量表（补充·导演思维课 + 费曼学习法）\n\n> V2.1 原有三种（分割光/侧逆光/顶光）→ V2.2 扩展为完整的八种标准布光。\n\n| 序号 | 布光方式 | 光源位置 | 视觉效果 | 关键词 | 适用场景 |\n|------|---------|---------|---------|--------|---------|\n| 1 | 蝴蝶光（美女光） | 前上方 | 唯美、显瘦、面部立体 | butterfly lighting, paramount lighting | 人物美化、广告、女性特写 |\n| 2 | 顶光（骷髅光） | 正上方 | 阴森、压抑、眼窝深阴影 | hard top light, overhead, dramatic shadow | 审讯、惊悚、压迫、恐怖 |\n| 3 | 伦勃朗光 | 侧前方 | 经典人像、立体、三角光 | Rembrandt lighting, triangle light | 人物肖像、权威角色、经典叙事 |\n| 4 | 阴阳光（分割光） | 正侧面 | 明暗对半、戏剧张力 | split lighting, dramatic, hard light from side | 悬疑、正邪对立、两面性 |\n| 5 | 轮廓光（边缘光） | 斜后方 | 勾勒轮廓、分离背景 | rim lighting, backlight, golden hour, edge light | 英雄出场、剪影、氛围感 |\n| 6 | 逆光 | 正后方 | 剪影、神秘 | backlight, silhouette | 剪影、悬疑、史诗感 |\n| 7 | 底光 | 下方 | 恐怖、诡异 | bottom light, under lighting, horror | 恐怖、反派、噩梦 |\n| 8 | 顺光 | 正前方 | 明亮、平、少阴影 | front light, flat lighting | 新闻、美妆、产品展示 |\n\n> 提示：①完整光圈值 f/1.0-f/64 共十三档（光圈越大→景深越小→背景越虚）；②焦段越长→景深越小（16mm 大景深→200mm 小景深）；③光度与光源距离成平方反比关系\n\n> 配套子节：§4.2.1 色彩体系控制（HEX 色卡三步法）→ §4.2.2 大师调色风格参考库（色系速查+导演名安全转换表）→ §4.2.3 验证过的完整提示词模板库（电影感黄金公式+9位导演模板）。布光表管单镜头光源，色卡体系管跨镜头色彩统一，两者叠加使用。\n\n#### 4.2.1 色彩体系控制（V2.2 新增·刺猬星球 HEX 调色法）\n\n> 来源：刺猬星球 super-i。解决 AI 生成画面色彩随机、跨镜头色彩漂移（小逻时间轴一致性的色彩层补充）。\n\n**底层逻辑：把颜色控制提前到生成之前**，用色值代替模糊文字（"我要蓝色"→锁死 HEX 色域）。\n\n**三步工作流：**\n1. **获取专属色卡**：上传 10 张同风格参考图 → 扫描提取核心 HEX 色值 → 生成专属色卡图\n2. **生图锁定色彩**：色卡作为参考图喂给生图工具，提示词只写主体 → 画面自动复用色彩体系\n3. **视频色彩延续**：用色卡生成的高质量静态图作为**首帧参考图**垫入视频工具 → 提示词只写动作不写光影 → 视频咬住首帧色彩，得到院线级统一调色\n\n**用法建议：**\n- 漫剧立项时先做专属色卡（10张同风格参考 → 色卡），全剧色彩体系统一\n- 每个场景变体（日/夜/战斗）可派生子色卡，但主色相不变\n- 跨集色彩一致性：同一角色/场景沿用同一色卡\n\n#### 4.2.2 大师调色风格参考库（V2.2 新增·V3.0 HEX增强·色卡速查）\n\n> 与 §4.2.1 配套：确定风格基调时直接查表选一种大师色系 → 用该色系的参考图/关键词生成色卡。**导演姓名不写进最终提示词**（内容安全红线），只写色彩方案。\n\n| 大师/流派 | 核心色系 | 关键词（可入提示词） | 适合题材 |\n|----------|---------|---------------------|---------|\n| 诺兰 Nolan | 冷灰蓝+单点暖色（湖蓝#3B9AB2 暗青灰#243940） | desaturated cool blue, teal & orange, gritty realism | 心理悬疑、科幻、现实题材 |\n| 维伦纽瓦 Villeneuve | 沙漠金+青灰（深沙棕#4A3728 土黄#D6A01D） | golden hour, sand tones, muted teal, vast negative space | 史诗、科幻、公路片 |\n| 韦斯·安德森 Anderson | 糖果色（千禧粉#F1BB7B 珊瑚红#FD6467 奶油黄#F3DF6C 芥末金#CEAB07） | pastel color palette, symmetrical, candy colors | 喜剧、荒诞、治愈系 |\n| 王家卫 Wong Kar-wai | 霓虹青绿+暗红（旗袍红#7C1010 暗血红#8B0000 墨绿#2F4F4F 暗金褐#B8860B） | neon teal, moody red, film noir, long exposure | 都市爱情、怀旧、情绪片 |\n| 蒂姆·波顿 Burton | 哥特暗紫+青黑 | gothic purple, dark teal, eerie, high contrast | 奇幻、暗黑童话、惊悚 |\n| 库布里克 Kubrick | 冷白+艳红 | stark white, bold red, symmetrical, sterile | 科幻、惊悚、冷峻题材 |\n| 罗杰·迪金斯 Deakins | 自然光+单点高亮 | natural light, single strong light source, deep shadows | 写实、西部、史诗 |\n| 韦斯·克雷文恐怖系 | 青绿暗光+血腥红 | sickly green, desaturated, blood red accent | 恐怖、惊悚 |\n| 侯孝贤 | 低饱和土黄+青灰 | muted earth tones, dusty, naturalistic, long take | 文艺、年代、写实 |\n| 张艺谋 | 高饱和红+金（朱红#FF4C00 故宫朱红#C83C23） | vivid red, imperial gold, bold color blocking | 古装、史诗、民族 |\n| 新海诚 | 通透蓝+高光白+橙 | vibrant blue sky, lens flare, glowing highlights, clean anime | 青春、治愈、动画 |\n| 赛博朋克 Cyberpunk | 霓虹粉紫+电蓝 | neon pink, electric blue, rain reflections, haze | 科幻、末世、都市夜 |\n| 中式恐怖 | 暗青+朱砂红+灰白（石青#1685A9 朱砂#FF461F 土黄#D6A01D） | dark teal, cinnabar red, pale grey, lantern light | 民俗恐怖、民国悬疑 |\n| 蒸汽朋克 Steampunk | 黄铜棕+青绿蒸汽 | brass brown, copper, steam green, warm gears | 架空历史、机械幻想 |\n| 蜘蛛侠·纵横宇宙风（2026-08-10 入库） | 高饱和波普冷暖对抗（主光金色暖阳+冷调天光共存） | 半色调网点阴影（halftone dots）、浅色手绘黑墨轮廓线、丝网印刷纹理、高光青/品红色散（chromatic aberration） | 动画、超英、潮流插画风 |\n\n**用法三步：**\n1. 定题材 → 查表选 1 个主色系（+ 可选 1 个辅色系）\n2. 用色系关键词生成参考图 / 提取色卡（§4.2.1 三步）\n3. 色卡垫入视频工具延续全片\n\n> 例：《奇门镇煞人》民国悬疑 → 中式恐怖色系（暗青+朱砂红+灰白）+ 诺兰写实质感 = 民俗悬疑的冷峻底色。\n\n**大师调色要点速记（来自色卡文档·可直接写进调色描述）：**\n- **王家卫**：①整体偏移法（画面往左下偏移，暗部带青绿）②黑位抬升（最暗亮度3-4%，柔和胶片质感）③低明度高饱和 ④红绿互补对比\n- **诺兰**：①冷色调低饱和（钢蓝/灰，去饱和）②高对比度（浓重阴影+明亮高光）③IMAX宽幅史诗尺度 ④实拍物理特效质感\n- **敦煌矿物色**：石青#1685A9 + 石绿#2C9678 + 朱砂#FF461F + 土黄#D6A01D（青绿叠翠/朱金璀璨/褐黑古韵三方案）\n- **故宫宫廷色**：故宫朱红#C83C23 + 琉璃黄#F0C75E + 青金蓝#1C2C5B + 玉白#F3F9F1\n\n**蜘蛛侠·纵横宇宙三合一画风（2026-08-10 入库·可复现配方）：**\n> 三块缺一不可：印刷漫画质感 + 波普色彩对抗 + 网点/色散光影。**不写片名/导演名**（内容安全红线），只写视觉语法。\n- **画风**：阴影区域布满细密半色调网点（halftone dots）；物体边缘带纤细浅色手绘黑墨轮廓线；全画面覆盖超细数字噪点+浅丝网印刷纹理，呈现高端漫画印刷品触感\n- **色彩**：同画面同时存在冷暖两组光源强对冲——主光为金色暖阳光，在人物右侧轮廓镀暖金色轮廓光；左侧窗户射入冷调天光，给左肩/物体左边缘铺淡青色反光，冷暖在同一物体表面共存\n- **光影**：阴影带轻薄网点纹理（非普通 CG 平滑渐变）；高光边缘带极淡青/品红色散偏移（chromatic aberration），模拟印刷套色错位瑕疵\n\n**✅ 已验证提示词（2026-08-06 用户实测）：电影感黄金公式**\n\n```\n[镜头类型与角度]，[主体正在进行的明确动作]，[具有层次深度的具体场景]，[灯光设计]，[命名色彩分级]，[氛围/类型] --ar 16:9 --stylize 200 --no text, watermark, brand logos\n```\n- 快速修正：景深平→加前景蒸汽/雨+中景道具+雾中背光；主体模糊→突出动词+负面补光+降stylize；文字残影→--no text, watermark, brand logos\n- 色彩分级 6 种：青橙大片/漂白旁路（去饱和高对比）/保留银盐/粉彩胶片/黑色电影/王家卫色调\n- 完整 9 位导演中英模板见 Obsidian `03-素材/色卡与提示词模板库/AI影视创作提示词模板库.md`（✅已验证）\n\n**导演名→描述性写法转换（防 Seedance 违规·用户实测）：**\n| 导演 | 安全写法 |\n|------|---------|\n| 韦斯·安德森 | perfectly symmetrical composition, pastel candy color palette, flat lay aesthetic |\n| 王家卫 | highly saturated emotional color grading, urban isolation, neon signs, dreamy bokeh |\n| 张艺谋 | bold monochromatic color scheme, Chinese cultural symbolism, ink wash aesthetic |\n| 诺兰 | cool desaturated palette, epic architectural scale, dramatic chiaroscuro lighting |\n| 昆汀 | violence aesthetics, vivid retro palette, dramatic angles, extreme close-ups |\n| 雷德利 | epic widescreen, industrial design, volumetric lighting, desaturated earth tones |\n| 黑泽明 | dynamic symmetrical composition, dramatic weather elements, samurai aesthetic |\n| 蒂姆·波顿 | gothic aesthetic, exaggerated character design, twisted surreal architecture |\n| 李安 | East-meets-West fusion, poetic natural lighting, restrained elegant composition |\n\n#### 4.2.3 验证过的完整提示词模板库（V3.0 新增·✅用户实测）\n\n> 来源：桌面《AI影视创作色卡与提示词模板库.docx》，2026-08-06 用户实测全部可用。完整 9 位导演中英双语模板 + 色彩分级见 Obsidian `03-素材/色卡与提示词模板库/AI影视创作提示词模板库.md`。\n\n**① 电影感黄金公式（已验证）：**\n```\n[镜头类型与角度]，[主体正在进行的明确动作]，[具有层次深度的具体场景]，[灯光设计]，[命名色彩分级]，[氛围/类型] --ar 16:9 --stylize 200 --no text, watermark, brand logos\n```\n- 快速修正：景深平→加前景蒸汽/雨+中景道具+雾中背光；主体模糊→突出动词+负面补光+降stylize；文字残影→`--no text, watermark, brand logos`\n- **色彩分级 6 种**：青橙大片（Teal&Orange）/漂白旁路（去饱和高对比）/保留银盐/粉彩胶片/黑色电影/王家卫色调\n- **灯光动词**：硬主光/软主光/负面补光/实景光源/雾中背光/轮廓光/镜面高光\n- **氛围元素**：体积雾/雨珠/灰尘颗粒/镜头光晕/光线包裹\n\n**② 9 位导演中文模板（已验证·投喂时建议去掉导演名用 §4.2.2 转换表）：**\n- **韦斯·安德森**：完美对称构图, 中心取景, 糖果色配色(粉/黄/薄荷绿), 精致场景设计, 平铺美学, 复古道具, 奇想氛围, 古怪角色造型, 极致精准分镜\n- **王家卫**：高饱和度情绪化色彩(深红/翡翠绿/电蓝), 慢镜头, 手持摄影美学, 都市疏离, 运动模糊, 香港霓虹招牌, 怀旧浪漫, 梦幻焦外, 香烟氛围\n- **张艺谋**：大胆单色配色(主导红/黑/白), 中国文化象征, 史诗级宏大场面, 中国传统建筑, 水墨画美学, 戏剧性构图, 武侠优雅\n- **诺兰**：冷色调低饱和度(钢蓝/灰), 史诗级建筑尺度, IMAX宽幅, 实拍特效美学, 时间操纵/碎片叙事视觉, 明暗对照光照, 理性氛围\n- **昆汀**：暴力美学, 鲜艳饱和复古色彩(黄/橙/红), 戏剧性低角度/仰角, 风格化动作编排, 1970年代B级片美学, 极端特写, 后备箱视角, 戏剧性血液效果\n- **雷德利**：史诗级宽幕构图, 工业设计美学, 大气体积光照, 丁达尔光, 低饱和度大地色调, 烟雾大气效果, 粗粝现实主义\n- **黑泽明**：动态对称构图, 武士战士美学, 戏剧性天气(雨/风/雾), 黑白或低饱和度, 日本古典建筑, 史诗级动作编排, 人文主义叙事\n- **蒂姆·波顿**：哥特美学, 黑暗奇幻, 夸张角色设计(大眼睛细肢体), 定格手工质感, 扭曲超现实建筑, 德国表现主义光照\n- **李安**：东西方美学融合, 诗意自然光照, 细腻情感表达, 克制优雅构图, 文化象征, 沉思内省情绪, 柔和色彩\n\n> 例：王家卫酒吧场景（已验证示例）→ `A woman in a red cheongsam leans against a bar, neon lights reflecting off wet surfaces, slow motion, handheld camera, dreamy bokeh, cigarette smoke atmosphere`\n\n### 4.3 材质情绪对照\n\n金属→科技冷峻 | 木质→复古温暖 | 石材→庄严厚重 | 玻璃→干净高级 | 布料→舒适温柔\n\n修饰词：rough / smooth / polished / matte / glossy / worn / scratched / weathered\n\n#### 4.3.1 不完美现实主义（V2.2 新增·防 CG 塑料感）\n\n> 来源：Cinematic World Generator。AI 画面太干净=塑料感/CG感，用生活磨损感让世界"被生活过"。\n\n**质感元素（直接写进画面描述）：**\n- 胶片颗粒 film grain / 雾霾 haze / 天气痕迹（雨渍、尘土）\n- 磨损布料 worn fabric / 裂纹石头 cracked stone / 手工木头 hand-shaped wood\n- 泥污 mud / 皮肤纹理 skin texture / 动物呼吸（冬日白气）\n- 实用光 practical light（火把、油灯、烛光而非棚拍光）\n- 环境损耗：旧工具、脚印、门框磨痕、炊烟\n\n> 用法：写完华丽材质描述后，加 1-2 个磨损元素打破"全新感"。史诗感≠干净，真实感=使用痕迹。\n\n#### 4.3.2 前景遮挡两神技（V2.2 新增·刺猬星球）\n\n> 来源：刺猬星球 super-i。AI 默认生成无遮挡"全知视角"画面，前景遮挡告诉 AI "摄影机藏在哪"，用透视关系构建三维空间。\n\n**① 物理遮挡前景（建立机位感与空间层次）**\n- 原理：真实拍摄中摄影机有物理位置，前景遮挡=告诉 AI 镜头躲在哪（柱后/门外/窗前）\n- 万能公式：`[工业级摄影参数] + [极度前景虚化（叙事介质）] + [中景主体与动作] + [背景环境] + [胶片与色彩质感]`\n- 示例：大理石柱虚化前景框架左缘 + 中景女主打电话 + 酒店大堂 + teal & orange 调色 = "躲在柱后偷听"的叙事感\n- 避坑：①不写"拍证件照"式流水账（无故事感）；②不加强行与环境不符的遮挡物（地下车库加樱花→破坏逻辑）\n\n**② 氛围遮挡前景（打破真空感，让空气被感知）**\n- 原理：用空气透视让光线传播有介质（新海诚=漂浮微尘/雨丝/薄雾让光有路径）\n- 介质词直接进提示词：`atmospheric haze`（薄雾）`dust motes`（微尘）`particles`（颗粒）\n- 避坑：①不滥用"极致细节、8k、锐利对焦"把空气杂质抹除（加重塑料感）；②只写"丁达尔光"不写介质→光柱像硬涂的\n- 示例：金日光从窗涌进 + 薄雾充满房间 + 丁达尔效应 + 微尘在光束中发光 = 时间流逝的情绪感\n\n> 与 §4.3.1 不完美现实主义互补：磨损感处理材质，遮挡处理空间与空气。\n\n### 4.4 镜头时长参考（生成段时间点）\n\n| 时长 | 用途 |\n|------|------|\n| 1-1.5s | 闪切/冲击（高速对撞、惊吓瞬间） |\n| 1.5-2s | 钩子/高潮快切 |\n| 2-2.5s | 常规动作/对白 |\n| 2.5-3s | 叙事叙述/建立 |\n| 3-4s | 情绪沉淀/反应 |\n| 4-6s | 慢镜头氛围/定格收尾 |\n\n**信息量时长估算（山音导演大师补充·核心时长法则）：**\n- 一个镜头内需要观众"读取"几层信息？读取一层≈2-3s，每多一层加2-3s\n- 单一信息 2-3s（一个物件特写、一个简单动作）/ 双重信息 4-5s（动作+环境关系、台词+反应）/ 多层信息 6-8s（复杂场面、多人互动）/ 综合段落 10-15s（长镜头调度、情绪留白）\n- 台词时长：用角色性格/年龄/情绪状态脑内"演"一遍——急躁年轻人争吵中10字约1.5s，沉稳老人回忆中10字可能5s（含停顿呼吸沉默），醉酒含混10字约4s；台词时间之外加反应时间（对方听完后的停顿、表情变化）\n\n### 4.5 宏大场景专项（V2.1 新增·考核标准③核心）\n\n> 触发场景：战场、城市全景、宫殿/宗门/巨型建筑、山川大泽、星空宇宙、灾难场面、千军万马、奇幻巨物等任何**人物与巨大环境/巨物并置**的场景。\n> 要求：**景别 + 焦段（毫米数）+ 运镜 + 人物与环境的比例关系**四项必须全部显式写进提示词，缺一不可。\n\n**景别-焦段对照表（宏大场景）：**\n\n| 景别 | 推荐焦段 | 用途 | 提示词写法示例 |\n|------|---------|------|---------------|\n| 大远景/上帝视角 | 16-24mm 超广角 | 建立世界规模、山川城池全貌 | "16mm超广角大远景，人物仅占画面二十分之一" |\n| 大全景（地面） | 24-35mm 广角 | 军队阵列、人群、巨物全貌 | "24mm广角全景，阵列从画面近端延伸到地平线" |\n| 中全景/人景关系 | 35-50mm | 人物与环境对话、行走于巨物之间 | "35mm中全景，人物立于城门之下，门洞高约人物的八倍" |\n| 中景叙事 | 50mm | 宏大场景中的人物动作、对话 | "50mm中景，将军骑马穿过燃火的街道" |\n| 近景/特写 | 85mm+ 长焦 | 宏大场景中的个体情绪、关键细节 | "85mm长焦近景，士兵脸上烟灰与汗水，背景军阵压缩虚化" |\n\n**宏大场景提示词必含四要素：**\n1. **景别**：大远景/大全景/中全景等（见上表）\n2. **焦段**：显式毫米数（16-24mm超广角 / 24-35mm广角 / 35-50mm标准 / 85mm+长焦）\n3. **运镜**：航拍/升降揭示规模（crane up 从人物特写拉升到城市全貌）；大远景缓慢横移（建立空间广度）；推近（从全景逼近关键人物）；史诗场面可用"上帝视角垂直俯瞰 + 缓慢推进"\n4. **人物与环境的比例差**：必须写清（"人物仅占画面十分之一""城门高度约为人物八倍""阵列如蚁群铺满原野"）\n\n**宏大场景构图规则（山音/小逻综合）：**\n- **三层纵深**：前景（人物/遮挡物）+ 中景（主体动作/人群）+ 远景（巨大环境/天空/地平线）必须同时存在\n- **权力构图**：人物在巨大环境中的渺小 = 压迫感（微缩化）；人物居中+环境对称 = 仪式感；巨物从画面上方压入 = 威胁感\n- **比例锚点**：先用有明确尺寸感的参照物建立比例（城门/树/旗/台阶），再放人物，AI 才不把巨物画小\n- **航拍/高空机位**：垂直俯瞰或高位俯拍，用于军队阵列、城市、地貌；结合缓慢推进或横移\n- **粒子与空气透视**：远景加空气透视（雾/尘/光线衰减），近实远虚强化纵深；风沙/旗帜/烟尘密度提示词要写\n- **光影**：宏大场景光随规模走——破晓/黄昏金色侧逆光强调体积；乌云顶光强调压迫；光源方向与时间在场景资产中已锁定，镜头内不突变\n- **VFX 提示词规范**：千军万马/巨物/灾难场面写"人群密度、阵列秩序、巨物与建筑比例"而非"很多人"；不写无法渲染的数量词（"数万"→"阵列延伸至地平线"）\n- **宏观视觉换挡**：宏大场景天然是换挡点——进入宏大场景的第一镜用大远景，出宏大场景用特写收束，形成"宏观→微观"的视觉闭环\n\n**宏大场景镜头描述示例（可直接进生成段）：**\n```\n4-6s：16mm超广角大远景，垂直航拍缓慢推进——千军阵列如蚁群铺满原野，战旗在风沙中翻卷，阵列从画面近端一直延伸到地平线的城墙之下。人物在画面中仅占极小比例。空气透视让远端的城墙隐入烟尘。（远处战鼓声、风沙呼啸声）\n```\n\n**门禁E：宏大场景门禁（考核标准③专用）**\n- [ ] 景别显式标注（大远景/大全景/中全景...）？\n- [ ] 焦段显式标注毫米数（16-24/24-35/35-50/85+）？\n- [ ] 运镜显式标注（航拍/升降/横移/推近...）？\n- [ ] 人物与巨大环境/巨物的比例差写清？\n- [ ] 三层纵深（前景/中景/远景）存在？\n- [ ] 空气透视/粒子密度/光影方向明确？\n- [ ] 无"数万""很多人"等不可渲染数量词？\n\n#### 4.5.1 巨物美学专项模板（V3.2 增补·2026-08-09 用户实测确认）\n\n> 来源：用户提供的 4 条实测可用巨物提示词（神话天龙/远古神像/天空巨鲸/极地巨冰兽）+ 当日连续测试验证。用于巨物/神兽/巨型遗迹等「巨物美学验证」镜头。\n\n**两种写法（用户实测确认）：**\n\n**写法A·单段直给（巨物提示词本身，适合静态/单图）：**\n```\n【神话XXX】巨物美学，【远古传说中的XXX，体貌描述——身躯/头部/材质/部分隐没（"仿佛无尽延伸"）】XXX巨大到超出人类理解并遮蔽天空，主体占据画面绝大部分空间，压迫感极强。画面前景或角落出现一个极其渺小的【人类】，如米粒般微小，用于形成强烈尺度对比。低角度仰拍，史诗级纵深构图，电影级光影，真实自然环境，超现实照片级真实，空气透视，翻涌云海，逆光，体积光与漂浮颗粒，低饱和高级色彩，窄画幅，极致细节，营造神圣、恐惧、孤独与敬畏感。【XXX】以具有压迫感的姿态凝视【镜头方向】\n```\n\n**写法B·六段式（用户确认"这才是我们的视频提示词格式"·仅>60s长视频生成段用这个）：**\n巨物美学段若>60s 才走六段式（【风格】→【出场人物与场景】→【色卡参考】→【镜头】→【时间轴】→【声音】），把写法A的巨物结构拆进【时间轴】各时间点，镜头段写低角度仰拍+缓慢推近，时间轴内保持主体占满画面+米粒人类尺度锚+凝视镜头方向。**不要混用**：≤60s 的生成段一律用五段式（无【出场人物与场景】），仅>60s 用六段式。\n\n**核心铁律（用户实测）：**\n1. **主体占据画面绝大部分空间**——压迫感来自填满画面，不是远处展示\n2. **渺小人类做尺度锚**——画面前景/角落放一个米粒般的人类，形成强烈尺度对比（比例差写"如米粒""微如尘埃"）\n3. **低角度仰拍**——史诗纵深构图，巨物从画面压向观众\n4. **体积光/空气透视/漂浮颗粒**——神圣感三件套，逆光 + 低饱和高级色彩\n5. **情绪词收尾**——神圣、恐惧、孤独、敬畏感（按题材选）\n6. **巨物凝视镜头方向**——低垂/俯视/凝视【镜头方向】，压迫感闭环\n7. **❌ 禁用上帝视角俯瞰**——俯瞰会把巨物拍小、稀释压迫感（用户实测："上帝视角跟奇怪，反而让巨物变小了"）\n8. **主体部分隐没**——"部分身体隐没在云层/浓雾/冰川"，暗示无尽延伸，比全貌更有压迫感\n9. **❌ 巨物段人类禁说话**（2026-08-09 用户实测）——巨物段里人类一开口模型容易乱配台词，一律不写台词，人声只保留喘息/呼吸，纯视觉+环境音效\n\n**巨物感强化八技法（2026-08-09 用户探讨确认·可叠加）：**\n1. **局部特写对比（最强）**——不拍全身，拍巨物一个局部与人类同框（"巨物的一片鳞甲矗立在地面，人类站在鳞甲根部，身高只到鳞甲边缘的十分之一"），大脑自动脑补全身，脑补的永远比画出来的大\n2. **出画构图**——巨物顶出画面边界（"巨物身躯向画面上方无限延伸，顶部超出画面边界——看不到头"），画面装不下它\n3. **人类视角限制**——从人类仰视视角写，仰到极限看不到全貌（"人类仰头仰到脖子极限，只能看到巨物下巴的下缘，再往上全被遮蔽"）\n4. **多层尺度锚（两级台阶）**——人类→参照物→巨物三级对比（"人类站在断裂的石柱旁，石柱高约人类五倍；巨物的一片鳞片，比整根石柱还高"）\n5. **速度反差**——巨物极慢人类极快（"巨物每眨一次眼耗时三秒；人类在它脚下拼命奔跑，跑出几十步，巨物才微微侧头"），越大越慢，速度差即尺度暗示\n6. **物理反馈**——巨物一动环境给反馈（"巨物迈步，地面裂纹如蛛网向地平线蔓延，碎石在人类脚边跳动，远处石柱成排倾倒"）\n7. **声音先行+低频**——声音比画面先到，低频吞掉人声（"巨物心跳如闷雷，从大地深处传来，人类脚下的碎石随心跳节奏跳动"）\n8. **剪影+隐没**——巨物大半隐入雾/云/黑暗只露轮廓（"巨物大半身躯没入暮色浓雾，仅剩山脊般的轮廓在雾中起伏，仿佛仍在生长"）\n\n**组合建议**：最狠组合 = ①局部特写 + ③视角限制 + ⑧隐没（人类只看到局部、仰头看不到全貌、大半还在雾里）。\n\n**题材替换位**：\n- 神话天龙：龙躯盘绕云海，长角刺破云层，鳞片沉重古老，低垂龙首凝视镜头\n- 远古神像：山岳般矗立，天空/穹顶裂口投下神圣光束，巨物以压迫感姿态凝视视线方向\n- 天空巨鲸：漂浮云海如移动大陆，鲸鳍划开云层，尾鳍没入天际，缓缓俯视凝视镜头\n- 极地巨冰兽：万年冰甲棱角冰刺，匍匐雪原，兽首冲破暴风雪，凛冽垂首凝视镜头\n- 玄冥巨蛇：蛇躯盘绕如城墙，鳞片层叠，蛇首探出深渊，暗金竖瞳凝视镜头（用户 2026-08-09 测试）\n- 遗迹石灵巨神：石肤带符文纹路，从大地裂缝升起，符文从眼窝向全身蔓延，低垂巨首凝视镜头（用户 2026-08-09 测试）\n- 通用替换：把【神话XXX】名称、体貌描述、题材情绪词换掉即可套用\n\n### 4.6 动作戏专项（V2.2 新增·参考 3D 动作戏视频生成笔记 + 用户验证）\n\n> 来源：桌面《[1.24]--3D动作戏视频生成 笔记》（即梦 Seedance 实战课）+ 用户验证的变身戏模板。动作戏/变身戏/高速打斗场景直接套用本节框架。\n\n> ⚠️ **主从关系（V4.1.1 确立）**：本节内 4.6.1-4.6.7 为**补充件**（变身戏/破坏三级/材质/多人约束/多角色拆分——武打专项没有的内容）；**打斗动作与提示词一律以 §4.6.8（动作正确性）+ §4.6.9（燃度）为准**，冲突时以 4.6.8/4.6.9 及 references 两文件为准。**专项优先于通用（V5.0.2 补充）**：打斗段同时受 §2.4 生成段式通用规则约束，两者冲突时（如 §2.4"一段只做一个镜头运动" vs §4.6.9 打斗运镜丰富度、§2.4 镜头写法 vs §4.6.9 镜头规格五要素）**以打斗专项 §4.6.8/4.6.9 为准**，但五段式骨架（【风格】→【色卡参考】→【镜头】→【建议时间轴】→【声音】）不变。\n\n#### 4.6.1 破坏效果三级层级（升级/破坏场面必用）\n\n从轻微到彻底，按破坏程度递进描写，AI 才能呈现可感知的破坏过程：\n- **初级**：表面出现裂痕（水晶高台深度裂痕、墙面裂纹蔓延）\n- **中级**：结构解体（廊柱沙化、墙体剥落、梁柱断裂）\n- **终极**：整体湮灭（建筑化为粉尘、物体消失殆尽）\n\n> 写法：先写破坏起点（裂痕），再写结构解体（沙化/剥落），最后写整体湮灭（粉尘），逐级升级，不跳级。\n\n#### 4.6.2 变身戏模板（用户验证可用·7阶段）\n\n变身/觉醒/进化类场景的标准化时间轴结构：\n\n| 阶段 | 时间占比 | 内容 |\n|------|---------|------|\n| 1 蓄势 | 0-15% | 原形态静止特写，材质细节清晰（粗糙布料/旧铠甲纹理），周围环境微动 |\n| 2 崩解 | 15-30% | 原服装/装甲从肩部/胸口开始崩解，撕裂成发光碎片，碎片悬空 |\n| 3 能量聚集 | 30-45% | 碎片与流光沿身体环绕升腾，空气扭曲，发丝无风自扬 |\n| 4 瞳孔异变 | 40-55% | 特写瞳孔：异象虚影与神光浮现，标志变身启动 |\n| 5 重组 | 50-70% | 花瓣/鳞甲/光翼等新形态元素从四周汇聚，沿身体曲线嵌合成形，咔嗒声密集 |\n| 6 爆发 | 65-85% | 新形态成形瞬间能量炸开（花海龙卷/冲击波/光爆），环境受破坏（见4.6.1） |\n| 7 收势 | 85-100% | 主角立于废墟/光芒中，余波微震，粉尘沉降，慢推特写眼神收尾 |\n\n**变身戏五条硬规则：**\n1. 觉醒前后形态必须分两张设定图上传（工具层：即梦等需 @各自形态图）\n2. 崩解→重组必须写清「旧材质→碎片→新材质」的转化过程，不直接跳变\n3. 爆发段的破坏效果按三级递进（4.6.1），与变身强度匹配\n4. 收势用慢推+眼神特写定格，完成情绪闭环\n5. 材质对比较量：旧形态粗糙质感 vs 新形态锋利半透明（花瓣/鳞甲/水晶）\n\n#### 4.6.3 动作戏节奏组合\n\n**慢-快-静节奏（变身/觉醒戏）：** 起始中景环绕升格慢镜 → 高速推进爆发 → 收尾环境静默\n**快-定-震-随-收节奏（多人打戏）：** 快速横向跟拍（疾速视界）→ 定住关键帧 → 撞击/爆发震动 → 跟随动作/飞射物 → 收尾定格\n\n**速度表现三件套（高速运动必写）：**\n1. 残影轨迹（高速移动留残影）\n2. 空气扭曲（突破音障/高速物周围空气变形）\n3. 动态模糊（运动物体边缘模糊）\n\n#### 4.6.4 动作戏材质精度对照（写进画面描述）\n\n| 对象 | 精度描述 |\n|------|---------|\n| 服饰布料 | 质感 + 运动褶皱（衣袂翻飞时的褶皱变化） |\n| 植物/藤蔓 | 表皮粗糙纹理 + 新芽鲜嫩感对比 |\n| 铠甲/金属 | 反光 + 锁链金属冷感 |\n| 能量体 | 透光特性 + 边缘发光 |\n| 建筑石材 | 厚重感 + 破坏后的断面/粉尘 |\n\n#### 4.6.5 动作戏特效清单（可直接写进提示词）\n\n- 突进气浪粒子（高速突进时身周气浪）\n- 种子/投掷物拖尾光点\n- 藤蔓疯长时泥土碎块飞溅\n- 绿叶/花瓣光粒飞舞\n- 冲击波粒子扩散\n- 破坏粉尘沉降\n\n#### 4.6.6 多人打戏约束（防比例失调）\n\n- 群众/士兵数量写明确数字或范围（"几十名无脸银甲净尘使"），不写"很多人"\n- 战斗比例平衡：我方/敌方数量与战力匹配，用文字约束防止一边倒失调\n- 新角色加入用 @角色名 标记并上传设定图；未出场角色从提示词删除\n- 多角色协调：每个角色的动作方向/节奏对齐，避免各自为战\n\n#### 4.6.7 多角色动作拆分（V2.2 新增·刺猬星球）\n\n> 来源：刺猬星球 super-i。解决多角色画面"动作混乱、改A毁B"——AI 注意力算力偏移：多个动作塞进同一句，AI 只保一个角色，其他变背景板，且不懂"同时/接着"的时序。\n\n**① 时间分段拆分（视频）**：不要流水账（"左边男人喝咖啡，右边女人跳舞，接着男人鼓掌"→AI混淆时序）。改成：\n- 分时间段明确算力重心：`0-3s 焦点：左男喝咖啡；4-8s 焦点：右女跳舞；8-10s 左男鼓掌`\n- 每段时间只保一个主角色动作\n\n**② 空间占位（画面构图）**：明确标注角色位置：\n- `画面左侧：男人；画面右侧：女人` → 避免 AI 抓错主体\n\n**③ 语义编辑锁定修改**：不用蒙版重绘（边缘闪烁+刷掉满意角色），用工具的视频编辑功能：\n- `保留右侧的女人，把左侧男人的动作改成抬手打招呼` → AI 精准识别角色只改目标部分\n\n**④ 分镜拆分破摆拍**：不要把所有动作塞进一个长镜头，拆三段（以"车站告别"为例）：\n- 阶段1 特写-情绪铺垫：女主微红眼眶、攥着车票的手\n- 阶段2 中景-动作爆发：松手、转身奔跑\n- 阶段3 全景-高潮定格：升格慢动作相拥、火车呼啸\n- 避坑：不必强求背景完全一致，观众注意力在人物动作，细微背景差异自动忽略\n\n> 工具适配（即梦 Seedance）：上传场景参考图+角色设定图（全身/三视图）→ 提示词用 @角色名 关联 → 选模型（2.0/2.0fast）→ 全能参考类型 → 16:9 或 9:16 → 默认 15s 一段（可拆 7 组镜头）。批量生成同风格镜头只需改变化部分。\n\n#### 4.6.8 武打动作体系（V4.1 新增·融合工业级15格PREVIS系统）\n\n> 来源：桌面《职业学校推荐skill/6.txt》工业级 15 格武打 PREVIS 系统（2026-08-16 入库）。补 4.6.1—4.6.7 缺的「动作本身」：动力链 / 攻防博弈 / 连续性 / 轴线 / QA。**打斗戏分镜与提示词直接套本节**。完整版（20 章，含 15 格 PREVIS 故事板生成与转提示词全规则）见 `references/武打PREVIS-15格动作预演系统.md`。\n\n**① 动作动力链（每招必写 11 环）**：意图 → 起手准备 → 重心变化 → 脚步位移 → 核心发力 → 肢体传导 → 攻击轨迹 → 接触点 → 命中/格挡反馈 → 收招惯性 → 下一格继承。禁止只画结果（挥拳/踢腿/爆炸/对波/静态摆姿势）——必须让观众看懂动作怎么发生。\n\n**② 15 格节奏结构（默认骨架，服从剧情）**：P01 建立空间与距离 → P02 起手试探 → P03 脚步启动重心前移 → P04 首次攻击进入 → P05 闪避格挡 → P06 首次碰撞 → P07 受力失衡 → P08 反击夺权 → P09 位移贴身 → P10 连招/兵器博弈 → P11 关键命中/缴械破防 → P12 身体反馈惯性 → P13 空间重建 → P14 稳住重心 → P15 反扑起手。**P15 不结束战斗**（除非剧情明确要求）——打斗是过程的高能截面，不是结局。\n\n**③ 攻防博弈**：节奏 `快→快→停→爆→反馈→反制→续`；每 3-5 格一次节奏变化，每 6-8 格一次主导权变化；禁止全程单方连击、禁止全程同一动作。\n\n**④ 拳脚与武器**：拳必写哪只手/蹬地/重心/腰胯/肩送/拳峰落点/对方先反馈哪；腿必写支撑腿/抬膝/髋转/轨迹/脚背掌跟落点/命中后重心；摔投拆六步（进入→控制→卡重心→发力→离地失衡→落地反馈），复杂地面技不单格完成。兵器必写谁持/哪手/长度/刃向/轨迹/接触点/滑动/压刃/震手；**刀剑碰撞不悬空**，至少一种：压刃/滑刃/挑刃/偏转/震手/卡位/缴械/余震；禁止武器穿模/换手/消失/长度漂移/无接触点。\n\n**⑤ 连续性五锁（每格继承上一格）**：状态继承（站位/朝向/重心/脚位/手部/伤势/体力）· 180°轴线（A左B右，跳轴只能经环绕/顶视/正面/摇镜重建，跳后保持新关系）· 惯性（前冲发衣后甩、急停衣发前甩、旋转同向，禁止互相冲突）· 伤势破损持续不自动恢复 · 特效不替代身体接触。禁止：瞬移/无理由换边/空间重置/多手多脚/肢体穿模/身体融合。\n\n**⑥ 动作 QA 速查（写前自检）**：15格齐？攻防成对？动力链在？接触点明确？命中后身体反馈？武器不穿模？左右站位连续？轴线成立？惯性方向对？伤势连续？无真实肤色/彩色材质？\n\n**⑦ 故事板转 Seedance 提示词（用户要求逐格输出时）**：故事板锁顺序/景别机位/站位/动作方向/武器位置/接触点/衔接；人物图锁脸型服装、场景图锁环境灯光天气、武器图锁外形握持。提示词必须忽略白模材质/编号/箭头/标注。每条 14 要素：镜头编号/建议时长/对应宫格/景别机位/运镜/动作起点/脚步重心/发力链/武器动作/接触反馈/收招惯性/下镜衔接/环境声音/禁止项。声音默认无 BGM，只留环境+呼吸+脚步+衣料+破风+碰撞+落地；写实打斗禁彩色能量特效；上镜结尾自然接下镜开头，禁止每镜从静止重新开始。\n\n#### 4.6.9 二次元打戏提示词体系（V4.1 新增·二次元打戏方法论提炼）\n\n> 来源：桌面《职业学校推荐skill/武打skill.md》（353KB 原文，2026-08-16 提炼入库）。与 §4.6.8 分工：**PREVIS 管"动作对不对"，本节管"打戏燃不燃"**。完整版（含 32 条铁律全表、15 种运镜+组合公式、9 角色劲气速查、技法总览、近景三模板）见 `references/二次元打戏提示词体系.md`。打斗段写完必过：§4.6.8 动作 QA + 本节燃向铁律 + 门禁D。\n\n**① 完播率公式**：开局冲击 20% × 节奏呼吸 30% × 运镜丰富度 25% × 情绪拐点 25%。开局 1.5s 内必须攻防接触（禁全景铺垫）；升级版：0.5s 内两种极端招式正面硬撞+微慢镜定格（2 秒跳出率降 38.98%）。\n\n**② 15 秒骨架**：0-1.5s 开局硬撞 → 1.5-5s 近景对招 → 5-8s 空间变化（维度≥2次）→ 8-9s 快攻升级 → 9-12s 情绪拐点 → 12-14.5s 终结技（呼吸帧→破局→绽放→余震）→ 以高潮收尾**不设收尾帧**（冲击波/碎石灰尘就是最终帧）。\n\n**③ 双观赏性**：远景看大动作（奇观型），近景看杀意（密度型）。**15s 内至少 1 段 2-3s 上半身近景对招**，纯远景大动作≠完整打戏。近景节奏=机枪节奏：3轻1重 / 左右交替加速 / 封破杀。\n\n**④ 招式序列化（铁律25）**：AI 对"机枪节奏/快速"等定性词执行偏差 30-40%——**必须写招式序列+落点+防守反馈**：`右摆拳打脸→左勾拳打下巴→右直拳打鼻梁→左横肘切眉骨→右标指刺咽喉，防守方依次侧偏、下潜、拍开、架桥、后撤`。禁止写"每秒攻击≥多少次"。近景手部观赏性排序：砸肘>横肘>寸拳>上勾拳>标指>推掌>冲拳>拍掌。\n\n**⑤ 镜头规格五要素（每次镜头必写）**：`[景别]·[拍摄视角+角度]·[运镜方式]·[跟随目标]`——景别四选一（全/中/近/特）、视角五选一（正/侧/斜/俯/仰）、角度具体值（30°仰/90°侧/45°斜俯）、跟随目标必写。禁"镜头拉远/靠近/跟随拍摄"。⚠️**空间感铁律：中景及以上禁 90° 侧面正拍，必须 30-60° 斜角制造纵深**。\n\n**⑥ 燃向铁律十诫（精选）**：视觉巅峰五要素同窗触发（大幅动作+快节奏+全景+特效+运镜缺一打折）· 呼吸帧需≥1.5s 高速铺垫（无铺垫定格=无聊）· 每击必有空气反馈（拳风+命中气爆，形态随攻击变）· 被击反应差异化（面部→后仰/腹部→弓虾/下盘→跪地）· 闪避大幅化（禁"侧身一让"，下潜贴地/后仰≥45°/后空翻）· 防守三态（被破防后 0.3-1s 不能恢复完整防守）· 特效服从角色主色（找不到归属的颜色删掉）· 禁 360°环绕/螺旋上升运镜 · 同对战招式零重复 · 全文≤2000字（超字数先删负面提示词）。\n\n**⑦ 劲气速查**：太极=黑白、白鸽=紫黑、红茶=橙红、凛羽=冰蓝银白、雷电=纯紫银紫、芭乐=粉渐变、冰女=蓝白硬冰、剑神=红紫瞬闪、绯雪=火红烈焰刀弧。写法：`右腿如钢鞭甩出，紫黑气焰沿小腿弧线炸裂成新月弧刃`（禁"角色释放紫色特效"）。\n\n**⑧ 角色战斗结构（创建打斗角色必用）**：主战技法 1-2 个占 70% + 破招技法 1-2 个占 20-30%（破防/摔投/锁控）+ 终结技法 1 个（视觉爆点）；距离覆盖 ≥2 类（近身/中距/空间变化）；动作维度 2-3 类（站立/腾空翻转/地面控制）。禁止平均使用技法；同类技法禁止全堆叠；必须有角色动作签名（一句话说清跟别人不一样在哪）和特效性格（灼烧/冻结/绽放/电弧，颜色只是基础）。创建流程：展示技法总览（推荐 4-5 个）→ 分配结构 → 输出角色卡 → 确认。\n\n**⑨ 兵器规则（持械打斗必用）**：中景/全景兵器攻防禁 90° 侧面正拍（像横版格斗游戏）；高速兵器招式不能全程特写（只用于破绽/命中/格挡瞬间 0.2-0.5s）；大圆弧剑花/满月斩禁近景（必须中景/全景看完整轨迹）；**兵器碰撞不能只写爆炸——必须写剑身/剑格/刃口物理接触**。转提示词公式：`[角色]+[步法/重心]+[身体发力]+[兵器部位]+[攻击轨迹]+[命中/格挡目标]+[兵器反馈]+[镜头目的]`。用户指定具体兵器体系时先读 `references/武学招式库-经典招式速查.md` 对应专项（剑法/长柄镰刀/太刀·梦想一心/太刀·绯雪樱灼流/高级轻功/修仙高级剑招），禁止只凭招式名生成；徒手对战不调用兵器库。\n\n**⑩ 终结技素材速查**：呼吸帧 8 种选 1（极慢定格/汗珠飘落/发丝静止/对视定格/风停/气焰收敛）；空间变化最低要求 15s 内 ≥2 种类型（腾空+贴地/倒置+侧翻，禁全程站桩）；情绪拐点两型——压制型（暴怒觉醒/连击加速/绝招释放/全力碾压）或逆转型（化劲反击/破绽捕捉/身法逆转/以退为进/绝境爆发/入身逆转）；终结技三幕=破局（打破攻防平衡）→绽放（全力输出）→余震（冲击波/粉尘收尾）。详细素材库（20+ 空间变化类型、14 种逆转技法、8 种呼吸帧全表）见 references。\n\n**⑪ 武学招式库（写打斗取招式）**：拳法系（咏春日字冲拳/标指、八极铁山靠/顶肘、太极云手/揽雀尾、八卦走圈/鹞子穿林、形意崩拳）、腿法系（谭腿十二路弹踩截蹬劈挂撩扫鞭踹膝摆、蔡拳偏门快打、巴西战舞倒置贴地、跆拳道540°旋风踢）、摔投系（柔道背负投/大外刈/内股、柔术十字固/三角绞、擒拿反关节）、身法系（凌波微步/缩地成寸/燕子三抄水/高级轻功·凌波九转/断崖折月/绝壁悬丝）、兵器系（华山/独孤九剑/玉女剑/子午剑、长柄镰刀、太刀·梦想一心12式、太刀·绯雪樱灼流12式、修仙高级剑招·万剑归宗/飞剑远杀/剑阵/剑墙）。**取用规则**：招式名直接写入提示词（"凤眼插指直刺咽喉"），配招用各武学典型连招，招式必须过动力链（§4.6.8）+序列化（§4.6.9），同对战零重复，特效服从角色主色。完整表（含太刀/轻功/修仙剑招镜头铁律）见 `references/武学招式库-经典招式速查.md`。\n\n### 4.7 世界观构建九面法（V2.2 新增·可选参考）\n\n> 来源：Cinematic World Generator（OAK）。用于**新场景/新世界观设计前**的世界速查，或宏大场景前的文化设定。核心思想：**把设定变成"画面里正在发生的事"，每个方面都是一张电影剧照，不是设定集**。已定剧本的常规分镜可跳过本节。\n\n#### 4.7.1 九面清单（每个方面=一个具体场景，不重复场景类型）\n\n| # | 方面 | 核心问题 | 场景内容示例 |\n|---|------|---------|-------------|\n| 1 | 居民 Inhabitants | 谁住在这里？ | 身份/姿态/着装/角色/肢体语言，在环境中生活而非站桩 |\n| 2 | 动物 Animals | 什么其他生命共享此世界？ | 劳作/迁徙/被饲养/被猎/被崇拜，或仅以踪迹/影子/骨骼暗示 |\n| 3 | 建筑 Architecture | 他们何处遮蔽/聚集/统治/铭记？ | 使用中的空间：冒烟的屋顶、进门的人、石雕下的守卫 |\n| 4 | 景观 Landscapes | 什么地形塑造了文明？ | 环境作为力量：风化、遗迹、作物线、炊烟、足迹、小人物衬尺度 |\n| 5 | 日常 Daily Life | 什么重复的日常动作？ | 劳作/食物/手工/修补/贸易/家庭节奏，平凡胜过仪式 |\n| 6 | 旅行 Travel | 如何移动？ | 步行/骑行/划船/拖拽/攀爬/迁移，展现距离、地形、天气、重量、努力 |\n| 7 | 声音与文化 Sound/Culture | 听起来像什么？ | 吟唱/聆听/乐器/工具击打/舞蹈/沉默/口述传统/丧葬，让声音可见 |\n| 8 | 权力与压力 Power/Intensity | 什么考验着这个世界？ | 风暴/洪水/仪式权威/社会沉默/稀缺/追捕/对峙/变革前一刻 |\n| 9 | 肖像 Portrait | 什么私人时刻承载世界灵魂？ | 一次亲密情绪瞬间：反应/手势/一瞥/伤口/呼吸/脏手/半明半暗的脸 |\n\n#### 4.7.2 世界连续性要素清单（同一部电影感）\n\n所有场景共享：气候 / 材料 / 服饰 / 建筑 / 工具 / 符号 / 动物 / 行为 / 地形 / 光线逻辑 / 色彩逻辑 / 质感。\n\n> 与 §3.2 六重一致性锁（同一集内）互补：本节是**世界观层面**的连续性（跨集跨场景），设定一个世界后所有场景自动继承。\n\n#### 4.7.3 使用中空间原则（建筑/场景不展示）\n\n- 建筑：冒烟的屋顶 > 空楼；进城门的人 > 城门全景；守卫下的石雕 > 石雕特写\n- 场景：正在被使用的空间才有生命；写"功能"不写"外观"\n- 判断标准：这一镜去掉人后还有故事吗？没有→合格；有→改成使用中\n\n> 与现有"禁止展示式构图"一致，本节给出正面写法。\n\n#### 4.7.4 场景/镜头必备五问（写每镜前自问）\n\n1. 这一帧里正在发生什么？\n2. 前景/中景/背景分别是什么？\n3. 镜头为什么选这个机位（查 §4.1.1 决策表）？\n4. 场景里哪个元素在"被使用"？\n5. 这个画面有没有"被发现"的现场感（非摆拍）？\n\n### 4.8 导演风格参考库（类型路由·老李补充）\n\n**情绪基调(A)：** 日常写实/情绪美学/诗意冥想/荒诞主义/悲剧/喜剧/黑色幽默/浪漫\n**类型片(B)：** 惊悚/心理惊悚/恐怖/犯罪/黑色电影/悬疑推理/科幻/奇幻魔幻\n**动作与对抗(C)：** 现代动作/武侠/战争/灾难\n**题材与关系(D)：** 爱情/家庭亲情/青春成长/传记/体育竞技\n**形式与叙事(E)：** 伪纪录片/公路片/歌舞片/动画/实验先锋\n**社会视角(F)：** 社会现实主义/历史古装/政治讽刺/主旋律\n\n**武侠动作重点参考：**\n- 胡金铨：定机位+精确走位，静→静→爆节奏，一招定胜负，留白\n- 徐克：创意运镜不受物理限制，甩镜+快切制造混乱能量，粒子密度极高，关键决杀慢放\n- 李安：动作舞蹈化，长镜头展示连续动作序列，山水画式构图，动作即内心\n\n**现代动作重点参考：**\n- 查德·斯塔赫斯基：宽镜头展示全身动作，长镜头中多人打斗，霓虹色系，动作清晰性优先\n- 吴宇森：慢动作核心，多角度覆盖同动作，双枪对称构图，暴力即美学\n- 乔治·米勒：画面中心法则（关键信息始终在画面正中心），双色高反差，极快但可读\n\n**史诗/宏大场面重点参考（V2.1 新增）：**\n- 彼得·杰克逊：史诗级远景+亲密的角色特写交替；大场面调度（数千角色战线）；航拍壮阔景观\n- 宫崎骏：云风水的动态构图；前景草花/中景角色/背景云山三层独立运动；飞行失重感\n- 库布里克：对称构图+单向透视（宏大的对称压迫感）；上帝视角俯瞰；广角+长焦并置\n\n> 参考风格只用于镜头与提示词创作，**不把导演/明星姓名写进最终提示词**（内容安全红线）。\n\n---\n\n## 五、表演控制（老李微表情库·补充层）\n\n> 主核为小逻六维物理表演（§2.2）；本模块在小逻未覆盖的**细微表情刻画**上补齐，二者叠加使用：\n> 关键近景/特写镜头 = 小逻六维（≥5维）+ 老李微表情库（克制即张力）。\n\n### 5.1 三维情绪描述法\n\n| 维度 | 错误 | 正确 |\n|------|------|------|\n| 表情 | 开心 | 嘴角上扬，眼尾弯起，眼角自然笑纹 |\n| 动作 | 无 | 双手微抬，身体轻轻小幅晃动 |\n| 语气 | 无 | 语调轻快，带着惊喜轻微颤音 |\n\n情绪必须搭配触发场景：有前因后果才自然。\n\n### 5.2 微表情时间轴切片法\n\n核心法则：**克制即张力**。情绪收缩在眼神、面部肌肉微动、呼吸中。\n\n情绪拆解公式：`动机 + 眼神 + 呼吸 + 脸部 + 身体 + 声音 + 收尾`\n\n时间轴格式（2-3秒/片）：\n```\n0-2s: [角色外貌前缀]，[初始状态]，[微表情细节]\n2-4s: [第一个变化]，[动作幅度]，[情绪过渡]\n6-9s: [情绪深化]，[面部变化]\n12-15s: [最终状态]，定格收尾，无黑屏无转场\n```\n\n### 5.3 矛盾肢体语言（高级技巧）\n\n描述矛盾的生理信号而非直说情绪。\n- "嘴角还在笑，眼睛里的光却慢慢弱下来"\n- "鼻翼轻动，咽喉吞咽，眼眶微湿但不落泪"\n- 嘴在笑眼在累 > 单纯哭泣\n\n### 5.4 情绪基底库\n\n| 情绪 | 微表情配方 |\n|------|-----------|\n| 失望/心碎 | 眼神光亮减弱、眼眶微红不落泪、视线下移、极轻微叹息 |\n| 心虚/撒谎 | 视线极小范围游移、眨眼频率微增、咽喉微动、呼吸变浅 |\n| 释怀/笑对 | 眼神由紧绷转柔、轻微长呼气、肩膀线条松弛、嘴角极淡微笑 |\n| 愤怒/压抑 | 眼神定死、呼吸变慢且沉、下颌线极微小紧绷、肩膀完全静止 |\n\n### 5.4.1 视线-情绪对照速查（2026-08-11 吸收 AI影视工具箱 + 小逻表情设定）\n\n| 视线状态 | 对应情绪/意图 | 英文标签 |\n|----------|--------------|----------|\n| 视线低垂落于地面/桌面 | 听训、臣服、隐忍、回避冲突 | averted gaze |\n| 视线直视对方瞳孔 | 表态、对峙、质问、醒悟、威胁 | direct eye contact |\n| 视线追随背影/移动目标 | 离别、念旧、不舍、暗中关注 | tracking gaze |\n| 视线极小范围游移 | 心虚、撒谎、盘算 | shifty eyes |\n| 视线定死不眨 | 愤怒压抑、杀意、审讯压迫 | dead stare |\n| 视线下移 + 眼眶微红 | 失望、心碎、委屈（不落泪） | downcast eyes |\n| 视线望向画外某方向 | 悬念、回忆、目标锁定（下镜给反向位目标） | off-screen gaze |\n| 眼神由紧绷转柔 | 释怀、原谅、温暖 | softening gaze |\n| 一侧眼睑微眯 + 视线重新判断 | 怀疑、重新评估、设防 | appraising gaze |\n| 视线疏离平直（眼睑更沉） | 冷漠、无视（与"平静"区分靠活动量） | detached gaze |\n\n**用法**：写对手戏时从表中直接选视线状态（含英文标签），配合 §2.4 视线锚定铁律使用；表情强度随剧情逐格发展，相邻镜头不无故跳变。\n\n> ⚠️ **标签职责分工（2026-08-11 用户实测：强行套表反致效果变差）**：英文标签每镜 2-4 个的配额，**优先给中文描述不出的镜头/表演质地**（cinematic handheld、depth of field、motion blur、precise eye focus）；视线关系用中文写明后，不重复占用英文标签位，仅关键表演节点（垂眼回避/直视表态）用 averted gaze / direct eye contact 强调。**已验证的标签组合优先，勿为套表而替换**——把镜头词换成视线词会损失画面质感（实测：subtle cinematic handheld→tracking gaze 后效果变差）。\n\n### 5.5 四大红线（表演输出前自查）\n\n1. **禁环境人物与空间位移**：交互对象替换为镜头/画面方向；打斗场景对手改为被动画面描述（"刀刃撞击护甲"不写"对手格挡"）\n2. **禁抽象心理描写**：全部翻译为面部肌肉与呼吸动作\n3. **禁动作超载**：2-3秒切片内最多1-2个微小动作，用"缓缓、极轻微、慢慢"；打斗场景适度放宽但每镜仍控制在2-3个核心动作\n4. **强制自查**：有主角以外人称代词？→删。有心理活动？→翻译成肌肉动作。\n\n### 5.6 好莱坞表演系统（ACTING SYSTEM 升级·V3.1）\n\n> 来源：HELL GRIND 项目 ACTING SKILL（Seedance 2.0 角色表演系统），全文见 `references/ACTING-SKILL-角色表演系统.md`。\n> **核心公理：表演是压力下的行为（BEHAVIOR under pressure），不是情感展示。** 角色想要什么、什么挡着、他怎么去拿——情感只是这场斗争的副产品，永远不直接写情感。\n\n#### 5.6.1 场景五支柱（每个角色每场戏必拆）\n\n| 支柱 | 内容 | 错误写法 | 正确写法 |\n|------|------|---------|---------|\n| 目标 | 此时此地想要什么，**动词指向对手** | 生气 | 让他还钱 |\n| 障碍与赌注 | 什么挡着 + 失败代价 | 无 | 两小时期限/傲气不让求饶 |\n| 战术 | 达成目标的具体方法（动词） | 全场一招 | 施压→诱惑→羞辱→讨价→威胁，失败就换 |\n| 节拍 | 最小行动单位，2-4次变化 | 整场无变化 | 停顿/变姿势/变速/换视线，节拍变化必须可见 |\n| 潜台词 | 真实想法 vs 嘴上说的 | 直接说 | 非问之问/重复问/突然换话题/不合时宜的玩笑/过短回答 |\n\n#### 5.6.2 角色表演主档案模板（150-220词，一段式，每角色一份）\n\n```\nCharacter acting as [NAME]. [年龄/体型/体态——身体是履历书]. [心理引擎一句]。Vocal profile: [音色/口音/语速/情绪下如何破音]. Key physical habits and tics: [招牌小动作+触发器；压力小动作+触发器；隐藏行为；面具及其破裂条件]. Walking style: [命名步态+重量/节奏/落脚]. However, when [情绪触发器], [面具崩溃后的转变]. [可选: 软化对象——唯一让脸真软下来的人/物].\n```\n\n**规则：**\n1. **只写可观察行为**：不写"他很紧张"，写"下唇颤抖、重吞口水、张嘴深吸气、抿唇急呼出"\n2. **每个小动作都有触发器**：不是"他掰指节"，是"他在无聊对话中掰指节以假装自信"（格式：动作+何时/为何）\n3. **命名步态**："power-walk""peacock strut""battering-ram stride"，再拆重量/步幅/躯干/头\n4. **面具+裂缝**：至少一个"However, when X——"条款（主导步态在拒绝后碎成孩子气的塌肩）——一人同时演两种真相才是人不是木偶\n5. **软化对象只给一个**：一个人/动物/物，不稀释\n6. **无服装**：服装在场景/外观块，表演档案必须跨服装存活\n7. **无摄影机无色彩**：表演只管表演\n8. **身体承载传记**："被过往斗争磨损的体格""永远紧张的肩"——职业/旧伤/自我认知写在身体里\n\n#### 5.6.3 眼睛生命（每条档案每场戏必写）\n\n死眼睛是 AI 表演的头号破绽。必写：\n- **微扫视+视线目标**：视线持续移动（漂移/闪开思考/扫向细节/落回），永不冻结锁定一点\n- **真实眨眼率**：压力下快速连眨；控制中缓慢平静；走神时"眨-失焦"\n- **活体眼神光**：眼睛必须湿润、有光、活着\n- **控制的静止是选择不是死亡**：掠食者式少眨眼要慢而刻意，视线仍缓慢移动\n- **眼神先于思考/头部**：眼睛先到目标，再转头；话语出口前思想已可读\n\n#### 5.6.4 声音永久锁定（不随场景改编）\n\n- 每角色一个 Voice prompt 永久声纹：`"A [age]-year-old [origin/accent]. [音色]; [语速]; [情绪特征——压力下如何变]."`\n- 角色说话时**逐字粘贴**到音频字段，永不修改；出现但不说话则省略\n- 表演段落里的声部描述（节拍变速/破音/低语）与 Voice prompt 必须一致\n\n#### 5.6.5 状态而非过渡（视频生成铁律）\n\n模型擅长状态、搞砸过渡。写**已经在动作中**："投掷中、挥拳中、踱步中"，不写"伸手进包、掏出、蓄力"的过程。逐拍链状态，不叙述连续过程。\n\n#### 5.6.6 群像与空间\n\n- **群体反应是波浪不是同步**：一个人先笑，第二个慢半拍，第三个不笑；同时同步=假\n- **反应比动作值钱**：事件后最珍贵的画面是目击者的脸\n- **威胁前冻结**：群像持续微动→关键威胁时一切静止（动→静的对比就是标点）\n- **移动=动机**：没人无缘无故穿场（逼近=升级/转身=驱逐/站起=夺权/冲突中坐下=悖论权力/停在门口=决策点/开始收拾=身体最后通牒）\n- **强者静而弱者躁**：危险不来自危险者本人，来自周围人的张力；威胁无预告（无蓄意停顿无慢速转身）\n- **消耗累积**：被磨垮的角色，身体累积变灰/变重/反应变慢，场景间永不重置\n\n#### 5.6.7 0-5 表演等级量表（自查）\n\n| 等级 | 名称 | 特征 |\n|------|------|------|\n| 0 | 人偶 | 念台词，无行为 |\n| 1 | 朗诵者 | "表情化"文本+指示情感+图解式身体 |\n| 2 | 勤勉 | 能猜出目标，但单战术/反应慢/空停顿 |\n| 3 | 工匠 | 有目标有节拍，会听对手，身体合理。缺：潜台词/意外战术/状态惯性 |\n| 4 | 活着 | 连续行为+对比战术+潜台词与文本分叉+身体里的地位+反应先于台词+至少一个意外但真实的抉择 |\n| 5 | 磁铁 | 4全有+悖论：同时好笑又可怕/残忍又迷人/撒谎又动人——**双重真相**，单一干净情绪在特写里是合成感 |\n\n主角镜头瞄准 4+；自查 2 以下先改再交。\n\n#### 5.6.8 15 种坏表演图谱（速查修复）\n\n| # | 症状 | 提示词级修复 |\n|---|------|-------------|\n| 1 | 指示（表情包） | 把脸从任务里拿掉，写目标+给手找事干 |\n| 2 | 演结果 | 只写角色此刻知道的 |\n| 3 | 等台词 | 反应从对手台词中途开始 |\n| 4 | 单战术 | 标节拍，每节拍一个新战术动词 |\n| 5 | 手势图解 | 手势要么先于思想、要么与话矛盾、要么没有 |\n| 6 | 免费情感 | 建梯子：克制→崩溃，情感必须付出代价 |\n| 7 | 身体违背传记 | 设身体档案：重心/节奏/磨损 |\n| 8 | 台词太干净 | 加脏：打断/吞尾音/重复 |\n| 9 | 威胁信号 | 威胁是日常的，暴力无预告 |\n| 10 | 同步群像 | 波浪式错开反应，强弱不一 |\n| 11 | 死停顿 | 停顿里填评估或事务——或剪掉 |\n| 12 | 情绪重置 | 状态有惯性，余波带入下一节拍 |\n| 13 | 点评角色 | 完全相信情境，喜剧要严肃演 |\n| 14 | 特写超载 | 镜头越紧动得越少：只有眼睛和思想 |\n| 15 | 死眼睛 | 完整应用 5.6.3，眼睛生命永不省略 |\n\n#### 5.6.9 发前清单（表演层）\n\n- [ ] 每个画面内角色目标=指向对手的动词\n- [ ] 障碍与赌注存在，失败代价真实\n- [ ] 2-4 次节拍变化，每次可见（停顿/姿势/语速/视线）\n- [ ] 反应先于对手台词结束；有评估时刻\n- [ ] 每角色有事务（business），中断动作的重音被刻意使用\n- [ ] 距离变化有动机；地位在身体里不在话里\n- [ ] 小动作都有触发器；面具有其裂缝（However, when X）\n- [ ] 眼睛生命显式写入：扫视/眨眼质量/眼神光/眼神先导\n- [ ] 角色说话则 Voice prompt 逐字粘贴；沉默则省略\n- [ ] 状态非过渡；表演层无服装/摄影机/色彩\n- [ ] 群像反应错开；强者静弱者躁\n- [ ] 等级量表自查 ≥4\n\n---\n\n## 六、影视美学与画面（老李补充层）\n\n### 6.1 影视美学核心价值观（补充·审美鉴赏 + 导演课）\n\n**形式与内容的统一（文质彬彬）**\n> 质胜文则野，文胜质则史。文质彬彬，然后君子。——《论语·雍也》\n- 质（内容）= 故事情节、人物、主题\n- 文（形式）= 画面风格、音乐风格、剪辑风格、表演风格\n- 伪精致陷阱：视觉越华丽、故事越空洞，形式失效；形式必须为内容提供支点\n- **AI创作最易犯错误**：把特效堆满但无扎实故事线、合理画面衔接、匹配的音配乐节奏\n\n**创作者的三个认知层级**\n1. 眼低手低：看不出好坏，也做不出（初学者，只能做初级执行）\n2. 眼高手低：能看出好坏，还做不出（进步关键阶段——**先洗眼睛再练手**）\n3. 眼高手高：审美判断力+创作执行力兼备（终极目标）\n> 核心结论：想做出好作品，先看过好作品。AI创作=把真人/动漫作品的审美积累用AI工具再做一遍。\n\n### 6.2 影视美学七大传统\n\n现实主义 / 形式主义 / 古典主义 / 表现主义 / 超现实主义 / 诗意美学 / 史诗美学\n\n### 6.3 意象体系设计\n\n- **视觉母题**：贯穿全片反复出现的视觉元素\n- **唯一高亮区**：全片中让观众视线追着走的核心视觉锚点\n- **意象闭环**：开场与结尾用同一意象的不同尺度/状态形成回收（宏大场景尤适用：开场大远景的巨物 → 结尾特写里的同一巨物残片）\n\n### 6.4 双轨节奏系统\n\n**外部情节节奏**（松/中/紧）+ **内在情感节奏**（轻/中/重）\n\n两条轨道错位是高级叙事手法——情节松+情感重的错位（画面越平静，情感越沉）。\n\n### 6.5 导演三道问\n\n1. 观众知道什么，角色不知道什么？→ 悬念/信息不对称 → 决定镜头视角\n2. 想让观众感受到什么情绪？→ 情绪目标→视觉手段 → 决定节奏光影\n3. 电影感来自什么？→ 区别于小说的纯电影表达 → 决定镜头运动/构图/声音\n\n---\n\n## 七、工业化流程\n\n### 7.1 三段式\n\n前期30%：创意→分镜→素材准备（角色设定图/场景图/关键帧/风格参考）\n中期40%：AI生成画面→人工迭代\n后期30%：剪辑合成→配乐音效→成片\n\n### 7.2 三轮迭代\n\n第1轮定风格 → 第2轮调构图 → 第3轮细化材质光影。禁止一开始抠细节。\n\n### 7.3 避坑清单\n\n- **分辨率陷阱**：画质由提示词决定，分辨率只改画布尺寸\n- **先宏观后微观**：极简提示词定方向→逐步细化\n- **单变量调试**：一次只改一个变量，可追溯效果来源\n- **参考图策略**：拆解要素（构图/光线/色彩/材质/氛围），非直接复制\n- **时长硬凑**：不为了凑90s把爆炸写成12s，内容量决定时长（用户纠错记录）\n- **段数硬凑**：不每集硬凑6段，剧情驱动（用户纠错记录）\n- **表格分镜投喂**：用户要的是生成段式叙述，不是表格（用户纠错记录）\n- **表演缺失**：不写"开心/难过"，用微表情+生理应激（小逻六维+老李微表情库）\n- **宏大场景画小**：不写"很多人/大场面"空词，用比例锚点+焦段+分层纵深（§4.5）\n\n---\n\n## 八、输出质量门禁（所有输出前必过）\n\n> 本套门禁为**唯一权威版**（2026-08-09 修复：与 §2 各步骤内嵌门禁统一，消除双套不同步）。\n\n### 门禁A：剧本门禁（①完成后）\n- [ ] 每集时长与分段结构清晰？时长由内容量决定，不硬凑？\n- [ ] 每段承担1个叙事功能？\n- [ ] 因果链完整：每场有目标/阻碍/行动/变化/离场钩子？\n- [ ] 反转有前置信息？不临时作弊？\n- [ ] 台词口语化？≤40字/句？符合身份与目的？\n- [ ] 无心理描写？无括号暗示？无说教？无抽象情绪词？\n- [ ] 集尾有悬念钩子（小问题已回答+更大问题被提出）？\n- [ ] 动作与镜头描述用角色正式姓名，无代词？\n- [ ] （用§2.1B双轨剧本时）子弹台词≤15字？伏笔分层登记（短程/中程/终极）？特写率≥40%？字数在硬指标内（60s=250-300字/120s=500-600字）？\n\n### 门禁B：分镜门禁（②完成后）\n- [ ] 第一镜从0s开始，最后一镜精确结束于总时长？\n- [ ] 相邻镜头首尾完全衔接？无重叠/跳秒/留白？时长由内容量决定？\n- [ ] 镜头数在软性参考内（18-26镜）？每镜时长合理（信息量估算）？\n- [ ] 动作-反应结构正确？关键节点用 hard cut？\n- [ ] 反应镜头不递归？连续反应镜头不机械复用？\n- [ ] 相邻镜头无相同景别/机位/角度/构图？\n- [ ] 每15-30s有宏观视觉换挡？\n- [ ] 角色/场景/道具编号跨镜头一致？状态连续？\n- [ ] 画面描述无代词？无抽象情绪词？无镜头编号？\n- [ ] 普通人物镜头≥3维、关键近景特写≥5维表演？\n- [ ] 台词能在对应时长内自然说完？\n- [ ] 宏大场景：景别+焦段+运镜+人物比例显式标注（§4.5）？\n- [ ] 中文输出最后一行"无字幕，无背景音乐"？\n- [ ] 零损耗切割：100%还原剧本？无脑补提炼？\n- [ ] 每镜有叙事目的（七分类）？\n- [ ] **动态场景：位置变化有运动因果（攻击→受力→移动→新位置）？跨镜继承上一镜空间状态？**（空间参考系统）\n\n### 门禁C：资产提示词门禁（衔接层完成后）\n- [ ] 三视图：正交投影？无透视？A-Pose？不可变DNA锁定？左右不镜像？\n- [ ] 表情设定：十二宫格？同一人物？四组易混表情物理差异明确？\n- [ ] 场景：空间结构/材质/光影/风格完整？焦段方案明确？\n- [ ] 剧情分镜格：每场一个？连续叙事？景别互补？镜头语言覆盖达标？人物/场景/风格锁定？\n- [ ] 宏大场景：景别+焦段+人物比例（§4.5）？\n### 门禁D：提示词门禁（③完成后）\n- [ ] 每段完整五段式（风格/色卡参考/镜头/时间轴/声音）？（>60s 长内容才六段式：+【出场人物与场景】）\n- [ ] >60s 的段：出场人物与场景写清（@资产位）？≤60s 的段：无此模块（回归 V3 实测好的五段式）？\n- [ ] 色卡参考位于【风格】之后、【镜头】之前？主色相+辅助色+高亮色+暗部色四色齐全且附 HEX+RGB？\n- [ ] 时间轴连续叙述？段间无缝衔接？总时长参考目标（建议性，可弹性）？\n- [ ] **运镜内嵌（V4.0.6）：每时间点运镜跟随情绪弧线进化（建立→引入→聚焦→爆发→收束）？运镜有完整轨迹+景别变化？视觉调度有大-中-小-大层级或尺度对比收尾？**\n- [ ] 开场直接炸开？不解释来历？\n- [ ] 动作+物理反馈+括号音效嵌入描述？\n- [ ] 零心理描写？只写可见可听？无抽象情绪词？\n- [ ] 台词自然语速能说完？角色名："台词"格式？\n- [ ] **对白戏时长：台词没说完不许切镜**？单镜 8-12字 已拉长到 2.5-4s？15字以上已拆连续时间点且台词连续？\n- [ ] 宏大场景：景别+焦段+人物比例（§4.5）？\n- [ ] **站位锚定：每镜首句写清人物空间关系（方位/距离/面向/前后景）？跨时间点位置变化写明移动轨迹？**（2026-08-11 用户反馈新增）\n- [ ] **视线锚定：对话/对手戏每镜写清谁看谁、看哪里、何时移开？听者视线是否约束？**（2026-08-11 用户反馈新增）\n- [ ] **打斗段（§4.6.8）：动作动力链完整（意图→起手→重心→发力→接触→反馈→收招→下格继承）？攻防成对（攻击必有防守/闪避/格挡/反制）？无瞬移/无理由换边/穿模/空间重置？P15 类结尾不静止摆pose？**（2026-08-16 武打体系入库新增）\n- [ ] **分段独立生成：每段【风格】【色卡参考】【镜头】完整自包含？无"延续/沿用/上段"等继承表述？同场景跨段色卡逐字一致？**（2026-08-11 用户确认新增）\n\n- [ ] 每段纯中文为主？英文标签每镜2-4个且兼容？\n- [ ] 六重一致性锁（资产/时间轴/空间/光影/风格/末态继承）满足？\n- [ ] 段间 hard cut 标记或时间轴连续？\n- [ ] 结尾视觉闭环（意象回收）？\n- [ ] 中文输出最后一行"无字幕，无背景音乐"？\n\n### 门禁E：宏大场景门禁（考核标准③·凡遇宏大场景必过）\n- [ ] 景别显式标注（大远景/大全景/中全景...）？\n- [ ] 焦段显式标注毫米数（16-24/24-35/35-50/85+）？\n- [ ] 运镜显式标注（航拍/升降/横移/推近...）？\n- [ ] 人物与巨大环境/巨物的比例差写清？\n- [ ] 三层纵深（前景/中景/远景）存在？\n- [ ] 空气透视/粒子密度/光影方向明确？\n- [ ] 无"数万""很多人"等不可渲染数量词？\n\n---\n\n## 九、开源电影级提示词方法论（HELL GRIND · V3.1 新增）\n\n> 来源：Higgsfield 开源 AI 电影《HELL GRIND》（95分钟，全提示词/资产开源，2026-08-07 入库）。用户验证过的专业提示词——按可复用方法论分类提炼入库。\n> 分类方法论全文：`references/HELL-GRIND-提示词分类方法论.md`（V4.1.3 起为唯一保留件，原文全集 252KB 已应要求移除）。\n> 用法：**长段/多镜头段提示词直接套本章骨架**；短段仍用 §2.4 五段式（≤60s）；>60s 长内容才升级六段式。\n\n### 9.1 提示词骨架（PROMPT FRAMEWORK）——长内容顶层结构\n\n长提示词按此顺序组织，缺一不可（详细说明见方法论文件 §一）：\n\n```\nSCENE CONTEXT        场景上下文（承接上一镜，1-2句）\nSTRICT / WORLD LOCK  铁律区（本段所有硬约束集中声明）\nACTIVE REFERENCES    本段激活的资产引用清单（角色/场景/道具 @引用）\nLOCATION MAP         空间布局锚点（方位/距离/几何关系）\nFIRST FRAME          第0帧画面状态（开局即定）\nFORMAT MODE          格式（时长/画幅/帧率/慢动作策略）\nOPTICS               光学（胶片/镜头/颗粒/快门）\nCAMERA               摄影机（运镜/机位/性格）\nACTION TIMING        动作时间轴（逐beat秒级编排）\nPHYSICS              物理（重量/惯性/接触阴影）\nLIGHTING             光线（光源/色温/方向）\nAUDIO                声音（环境SFX/台词/音乐规则）\nCHARACTER ACTING     表演（微表情/反应节奏）\nSTYLE                风格（导演风格转述/质感）\nQUALITY              质量（8K/毛孔级皮肤/实拍感）\nPOSITIVE CONSTRAINTS 正约束（明确"画面里必须有"什么）\n```\n\n**关键设计：** 骨架按"AI消费优先级"排序（铁律/空间在前，动作居中，风格质量收尾）；每字段只写一次，动作段引用前面锁定内容（"Camera rules continue"）；结尾固定写 `References = visual identity / costume / environment matching only. Generate 100% original continuous live-action cinematography from scratch.`（参考图只做身份匹配，动态画面100%原创）。\n\n### 9.2 资产引用体系（长片一致性根基）\n\n- **资产编号**：`<<<uuid>>>` + `[imageN]` 双标识，文字描述兜底\n- **分状态建资产**：同一角色按状态拆（常态/湿身/带伤），同段只激活需要的状态\n- **身份切换（IDENTITY SWITCH）**：变身/受伤时显式声明 `<<<A>>> → <<<B>>>`，从某帧起只用B——杜绝中途漂移\n- **参考图标注用途**：`CHARACTER REF — appearance only` / `SCENE REF — space only` / `ELEMENT REF — do not copy framing`；场景分正面/背面（FRONT SIDE / BACK SIDE）两张\n- 环境参考图只继承风格/色调/氛围，禁止复制构图和机位\n\n### 9.3 统一大气指令（跨镜头一致性杀手锏）\n\n把贯穿所有镜头的大气参数**单独成块，要求每段原样粘贴**——这是长片不漂移的核心秘密。锁定参数：色温（如4500K冷阴天）/ 雪暴等级（每帧100-200片雪花）/ 能见度（30-50米）/ 调色板（60:30:10）/ 光线（overcast冷漫射光）/ 地平线（无可见地平线）/ 风向。\n\n**无限军团模式**（战场类）：每2-3秒从雾里冲出3-5个新敌；地下再生每镜5-8次；第0帧已在战场中心（无开始过渡）；后景敌人运动矢量永远指向主角；史诗规模写"单帧500-1000人暗示10000+"不写"数万"；人群写"3种样式混合"不写克隆。\n\n### 9.4 铁律区写法（STRICT / HARD LOCK）\n\n- **正约束**：写"画面里必须有"——`EXACT 3 CHARACTERS` / `No duplicates` / `第0帧长矛必须在骑兵手中` / `盾牌开拍前已长好`\n- **硬锁清单**：慢动作/位置锚点/角色解剖/动作编排/硬切转场/光线，每个单独一条 `⚠️ XXX (HARD LOCK)`\n- **几何锁定**：罗盘定向（NORTH=天窗墙...）+ 锁定距离（两人EXACTLY 2.5米）+ 锚点不动（柱子固定不跟随）+ 比例锚点（怪物360cm，头是人的两倍高）\n\n### 9.5 动作编排（秒级beat写作）\n\n- **单镜头beat**：`动作(0-2秒): [核心动作] + [SLOW-MOTION段落,放慢4-6倍] + 慢动作细节 + [回到正常速度]`\n- **帧率渐变**（一镜内）：`60fps → 240fps（重慢动作）→ ⚡10000fps（子弹时间，只给3个峰值瞬间）`——ramp都在机内完成，绝不是剪辑切\n- **多镜头段**：`multishot sequence — 15 SECONDS · 21:9 · 8K · 60fps · hard cuts only · exactly 6 numbered shots`；每镜之间 `HARD CUT — [大气参数锁定摘要]`（把须延续的参数浓缩一行，防漂移）\n- **多角色时序**：每beat只保一个主角色动作，其他角色只写在场状态\n\n### 9.6 战斗戏专项\n\n- **死亡规则统一**：不死系死亡=黑色尘雾/黑沙；`切开即崩解，两半分离后变黑色尘雾爆发`\n- **有机武器 vs 持械**：`整条手臂变成水晶武器——不是握在手中的武器` / `骨刃是身体的一部分，没有手没有握柄`（写进AVOID：不要画手）\n- **战斗摄影机性格**：`非常活跃手持剧烈摇晃反应性相机，像战地摄影师冲入战场`；反应性jolt；每0.5-1秒插入动态CU（0.2-0.5秒），whip pan连接\n- **一镜到底（ONER）**：`SINGLE CONTINUOUS HANDHELD ONER, NO editorial cuts`；whip-pan是机内运动不是剪辑；PHASE A中段开场→B格挡反击→C连杀狂潮→D持续战斗无结局；马匹规则写死（`马永不停留/永不撞盾/从旁全速掠过`）；结尾不解决（`take ends mid-action`）\n- **体力疲劳递进**：长战斗写主角疲劳（白气呼吸/转身变慢/有一刀擦过肩甲）——真实消耗感\n\n### 9.7 表演与情绪（SOLO PORTRAIT 范本）\n\n- **情绪弧线时间轴**（10秒单人特写）：0-3s持续醒悟（眼神下移/瞳孔放大/浅震惊呼吸）→ 3-6s醒悟加深为悲伤（眉心上挑/嘴唇抿紧/一滴泪滑过血迹）→ 6-10s悲伤转暴怒（眼神抬起/眉毛下压/下颌紧咬/面部微颤/太阳穴血管鼓起）\n- **表演硬规则**：台词前后各留1秒静默（先拍脸再开口，说完继续hold）；台词内容绝不视觉化（无闪回无幻影）；声音优先混音（说话时环境声duck到低音量）；只演剧本台词（无即兴无嘟囔无画外音，没台词就是沉默）\n- **毛孔级皮肤**：`pore-level realism — vellus hair（毳毛）, asymmetric moles（不对称痣）, capillary flush（毛细血管泛红）, pore-shadow matching on-set light`\n\n### 9.8 环境镜头范本\n\n- **城市航拍空镜**（8秒）：完整参数锁（600米高度+15度前倾+地平线y=35%+2.39:1+整段匀速右移）；运动层级（摄影机匀速横移/环境斜雨/主体两辆车/内部云层闪电）；闪电时刻表（0.8s+3.2s+6.1s，每次配数秒后闷雷）；调色板60:30:10；连续性锁（始终只有两辆车/地铁高架空载/云层永不散）\n- **自然亲密空镜**（5秒）：手持中景开始→缓慢匀速后拉→两人变小融入广阔自然；负向清单极详细（无音乐无接吻无慢动作无他人无胡须无对白无文字）\n\n### 9.9 图像编辑提示词（损伤修正范本）\n\n- **结构**：`Edit this image. [总目标] Apply these corrections consistently across all views.` → CHANGE 1删除类 / CHANGE 2削减类 / PRESERVE保留类 / CHANGE 3比例类 / CHANGE 4可读性 → `Final goal: [最终画面一句话]`\n- **原则**：删除/削减/保留三类分开写；削减给"完整清单"（`这就是面部损伤的完整清单`）防止AI加戏；负向清单给具体参照物（`NOT horror movie victim`）；保留项写死（身份/结构/体型/发型/服装/姿势/布局/背景）\n\n### 9.10 统一风格前缀 + 导演风格转述表\n\n每段可复用基础前缀（与§1.7基-氛-画同构）：`Style: 8K IMAX. Photorealistic — no 3D render, no game engine` → `Lighting: Natural light only — contre-jour backlight, camera on shadow side, atmospheric haze` → `Color: 60:30:10` → `Camera: Physical cine lens. 180° shutter motion blur` → `Skin: Pore-level realism` → `Acting: Hollywood — micro-pauses` → `Physics: Gravity and inertia respected` → `Composition: Rule of thirds + golden ratio` → `Continuity: No identity drift` → `Technical: 24fps, 8K` → `Audio: Environmental SFX only. No music. No subtitles.`\n\n**导演风格转述表**（HELL GRIND 实际用到，遵守§0.3不写人名红线）：\n\n| 原参考 | 提示词转述写法 |\n|--------|---------------|\n| Lubezki × Deakins | 自然光+逆光（contre-jour）+大气雾霾+手持 |\n| Kurosawa Ran | 动态对称构图+史诗战场+戏剧性天气+低饱和 |\n| John Wick / The Raid | 一镜到底打斗+干净利落击杀节拍+摄影机活在暴力里 |\n| Terrence Malick | 亲密连接消融于广阔自然+缓慢后拉 |\n| Cuaron / Villeneuve | 世界密度+手持长镜头 / 监视级克制+低照度实用光 |\n| 动漫终战（Bleach/鬼灭） | 爆裂动作+关键帧定格+"漫画静止帧"节拍 |\n\n### 9.11 项目级工程秘密（总结）\n\n1. 一致性不是靠"记得"，是靠"复制"——统一大气指令/无限军团指令/第0帧指令要求每段原样粘贴\n2. 资产是长片的命——每角色每状态独立资产，变身用 IDENTITY SWITCH\n3. 正约束优于负约束——"EXACT 3 CHARACTERS"比"不要第4个人"有效\n4. 几何锁死——罗盘+距离+锚点，空间不漂移\n5. 硬切=状态摘要——HARD CUT 后跟一行大气参数摘要\n6. 长片=多段骨架——每段独立完整骨架，段间靠"Scene context: 承接上一镜"衔接\n7. 负向清单收尾——每段结尾列 AVOID/NEGATIVES，把最易翻车点列全\n\n### 9.12 CINEDANCE 导演系统（V3.1 升级·详细版见 references）\n\n> 📄 完整版：`references/CINEDANCE-HIGGSFIELD-提示词导演系统.md`。定位：§9.1 骨架的"母版"（4-D 方法论 + 输出前静默 QA，适合"首生成即可用"的高要求场景）。以下为速查要点：\n\n**4-D 内部方法论**：D1 Deconstruct（只保留本镜可见可闻内容，删陈旧@标签/前场措辞）→ D2 Diagnose（预诊首帧空/角色迟到/视线反转/道具拿错手等失败风险，逐项加短锁）→ D3 Develop（顺序：场景上下文→输出设置→激活引用→地点地图→首帧占位→空间调度→角色锚点→格式→光学镜头→摄影机→动作时间→物理材质→光曝光→音频→正锁→局部失败锁；**空间规则先于镜头风格，光是优先锁不是装饰**）→ D4 Deliver（只输出最终提示词，不带QA/推理/笔记）。\n\n**镜头控制：视场角代替毫米数**（Seedance 对可观察镜头结果响应更好）：107°广角贴脸/84°经典广角/47°标准人眼/29°短长焦中景/18°经典长焦紧特写/8°超长焦监视（必加前景遮挡30-45%）。脸部肖像84→29→18；环境动作47→84→107；远距观察8°。**同节拍内混内容类=镜头漂移**。\n\n**长焦/广角可观察结果堆栈**（每镜≥4/3条）：长焦=背景完全柔化/主体锐利/奶油散景/背景压扁/雾悬浮；广角=前景身体存在感/环境环绕可见/边到边合焦/直线保持直线/相机物理贴近。反漂移锁：`本镜任何部分不得变成[广角/长焦]`。\n\n**摄影机写为物理操作员行为**：`camera fixed at X`/`lens at hip height`/`subject occupies screen-left third`/`profile preferred`；手持写物理描述（操作员呼吸/重心转移/有机不完美校正），禁 digital jitter/random shake/gimbal smoothness。\n\n**首帧占位锁**：`The first visible frame already contains all required characters in their correct positions. No empty establishing frame. No delayed character reveal.`（仅用户明确要求才允许空开场）。\n\n**空间调度锁**：每主体写屏幕位置+世界位置+距地标距离+身体朝向+视线方向+运动方向+前中背景；**视线与身体朝向分离写**（`torso faces X`/`eyes stay locked on X`）；**地标近距锁禁弱词**（禁用 near/around/beside，替换 `within 1 meter`/`back against the wall`/`hand on the handle`）。\n\n**多镜连续性锁**：默认单镜连续；多镜必须显式定义每剪（Shot A 时长/相机/首帧/调度/动作 + 切型 + Shot B 全套），绝不让模型发明剪；剪后不重置动作不传送角色；允许 HARD/SMASH/MATCH/INSERT/REVERSE/WHIP CUT，禁 fade/crossfade/dissolve。\n\n**灯光优先锁**：逆光锁 `Subject stays between camera and the brighter background. Camera stays on the shadow side. Faces remain in deep shadow unless explicitly lit. Only rim light, edge light, wet speculars, eye glints, and environmental bounce reveal detail.`；光向必写（主光源/光向/相机与光相对侧/阴影轮廓侧/背景亮度/曝光优先/允许高光/禁止光失败）。\n\n**上下文隔离**：最终提示词是密封的当前镜头文档，禁场景号/集标签/脚本头/前场摘要/未用角色地点标签/previously/again/same as before/continues。\n\n**参考控制层级**：身份参考管脸/身体/比例/服装；地点参考管建筑/材质/地理/光向（不得覆盖所需机位）；道具参考管形状/尺度/状态；风格参考不得覆盖身份/调度/动作/光学/灯光。**高细节只给需要控制处，低细节给泛美描述——改进来自更强信号，不是更多赘肉**。\n\n**输出前静默 QA（20项）**：所有@标签实际用到？删了陈旧@标签？首帧正确？每角色位置/视线/身体朝向清楚？地标近距物理锚定？机位侧清楚？镜头性格按内容类型？镜头防漂移？灯光防平？道具在正确的手？动作物理可行？时间块一致？对白干净仅台词？避免场景号和上下文泄漏？QA隐藏不外露？\n\n### 9.13 LIRA 图像资产体系（V3.1 新增·详细版见 references）\n\n> 📄 完整版：`references/LIRA-SKILL-图像提示词优化.md`。定位：衔接层资产提示词（三视图/场景/道具/编辑）的进阶规范。\n\n**模型路由**：角色表/肖像/一致性 → Soul 2.0（Soul ID 锁脸）；场景/环境/电影静帧 → Soul Cinema（21:9）；道具表 → NBP/GPT Image 2；**帧编辑永远第一选择 NBP**（最小改动+穷举保留）→ Seedream 4.5（只做纹理通道）→ GPT Image 2 最后手段。需要重建的画面回 Soul 重新生成。画幅/分辨率=平台UI参数，不进提示词文本；无模型有负向提示词参数，一切靠正向描述。\n\n**10条反失败铁律**（核心5条）：①自然散文非关键词堆叠（不用ALL-CAPS段落头，CAPS只用于编辑CHANGE/PRESERVE）；②不膨胀（80-150词最优）；③**正向>负向**（生成提示词绝不写"不要什么"，NOT堆叠会注入概念本身；编辑中"移除"才合法且必须配"填补"）；④技术光与材质非模糊氛围（`single overhead key light, soft 2:1 ratio` 优于 `dramatic cinematic lighting`；`board-formed concrete` 优于"混凝土"）；⑤角色一致性=Soul ID 非散文；⑥防插画漂移（写 `studio photographs/film character sheet/cinematic film still`，禁 character reference sheet/painterly）；⑦文字给精确文案+字体字重颜色；纹身给具体设计；绝不写真实人名/IP/品牌；⑧60/30/10 调色板从指令/语境/参考推导，绝不凭空发明；⑨编辑 NBP 第一+最小CHANGE+穷举PRESERVE；⑩不膨胀≤1500-2000字符。\n\n**技术块（相机+胶片）**：胶片登记 `Photorealistic ARRI Alexa LF anamorphic Cooke S4 lens at T2.0, organic 35mm Kodak Vision3 250D film grain, soft cinematic falloff`；现代数字登记 `Shot on ARRI Alexa Mini LF with ARRI Signature Prime lens, clean modern digital cinematic capture`。调色板包裹：`Refined desaturated palette: [cool] dominating, [warm] as only warm contrast, deep crushed blacks`（照片级角色工作去"painterly"）。\n\n### 9.14 情绪驱动电影感提示词（V3.2 新增·来源 Quill 免费版）\n\n> 📄 完整版见 Obsidian `07-课件内容/AI导演思维10天课程/提炼内容/`。通过情绪/叙事意图/观众心理反推镜头角度/焦距/构图/景深/光线/色彩/材质/氛围/胶片质感。**绝不把术语当通用提质词堆砌**。\n\n**先想六问**：观众位置（受害者/目击者/追逐者/上帝视角/亲密参与者）→ 权力关系（谁支配谁）→ 空间心理（开放/封闭/压缩/空旷/迷宫/垂直/坍塌）→ 叙事焦点（人/威胁/物/环境/光/缺席）→ 视觉温度（有生命/温暖/无菌/死亡/神圣/被污染）→ 真实程度（纪录片/神话现实/灾难现实/梦境逻辑）。\n\n**情绪→视觉决策表速查**：恐惧/压迫=低机位仰拍+长焦压缩+侧逆光穿尘+低饱和冷调；巨物渺小=人眼高度+人压底部边缘+巨物比人清楚；敬畏=低机位正面对称+小人物+纪念碑主体+真实大气逆光；幽闭无路=长焦压平/紧广角畸变+删天空地平线+低亮度+出口方向无光；孤独遗弃=远距静态旁观+大量负空间+冷灰弱光；权力权威=仰拍或眼平对称+居中垂直轴+硬侧光受控阴影；追逐恐慌=手持肩高跟拍+倾斜线/局部遮挡/前景虚化+实用光强对比；亲密脆弱=近距眼平/过肩+标准到短长焦+浅焦锁眼/手+暖肤柔对比。\n\n**镜头速记**：低机位=权力上移(弱势/压迫)；高机位=脆弱/被监视；眼平=纪实在场；广角=逼近/畸变/恐慌；长焦=压缩纵深/不可逃避；浅景深=锁叙事焦点；深焦=关系全可读。\n\n**硬规则**：①确定性——不写 or/或/斜杠选项，每个变量只选一个；②默认电影机质感——写真实电影机+胶片（`电影机拍摄`/`35mm 胶片扫描质感`/细腻颗粒/柔和动态范围/轻微 halation），绝不只写"电影感"；③每个选择都有情绪功能——把效果拆成镜头/曝光/颗粒/高光/色彩行为，不写抽象赞美。用户给了字段模板时严格保留标题/标点/顺序。\n\n### 9.15 实战提示词拆解库（V3.2 增补·速查版见 references）\n\n> 📄 核心结论已提炼为下方速查（九大类别 + 八条落地铁律）；原始数据（340条 JSON/精选 md）已于 2026-08-09 应要求移除，方法论点见 `references/HELL-GRIND-提示词分类方法论.md`。\n\n**九大实战类别**：①定场环境（分段大写标题 THE FIELD/THE ALTAR + 60:30:10 + 技术参数，禁词列末尾）；②角色锁定多镜头（`EXACT N CHARACTERS` 锁人数 + `<<<uuid>>>` 引用资产标注用途）；③动作群戏（Style Prefix 固定开头一字不差 + Camera/Environment 独立段落 + 结尾技术标签）；④中文多镜头对白（**整个场景用中文写，Seedance 支持**；⚠️一句台词=一个镜头，禁止台词跨镜头）；⑤浪漫特写（CAMERA/LIGHT/ACTION/SOUND/NEGATIVE 分节 + ACTION 分秒级 0.0s/1.5s/3.0s/4.5s/5.0s）；⑥慢动作多角色（CUT 标签分段 + 帧率转换 96→24fps 4x SLOW-MO + 屏幕时间/真实时间双标注）；⑦风格参考（(StyleReference) 声明 + 油画术语 brush textures/thick paint 替代"油画风格"）；⑧服装编辑（CHANGE 精确改什么 + PRESERVE 锁住不变 + 材质细节 + REMOVE 明确删除项）；⑨角色描述（面部+体型+发型+服装全正述，不写情绪，三视图一帧）。\n\n**八条落地铁律**：①Style Prefix 全项目锁定一字不差（8K IMAX...60:30:10...180° shutter...）；②资产引用用 `<<<uuid>>>`/`<<<image_N>>>` 并标注用途（CHARACTER REF/SPATIAL ref/StyleReference）；③中文提示词可行（Scene 14 整场中文）；④多镜头=【镜头N】分段，每镜独立机位/景别/动作/对白；⑤秒级动作编排（[ACTION] 内 0.0s/1.5s/3.0s/4.5s/5.0s 逐秒拆解）；⑥负向列表 [NEGATIVE] 锁细节（no music/no slow motion/no extra fingers）；⑦编辑提示词=CHANGE+PRESERVE；⑧定场镜用大写分段标题。\n\n**中文多镜头对白范本结构**（Scene 14 实证）：资产引用（`<<<image_1>>>` 角色/地点，标注 MAIN VIEW/REVERSE VIEW/布局）→ 人物位置（A站X处面向Y，B在A正后方1.5米）→ ⚠️规则前置（屏幕光线规则/对白规则）→ 【镜头N】每镜机位+焦段+景别+时长+动作+台词 → 结尾 Style 段统一风格（8K IMAX电影/灯光仅场景内实际光源/60:30:10/表演反应前微停顿/物理重力惯性/60fps/仅环境SFX/禁音乐禁字幕/时长画幅）。\n\n## 十、使用建议\n\n### 完整工作流\n\n```\n剧本大纲 → ①详细剧本 → ②分集分镜脚本 → 衔接层(三视图/表情/场景/剧情分镜格) → ③每集分镜提示词 → 生成验证\n```\n\n**①详细剧本：** 小逻编剧创作逻辑（阶段路由/场次戏剧单元/冲突升级/五维微表演/角色名称硬规则）→ 分集规划 → 分段结构 → 资产登记\n**②分集分镜脚本：** 小逻时间轴（0-90s连续/18-26镜/动作-反应hard cut/宏观视觉换挡/六维表演/资产统一/硬校验）+ 山音补充（镜头组/动作反应变体/信息量时长）\n**衔接层：** 角色三视图提示词（小逻正交标准）→ 角色表情设定提示词（十二宫格）→ 场景提示词（焦段体系）→ 剧情分镜格提示词（每场一个）\n**③每集分镜提示词：** 按生成段式输出纯中文提示词（≤60s 五段式 / >60s 六段式）→ 自检门禁D+E\n**生成验证：** AI视频生成 → 角色骨相一致检查 → 道具连续检查 → 光影来源检查 → 段间衔接检查（考核标准①）\n\n### 模型选择\n\n- 极端特写/微距镜头 → Kling 1.6 或 Runway Gen-4\n- 人物微妙表演（微表情/生理应激）→ Pika 2.0 或 Kling 高细节模式\n- 粒子特效密集场景 → Kling 1.6（粒子物理一致性）\n- 环绕运镜+物理交互 → Kling 关键帧首尾帧功能\n- 宏大场景/大远景/航拍 → 可先出静止关键帧验证比例再生成动态（防巨物画小）\n\n### 跨段生成衔接\n\n- **首尾帧方案已废弃（V4.0.2）**：不再用上一段尾帧当下一段首帧直接拼接——AI 无长时序记忆，动态信息每 15s 归零，直接拼必跳切。\n- 正确做法：每段生成前**绘制分镜参考图**（固定上段结尾的人物姿态/站位/互动）→ 提示词同步更新变动数据（站位/姿态/构图）→ 拼接节点**更换机位**（切近/反打/换景别）\n- 不变数据（人物资产图/场景图）全程固定导入；可变数据（站位/姿态/互动/构图）每段同步更新\n- 硬切镜头建议单独生成后剪辑拼接\n- 光影不变则生成时锁定光源方向描述\n- 段间衔接四重规则（资产/动作/情绪/声音）逐段核对 + 末态继承锁检查（详见 §3.7）\n\n---\n\n## 十一、版本记录\n\n- **V5.0.2（2026-08-20）**：**招式库
