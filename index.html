/* --- 从云端加载数据 --- */
let lastSyncError='';
async function loadFromCloud(){
  if(!sbClient)return null;
  try{
    updateSyncBadge('syncing','同步中…');
    const {data,error}=await sbClient.from('workbench_data')
      .select('data,updated_at')
      .eq('workspace_id',CLOUD_CFG.workspaceId)
      .maybeSingle();
    if(error){
      lastSyncError=error.message||JSON.stringify(error);
      updateSyncBadge('error','加载失败');
      console.error('[Supabase] 加载失败:',lastSyncError);
      return null;
    }
    if(!data){updateSyncBadge('online','已连接');return null;}
    updateSyncBadge('online','已连接');
    lastSyncError='';
    if(data.updated_at){
      lastCloudSaveTime=new Date(data.updated_at).getTime();
    }
    return data.data;
  }catch(e){
    lastSyncError=e.message||String(e);
    updateSyncBadge('error','网络错误');
    console.error('[Supabase] 网络异常:',lastSyncError);
    return null;
  }
}

/* --- 保存到云端（防抖 + 自动重试） --- */
let saveRetryCount=0;
let lastSaveTimestamp=null;  // 记录本次保存的时间戳，用于识别自己保存的回声
function saveToCloud(){
  if(!sbClient)return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    syncTimer=null;  // 清空定时器引用，让订阅/轮询可以正常工作
    _cloudSaveInProgress=true;  // 标记云端保存进行中
    updateSyncBadge('syncing','同步中…');
    const ts=new Date().toISOString();
    try{
      const {error}=await sbClient.from('workbench_data')
        .upsert({
          workspace_id:CLOUD_CFG.workspaceId,
          data:DB,
          updated_at:ts
        });
      if(error){
        saveRetryCount++;
        if(saveRetryCount<=3){
          updateSyncBadge('error','重试中('+saveRetryCount+'/3)');
          setTimeout(()=>saveToCloud(),2000*saveRetryCount);
        }else{
          updateSyncBadge('error','保存失败');
          saveRetryCount=0;
        }
      }else{
        saveRetryCount=0;
        lastCloudSaveTime=Date.now();
        lastSaveTimestamp=ts;
        updateSyncBadge('online','已连接');
      }
    }catch(e){
      saveRetryCount++;
      if(saveRetryCount<=3){
        updateSyncBadge('error','重试中('+saveRetryCount+'/3)');
        setTimeout(()=>saveToCloud(),2000*saveRetryCount);
      }else{
        updateSyncBadge('error','网络错误');
        saveRetryCount=0;
      }
    }finally{
      _cloudSaveInProgress=false;
    }
  },500);
}

/* --- 定期同步（每30秒检查一次云端是否有更新） --- */
let pollTimer=null;
function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    if(!sbClient||isRemoteUpdate)return;
    /* 如果有未执行的保存或正在保存，跳过覆盖以避免丢失本地新增数据 */
    if(syncTimer||_cloudSaveInProgress)return;
    try{
      const {data,error}=await sbClient.from('workbench_data')
        .select('data,updated_at')
        .eq('workspace_id',CLOUD_CFG.workspaceId)
        .maybeSingle();
      if(!error&&data&&data.data){
        const cloudTime=new Date(data.updated_at).getTime();
        const localTime=lastCloudSaveTime||0;
        if(cloudTime>localTime){
          try{
            isRemoteUpdate=true;
            DB=data.data;
            ensureKeys();
            localStorage.setItem(STORE_KEY,JSON.stringify(DB));
            /* 弹窗打开时仅更新数据，不触发页面重渲染（避免干扰表单操作） */
            if(isModalOpen()){
              _pendingCloudRender=true;
            }else{
              const cur=document.querySelector('.nav-item.active');
              if(cur)switchSection(cur.dataset.id);
            }
          }catch(e){
            console.error('[Sync] 轮询处理异常:',e);
          }finally{
            isRemoteUpdate=false;
            lastCloudSaveTime=cloudTime;
          }
        }
      }
    }catch(e){}
  },30000);
}

let lastCloudSaveTime=0;

/* --- 实时订阅 --- */
let _initGracePeriod=true;  /* 初始化保护期，防止订阅回声导致闪屏 */
function subscribeCloud(){
  if(!sbClient||!CLOUD_CFG.workspaceId)return;
  if(sbChannel)sbClient.removeChannel(sbChannel);
  sbChannel=sbClient.channel('workbench-sync')
    .on('postgres_changes',{
      event:'*',schema:'public',table:'workbench_data',
      filter:'workspace_id=eq.'+CLOUD_CFG.workspaceId
    },(payload)=>{
      if(payload.eventType==='DELETE')return;
      /* 初始化保护期内跳过所有订阅事件，避免闪屏 */
      if(_initGracePeriod)return;
      const newData=payload.new&&payload.new.data;
      const cloudTs=payload.new&&payload.new.updated_at;
      /* 跳过自己保存的回声：避免覆盖本地未同步的新增数据 */
      if(cloudTs&&lastSaveTimestamp&&new Date(cloudTs).getTime()===new Date(lastSaveTimestamp).getTime()){
        lastSaveTimestamp=null;
        return;
      }
      if(newData&&!isRemoteUpdate){
        /* 如果有未执行的保存或正在保存，跳过覆盖以避免丢失本地新增数据 */
        if(syncTimer||_cloudSaveInProgress){
          return;
        }
        try{
          isRemoteUpdate=true;
          DB=newData;
          ensureKeys();
          localStorage.setItem(STORE_KEY,JSON.stringify(DB));
          /* 弹窗打开时仅更新数据，不触发页面重渲染（避免干扰表单操作） */
          if(isModalOpen()){
            _pendingCloudRender=true;
          }else{
            const cur=document.querySelector('.nav-item.active');
            if(cur)switchSection(cur.dataset.id);
          }
        }catch(e){
          console.error('[Sync] 订阅处理异常:',e);
        }finally{
          isRemoteUpdate=false;
        }
      }
    })
    .subscribe();
}

/* ========== HTML 转义 ========== */
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ========== 点击复制 ========== */
function copyText(el,customText){
  const text=customText!==undefined?customText:el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>_showCopyTip(el));
  }else{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy');_showCopyTip(el);}catch(e){}
    document.body.removeChild(ta);
  }
}
/* 通用复制到剪贴板（带toast提示） */
function copyToClipboard(text){
  if(!text) return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板','success'));
  }else{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy');showToast('已复制到剪贴板','success');}catch(e){showToast('复制失败','error');}
    document.body.removeChild(ta);
  }
}

/* ========== 标签颜色 ========== */
const TAG_COLORS=[
  ['var(--tag-blue)','var(--tag-blue-t)'],
  ['var(--tag-mint)','var(--tag-mint-t)'],
  ['var(--tag-amber)','var(--tag-amber-t)'],
  ['var(--tag-violet)','var(--tag-violet-t)'],
  ['var(--tag-rose)','var(--tag-rose-t)'],
];
function tagColor(text){
  let h=0; for(let i=0;i<text.length;i++) h=text.charCodeAt(i)+((h<<5)-h);
  const c=TAG_COLORS[Math.abs(h)%TAG_COLORS.length];
  return 'background:'+c[0]+';color:'+c[1];
}
function tagAccentColor(text){
  if(!text) return '#cbd5e1';
  let h=0; for(let i=0;i<text.length;i++) h=text.charCodeAt(i)+((h<<5)-h);
  const c=TAG_COLORS[Math.abs(h)%TAG_COLORS.length];
  return c[1];
}

/* ========== Toast 提示系统 ========== */
function showToast(msg,type){
  const container=document.getElementById('toastContainer');
  if(!container) return;
  const toast=document.createElement('div');
  const t=type||'';
  const icons={success:'✓',error:'✕',warn:'!','':''};
  toast.className='toast '+t;
  toast.innerHTML=(icons[t]?'<span style="font-size:15px;font-weight:700">'+icons[t]+'</span>':'')+escapeHtml(msg);
  container.appendChild(toast);
  setTimeout(()=>toast.remove(),2600);
}

  body.classList.remove('theme-dark');

  body.setAttribute('data-theme',themeName);

/* ========== 全局搜索 ========== */
let searchSelectedIndex=-1;
function openSearch(){
  const mask=document.getElementById('searchMask');
  const input=document.getElementById('searchInput');
  if(mask) mask.classList.add('show');
  if(input){ input.value=''; input.focus(); }
  document.getElementById('searchResults').innerHTML='<div class="search-empty">输入关键词开始搜索</div>';
  searchSelectedIndex=-1;
}
function closeSearch(){
  const mask=document.getElementById('searchMask');
  if(mask) mask.classList.remove('show');
}
function doSearch(query){
  const resultsEl=document.getElementById('searchResults');
  if(!query||!query.trim()){
    resultsEl.innerHTML='<div class="search-empty">输入关键词开始搜索</div>';
    searchSelectedIndex=-1;
    return;
  }
  const q=query.trim().toLowerCase();
  const results=[];
  
  /* 1. 搜索菜单 */
  NAV.forEach(n=>{
    if(n.name.toLowerCase().includes(q)||(n.group&&n.group.toLowerCase().includes(q))){
      results.push({type:'nav',ico:n.ico,title:n.name,desc:n.group||'',group:'功能菜单',id:n.id});
    }
  });
  
  /* 2. 搜索我的提示词 */
  if(Array.isArray(DB.myPrompts)){
    DB.myPrompts.forEach((p,i)=>{
      if((p.title&&p.title.toLowerCase().includes(q))||(p.desc&&p.desc.toLowerCase().includes(q))||(p.tag&&p.tag.toLowerCase().includes(q))){
        results.push({type:'prompt',ico:'📝',title:p.title||'未命名',desc:(p.tag?p.tag+' · ':'')+(p.desc||'').slice(0,40),group:'我的提示词',listKey:'myPrompts',index:i});
      }
    });
  }
  
  /* 3. 搜索灵感收藏 */
  if(Array.isArray(DB.inspos)){
    DB.inspos.forEach((p,i)=>{
      if((p.title&&p.title.toLowerCase().includes(q))||(p.desc&&p.desc.toLowerCase().includes(q))){
        results.push({type:'inspo',ico:'⭐',title:p.title||'未命名',desc:(p.desc||'').slice(0,40),group:'灵感收藏',section:'inspo',index:i});
      }
    });
  }
  
  /* 4. 搜索账本 */
  if(Array.isArray(DB.ledger)){
    DB.ledger.forEach((p,i)=>{
      if((p.title&&p.title.toLowerCase().includes(q))||(p.desc&&p.desc.toLowerCase().includes(q))||(p.tag&&p.tag.toLowerCase().includes(q))){
        results.push({type:'ledger',ico:'📊',title:p.title||'未命名',desc:(p.tag?p.tag+' · ':'')+(p.amount?'¥'+p.amount:''),group:'小账本',section:'ledger',index:i});
      }
    });
  }
  
  /* 5. 搜索AI提示词库 */
  if(Array.isArray(DB.aiPrompts)){
    DB.aiPrompts.forEach((p,i)=>{
      if((p.title&&p.title.toLowerCase().includes(q))||(p.desc&&p.desc.toLowerCase().includes(q))||(p.tag&&p.tag.toLowerCase().includes(q))){
        results.push({type:'prompt',ico:'💬',title:p.title||'未命名',desc:(p.tag?p.tag+' · ':'')+(p.desc||'').slice(0,40),group:'AI提示词库',listKey:'aiPrompts',index:i});
      }
    });
  }
  
  /* 渲染结果 */
  if(results.length===0){
    resultsEl.innerHTML='<div class="search-empty">🔍 没有找到相关结果</div>';
    searchSelectedIndex=-1;
    return;
  }
  
  searchSelectedIndex=0;
  resultsEl.innerHTML=results.slice(0,20).map((r,i)=>
    '<div class="search-result-item '+(i===0?'selected':'')+'" data-index="'+i+'" onclick="handleSearchResult('+i+')">'
      +'<div class="sr-ico">'+r.ico+'</div>'
      +'<div class="sr-info">'
        +'<div class="sr-title">'+escapeHtml(r.title)+'</div>'
        +'<div class="sr-desc">'+escapeHtml(r.desc)+'</div>'
      +'</div>'
      +'<span class="sr-group">'+escapeHtml(r.group)+'</span>'
    +'</div>'
  ).join('');
  
  /* 保存结果供键盘操作使用 */
  window._searchResults=results.slice(0,20);
}
function handleSearchResult(index){
  const r=window._searchResults&&window._searchResults[index];
  if(!r) return;
  closeSearch();
  if(r.type==='nav'){
    switchSection(r.id);
  }else if(r.type==='prompt'){
    switchSection(r.listKey==='myPrompts'?'myprompts':'ai');
    showToast('已定位到提示词：'+r.title,'success');
  }else if(r.type==='inspo'){
    switchSection('inspo');
    showToast('已定位到灵感收藏','success');
  }else if(r.type==='ledger'){
    switchSection('ledger');
    showToast('已定位到账本记录','success');
  }
}
/* 搜索键盘操作 */
document.addEventListener('keydown',function(e){
  const mask=document.getElementById('searchMask');
  if(!mask||!mask.classList.contains('show')){
    /* Ctrl+K / Cmd+K 打开搜索 */
    if((e.ctrlKey||e.metaKey)&&e.key==='k'){
      e.preventDefault();
      openSearch();
    }
    return;
  }
  if(e.key==='Escape'){ closeSearch(); }
  else if(e.key==='ArrowDown'){
    e.preventDefault();
    const items=document.querySelectorAll('.search-result-item');
    if(items.length===0) return;
    if(searchSelectedIndex<items.length-1) searchSelectedIndex++;
    items.forEach((el,i)=>el.classList.toggle('selected',i===searchSelectedIndex));
    items[searchSelectedIndex].scrollIntoView({block:'nearest'});
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    const items=document.querySelectorAll('.search-result-item');
    if(items.length===0) return;
    if(searchSelectedIndex>0) searchSelectedIndex--;
    items.forEach((el,i)=>el.classList.toggle('selected',i===searchSelectedIndex));
    items[searchSelectedIndex].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){
    e.preventDefault();
    if(searchSelectedIndex>=0) handleSearchResult(searchSelectedIndex);
  }
});

function renderList(listKey){
  const config=LISTS[listKey];
  if(!config) return;
  const container=document.getElementById('lc_'+listKey);
  if(!container) return;
  let items=(DB[config.dbKey]||[]).map((item,i)=>({item,i}));
  const filter=LIST_TAG_FILTER[listKey];
  if(filter&&filter!=='全部'){
    items=items.filter(x=>x.item.tag===filter);
  }
  if(items.length===0){
    container.innerHTML='<div class="empty-hint"><div class="big"><span class="big-emoji">'+config.icon+'</span></div>'+(filter&&filter!=='全部'?'该分类暂无内容':'暂无内容，点击"+ 新增"添加')+'</div>';
    return;
  }
  let html='';
  items.forEach((x)=>{
    const item=x.item, i=x.i;
    html+=renderListItem(listKey,item,i);
  });
  container.innerHTML=html;
}

function renderListItem(listKey,item,i){
  const config=LISTS[listKey];
  let hasCheckbox=false, checkboxChecked=false;
  let titleParts=[],metaParts=[],descParts=[],tagParts=[],fieldParts=[];
  config.fields.forEach(f=>{
    const as=f.as||'field';
    if(as==='checkbox'){
      hasCheckbox=true;
      checkboxChecked=!!item[f.key];
      return;
    }
    const val=item[f.key];
    if(val===undefined||val===null||val==='') return;
    const text=String(val);
    if(as==='title') titleParts.push(text);
    else if(as==='meta') metaParts.push(text);
    else if(as==='desc') descParts.push(text);
    else if(as==='tag') tagParts.push('<span class="pill" style="'+tagColor(text)+'">'+escapeHtml(text)+'</span>');
    else fieldParts.push('<span><b>'+escapeHtml(f.label)+'：</b>'+escapeHtml(text)+'</span>');
  });

let _itemMenu=null;
function _ensureMenu(){
  if(_itemMenu) return _itemMenu;
  _itemMenu=document.createElement('div');
  _itemMenu.className='item-menu';
  _itemMenu.innerHTML='';
  document.body.appendChild(_itemMenu);
  document.addEventListener('click',function(e){
    if(_itemMenu&&!_itemMenu.contains(e.target)&&!e.target.classList.contains('item-more')){
      _itemMenu.classList.remove('show');
    }
  });
  window.addEventListener('scroll',function(){if(_itemMenu)_itemMenu.classList.remove('show');},true);
  window.addEventListener('resize',function(){if(_itemMenu)_itemMenu.classList.remove('show');});
  return _itemMenu;
}
function _positionMenu(menu,btn){
  const r=btn.getBoundingClientRect();
  let x=r.right-120, y=r.bottom+4;
  if(x<8) x=8;
  if(y+100>window.innerHeight) y=r.top-104;
  if(y<8) y=8;
  menu.style.left=x+'px';
  menu.style.top=y+'px';
}
function showItemMenu(e,listKey,i){
  e.stopPropagation();
  const menu=_ensureMenu();
  const config=LISTS[listKey];
  menu.innerHTML=
    '<button class="im-btn im-edit" onclick="_menuEdit(\''+listKey+'\','+i+')">✏️ 编辑</button>'+
    '<div class="im-divider"></div>'+
    '<button class="im-btn im-del" onclick="_menuDel(\''+listKey+'\','+i+')">🗑️ 删除</button>';
  _positionMenu(menu,e.currentTarget);
  menu.classList.add('show');
}

function openListModal(listKey,index){
  const config=LISTS[listKey];
  const editing=index!==undefined&&index!==null;
  const item=editing?Object.assign({},DB[config.dbKey][index]):{};
  let formHtml='';
  config.fields.forEach(f=>{
    const raw=item[f.key];
    const val=(f.type==='checkbox')?(raw!==undefined?raw:false):(raw!==undefined?raw:'');
    formHtml+='<label class="crud-label">'+escapeHtml(f.label)+'</label>';
    if(f.type==='textarea'){
      formHtml+='<textarea class="crud-textarea" id="fld_'+f.key+'" placeholder="'+escapeHtml(f.placeholder||'')+'">'+escapeHtml(val)+'</textarea>';
    }else if(f.type==='select'){
      formHtml+='<select class="crud-input" id="fld_'+f.key+'" style="margin-bottom:8px">';
      let hasVal=f.options.indexOf(val)>=0;
      if(!hasVal&&val) formHtml+='<option value="'+escapeHtml(val)+'" selected>'+escapeHtml(val)+'</option>';
      f.options.forEach(opt=>{
        formHtml+='<option value="'+escapeHtml(opt)+'"'+(val===opt?' selected':'')+'>'+escapeHtml(opt)+'</option>';
      });
      formHtml+='</select>';
    }else if(f.type==='checkbox'){
      formHtml+='<label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;cursor:pointer">'+
        '<input type="checkbox" id="fld_'+f.key+'" '+(val?'checked':'')+' style="width:20px;height:20px;cursor:pointer"> '+
        escapeHtml(f.placeholder||'已完成')+'</label>';
    }else if(f.type==='month'){
      /* 月份选择器：兼容 "2026年8月" 和 "2026-08" 格式 */
      var monthVal=val||'';
      if(monthVal){
        var mm=monthVal.match(/(\d{4})[^\d]*(\d{1,2})/);
        if(mm) monthVal=mm[1]+'-'+String(mm[2]).padStart(2,'0');
      }
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="month" value="'+escapeHtml(monthVal)+'" style="margin-bottom:8px">';
    }else if(f.type==='date'){
      /* 日期选择器：兼容 "2026-08-20" 和 "2026年8月20日" 格式 */
      var dateVal=val||'';
      if(dateVal){
        var dm=dateVal.match(/(\d{4})[^\d]*(\d{1,2})[^\d]*(\d{1,2})/);
        if(dm) dateVal=dm[1]+'-'+String(dm[2]).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0');
      }
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="date" value="'+escapeHtml(dateVal)+'" style="margin-bottom:8px">';
    }else{
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="'+(f.inputType||'text')+'" placeholder="'+escapeHtml(f.placeholder||'')+'" value="'+escapeHtml(val)+'">';
    }
  });
  showModal(config.icon+' '+(editing?'编辑':'新增')+config.title, formHtml, ()=>{
    const newItem={};
    config.fields.forEach(f=>{
      const el=document.getElementById('fld_'+f.key);
      if(!el) return;
      if(f.type==='checkbox'){ newItem[f.key]=el.checked; }
    else if(f.type==='month'){
      /* 将 "2026-08" 转成 "2026年8月" */
      var mv=el.value;
      if(mv){
        var parts=mv.split('-');
        newItem[f.key]=parts[0]+'年'+parseInt(parts[1],10)+'月';
      } else newItem[f.key]='';
    }
    else if(f.type==='date'){
      /* 将 "2026-08-20" 转成 "2026年8月20日" */
      var dv=el.value;
      if(dv){
        var parts=dv.split('-');
        newItem[f.key]=parts[0]+'年'+parseInt(parts[1],10)+'月'+parseInt(parts[2],10)+'日';
      } else newItem[f.key]='';
    }
    else { newItem[f.key]=el.value.trim(); }
    });
    /* 校验：至少有一个非空非布尔字段 */
    const hasContent=config.fields.some(f=>{
      const v=newItem[f.key];
      return v!==false&&v!==''&&v!==undefined&&v!==null;
    });
    if(!hasContent){ alert('请至少填写一项内容'); return false; }
    if(editing){ DB[config.dbKey][index]=newItem; }
    else { DB[config.dbKey].push(newItem); }
    saveData();
    renderList(listKey);
    /* 刷新每日计划的目标跑车卡片 */
    if(config.dbKey==='salaryGoal') renderGoalCar();
    return true;
  });
}

  var text=document.getElementById('batchInput').value.trim();

  if(!text){
    preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">请先粘贴歌单内容</div>';
    return;
  }
  /* 检测是否为网易云音乐链接 */
  var urlMatch=text.match(/(https?:\/\/(?:163cn\.tv\/\w+|music\.163\.com\/(?:playlist|album|song)[^\s]*))/i);
  if(urlMatch){
    preview.innerHTML='<div style="color:var(--accent);font-size:13px;padding:8px">⏳ 正在从网易云音乐获取歌单…</div>';

    fetchNeteasePlaylist(urlMatch[1],listKey);

/* 从网易云音乐获取歌单 — 通过本地代理服务器 */
var _fetchedPlaylistSongs=null;
async function fetchNeteasePlaylist(url,listKey){
  var preview=document.getElementById('batchPreview');
  var btn=document.getElementById('batchConfirmBtn');
  _fetchedPlaylistSongs=null;
  try{
    /* 调用本地代理服务器获取歌单数据 */
    var proxyUrl='http://localhost:8080/api/playlist?url='+encodeURIComponent(url);
    var resp=await fetch(proxyUrl);
    var data=await resp.json();

    if(!data||!data.success){
      var errMsg=(data&&data.error)?data.error:'未知错误';
      preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">⚠️ 获取歌单失败：'+escapeHtml(errMsg)+'<br>请直接粘贴歌曲列表<br>格式：歌曲名 - 歌手名（每行一首）</div>';
      btn.disabled=true; btn.style.opacity=.5;
      return;
    }

    var songs=data.songs||[];
    if(songs.length===0){
      preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">⚠️ 未获取到歌曲数据，请直接粘贴歌曲列表</div>';
      btn.disabled=true; btn.style.opacity=.5;
      return;
    }

    _fetchedPlaylistSongs=songs;
    _renderBatchPreview(songs,btn);
    var statusDiv=document.createElement('div');
    statusDiv.style.cssText='font-size:12px;color:#52c41a;padding:4px 8px 0';
    var playlistName=data.playlist_name||'';
    statusDiv.innerHTML='✅ 从网易云音乐获取到 '+songs.length+' 首歌曲'+(playlistName?'<br>📋 歌单：'+escapeHtml(playlistName):'');
    preview.insertBefore(statusDiv,preview.firstChild);
  }catch(e){
    preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">⚠️ 网络请求失败：'+escapeHtml(e.message||String(e))+'<br><br>可能是代理服务器未启动，请检查服务器状态。<br>也可直接粘贴歌曲列表（每行一首）<br>格式：歌曲名 - 歌手名</div>';
    btn.disabled=true; btn.style.opacity=.5;
  }
}

function _renderBatchPreview(songs,btn){
  var preview=document.getElementById('batchPreview');

  html+='<div style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:4px 0">';
  songs.forEach(function(s,i){
    html+='<div style="display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:13px;border-bottom:1px solid var(--line)">'+
      '<span style="color:var(--ink-3);font-size:11px;width:20px">'+(i+1)+'</span>'+
      '<span style="font-weight:600;flex:1">'+escapeHtml(s.title||'未知歌曲')+'</span>'+
      '<span style="color:var(--accent);font-size:12px">'+escapeHtml(s.singer||'')+'</span>'+
      (s.note?'<span style="color:var(--ink-3);font-size:11px">'+escapeHtml(s.note)+'</span>':'')+
      '</div>';
  });
  html+='</div>';
  preview.innerHTML=html;

function parseSongs(text){
  var lines=text.split(/\r?\n/);
  var songs=[];
  lines.forEach(function(line){
    line=line.trim();
    if(!line) return;
    /* 去掉序号前缀：1. / 1) / 1、 / - 1. 等 */
    line=line.replace(/^\s*[-]*\s*\d+\s*[.、)]\s*/,'');
    if(!line) return;
    var title='',singer='',note='';
    var matched=false;

    /* 格式1: 歌曲 - 歌手 (备注)  或  歌曲 -- 歌手 */
    var m=line.match(/^(.+?)\s*-{2,}\s*(.+)$/);
    if(!m) m=line.match(/^(.+?)\s+-\s+(.+)$/);
    if(m){
      title=m[1].trim();
      var rest=m[2].trim();
      /* 检查备注：括号或后面的文字 */
      var nm=rest.match(/^(.+?)\s*[（(](.+)[）)]\s*$/);
      if(nm){
        singer=nm[1].trim();
        note=nm[2].trim();
      }else{
        /* 歌手后面可能有备注，用空格分隔 */
        var parts=rest.split(/\s{2,}/);
        singer=parts[0].trim();
        if(parts.length>1) note=parts.slice(1).join(' ').trim();
      }
      matched=true;
    }

    /* 格式2: 歌曲（歌手）或 歌曲(歌手) */
    if(!matched){
      var m2=line.match(/^(.+?)[（(](.+?)[）)]\s*$/);
      if(m2){
        title=m2[1].trim();
        singer=m2[2].trim();
        matched=true;
      }
    }

    /* 格式3: 歌曲【歌手】 */
    if(!matched){
      var m3=line.match(/^(.+?)\[(.+?)\]\s*$/);
      if(m3){
        title=m3[1].trim();
        singer=m3[2].trim();
        matched=true;
      }
    }

    /* 格式4: 只有歌名，无歌手 */
    if(!matched){
      title=line;
    }

    /* 清理 title 两端的引号 */
    title=title.replace(/^[""''「『]+/,'').replace(/[""」』]+$/,'').trim();
    if(title) songs.push({title:title,singer:singer,note:note});
  });
  return songs;
}

function confirmBatchImport(listKey){
  /* 优先使用从网易云音乐获取的歌曲数据 */
  var songs=_fetchedPlaylistSongs;
  if(!songs||songs.length===0){
    var text=document.getElementById('batchInput').value.trim();
    if(!text) return;
    songs=parseSongs(text);
  }
  if(!songs||songs.length===0) return;
  var config=LISTS[listKey];
  var added=0;
  songs.forEach(function(s){
    var item={};
    config.fields.forEach(function(f){
      if(f.key==='title') item[f.key]=s.title||'';
      else if(f.key==='singer') item[f.key]=s.singer||'';
      else if(f.key==='note') item[f.key]=s.note||'';
      else if(f.key==='desc') item[f.key]=s.note||'';
      else item[f.key]='';
    });
    /* 至少有歌名才添加 */
    if(item.title){
      DB[config.dbKey].push(item);
      added++;
    }
  });
  saveData();
  renderList(listKey);
  _fetchedPlaylistSongs=null;
  var mask=document.getElementById('batchModal');
  if(mask){ mask.remove(); _afterModalClose(); }
  /* 显示成功提示 */
  var toast=document.createElement('div');
  toast.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,51,73,.95);color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:99999;animation:connectPop .4s ease both';
  toast.textContent='✅ 成功导入 '+added+' 首歌曲';
  document.body.appendChild(toast);
  setTimeout(function(){ toast.remove(); },1800);
}

function renderTodo(){
  const list=document.getElementById('todoList');
  if(!list)return;
  if(DB.todos.length===0){
    list.innerHTML='<div class="empty-hint"><div class="big"><span class="big-emoji">📝</span></div>暂无待办，点击"+ 新增"添加</div>';
    updateTodoProgress();
    return;
  }
  let html='';
  DB.todos.forEach((t,i)=>{
    html+='<div class="todo-item'+(t.done?' done':'')+'">'+
      '<div class="ck" onclick="toggleTodo('+i+')"></div>'+
      '<span class="label" ondblclick="editTodo('+i+')">'+escapeHtml(t.t)+'</span>'+
      '<span class="del" onclick="delTodo('+i+')">✕</span></div>';
  });
  list.innerHTML=html;

}
function updateTodoProgress(){
  const done=DB.todos.filter(t=>t.done).length;
  const bar=document.getElementById('progBar');
  const txt=document.getElementById('progTxt');
  if(bar) bar.style.width=(DB.todos.length?done/DB.todos.length*100:0)+'%';
  if(txt) txt.textContent=done+' / '+DB.todos.length;
}

    if(!vals.t) return false;

function editTodo(i){

/* 日历 */
let calYear=2026,calMonth=7;
function renderCal(){
  const grid=document.getElementById('calGrid');if(!grid)return;
  const monEl=document.getElementById('calMon');
  if(monEl) monEl.textContent=calYear+'年'+(calMonth+1)+'月';
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  let html='';
  ['日','一','二','三','四','五','六'].forEach(w=>html+='<div class="wh">'+w+'</div>');
  for(let i=first-1;i>=0;i--) html+='<div class="d dim">'+(prevDays-i)+'</div>';
  for(let d=1;d<=days;d++){
    let cls='d';
    if(calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate()) cls+=' today';
    if(DB.checkedDays.includes(d)&&calYear===2026&&calMonth===7) cls+=' checked';
    html+='<div class="'+cls+'" onclick="toggleCheck('+d+')">'+d+'</div>';
  }
  grid.innerHTML=html;
}
function toggleCheck(d){
  if(calYear!==2026||calMonth!==7)return;
  const idx=DB.checkedDays.indexOf(d);
  if(idx>=0) DB.checkedDays.splice(idx,1);
  else DB.checkedDays.push(d);
  saveData(); renderCal();
}
function calNav(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCal();
}

/* 渲染目标跑车卡片 */
function renderGoalCar(){
  var box=document.getElementById('goalCarContent');
  if(!box) return;
  /* 取第一个进行中的储蓄目标 */
  var goals=DB.salaryGoal||[];
  var goal=goals.find(function(g){return g.status==='进行中';})||goals[0];
  if(!goal){
    box.innerHTML='<div style="font-size:36px">🏁</div>'+
      '<div style="font-size:13px;color:var(--ink-3);margin-top:8px">还没有储蓄目标，去「工资储蓄」添加一个吧</div>';
    return;
  }
  var target=parseFloat(goal.target)||0;
  var current=parseFloat(goal.current)||0;
  var diff=target-current;
  var percent=target>0?Math.min(100,Math.round(current/target*100)):0;
  var carEmoji=percent>=100?'🏆':percent>=75?'🏎️':'🚗';

  var html='';
  html+='<div style="font-size:42px;line-height:1;animation:carBounce 2s ease-in-out infinite">'+carEmoji+'</div>';
  html+='<div style="margin-top:6px;font-size:14px;font-weight:700;color:var(--ink)">'+escapeHtml(goal.title||'目标')+'</div>';
  if(diff>0){
    html+='<div style="margin-top:4px;font-size:18px;font-weight:800;color:var(--accent-warm)">离目标还差 ¥'+diff.toLocaleString()+'</div>';
    html+='<div style="margin-top:2px;font-size:12px;color:var(--ink-3)">已存 ¥'+current.toLocaleString()+' / 目标 ¥'+target.toLocaleString()+'</div>';
  }else{
    html+='<div style="margin-top:4px;font-size:18px;font-weight:800;color:var(--accent-2)">🎉 目标已达成！</div>';
    html+='<div style="margin-top:2px;font-size:12px;color:var(--ink-3)">累计 ¥'+current.toLocaleString()+'</div>';
  }
  /* 进度条跑道 */
  html+='<div style="margin-top:10px;position:relative;height:8px;background:#f0e6d0;border-radius:4px;overflow:hidden">';
  html+='<div style="position:absolute;left:0;top:0;height:100%;width:'+percent+'%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transition:width .6s ease"></div>';
  html+='</div>';
  html+='<div style="margin-top:4px;font-size:11px;color:var(--ink-3)">完成度 '+percent+'%</div>';
  box.innerHTML=html;
}

/* 渲染今日油价 */
function renderOilPrice(){
  var box=document.getElementById('oilPriceContent');

  /* 初始化城市选择器 */
  var sel=document.getElementById('oilCitySelect');
  if(sel&&!sel.options.length){
    OIL_CITIES.forEach(function(c){
      var opt=document.createElement('option');
      opt.value=c.slug; opt.textContent=c.name;
      sel.appendChild(opt);
    });
  }
  /* 从localStorage恢复城市选择 */
  var savedCity=localStorage.getItem('oilCity');
  if(savedCity){ _oilCitySlug=savedCity; }
  if(sel) sel.value=_oilCitySlug;

  /* 找到城市名称 */
  var cityInfo=OIL_CITIES.find(function(c){return c.slug===_oilCitySlug;});
  var cityName=cityInfo?cityInfo.name:'湖南';

  box.innerHTML='<div style="text-align:center;padding:12px 0;color:var(--ink-3);font-size:13px">正在获取'+escapeHtml(cityName)+'油价…</div>';

  /* 读取本地 oil-data.json（由 GitHub Actions 每小时更新） */
  var jsonUrl='oil-data.json?t='+Date.now();
  fetch(jsonUrl)
    .then(function(r){return r.json();})
    .then(function(data){
      var cityData=data.cities&&data.cities[_oilCitySlug];
      if(cityData&&cityData.prices&&cityData.prices.length>0){
        renderOilPriceData(box,cityData,cityName,data.updatedAt);
      }else{
        renderOilPriceFallback(box,'暂无'+cityName+'油价数据');
      }
    })
    .catch(function(err){
      renderOilPriceFallback(box,'油价数据加载失败，请稍后重试');
    });

  /* 设置定时自动刷新（每5分钟） */
  if(_oilRefreshTimer) clearTimeout(_oilRefreshTimer);

}

/* 从车型名称识别品牌 */
function getCarBrand(title){
  if(!title) return null;
  var text=String(title).toLowerCase();
  for(var i=0;i<CAR_BRANDS.length;i++){
    var b=CAR_BRANDS[i];
    for(var j=0;j<b.keys.length;j++){
      if(text.indexOf(b.keys[j].toLowerCase())>=0){
        return b;
      }
    }
  }
  return null;
}

/* 加载车辆图片 */
var _carImgCache={};
function loadCarImage(title,wrapId){
  var wrap=document.getElementById(wrapId);
  if(!wrap) return;
  var brand=getCarBrand(title);
  if(!brand){
    wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
    return;
  }
  /* 优先使用本地自定义图片 */
  if(brand.localImg){
    _setCarImg(wrap,brand.localImg,brand);
    return;
  }
  /* 检查内存缓存 */
  if(_carImgCache[brand.wiki]){
    _setCarImg(wrap,_carImgCache[brand.wiki],brand);
    return;
  }
  /* 检查 localStorage 缓存 */
  var cacheKey='carImg_'+brand.wiki;
  try{
    var cached=localStorage.getItem(cacheKey);
    if(cached){
      _carImgCache[brand.wiki]=cached;
      _setCarImg(wrap,cached,brand);
      return;
    }
  }catch(e){}
  /* 显示加载中 */
  wrap.innerHTML='<div class="car-img-loading">🚗</div>';
  /* 从维基百科 REST API 获取图片 */
  var apiUrl='https://en.wikipedia.org/api/rest_v1/page/summary/'+brand.wiki;
  fetch(apiUrl,{headers:{'Accept':'application/json'}})
    .then(function(r){return r.json();})
    .then(function(data){
      var imgSrc='';
      if(data.originalimage&&data.originalimage.source){
        imgSrc=data.originalimage.source;
      }else if(data.thumbnail&&data.thumbnail.source){
        imgSrc=data.thumbnail.source;
      }
      if(imgSrc){
        _carImgCache[brand.wiki]=imgSrc;
        try{localStorage.setItem(cacheKey,imgSrc);}catch(e){}
        _setCarImg(wrap,imgSrc,brand);
      }else{
        wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
      }
    })
    .catch(function(){
      /* 尝试中文维基百科 */
      var cnApiUrl='https://zh.wikipedia.org/api/rest_v1/page/summary/'+brand.wiki;
      fetch(cnApiUrl,{headers:{'Accept':'application/json'}})
        .then(function(r){return r.json();})
        .then(function(data){
          var imgSrc='';
          if(data.originalimage&&data.originalimage.source){
            imgSrc=data.originalimage.source;
          }else if(data.thumbnail&&data.thumbnail.source){
            imgSrc=data.thumbnail.source;
          }
          if(imgSrc){
            _carImgCache[brand.wiki]=imgSrc;
            try{localStorage.setItem(cacheKey,imgSrc);}catch(e){}
            _setCarImg(wrap,imgSrc,brand);
          }else{
            wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
          }
        })
        .catch(function(){
          wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
        });
    });
}

function _setCarImg(wrap,src,brand){
  var img=new Image();
  img.loading='lazy';
  img.alt=brand.wiki;
  img.style.width='100%';
  img.style.height='100%';
  img.style.objectFit=brand.localImg?'contain':'cover';
  img.style.padding=brand.localImg?'4px':'0';
  img.onerror=function(){
    wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
  };
  img.onload=function(){
    wrap.innerHTML='';
    wrap.appendChild(img);
  };
  img.src=src;

/* 用户上传自定义车辆图片，自动抠图 */
function uploadCarImage(i){
  var input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.onchange=function(e){
    var file=e.target.files[0];
    if(!file)return;
    /* 显示抠图进度 */
    var toast=document.createElement('div');
    toast.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:20px 32px;border-radius:16px;font-size:14px;z-index:99999;text-align:center';
    toast.innerHTML='<div style="margin-bottom:8px">📸 正在处理图片...</div><div style="font-size:12px;opacity:.7">自动抠图中，请稍候</div>';
    document.body.appendChild(toast);
    
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var canvas=document.createElement('canvas');
        var maxW=800,maxH=600;
        var w=img.width,h=img.height;
        if(w>maxW){h=h*maxW/w;w=maxW;}
        if(h>maxH){w=w*maxH/h;h=maxH;}
        canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        
        /* 自动抠图：基于边缘颜色采样 + 色差移除 */
        try{
          autoRemoveBg(ctx,w,h);
        }catch(err){
          console.warn('抠图失败，使用原图:',err);
        }
        
        var dataUrl=canvas.toDataURL('image/png');
        if(!DB.carInfo)DB.carInfo=[];
        if(!DB.carInfo[i])DB.carInfo[i]={};
        DB.carInfo[i].customImg=dataUrl;
        saveData();
        
        toast.remove();
        renderList('carInfo');
      };
      img.onerror=function(){ toast.remove(); alert('图片加载失败'); };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* 纯Canvas自动抠图：边缘采样 + 色差移除 + 边缘羽化 */
function autoRemoveBg(ctx,w,h){
  var imageData=ctx.getImageData(0,0,w,h);
  var data=imageData.data;
  
  /* 1. 采样四条边的像素颜色 */
  var samples=[];
  var step=Math.max(2,Math.floor(Math.min(w,h)/30));
  for(var x=0;x<w;x+=step){
    var idxTL=(0*w+x)*4; samples.push([data[idxTL],data[idxTL+1],data[idxTL+2]]);
    var idxBL=((h-1)*w+x)*4; samples.push([data[idxBL],data[idxBL+1],data[idxBL+2]]);
  }
  for(var y=0;y<h;y+=step){
    var idxLT=(y*w+0)*4; samples.push([data[idxLT],data[idxLT+1],data[idxLT+2]]);
    var idxRT=(y*w+(w-1))*4; samples.push([data[idxRT],data[idxRT+1],data[idxRT+2]]);
  }
  
  /* 2. 聚类找主背景色：用简单色彩量化 */
  var bgColors=[];
  samples.forEach(function(s){
    var qr=Math.round(s[0]/32)*32, qg=Math.round(s[1]/32)*32, qb=Math.round(s[2]/32)*32;
    var key=qr+','+qg+','+qb;
    var found=bgColors.find(function(c){return c.key===key;});
    if(found){found.count++;}
    else{bgColors.push({key:key,r:qr,qg:qg,qb:qb,count:1,rs:0,gs:0,bs:0});}
    if(found){found.rs+=s[0]; found.gs+=s[1]; found.bs+=s[2]; found.count++;}
    else{bgColors[bgColors.length-1].rs=s[0]; bgColors[bgColors.length-1].gs=s[1]; bgColors[bgColors.length-1].bs=s[2];}
  });
  
  /* 取出现最多的颜色作为背景 */
  bgColors.sort(function(a,b){return b.count-a.count;});
  var bg=bgColors[0];
  var bgR=bg.rs/bg.count, bgG=bg.gs/bg.count, bgB=bg.bs/bg.count;
  
  /* 3. 如果有多个主要边缘色，取前2个 */
  var bgList=[{r:bgR,g:bgG,b:bgB}];
  if(bgColors.length>1 && bgColors[1].count>bgColors[0].count*0.3){
    var bg2=bgColors[1];
    bgList.push({r:bg2.rs/bg2.count,g:bg2.gs/bg2.count,b:bg2.bs/bg2.count});
  }
  
  /* 4. 遍历像素，与背景色比较 */
  var threshold=45;  /* 完全透明的色差阈值 */
  var feather=25;    /* 羽化范围 */
  
  for(var i=0;i<data.length;i+=4){
    var r=data[i],g=data[i+1],b=data[i+2];
    var minDist=999999;
    for(var bi=0;bi<bgList.length;bi++){
      var bgc=bgList[bi];
      var dist=Math.sqrt((r-bgc.r)*(r-bgc.r)+(g-bgc.g)*(g-bgc.g)+(b-bgc.b)*(b-bgc.b));
      if(dist<minDist)minDist=dist;
    }
    if(minDist<threshold){
      data[i+3]=0; /* 完全透明 */
    } else if(minDist<threshold+feather){
      /* 边缘羽化 */
      var alpha=(minDist-threshold)/feather;
      data[i+3]=Math.round(alpha*255);
    }
  }
  
  ctx.putImageData(imageData,0,0);
}

/* 生成环形饼图 */
function makeDonut(groups,totalCount){
  if(totalCount===0){
    return '<div style="text-align:center;padding:20px;color:var(--ink-3);font-size:13px">暂无数据，去各模块添加内容吧</div>';
  }
  var cx=80,cy=80,r=60,rInner=38;
  var svg='<div class="ov-donut-wrap"><svg width="160" height="160">';
  var legend='';
  var startAngle=-90;
  groups.forEach(function(g,idx){
    var gCount=0;
    g.sections.forEach(function(s){gCount+=s.count;});
    if(gCount===0) return;
    var pct=gCount/totalCount;
    var angle=pct*360;
    var endAngle=startAngle+angle;
    if(idx===groups.length-1) endAngle=270; /* 最后一块闭合 */
    var color=OV_COLORS[idx%OV_COLORS.length];
    var path=arcPath(cx,cy,r,rInner,startAngle,endAngle);
    svg+='<path d="'+path+'" fill="'+color+'" opacity="0.9" style="cursor:pointer" onclick="switchSection(\''+g.sections[0].id+'\')"><title>'+g.name+': '+gCount+'条 ('+Math.round(pct*100)+'%)</title></path>';
    legend+='<div class="ov-legend-item" onclick="switchSection(\''+g.sections[0].id+'\')">'
      +'<span class="ov-legend-dot" style="background:'+color+'"></span>'
      +'<span>'+g.name+'</span>'
      +'<span class="ov-legend-val">'+gCount+'条</span>'
    +'</div>';
    startAngle=endAngle;
  });
  svg+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="22" font-weight="800" fill="#1a202c">'+totalCount+'</text>';
  svg+='<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="10" fill="#94a3b8">总数据</text>';
  svg+='</svg><div class="ov-legend">'+legend+'</div></div>';
  return svg;
}

/* 环形扇形路径 */
function arcPath(cx,cy,rOuter,rInner,startDeg,endDeg){
  var sRad=startDeg*Math.PI/180;
  var eRad=endDeg*Math.PI/180;
  var x1=cx+rOuter*Math.cos(sRad), y1=cy+rOuter*Math.sin(sRad);
  var x2=cx+rOuter*Math.cos(eRad), y2=cy+rOuter*Math.sin(eRad);
  var x3=cx+rInner*Math.cos(eRad), y3=cy+rInner*Math.sin(eRad);
  var x4=cx+rInner*Math.cos(sRad), y4=cy+rInner*Math.sin(sRad);
  var large=(endDeg-startDeg)>180?1:0;
  return 'M'+x1+' '+y1+' A'+rOuter+' '+rOuter+' 0 '+large+' 1 '+x2+' '+y2
    +' L'+x3+' '+y3+' A'+rInner+' '+rInner+' 0 '+large+' 0 '+x4+' '+y4+' Z';
}

/* 生成横向柱状图 */
function makeBars(groups,totalCount){
  if(totalCount===0) return '<div style="text-align:center;padding:16px;color:var(--ink-3);font-size:13px">暂无数据</div>';
  var maxCount=1;
  groups.forEach(function(g){
    g.sections.forEach(function(s){ if(s.count>maxCount)maxCount=s.count; });
  });
  var html='';
  groups.forEach(function(g,idx){
    var color=OV_COLORS[idx%OV_COLORS.length];
    g.sections.forEach(function(s){
      var w=maxCount>0?Math.round(s.count/maxCount*100):0;
      html+='<div class="ov-bar-row" onclick="switchSection(\''+s.id+'\')">';
      html+='<div class="ov-bar-label">'+s.name+'</div>';
      html+='<div class="ov-bar-track"><div class="ov-bar-fill" style="width:'+w+'%;background:'+color+'">'+(s.count>0?s.count:'')+'</div></div>';
      html+='</div>';
    });
  });
  return html;
}

function formatInspoTime(ts){
  if(!ts)return '';
  const d=new Date(ts);
  const now=new Date();
  const diff=now-d;
  if(diff<60000)return '刚刚';
  if(diff<3600000)return Math.floor(diff/60000)+'分钟前';
  if(diff<86400000)return Math.floor(diff/3600000)+'小时前';
  if(diff<86400000*7)return Math.floor(diff/86400000)+'天前';
  return (d.getMonth()+1)+'/'+d.getDate();
}

    return;
  }
  // 如果在录别的字段，先停掉
  if(_voiceRec){
    _voiceRec.stop();
  }

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    alert('当前浏览器不支持语音识别，请使用 Chrome、Edge 或 Safari 浏览器');
    return;
  }

  _voiceRec=new SR();
  _voiceRec.lang='zh-CN';
  _voiceRec.continuous=true;
  _voiceRec.interimResults=true;

  const target=document.getElementById(targetId);
  if(!target)return;

  _voiceTargetId=targetId;
  _voiceBtnEl=btnEl;
  _voiceAccumText=target.value||'';

  btnEl.classList.add('recording');
  btnEl.textContent='🔴';

  const hintId=targetId==='ipTitle'?'voiceHintTitle':'voiceHintDesc';
  const hint=document.getElementById(hintId);
  if(hint){hint.classList.add('recording');hint.textContent='正在录音…说完后点击按钮停止';}

  let finalText='';

  _voiceRec.onresult=function(event){
    let interim='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t=event.results[i][0].transcript;
      if(event.results[i].isFinal){
        finalText+=t;
      }else{
        interim+=t;
      }
    }
    target.value=_voiceAccumText+finalText+interim;
  };

  _voiceRec.onerror=function(event){
    console.error('语音识别错误:',event.error);
    let msg='语音识别出错';
    if(event.error==='not-allowed'||event.error==='service-not-allowed'){
      msg='麦克风权限被拒绝，请允许浏览器使用麦克风';
    }else if(event.error==='no-speech'){
      msg='没有检测到语音，请再试一次';
    }else if(event.error==='network'){
      msg='网络错误，语音识别需要网络连接';
    }
    alert(msg);
    _stopVoiceUI();
  };

  _voiceRec.onend=function(){
    // 录音结束，把最终文本写入
    if(finalText){
      target.value=_voiceAccumText+finalText;
    }
    _stopVoiceUI();
  };

  try{
    _voiceRec.start();
  }catch(e){
    alert('无法启动语音识别：'+e.message);
    _stopVoiceUI();
  }
}

function _stopVoiceUI(){
  if(_voiceBtnEl){
    _voiceBtnEl.classList.remove('recording');
    _voiceBtnEl.textContent='🎤';
  }
  const h1=document.getElementById('voiceHintTitle');
  const h2=document.getElementById('voiceHintDesc');
  if(h1){h1.classList.remove('recording');h1.textContent='点麦克风语音输入标题';}
  if(h2){h2.classList.remove('recording');h2.textContent='点麦克风语音输入描述';}
  _voiceRec=null;
  _voiceTargetId=null;
  _voiceBtnEl=null;
  _voiceAccumText='';
}

function renderLedger(){
  const list=document.getElementById('ledgerList');
  if(!list)return;
  const total=DB.ledger.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const budget=DB.budget||6000;
  const pct=budget>0?Math.round(total/budget*100):0;
  const summary=document.getElementById('ledgerSummary');
  const bar=document.getElementById('ledgerBar');
  const hint=document.getElementById('ledgerHint');
  if(summary) summary.innerHTML='¥ '+total.toLocaleString()+' <span style="font-size:13px;font-weight:500;color:var(--ink-3)">/ '+budget.toLocaleString()+'</span>';
  if(bar) bar.style.width=Math.min(pct,100)+'%';
  if(hint) hint.textContent=DB.ledger.length===0?'还没有记账，点击"记一笔"开始。':
    pct<50?'已用 '+pct+'%，节奏不错。':
    pct<80?'已用 '+pct+'%，注意控制。':
    pct<100?'已用 '+pct+'%，预算快满了！':'已超支 '+(pct-100)+'%！';
  if(DB.ledger.length===0){
    list.innerHTML='<div class="empty-hint"><div class="big"><span class="big-emoji">📊</span></div>还没有记账记录</div>';
    return;
  }
  let html='<table class="sub-tbl"><tr><th>类别</th><th>金额</th><th>占比</th><th></th></tr>';
  DB.ledger.slice().reverse().forEach((e,idx)=>{
    const i=DB.ledger.length-1-idx;
    const cat=LEDGER_CATS.find(c=>c.name===e.cat);
    const icon=cat?cat.icon:'👤';
    html+='<tr><td>'+icon+' '+escapeHtml(e.cat)+'</td><td>¥'+escapeHtml(e.amount)+'</td><td>'+(total>0?Math.round(e.amount/total*100):0)+'%</td>'+
      '<td><span style="cursor:pointer;color:#e74c3c;font-size:13px" onclick="delLedger('+i+')">✕</span></td></tr>';
  });
  html+='</table>';
  list.innerHTML=html;
}

function saveCloudCfg(){
  let url=document.getElementById('cfgUrl').value.trim().replace(/\/+$/,'');
  const anonKey=document.getElementById('cfgKey').value.trim();
  const workspaceId=document.getElementById('cfgWs').value.trim();
  if(!url||!anonKey||!workspaceId){
    alert('请填写完整的 Supabase URL、Anon Key 和工作区 ID');return;
  }
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(url)){
    alert('URL格式不正确，应该是 https://xxxxxxxx.supabase.co 格式（不要有末尾斜杠）');return;
  }
  CLOUD_CFG={url,anonKey,workspaceId};
  saveCloudConfig(CLOUD_CFG);
  if(initSupabase()){
    alert('云同步配置已保存！正在测试连接…');
    (async()=>{
      const d=await loadFromCloud();
      if(d){
        DB=d;ensureKeys();saveData();switchSection('data');
        subscribeCloud();
        startPolling();
        alert('✅ 连接成功！数据已从云端加载。\n工作区: '+workspaceId+'\n\n数据会自动同步，无需手动操作。');
      }else if(lastSyncError){
        alert('❌ 连接失败：'+lastSyncError+'\n\n请检查：\n1. 是否已在Supabase运行建表SQL\n2. 是否运行了GRANT权限语句\n3. URL和Key是否正确');
      }else{
        subscribeCloud();
        startPolling();
        alert('✅ 已连接！工作区为空，数据将在保存时自动上传。\n工作区: '+workspaceId+'\n\n数据会自动同步，无需手动操作。');
      }
    })();
  }else{
    alert('连接失败，请检查 URL 和 Key 是否正确');
  }
}
function disconnectCloud(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(sbChannel){sbClient.removeChannel(sbChannel);sbChannel=null;}
  sbClient=null;
  CLOUD_CFG={};
  saveCloudConfig({});
  updateSyncBadge('off','本地模式');
  alert('已断开云同步，回到本地模式。');
  switchSection('data');
}
async function syncNow(){
  if(!sbClient){alert('请先启用云同步');return;}
  updateSyncBadge('syncing','同步中…');
  const {error}=await sbClient.from('workbench_data')
    .upsert({workspace_id:CLOUD_CFG.workspaceId,data:DB,updated_at:new Date().toISOString()});
  if(error){
    updateSyncBadge('error','同步失败');
    alert('同步失败: '+error.message+'\n\n常见原因:\n1. 表未创建或权限未设置\n2. URL或Key不正确\n3. 需要在Supabase运行GRANT语句');
  }
  else{updateSyncBadge('online','已连接');alert('同步成功！');}
}

function exportModule(dbKey,moduleName){
  const data=DB[dbKey];
  if(data===undefined||(Array.isArray(data)&&data.length===0)){
    showToast(moduleName+'暂无数据可导出','warn');
    return;
  }
  const exportObj={module:dbKey,name:moduleName,exportDate:new Date().toISOString(),data:data};
  const blob=new Blob([JSON.stringify(exportObj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='xiaosong-'+dbKey+'-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast(moduleName+' 导出成功！','success');
}
function importData(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        /* 判断是否为单模块导出 */
        if(data.module&&data.data!==undefined){
          const moduleName=data.name||data.module;
          if(!confirm('检测到「'+moduleName+'」单模块数据，导入后将合并到当前数据中。确认导入？')) return;
          if(Array.isArray(data.data)&&Array.isArray(DB[data.module])){
            DB[data.module]=data.data.concat(DB[data.module]);
          }else{
            DB[data.module]=data.data;
          }
          ensureKeys(); saveData();
          showToast(moduleName+' 导入成功！','success');
          switchSection('data');
        }else{
          if(confirm('导入会覆盖当前所有数据，确定继续？')){
            DB=data; ensureKeys(); saveData();
            showToast('数据导入成功！','success');
            switchSection('data');
          }
        }
      }catch(err){ showToast('导入失败：文件格式错误','error'); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function resetData(){
  if(confirm('确定清空所有数据？此操作不可撤销！建议先导出备份。')){
    if(confirm('再次确认：真的要清空全部数据吗？')){
      DB={};
      ensureKeys();
      saveData();
      showToast('已清空所有数据','warn');
      switchSection('data');
    }
  }
}

/* 调用大模型API */
function callAgentLLM(systemPrompt, userMessage, isTest){
  const s=DB.apiSettings||{};
  let baseUrl=s.apiBaseUrl||'';
  const apiKey=s.apiKey||'';
  const model=s.model||(isTest?'gpt-4o-mini':'gpt-4o');
  if(!baseUrl||!apiKey){
    return Promise.reject(new Error('API 地址或 Key 未设置，请先在上方「API 设置」中填写并保存'));
  }
  /* 规范化 baseUrl，智能识别版本号 */
  baseUrl=baseUrl.replace(/\/+$/,'');
  if(baseUrl.endsWith('/chat/completions')){
    /* 已经是完整地址，直接用 */
  }else if(/\/v\d+$/.test(baseUrl)){
    /* 已经包含版本号（如/v1,/v4），直接补/chat/completions */
  }else{
    /* 默认加 /v1 */
    baseUrl=baseUrl+'/v1';
  }
  const url=baseUrl+'/chat/completions';

  return fetch(url,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+apiKey
    },
    body:JSON.stringify({
      model: model,
      messages:[
        {role:'system',content:systemPrompt},
        {role:'user',content:userMessage}
      ],
      temperature:0.8,
      response_format:{type:'json_object'}
    })
  }).then(r=>{
    if(!r.ok){
      return r.text().then(t=>{
        let msg='HTTP '+r.status;
        try{ const e=JSON.parse(t); if(e.error&&e.error.message) msg+='：'+e.error.message; }catch(_){}
        throw new Error(msg);
      });
    }
    return r.json();
  }).then(data=>{
    const content=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
    if(!content) throw new Error('API 返回内容为空');
    return content;
  });
}

/* 从文本中提取JSON（容错处理） */
function extractJsonFromText(text){
  if(!text) return null;
  /* 先尝试直接解析 */
  try{ return JSON.parse(text); }catch(_){}
  /* 尝试提取第一个 { 到最后一个 } */
  const first=text.indexOf('{');
  const last=text.lastIndexOf('}');
  if(first>-1&&last>-1&&last>first){
    try{ return JSON.parse(text.substring(first,last+1)); }catch(_){}
  }
  /* 尝试用正则匹配 JSON 对象 */
  const match=text.match(/\{[\s\S]*\}/);
  if(match){
    try{ return JSON.parse(match[0]); }catch(_){}
  }
  return null;
}

  const isCharWard=data.output_mode==='character_wardrobe';

  const titleCard=document.querySelector('#agentResult .card.tint-rose .card-h');

    if(titleCard&&titleCard.firstChild&&titleCard.firstChild.nodeType===3){

    document.getElementById('resStyle').textContent=data.style||'故事板';
    document.getElementById('resLogline').textContent=data.logline||'暂无梗概';
    if(shotsTitle) shotsTitle.textContent='🎬 分镜面板';
    if(legendCard) legendCard.style.display='block';
    if(charCard) charCard.style.display='block';
    renderCharacters(data.characters||[]);
    renderStoryboardPanels(data.panels||[]);
    renderStoryboardLegend(data.legend||{});
  } else {
    /* 剧本模式 */
    if(titleCard&&titleCard.firstChild&&titleCard.firstChild.nodeType===3){
      titleCard.firstChild.textContent='📄 漫剧剧本 ';
    }
    document.getElementById('resTitle').textContent=data.title||'未命名';
    document.getElementById('resGenre').textContent=data.genre||'未分类';
    document.getElementById('resStyle').textContent=data.style||'默认画风';
    document.getElementById('resLogline').textContent=data.logline||'暂无梗概';
    if(shotsTitle) shotsTitle.textContent='🎬 分镜脚本';
    if(legendCard) legendCard.style.display='none';
    if(charCard) charCard.style.display='block';

/* 渲染故事板图例 */

/* 渲染角色设定内容 */
function renderCharacterContent(data){
  const container=document.getElementById('resShots');
  if(!container) return;
  const isCharRef=data.output_mode==='character_reference';
  const isCharWard=data.output_mode==='character_wardrobe';
  const isCharBoth=data.output_mode==='character_both';
  const refData=isCharBoth?data.reference:data;
  const wardData=isCharBoth?data.wardrobe:data;

  let html='';

  /* 角色设定卡部分 */
  if(isCharRef||isCharBoth){
    html+=renderCharReferenceHtml(refData);
  }

  /* 衣橱设定部分 */
  if(isCharWard||isCharBoth){
    html+=renderCharWardrobeHtml(wardData,isCharBoth);
  }

  /* 正向/负向提示词 */
  const promptData=isCharWard?wardData:refData;
  if(promptData&&(promptData.positive_prompt||promptData.negative_prompt)){
    html+=`<div style="margin-top:16px;padding:12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)">`;
    if(promptData.positive_prompt){
      html+=`<div style="margin-bottom:8px"><span style="color:var(--accent);font-weight:500">✅ 正向提示词：</span><button class="btn btn-mint" style="padding:2px 8px;font-size:11px;margin-left:8px" onclick="copyCharPositivePrompt()">📋 复制</button></div>`;
      html+=`<div style="font-size:12px;color:var(--ink-2);line-height:1.6">${escapeHtml(promptData.positive_prompt)}</div>`;
    }
    if(promptData.negative_prompt){
      html+=`<div style="margin:8px 0"><span style="color:var(--danger);font-weight:500">❌ 负面提示词：</span><button class="btn btn-mint" style="padding:2px 8px;font-size:11px;margin-left:8px" onclick="copyCharNegativePrompt()">📋 复制</button></div>`;
      html+=`<div style="font-size:12px;color:var(--ink-2);line-height:1.6">${escapeHtml(promptData.negative_prompt)}</div>`;
    }
    html+=`</div>`;
  }

  container.innerHTML=html;
}

  if(data.video_prompts&&data.video_prompts.length){
    html+=`<div style="margin-bottom:10px">
      <div style="font-weight:500;font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px">

    data.video_prompts.forEach((v,i)=>{
      html+=`
        <div style="margin-bottom:10px;padding:12px;background:var(--surface);border-radius:8px;border:1px solid var(--border)">

            <span class="agent-shot-id">${v.panel_id||('P'+(i+1))}</span>
            <span style="font-size:12px">视频提示词</span>
          </div>
          <div style="font-size:12px;margin-bottom:6px">
            <span style="color:var(--accent);font-weight:500">正向：</span>
            <button class="btn btn-mint" style="padding:2px 8px;font-size:10px;margin-left:6px" onclick="copyPipelineVideoPrompt(${i},'positive')">📋 复制</button>
          </div>
          <div style="background:var(--bg);padding:8px;border-radius:6px;font-size:11px;color:var(--ink-2);line-height:1.5;word-break:break-all">${escapeHtml(v.positive||'')}</div>
          <div style="font-size:12px;margin-top:8px;margin-bottom:6px">
            <span style="color:var(--danger);font-weight:500">负面：</span>
            <button class="btn btn-mint" style="padding:2px 8px;font-size:10px;margin-left:6px" onclick="copyPipelineVideoPrompt(${i},'negative')">📋 复制</button>
          </div>
          <div style="background:var(--bg);padding:8px;border-radius:6px;font-size:11px;color:var(--ink-3);line-height:1.5;word-break:break-all">${escapeHtml(v.negative||'')}</div>
        </div>`;
    });
    html+=`</div>`;
  }

  container.innerHTML=html;
}

/* 全流程 - 复制角色提示词 */
function copyPipelineCharPrompt(idx,type){
  const d=_currentManhuaScript;
  if(!d||!d.character_assets||!d.character_assets[idx]) return;
  const c=d.character_assets[idx];
  const map={full:'prompt_full',mj:'prompt_mj',sd:'prompt_sd'};
  const text=c[map[type]]||'';
  copyToClipboard(text);
  showToast('角色提示词已复制','success');
}
/* 全流程 - 复制场景提示词 */
function copyPipelineScenePrompt(idx,type){
  const d=_currentManhuaScript;
  if(!d||!d.scene_assets||!d.scene_assets[idx]) return;
  const s=d.scene_assets[idx];
  const map={full:'prompt_full',mj:'prompt_mj',sd:'prompt_sd'};
  const text=s[map[type]]||'';
  copyToClipboard(text);
  showToast('场景提示词已复制','success');
}
/* 全流程 - 复制故事板绘图提示词 */

/* 全流程 - 复制视频提示词 */

/* 保存漫剧到项目 */
function saveScriptProject(){
  if(!_currentManhuaScript){
    showToast('当前没有可保存的内容','warn');
    return;
  }
  const data=_currentManhuaScript;
  const isPipeline=data.output_mode==='pipeline';
  const isChar=data.output_mode&&data.output_mode.startsWith('character');
  const refData=isChar?(data.reference||data):data;
  let title,tag,desc,toastMsg;
  if(isPipeline){
    title=data.title||'未命名项目';
    tag=(data.analysis?.genre||'')+'·全流程资产';
    desc=data.analysis?.summary||'';
    toastMsg='已保存到全流程项目';
  } else if(isChar){
    title=refData.name||'未命名角色';
    tag=(refData.era||'')+(refData.job?'·'+refData.job:'');
    desc=refData.intro||refData.temperament||'';
    toastMsg='已保存到角色项目';
  } else {
    title=data.title||'未命名漫剧';
    tag=data.genre||'未分类';
    desc=data.logline||'';
    toastMsg='已保存到漫剧项目';
  }
  const item={
    title:title,
    tag:tag,
    desc:desc,
    data:JSON.parse(JSON.stringify(data))
  };
  DB.scriptProjects.push(item);
  saveData();
  renderList('scriptProjects');
  showToast(toastMsg,'success');
}

/* 复制完整剧本 */
function copyFullScript(){
  if(!_currentManhuaScript){
    showToast('当前没有内容可复制','warn');
    return;
  }
  const d=_currentManhuaScript;
  const isStoryboard=d.output_mode==='storyboard'||Array.isArray(d.panels);
  const isCharRef=d.output_mode==='character_reference';
  const isCharWard=d.output_mode==='character_wardrobe';
  const isCharBoth=d.output_mode==='character_both';
  const isCharacter=isCharRef||isCharWard||isCharBoth;
  const isPipeline=d.output_mode==='pipeline';

  let text='';
  if(isPipeline){
    const a=d.analysis||{};
    text+=`===【${d.title||'未命名项目'} · 全流程资产】===\n\n`;
    text+=`题材：${a.genre||'-'}\n`;
    text+=`美术风格：${a.art_style||'-'}\n`;
    text+=`故事梗概：${a.summary||'-'}\n`;
    if(a.characters) text+=`出场角色：${a.characters.join('、')}\n`;
    if(a.scenes) text+=`出场场景：${a.scenes.join('、')}\n`;
    if(a.conflict) text+=`关键冲突：${a.conflict}\n`;
    text+='\n';

    /* 角色资产 */
    if(d.character_assets&&d.character_assets.length){
      text+=`===【角色资产库】===\n\n`;
      d.character_assets.forEach((c,i)=>{
        text+=`【角色${i+1}：${c.name||''}】\n`;
        if(c.profile){
          text+=`身份：${c.profile.identity||''}\n`;
          text+=`性格：${c.profile.personality||''}\n`;
          text+=`外貌：${c.profile.appearance||''}\n`;
        }
        text+=`通用完整版：${c.prompt_full||''}\n`;
        text+=`MJ精简版：${c.prompt_mj||''}\n`;
        text+=`SD优化版：${c.prompt_sd||''}\n\n`;
      });
    }

    /* 场景资产 */
    if(d.scene_assets&&d.scene_assets.length){
      text+=`===【场景资产库】===\n\n`;
      d.scene_assets.forEach((s,i)=>{
        text+=`【场景${i+1}：${s.name||''}】\n`;
        text+=`环境描述：${s.environment||''}\n`;
        text+=`通用完整版：${s.prompt_full||''}\n`;
        text+=`MJ精简版：${s.prompt_mj||''}\n`;
        text+=`SD优化版：${s.prompt_sd||''}\n\n`;
      });
    }

    /* 分镜故事板 */
    if(d.storyboard&&d.storyboard.panels&&d.storyboard.panels.length){
      text+=`===【分镜故事板】===\n`;
      text+=`布局：${d.storyboard.layout||''}（共${d.storyboard.total_panels||d.storyboard.panels.length}格）\n\n`;
      d.storyboard.panels.forEach((p,i)=>{
        text+=`── ${p.panel_id||('P'+(i+1))} / ${p.shot_type||''} / ${p.camera_move||''} ──\n`;
        text+=`画面：${p.description||''}\n`;
        text+=`绘图：${p.draw_prompt||''}\n\n`;
      });
    }

    /* 视频提示词 */
    if(d.video_prompts&&d.video_prompts.length){
      text+=`===【分镜视频生成提示词】===\n\n`;
      d.video_prompts.forEach((v,i)=>{
        text+=`${v.panel_id||('P'+(i+1))}视频提示词：\n`;
        text+=`正向：${v.positive||''}\n`;
        text+=`负面：${v.negative||''}\n\n`;
      });
    }
  } else if(isCharacter){
    const ref=isCharBoth?d.reference:d;
    const ward=isCharBoth?d.wardrobe:d;

    if(isCharRef||isCharBoth){
      text+=`【${ref.name||'未命名角色'} · 角色设定卡】\n`;
      text+=`性别：${ref.gender||''}\n`;
      text+=`年龄：${ref.age||''}\n`;
      text+=`时代：${ref.era||''}\n`;
      text+=`职业：${ref.job||''}\n`;
      text+=`气质：${ref.temperament||''}\n`;
      if(ref.special_feature) text+=`特征：${ref.special_feature}\n`;
      if(ref.style) text+=`画风：${ref.style}\n`;
      if(ref.intro) text+=`\n${ref.intro}\n`;
      if(ref.personality_tags&&ref.personality_tags.length){
        text+=`性格标签：${ref.personality_tags.join('、')}\n`;
      }
      text+='\n';

      /* 四视图 */
      if(ref.four_views){
        text+=`━━━ 造型四视图 ━━━\n`;
        const viewMap={front:'正面',three_quarter:'3/4侧',side:'侧面',back:'背面'};
        for(const [k,v] of Object.entries(ref.four_views)){
          text+=`\n【${viewMap[k]||k}】${v.desc||''}\n`;
          if(v.draw_prompt) text+=`绘图：${v.draw_prompt}\n`;
        }
        text+='\n';
      }

      /* 表情系统 */
      if(ref.expressions&&ref.expressions.length){
        text+=`━━━ 表情系统 ━━━\n`;
        ref.expressions.forEach(e=>{
          text+=`· ${e.name}：${e.desc||''}\n`;
        });
        text+='\n';
      }

      /* 职业姿态 */
      if(ref.poses&&ref.poses.length){
        text+=`━━━ 职业姿态参考 ━━━\n`;
        ref.poses.forEach(p=>{
          text+=`\n【${p.name}】${p.desc||''}\n`;
          if(p.draw_prompt) text+=`绘图：${p.draw_prompt}\n`;
        });
        text+='\n';
      }

      /* 服化道 */
      if(ref.costume_details&&ref.costume_details.length){
        text+=`━━━ 服化道细节 ━━━\n`;
        text+=`服装：${ref.costume_details.join('、')}\n`;
        if(ref.accessory_details) text+=`配饰：${ref.accessory_details.join('、')}\n`;
        if(ref.shoe_details) text+=`鞋履：${ref.shoe_details}\n`;
        text+='\n';
      }

      /* 正负向提示词 */
      if(ref.positive_prompt) text+=`✅ 正向：${ref.positive_prompt}\n`;
      if(ref.negative_prompt) text+=`❌ 负面：${ref.negative_prompt}\n`;
    }

    if(isCharWard||isCharBoth){
      if(isCharBoth) text+='\n═══════════════════════\n\n';
      text+=`【${ward.name||ref.name||'角色'} · 10套剧情衣橱】\n`;
      text+=`时代：${ward.era||ref.era||''}\n`;
      text+=`职业：${ward.job||ref.job||''}\n`;
      text+='\n';
      text+=`━━━ 10套穿搭 ━━━\n`;
      (ward.wardrobes||[]).forEach((w,i)=>{
        text+=`\n── ${w.id||('W'+(i+1))} ${w.name||''} ──\n`;
        if(w.keywords) text+=`风格：${w.keywords.join('、')}\n`;
        if(w.scene) text+=`场景：${w.scene}\n`;
        if(w.outfit) text+=`穿搭：${w.outfit}\n`;
        if(w.shoes) text+=`鞋履：${w.shoes}\n`;
        if(w.accessories) text+=`配饰：${w.accessories.join('、')}\n`;
        if(w.color_scheme) text+=`配色：${w.color_scheme}\n`;
        if(w.props) text+=`道具：${w.props}\n`;
        if(w.draw_prompt) text+=`绘图：${w.draw_prompt}\n`;
      });
      if(ward.positive_prompt) text+=`\n✅ 正向：${ward.positive_prompt}\n`;
      if(ward.negative_prompt) text+=`❌ 负面：${ward.negative_prompt}\n`;
    }
  } else {
    text=`【${d.title}】\n`;
    text+=`题材：${d.genre||''}\n`;
    text+=`风格：${d.style||''}\n`;
    if(d.logline) text+=`梗概：${d.logline}\n`;
    if(d.type) text+=`类型：${d.type}\n`;
    if(d.layout&&d.layout.grid) text+=`布局：${d.layout.grid}（共${d.layout.total_panels||''}格）\n`;
    text+='\n';
    
    if(d.characters&&d.characters.length){
      text+=`━━━ 角色设定 ━━━\n`;
      d.characters.forEach(c=>{
        text+=`\n【${c.name}】${c.role||''}\n`;
        if(c.personality) text+=`性格：${(c.personality||[]).join('、')}\n`;
        if(c.description) text+=`描述：${c.description}\n`;
        if(c.draw_prompt) text+=`绘图提示词：${c.draw_prompt}\n`;
        if(c.voice_tip) text+=`配音建议：${c.voice_tip}\n`;
      });
      text+='\n';
    }
    
    if(isStoryboard){
      /* 故事板格式 */
      if(d.legend&&Object.keys(d.legend).length){
        text+=`━━━ 图例说明 ━━━\n`;
        for(const [k,v] of Object.entries(d.legend)){
          text+=`· ${k}：${v}\n`;
        }
        text+='\n';
      }
      text+=`━━━ 分镜面板 ━━━\n`;
      (d.panels||[]).forEach((p,i)=>{
        text+=`\n── ${p.panel_id||('P'+(i+1))} / ${p.shot_type||''} / ${p.action||''} ──\n`;
        if(p.performance) text+=`表演：${p.performance}\n`;
        if(p.sound) text+=`音效：${p.sound}\n`;
        text+=`画面：${p.description||''}\n`;
        if(p.duration) text+=`时长：${p.duration}秒\n`;
        if(p.draw_prompt) text+=`绘图：${p.draw_prompt}\n`;
      });
    } else {
      /* 剧本格式 */
      text+=`━━━ 分镜脚本 ━━━\n`;
      (d.shots||[]).forEach(s=>{
        text+=`\n── 镜头 ${s.shot_id}（${s.camera||''} · ${s.duration||'?'}秒）──\n`;
        text+=`场景：${s.scene||''}\n`;
        text+=`动作：${s.action||''}\n`;
        if(s.dialogue) text+=`台词："${s.dialogue}"\n`;
        if(s.narration) text+=`旁白：${s.narration}\n`;
        text+=`情绪：${s.emotion||''}\n`;
        text+=`绘图：${s.draw_prompt||''}\n`;
        if(s.bgm) text+=`BGM：${s.bgm}\n`;
        if(s.sound_effect) text+=`音效：${s.sound_effect}\n`;
      });
    }
  }
  
  let toastMsg='完整剧本已复制';
  if(isCharacter) toastMsg='角色设定已复制';
  if(isPipeline) toastMsg='全流程资产已复制';
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast(toastMsg+'到剪贴板','success'));
  }else{
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');showToast(toastMsg,'success');}catch(e){showToast('复制失败','error');}
    document.body.removeChild(ta);
  }
}

  mask.className='modal-mask show';
  mask.id='crudModal';
  mask.onclick=e=>{ if(e.target===mask){ mask.remove(); _afterModalClose(); } };
  mask.innerHTML='<div class="modal-box">'+
    '<h3>'+title+'<button class="modal-close" onclick="var m=this.closest(\'.modal-mask\'); if(m){m.remove(); _afterModalClose();}">✕</button></h3>'+

    '</div>';

  if(!saveBtn){
    console.error('[Modal] 保存按钮未找到，无法绑定事件');

  }
  saveBtn.addEventListener('click',function(e){
    e.preventDefault();

      if(ok!==false){
        mask.remove();
        _afterModalClose();

/* ====== 边缘滑动手势：从屏幕左侧向右滑打开导航，从右向左滑关闭 ====== */
(function(){
  var startX=0,startY=0,swiping=false,edgeWidth=30;
  document.addEventListener('touchstart',function(e){
    if(window.innerWidth>768) return; /* 仅移动端 */
    var t=e.touches[0];
    var sb=document.getElementById('sidebar');
    var isOpen=sb&&sb.classList.contains('open');
    if(isOpen){
      /* 导航已打开，任何位置向左滑可关闭 */
      startX=t.clientX; startY=t.clientY; swiping='close';
    }else if(t.clientX<=edgeWidth){
      /* 导航关闭，从左边缘向右滑打开 */
      startX=t.clientX; startY=t.clientY; swiping='open';
    }else{
      swiping=false;
    }
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!swiping) return;
    var t=e.touches[0];
    var dx=t.clientX-startX;
    var dy=t.clientY-startY;
    if(swiping==='open'&&dx>20&&Math.abs(dx)>Math.abs(dy)*1.5){
      toggleSidebar(true);
      swiping=false;
    }else if(swiping==='close'&&dx<-20&&Math.abs(dx)>Math.abs(dy)*1.5){
      toggleSidebar(false);
      swiping=false;
    }
  },{passive:true});

  document.addEventListener('touchend',function(){
    swiping=false;
  },{passive:true});
})();

/* 生成漫剧提示词 - 主入口 */
function wsGenerate(){
  var ta=document.getElementById('wsNovelInput');
  var text=ta?ta.value.trim():'';
  if(!text){
    wsShowError('请先输入或上传小说内容');
    return;
  }

  var s=DB.apiSettings||{};
  if(!s.apiBaseUrl||!s.apiKey){
    wsShowError('请先在「智能体库」中设置 API 地址和 Key');
    return;
  }

  var styleEl=document.getElementById('wsStyle');
  var style=styleEl?styleEl.value:'国漫写实';
  var typeEl=document.getElementById('wsNovelType');
  var novelType=typeEl?typeEl.value:'古风仙侠';
  var mode=wsGetMode();
  var extraEl=document.getElementById('wsExtra');
  var extra=extraEl?extraEl.value.trim():'';

  wsHideError();
  var loadingText='AI 正在分析小说并生成分镜提示词，请稍候…';
  if(mode==='parse') loadingText='AI 正在解析小说设定，请稍候…';
  if(mode==='quick') loadingText='AI 正在快速生成分镜，请稍候…';
  wsShowLoading(loadingText);

  var btn=document.getElementById('btnWsGenerate');
  if(btn) btn.disabled=true;

  /* 构建系统提示词 */
  var sysPrompt=wsBuildSystemPrompt(mode);
  /* 截取小说文本 */
  var novelChunk=text.length>8000?text.substring(0,8000)+'\n...(内容过长已截断)':text;
  var userMsg='【画风】'+style+'\n【小说类型】'+novelType+'\n';
  if(extra) userMsg+='【补充要求】'+extra+'\n';
  userMsg+='\n请分析以下小说内容并返回JSON：\n\n'+novelChunk;

  callAgentLLM(sysPrompt,userMsg,false)
    .then(function(resp){
      var data=extractJsonFromText(resp);
      if(!data){
        throw new Error('AI返回的内容无法解析为JSON，请重试');
      }
      wsState.result=data;
      wsState.characters=data.characters||[];
      wsState.scenes=data.scenes||[];
      wsState.panels=(data.storyboard&&data.storyboard.panels)?data.storyboard.panels:[];
      wsState.fullPrompt=(data.storyboard&&data.storyboard.full_prompt)?data.storyboard.full_prompt:'';
      wsRenderResult(data,style,novelType);
      wsHideLoading();
      showToast('✅ 生成完成！提示词可一键复制','success');
    })
    .catch(function(err){
      wsHideLoading();
      wsShowError(err.message||err);
    })
    .finally(function(){
      if(btn) btn.disabled=false;
    });
}

/* 构建系统提示词 */
function wsBuildSystemPrompt(mode){
  var modeDesc={
    parse:'只解析模式：提取角色、场景、情感和风格推荐，不生成完整分镜',
    full:'完整分镜模式：提取全部信息并生成8-16格详细分镜故事板，每格必须包含绘图提示词',
    quick:'快速分镜模式：提取核心信息并生成4-6格简化分镜'
  };
  return '你是一个专业的小说→漫剧分镜转换专家。请分析用户提供的小说内容，提取关键信息并返回标准JSON。'+modeDesc[mode]+'\n\n'+
    '返回JSON格式（严格遵循，只返回JSON不要其他文字）：\n'+
    '{\n'+
    '  "novel_name":"小说名称",\n'+
    '  "novel_type":"小说类型",\n'+
    '  "summary":"小说梗概（50-100字）",\n'+
    '  "characters":[\n'+
    '    {"name":"角色名","type":"主角/配角/反派","emoji":"表情","description":"简短描述","prompt":"角色绘图提示词"}\n'+
    '  ],\n'+
    '  "scenes":[\n'+
    '    {"name":"场景名","type":"室内/室外","description":"场景描述","prompt":"场景绘图提示词"}\n'+
    '  ],\n'+
    '  "storyboard":{\n'+
    '    "panels":[\n'+
    '      {\n'+
    '        "id":"P01",\n'+
    '        "shot_type":"远景/中景/近景/特写",\n'+
    '        "camera_movement":"固定/推拉/摇移",\n'+
    '        "composition":"画面构图描述",\n'+
    '        "characters":["出场角色"],\n'+
    '        "dialogue":"对白内容",\n'+
    '        "emotion":"情绪",\n'+
    '        "prompt":"完整绘图提示词（可直接复制使用）"\n'+
    '      }\n'+
    '    ],\n'+
    '    "full_prompt":"所有分镜提示词汇总文本"\n'+
    '  }\n'+
    '}\n\n'+
    '要求：\n'+
    '1. 角色至少3-8个，每个角色必须有prompt字段（可直接用于AI绘图）\n'+
    '2. 场景至少2-5个，每个场景必须有prompt字段\n'+
    '3. 分镜格数：parse模式0格，full模式8-16格，quick模式4-6格\n'+
    '4. 每格分镜的prompt必须包含完整的绘图描述（画风、场景、角色、动作、光影等）\n'+
    '5. full_prompt字段汇总所有分镜提示词，每行一条\n'+
    '6. 所有prompt字段都要可直接复制到AI绘图工具使用';
}

/* 渲染结果 */
function wsRenderResult(data,style,novelType){
  var resultEl=document.getElementById('wsResult');
  if(!resultEl) return;
  resultEl.style.display='block';

  /* 基本信息 */
  var el;
  el=document.getElementById('wsResName'); if(el) el.textContent=data.novel_name||'未命名';
  el=document.getElementById('wsResType'); if(el) el.textContent=data.novel_type||novelType||'—';
  el=document.getElementById('wsResStyle'); if(el) el.textContent=style||'—';
  el=document.getElementById('wsResSummary'); if(el) el.textContent=data.summary||'暂无梗概';

  /* 渲染角色 */
  wsRenderChars(data.characters||[]);
  /* 渲染场景 */
  wsRenderScenes(data.scenes||[]);
  /* 渲染分镜 */
  wsRenderPanels((data.storyboard&&data.storyboard.panels)?data.storyboard.panels:[]);
  /* 渲染完整提示词 */
  wsRenderFullPrompt((data.storyboard&&data.storyboard.full_prompt)?data.storyboard.full_prompt:'');

  resultEl.scrollIntoView({behavior:'smooth',block:'start'});
}

function wsRenderScenes(scenes){
  var c=document.getElementById('wsResScenes');
  if(!c) return;
  if(!scenes.length){
    var card=document.getElementById('wsResScenesCard');
    if(card) card.style.display='none';
    return;
  }
  var card=document.getElementById('wsResScenesCard');
  if(card) card.style.display='block';
  c.innerHTML=scenes.map(function(s,idx){
    return '<div class="agent-char-card">'+
      '<div class="agent-char-head">'+
        '<span class="agent-char-name">🏠 '+escapeHtml(s.name||'场景')+'<span class="agent-char-role">'+(s.type||'室外')+'</span></span>'+
        '<button class="btn btn-mint agent-copy-btn" onclick="wsCopyScenePrompt('+idx+')">📋 复制提示词</button>'+
      '</div>'+
      (s.description?'<div class="txt" style="font-size:13px;color:var(--ink-2);margin-bottom:6px">'+escapeHtml(s.description)+'</div>':'')+
      (s.prompt?'<div class="agent-char-prompt">'+escapeHtml(s.prompt)+'</div>':'')+
    '</div>';
  }).join('');
}

/* 渲染分镜列表（带每格复制按钮） */
function wsRenderPanels(panels){
  var c=document.getElementById('wsResPanels');
  if(!c) return;
  if(!panels.length){
    c.innerHTML='<div class="txt" style="color:var(--ink-3);text-align:center;padding:20px">此模式下未生成分镜数据</div>';
    return;
  }
  var html='<div class="agent-shot-table">';
  panels.forEach(function(p,i){
    html+=
      '<div class="agent-shot-card">'+
        '<div class="agent-shot-head">'+
          '<span class="agent-shot-id">'+(p.id||('P'+(i+1)))+'</span>'+
          '<span class="agent-shot-camera">'+escapeHtml(p.shot_type||'')+'</span>'+
          '<span class="agent-shot-dur">🎬 '+escapeHtml(p.camera_movement||'固定')+'</span>'+
          '<button class="btn btn-mint agent-copy-btn" onclick="wsCopyPanelPrompt('+i+')">📋 复制绘图提示词</button>'+
        '</div>'+
        '<div class="agent-shot-body">'+
          (p.composition?'<div class="agent-shot-row"><span class="agent-shot-label">画面：</span><span>'+escapeHtml(p.composition)+'</span></div>':'')+
          (p.characters&&p.characters.length?'<div class="agent-shot-row"><span class="agent-shot-label">角色：</span><span>'+escapeHtml(p.characters.join('、'))+'</span></div>':'')+
          (p.dialogue?'<div class="agent-shot-row"><span class="agent-shot-label">对白：</span><span>'+escapeHtml(p.dialogue)+'</span></div>':'')+
          (p.emotion?'<div class="agent-shot-row"><span class="agent-shot-label">情绪：</span><span>'+escapeHtml(p.emotion)+'</span></div>':'')+
          '<div class="agent-shot-draw">'+
            '<div class="agent-shot-label">🎨 绘图提示词：</div>'+
            '<div class="agent-shot-draw-text">'+escapeHtml(p.prompt||'')+'</div>'+
          '</div>'+
        '</div>'+
      '</div>';
  });
  html+='</div>';
  c.innerHTML=html;
}

/* 渲染完整提示词汇总 */
function wsRenderFullPrompt(text){
  var el=document.getElementById('wsFullPrompt');
  if(!el) return;
  if(!text){
    /* 如果没有full_prompt，自动汇总所有分镜提示词 */
    text=wsState.panels.map(function(p,i){
      return '['+(p.id||('P'+(i+1)))+'] '+(p.prompt||'');
    }).filter(Boolean).join('\n\n');
  }
  el.textContent=text||'暂无提示词';
}

/* === 复制功能 === */

/* 复制角色提示词 */
function wsCopyCharPrompt(idx){
  var ch=wsState.characters[idx];
  if(!ch||!ch.prompt){showToast('该角色无提示词','error');return;}
  copyToClipboard(ch.prompt);
  showToast('角色「'+ch.name+'」提示词已复制','success');
}

/* 复制场景提示词 */
function wsCopyScenePrompt(idx){
  var s=wsState.scenes[idx];
  if(!s||!s.prompt){showToast('该场景无提示词','error');return;}
  copyToClipboard(s.prompt);
  showToast('场景「'+s.name+'」提示词已复制','success');
}

/* 复制分镜提示词 */
function wsCopyPanelPrompt(idx){
  var p=wsState.panels[idx];
  if(!p||!p.prompt){showToast('该分镜无提示词','error');return;}
  copyToClipboard(p.prompt);
  showToast('分镜「'+(p.id||('P'+(idx+1)))+'」提示词已复制','success');
}

/* 复制全部提示词 */
function wsCopyAll(){
  var parts=[];
  /* 角色提示词 */
  if(wsState.characters.length){
    parts.push('===== 角色提示词 =====');
    wsState.characters.forEach(function(ch){
      if(ch.prompt) parts.push('['+ch.name+'] '+ch.prompt);
    });
  }
  /* 场景提示词 */
  if(wsState.scenes.length){
    parts.push('\n===== 场景提示词 =====');
    wsState.scenes.forEach(function(s){
      if(s.prompt) parts.push('['+s.name+'] '+s.prompt);
    });
  }
  /* 分镜提示词 */
  if(wsState.panels.length){
    parts.push('\n===== 分镜提示词 =====');
    wsState.panels.forEach(function(p,i){
      if(p.prompt) parts.push('['+(p.id||('P'+(i+1)))+'] '+p.prompt);
    });
  }
  /* 完整提示词 */
  if(wsState.fullPrompt){
    parts.push('\n===== 完整提示词汇总 =====');
    parts.push(wsState.fullPrompt);
  }
  var text=parts.join('\n');
  if(!text){showToast('暂无提示词可复制','error');return;}
  copyToClipboard(text);
  showToast('✅ 已复制全部提示词（'+wsState.panels.length+'格分镜 + '+wsState.characters.length+'角色 + '+wsState.scenes.length+'场景）','success');
}

/* 复制完整提示词汇总 */
function wsCopyFullPrompt(){
  var el=document.getElementById('wsFullPrompt');
  var text=el?el.textContent:'';
  if(!text){showToast('暂无提示词','error');return;}
  copyToClipboard(text);
  showToast('完整提示词已复制','success');
}
</script>
