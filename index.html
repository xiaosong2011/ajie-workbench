<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小松工作台">
<meta name="theme-color" content="#15273b">
<meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%23a8edea'/><stop offset='100%' stop-color='%2389cff0'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><path d='M50 18L56 44H82L61 57L67 84L50 68L33 84L39 57L18 44H44L50 18Z' fill='white' opacity='0.95'/><rect x='38' y='38' width='24' height='24' rx='5' fill='none' stroke='white' stroke-width='3' opacity='0.85'/></svg>">
  <title>小松的工作台 · 男生版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<style>
  :root{
    --side-1:#162235; --side-2:#1d2e44; --side-active:#2b4a6b;
    --side-text:#c4d4e3; --side-text-dim:#7d92a6;
    --content-bg:#f6f8fa; --card:#ffffff;
    --accent:#2e86de; --accent-2:#1abc9c; --accent-warm:#e67e22;
    --ink:#1f2d3d; --ink-2:#51637a; --ink-3:#8a9bb0;
    --line:#e3e9f0; --tag-blue:#dbeafe; --tag-blue-t:#1d6fb8;
    --tag-mint:#d4f1e4; --tag-mint-t:#128a6a;
    --tag-amber:#fde8d0; --tag-amber-t:#c4771a;
    --tag-violet:#e6dcf7; --tag-violet-t:#6b3fa0;
    --tag-rose:#fbdde6; --tag-rose-t:#b83d63;
    --shadow:0 1px 3px rgba(20,40,70,.04),0 2px 8px rgba(20,40,70,.05);
    --shadow-hover:0 4px 16px rgba(20,40,70,.08),0 8px 24px rgba(20,40,70,.06);
    --radius:16px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --statusbar-h:calc(38px + var(--safe-top));
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{height:100%;touch-action:manipulation;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Roboto,sans-serif;
    background:#0f1a26; color:var(--ink); overflow:hidden;
    -webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;
  }
  .device{
    width:100%; height:100vh; height:100dvh; max-width:1180px; margin:0 auto;
    display:flex; flex-direction:column; background:var(--content-bg);
    position:relative;
  }
  /* ===== 顶部状态栏（适配全面屏安全区）===== */
  .statusbar{
    height:var(--statusbar-h); padding-top:var(--safe-top);
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding-left:18px; padding-right:18px;
    font-size:14px; font-weight:600; color:#fff;
    background:linear-gradient(90deg,var(--side-1),var(--side-2));
  }
  .statusbar .left{display:flex;align-items:center;gap:8px}
  .statusbar .center{width:120px;height:26px;background:#000;border-radius:14px}
  .statusbar .right{display:flex;align-items:center;gap:6px;font-size:12px}
  .statusbar .right svg{width:16px;height:11px}
  .bat{display:inline-flex;align-items:center;gap:2px}
  .bat-body{width:22px;height:11px;border:1.4px solid #fff;border-radius:3px;position:relative;padding:1.2px}
  .bat-body i{display:block;height:100%;width:67%;background:#fff;border-radius:1px}
  .bat-tip{width:2px;height:5px;background:#fff;border-radius:0 2px 2px 0}

  /* ===== 主体分栏 ===== */
  .main{flex:1; display:flex; overflow:hidden; min-height:0}

  /* ===== 左侧导航 ===== */
  .sidebar{
    width:188px; flex-shrink:0; background:linear-gradient(180deg,var(--side-1),var(--side-2));
    display:flex; flex-direction:column; overflow:hidden;
  }
  .side-head{padding:14px 16px 10px}
  .side-head .ws-name{color:#fff;font-size:16px;font-weight:700;letter-spacing:.5px}
  .side-head .ws-sub{color:var(--side-text-dim);font-size:11px;margin-top:3px;display:flex;align-items:center;gap:4px}
  .side-head .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:inline-flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
  .nav-scroll{flex:1;overflow-y:auto;padding:4px 8px 16px;-webkit-overflow-scrolling:touch}
  .nav-scroll::-webkit-scrollbar{width:0}
  .nav-item{
    display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:11px;
    color:var(--side-text);font-size:13px;cursor:pointer;margin:2px 0;
    transition:background .2s,color .2s,transform .15s; position:relative; user-select:none;
  }
  .nav-item .ico{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:rgba(255,255,255,.08);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .nav-item:hover{background:rgba(255,255,255,.07)}
  .nav-item:hover .ico{transform:scale(1.12) rotate(-5deg)}
  .nav-item.active{background:var(--side-active);color:#fff}
  .nav-item.active .ico{background:rgba(255,255,255,.18)}
  .nav-item.active::before{content:"";position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent-2);border-radius:3px 0 0 3px}
  .nav-item .badge{margin-left:auto;background:#e74c3c;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .nav-group{font-size:10px;font-weight:700;color:var(--side-text-dim);letter-spacing:1px;padding:14px 10px 4px;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.06);margin-top:6px}
  .nav-group:first-child{border-top:none;margin-top:2px}

  /* ===== 右侧内容 ===== */
  .content{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--content-bg)}
  .content::-webkit-scrollbar{width:6px}
  .content::-webkit-scrollbar-track{background:transparent}
  .content::-webkit-scrollbar-thumb{background:#c5d2e0;border-radius:3px;transition:background .2s}
  .content::-webkit-scrollbar-thumb:hover{background:#9fb0c4}
  .content-inner{padding:20px 24px calc(80px + var(--safe-bottom));max-width:760px}

  .page-head{display:flex;align-items:flex-end;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .page-head .bow{font-size:20px}
  .page-head h1{font-size:24px;font-weight:800;color:var(--ink)}
  .page-head .sub{font-size:13px;color:var(--ink-3);font-weight:500;margin-bottom:2px}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line);transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s ease,border-color .22s ease}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:rgba(46,134,222,.2)}
  .card.tint-blue,.card.tint-mint,.card.tint-amber,.card.tint-violet,.card.tint-slate{background:var(--card);border-color:var(--line)}
  .card-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px;flex-wrap:wrap}
  .card-h .right-ml{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3)}
  .card-h .btn{margin-left:auto}
  .txt{font-size:13.5px;line-height:1.75;color:var(--ink-2)}
  .txt b{color:var(--ink);font-weight:600}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;border:none;transition:transform .15s,box-shadow .2s,filter .15s;font-family:inherit}
  .btn:active{transform:scale(.96)}
  .btn-accent{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(46,134,222,.25)}
  .btn-accent:hover{box-shadow:0 4px 12px rgba(46,134,222,.35);filter:brightness(1.05)}
  .btn-mint{background:var(--accent-2);color:#fff;box-shadow:0 2px 8px rgba(26,188,156,.25)}
  .btn-mint:hover{box-shadow:0 4px 12px rgba(26,188,156,.35);filter:brightness(1.05)}
  .btn-ghost{background:#f1f5fa;color:var(--ink-2);border:1px solid var(--line);transition:all .15s}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:#f8faff}
  .btn:hover{filter:brightness(1.02)}

  /* 待办 */
  .todo-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .progress{flex:1;height:6px;background:#eaeff5;border-radius:3px;overflow:hidden;min-width:60px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:3px;transition:width .3s}
  .todo-item{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px;transition:all .15s;border-radius:0}
  .todo-item:last-child{border-bottom:none}
  .todo-item:hover{background:var(--content-bg);border-radius:8px;margin:0 -4px;padding:12px 12px}
  .todo-item .ck{width:20px;height:20px;border-radius:6px;border:2px solid #c2cdda;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
  .todo-item.done .ck{background:var(--accent-2);border-color:var(--accent-2)}
  .todo-item.done .ck::after{content:"✓";color:#fff;font-size:12px;font-weight:800}
  .todo-item.done .label{text-decoration:line-through;color:var(--ink-3)}
  .todo-item .del{margin-left:auto;color:#c2cdda;cursor:pointer;font-size:14px;opacity:0;transition:opacity .15s,transform .15s}
  .todo-item:hover .del{opacity:1}
  .todo-item .del:hover{transform:scale(1.15);color:#ef4444}

  /* 日历 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head .mon{font-size:14px;font-weight:700}
  .cal-head .nav-btn{cursor:pointer;color:var(--ink-3);font-size:16px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:8px}
  .cal-head .nav-btn:hover{background:#eef3f9}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal-grid .wh{font-size:11px;color:var(--ink-3);padding:4px 0;font-weight:600}
  .cal-grid .d{font-size:12px;padding:6px 0;border-radius:8px;cursor:pointer;position:relative;color:var(--ink-2)}
  .cal-grid .d.dim{color:#c2cdda}
  .cal-grid .d.today{border:1.5px solid var(--accent);font-weight:700;color:var(--accent)}
  .cal-grid .d.checked{background:var(--accent-2);color:#fff;font-weight:700}
  .cal-grid .d.checked::after{content:"";display:block;width:4px;height:4px;background:#fff;border-radius:50%;margin:1px auto 0}
  .cal-legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--ink-3)}
  .cal-legend span{display:flex;align-items:center;gap:4px}

  /* 资源条目 */
  .res{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .res:last-child{border-bottom:none}
  .res .num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5aa9e6);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .res .num.amber{background:linear-gradient(135deg,var(--accent-warm),#f0a957)}
  .res .num.violet{background:linear-gradient(135deg,#7e57c2,#a78bda)}
  .res .body{flex:1}
  .res .t{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:4px}
  .res .t .ext{color:var(--ink-3);font-size:12px}
  .res .meta{font-size:11px;color:var(--ink-3);margin:2px 0 4px}
  .res .desc{font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .res .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}

  /* 时间线 */
  .tl{position:relative;padding-left:18px}
  .tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 14px 14px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:"";position:absolute;left:-14px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 0 0 2px var(--accent)}
  .tl-item.mint::before{background:var(--accent-2);box-shadow:0 0 0 2px var(--accent-2)}
  .tl-item.amber::before{background:var(--accent-warm);box-shadow:0 0 0 2px var(--accent-warm)}
  .tl-item .tm{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
  .tl-item .ti{font-size:13px;font-weight:700;color:var(--ink)}
  .tl-item .td{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.5}

  /* 子表格 */
  .sub-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .sub-tbl th{text-align:left;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  .sub-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--ink-2)}
  .sub-tbl td b{color:var(--ink)}

  /* 浮动按钮 */
  .fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-bottom));width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-3);cursor:pointer;z-index:50;border:none}
  .fab:hover{color:var(--accent)}

  /* ===== 浮动菜单按钮（手机端 + PWA 始终可见）===== */
  .menu-fab{display:none}
  @media(max-width:768px){
    .menu-fab{
      display:flex;position:fixed;left:16px;bottom:calc(16px + var(--safe-bottom));
      width:54px;height:54px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff;align-items:center;justify-content:center;
      font-size:26px;cursor:pointer;z-index:62;border:none;
      box-shadow:0 4px 18px rgba(46,134,222,.5);
      user-select:none;
    }
    .menu-fab:active{transform:scale(.9)}
  }

  /* ===== Toast 提示 ===== */
  .toast-container{position:fixed;top:calc(var(--statusbar-h) + 10px);left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{
    background:rgba(30,45,60,.92);color:#fff;padding:10px 18px;border-radius:12px;
    font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.2);
    animation:toastIn .3s cubic-bezier(.34,1.56,.64,1),toastOut .3s ease 2.2s forwards;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:8px;pointer-events:auto;
  }
  .toast.success{background:rgba(26,168,122,.92)}
  .toast.error{background:rgba(220,53,69,.92)}
  .toast.warn{background:rgba(230,126,34,.92)}
  @keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes toastOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-10px) scale(.95)}}

  /* ===== 可折叠导航分组 ===== */
  .nav-group-header{
    display:flex;align-items:center;justify-content:space-between;
    font-size:10px;font-weight:700;color:var(--side-text-dim);letter-spacing:1px;
    padding:14px 10px 4px;text-transform:uppercase;
    border-top:1px solid rgba(255,255,255,.06);margin-top:6px;
    cursor:pointer;user-select:none;
  }
  .nav-group-header:first-of-type{border-top:none;margin-top:2px}
  .nav-group-header .group-arrow{
    width:14px;height:14px;display:flex;align-items:center;justify-content:center;
    font-size:9px;transition:transform .25s ease;opacity:.6;
  }
  .nav-group-header.collapsed .group-arrow{transform:rotate(-90deg)}
  .nav-group-items{overflow:hidden;transition:max-height .3s ease}
  .nav-group-items.collapsed{max-height:0 !important}

  /* ===== 全局搜索 ===== */
  .search-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);
    z-index:150;display:none;align-items:flex-start;justify-content:center;
    padding-top:80px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .search-mask.show{display:flex}
  .search-box{
    background:var(--card);border-radius:16px;width:90%;max-width:520px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;
    animation:searchPop .25s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes searchPop{from{opacity:0;transform:translateY(-20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  .search-input-wrap{
    display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .search-input-wrap .s-ico{font-size:18px;color:var(--ink-3)}
  .search-input-wrap input{
    flex:1;border:none;outline:none;background:transparent;
    font-size:15px;color:var(--ink);font-weight:500;
  }
  .search-input-wrap input::placeholder{color:var(--ink-3)}
  .search-input-wrap .s-close{
    font-size:12px;color:var(--ink-3);cursor:pointer;padding:4px 8px;
    border-radius:6px;background:var(--content-bg);
  }
  .search-results{max-height:400px;overflow-y:auto;padding:8px}
  .search-result-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-radius:10px;cursor:pointer;transition:background .15s;
  }
  .search-result-item:hover{background:var(--content-bg)}
  .search-result-item.selected{background:var(--content-bg);border:1px solid var(--accent)}
  .search-result-item .sr-ico{font-size:18px;width:32px;height:32px;border-radius:8px;background:var(--content-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .search-result-item .sr-info{flex:1;min-width:0}
  .search-result-item .sr-title{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search-result-item .sr-desc{font-size:11px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search-result-item .sr-group{font-size:10px;color:var(--accent);background:var(--tag-blue);padding:2px 6px;border-radius:4px;font-weight:600}
  .search-empty{text-align:center;padding:30px;color:var(--ink-3);font-size:13px}
  .search-hint{padding:8px 16px;font-size:11px;color:var(--ink-3);border-top:1px solid var(--line);display:flex;justify-content:space-between}
  .search-hint kbd{background:var(--content-bg);padding:2px 6px;border-radius:4px;font-size:10px;font-family:inherit}

  /* ===== 主题切换按钮 ===== */
  .theme-btn{
    width:28px;height:28px;border-radius:8px;display:inline-flex;
    align-items:center;justify-content:center;font-size:14px;cursor:pointer;
    transition:all .2s;
  }
  .theme-btn:hover{background:rgba(255,255,255,.15)}
  .theme-btn:active{transform:scale(.9)}

  /* ===== 面包屑导航 ===== */
  .breadcrumb{
    display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);
    margin-bottom:8px;flex-wrap:wrap;
  }
  .breadcrumb .bc-item{cursor:pointer;transition:color .15s}
  .breadcrumb .bc-item:hover{color:var(--accent)}
  .breadcrumb .bc-sep{color:var(--ink-3);opacity:.5}
  .breadcrumb .bc-current{color:var(--ink);font-weight:600}

  /* ===== 主题颜色平滑过渡 ===== */
  body{transition:background-color .3s ease,color .3s ease}
  .card,.nav-item,.btn,.gitem,.todo-item,.modal-box,.share-box,
  .crud-input,.crud-textarea,.modal-close,.content,.empty,.empty-hint,
  .ov-nav-btn,.pill,.progress,.search-box,.search-result-item{
    transition:background-color .3s ease,border-color .3s ease,color .3s ease,box-shadow .3s ease;
  }

  /* ===== 五套主题系统 ===== */
  /* 所有主题通过 body[data-theme="xxx"] 切换变量 */

  /* 主题一：晨光白 (default) — 温暖、柔和、纸质感，陶土橙主色 */
  body[data-theme="default"]{
    --content-bg:#faf7f2; --card:#ffffff;
    --ink:#3d2f24; --ink-2:#7a6552; --ink-3:#a89583;
    --accent:#c2692e; --accent-2:#d4a053; --accent-warm:#b45309;
    --line:#ede5da;
    --side-1:#2d241c; --side-2:#3d3127; --side-active:#5c4432;
    --side-text:#e8ddd0; --side-text-dim:#9a8873;
    --tag-blue:#e8ddc8; --tag-blue-t:#8b6914;
    --tag-mint:#d9e4cf; --tag-mint-t:#4d7c0f;
    --tag-amber:#f5e0c8; --tag-amber-t:#c2692e;
    --tag-violet:#e4d4dd; --tag-violet-t:#7c3aed;
    --tag-rose:#f3dcd2; --tag-rose-t:#be123c;
    --shadow:0 1px 3px rgba(60,40,20,.05),0 2px 8px rgba(60,40,20,.04);
    --shadow-hover:0 4px 16px rgba(60,40,20,.08),0 8px 24px rgba(60,40,20,.06);
  }

  /* 主题二：雾屿蓝 (ocean) — 冷静、清晰、技术感，亮蓝主色 */
  body[data-theme="ocean"]{
    --content-bg:#f6f8fa; --card:#ffffff;
    --ink:#1f2d3d; --ink-2:#51637a; --ink-3:#8a9bb0;
    --accent:#2e86de; --accent-2:#1abc9c; --accent-warm:#e67e22;
    --line:#e3e9f0;
    --side-1:#162235; --side-2:#1d2e44; --side-active:#2b4a6b;
    --side-text:#c4d4e3; --side-text-dim:#7d92a6;
    --tag-blue:#dbeafe; --tag-blue-t:#1d6fb8;
    --tag-mint:#d4f1e4; --tag-mint-t:#128a6a;
    --tag-amber:#fde8d0; --tag-amber-t:#c4771a;
    --tag-violet:#e6dcf7; --tag-violet-t:#6b3fa0;
    --tag-rose:#fbdde6; --tag-rose-t:#b83d63;
    --shadow:0 1px 3px rgba(20,40,70,.04),0 2px 8px rgba(20,40,70,.05);
    --shadow-hover:0 4px 16px rgba(20,40,70,.08),0 8px 24px rgba(20,40,70,.06);
  }

  /* 主题三：抹茶绿 (moss) — 治愈、舒缓、护眼，鼠尾草绿主色 */
  body[data-theme="moss"]{
    --content-bg:#f5f7f1; --card:#ffffff;
    --ink:#2a3328; --ink-2:#5a6b55; --ink-3:#8a9a85;
    --accent:#6b8e5a; --accent-2:#8bb776; --accent-warm:#b8860b;
    --line:#e3e9dc;
    --side-1:#1e2a1d; --side-2:#2a3a29; --side-active:#3d543c;
    --side-text:#c8d4be; --side-text-dim:#7d9270;
    --tag-blue:#d7e3d1; --tag-blue-t:#3a6b2d;
    --tag-mint:#d9ead0; --tag-mint-t:#4d7c3f;
    --tag-amber:#f0e6cc; --tag-amber-t:#927019;
    --tag-violet:#dcd5e0; --tag-violet-t:#6b3fa0;
    --tag-rose:#ecd7d7; --tag-rose-t:#a34545;
    --shadow:0 1px 3px rgba(40,60,30,.04),0 2px 8px rgba(40,60,30,.04);
    --shadow-hover:0 4px 16px rgba(40,60,30,.07),0 8px 24px rgba(40,60,30,.05);
  }

  /* 主题四：极夜灰 (dark) — 高级、沉浸、不刺眼，冰蓝主色 */
  body[data-theme="dark"]{
    --content-bg:#141927; --card:#1e2436;
    --ink:#e8ecf4; --ink-2:#aab4c8; --ink-3:#6b7690;
    --accent:#60a5fa; --accent-2:#67e8f9; --accent-warm:#f59e0b;
    --line:#2a3147;
    --side-1:#0d1220; --side-2:#141a2e; --side-active:#1e2a45;
    --side-text:#b8c4d8; --side-text-dim:#5f6b85;
    --tag-blue:#1e3a5f; --tag-blue-t:#60a5fa;
    --tag-mint:#1a3d33; --tag-mint-t:#5ed6b0;
    --tag-amber:#4a3520; --tag-amber-t:#f0a957;
    --tag-violet:#3a2d5c; --tag-violet-t:#b89eff;
    --tag-rose:#4a2536; --tag-rose-t:#ff8fb3;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.2);
    --shadow-hover:0 4px 16px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
  body[data-theme="dark"] .content::-webkit-scrollbar-thumb{background:#3d4560}
  body[data-theme="dark"] .btn-ghost{background:#2d3448;color:var(--ink-2);border-color:var(--line)}
  body[data-theme="dark"] .modal-box{background:rgba(30,36,54,.85)}
  body[data-theme="dark"] .crud-input,
  body[data-theme="dark"] .crud-textarea{background:#2a3147;border-color:#3d4560;color:var(--ink)}
  body[data-theme="dark"] .crud-input:focus,
  body[data-theme="dark"] .crud-textarea:focus{background:#2f3750;border-color:var(--accent)}
  body[data-theme="dark"] .modal-close{background:#2a3147;color:var(--ink-3)}
  body[data-theme="dark"] .search-box{background:#1e2436}
  body[data-theme="dark"] .empty,
  body[data-theme="dark"] .empty-hint{background:linear-gradient(135deg,rgba(40,48,68,.6),rgba(30,36,54,.4));border-color:#3d4560}

  /* 主题五：勃艮第红 (wine) — 复古、优雅、个性，玫瑰粉主色 */
  body[data-theme="wine"]{
    --content-bg:#1a1418; --card:#251c20;
    --ink:#f0e6ea; --ink-2:#b8a4ad; --ink-3:#7d6b73;
    --accent:#f472b6; --accent-2:#fb923c; --accent-warm:#f59e0b;
    --line:#36282e;
    --side-1:#1a0f14; --side-2:#271820; --side-active:#3d242f;
    --side-text:#e0c8d2; --side-text-dim:#8a6b78;
    --tag-blue:#2e1f3a; --tag-blue-t:#c4b5fd;
    --tag-mint:#1f3028; --tag-mint-t:#86efac;
    --tag-amber:#3d2420; --tag-amber-t:#fdba74;
    --tag-violet:#3d1f3a; --tag-violet-t:#f0abfc;
    --tag-rose:#4a2030; --tag-rose-t:#f9a8d4;
    --shadow:0 1px 3px rgba(80,20,40,.25),0 2px 8px rgba(80,20,40,.2);
    --shadow-hover:0 4px 16px rgba(120,30,60,.35),0 8px 24px rgba(120,30,60,.25);
  }
  body[data-theme="wine"] .content::-webkit-scrollbar-thumb{background:#5a3d48}
  body[data-theme="wine"] .btn-ghost{background:#36282e;color:var(--ink-2);border-color:var(--line)}
  body[data-theme="wine"] .modal-box{background:rgba(37,28,32,.88)}
  body[data-theme="wine"] .crud-input,
  body[data-theme="wine"] .crud-textarea{background:#302227;border-color:#4a353d;color:var(--ink)}
  body[data-theme="wine"] .crud-input:focus,
  body[data-theme="wine"] .crud-textarea:focus{background:#3a2a30;border-color:var(--accent)}
  body[data-theme="wine"] .modal-close{background:#36282e;color:var(--ink-3)}
  body[data-theme="wine"] .search-box{background:#251c20}
  body[data-theme="wine"] .empty,
  body[data-theme="wine"] .empty-hint{background:linear-gradient(135deg,rgba(60,30,40,.5),rgba(40,20,30,.3));border-color:#5a3d48}

  /* 主题六：落霞粉 (sunset) — 梦幻晚霞背景，玻璃拟态卡片，粉紫渐变主色 */
  body[data-theme="sunset"]{
    --content-bg:transparent; --card:rgba(255,255,255,.72);
    --ink:#4a2c4a; --ink-2:#7d5a7d; --ink-3:#a88aa8;
    --accent:#e879a8; --accent-2:#b479e8; --accent-warm:#f59e0b;
    --line:rgba(255,255,255,.5);
    --side-1:rgba(42,24,54,.85); --side-2:rgba(58,34,72,.8); --side-active:rgba(132,72,168,.6);
    --side-text:#f0e0f5; --side-text-dim:#b89cc8;
    --tag-blue:rgba(200,180,230,.6); --tag-blue-t:#6b3fa0;
    --tag-mint:rgba(180,220,200,.6); --tag-mint-t:#2d7a5a;
    --tag-amber:rgba(250,210,170,.6); --tag-amber-t:#c2692e;
    --tag-violet:rgba(220,190,240,.6); --tag-violet-t:#7c3aed;
    --tag-rose:rgba(245,200,220,.6); --tag-rose-t:#be123c;
    --shadow:0 4px 16px rgba(120,50,120,.12),0 2px 8px rgba(120,50,120,.08);
    --shadow-hover:0 8px 32px rgba(120,50,120,.18),0 4px 16px rgba(120,50,120,.12);
  }
  body[data-theme="sunset"] .device{
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,200,220,.6) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 30%, rgba(200,170,240,.5) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 80%, rgba(255,220,180,.5) 0%, transparent 50%),
      linear-gradient(135deg, #ffd6e8 0%, #e8d5f5 35%, #d5e8f5 70%, #fff0d6 100%);
    background-attachment: fixed;
  }
  body[data-theme="sunset"] .card,
  body[data-theme="sunset"] .stat-card,
  body[data-theme="sunset"] .quick-item,
  body[data-theme="sunset"] .list-item{
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.6);
  }
  body[data-theme="sunset"] .card:hover,
  body[data-theme="sunset"] .stat-card:hover,
  body[data-theme="sunset"] .quick-item:hover,
  body[data-theme="sunset"] .list-item:hover{
    background:rgba(255,255,255,.85);
  }
  body[data-theme="sunset"] .content::-webkit-scrollbar-thumb{background:rgba(180,120,180,.4)}
  body[data-theme="sunset"] .btn-ghost{background:rgba(255,255,255,.6);color:var(--ink-2);border-color:rgba(255,255,255,.5);backdrop-filter:blur(8px)}
  body[data-theme="sunset"] .modal-box{background:rgba(255,255,255,.85);backdrop-filter:blur(20px)}
  body[data-theme="sunset"] .crud-input,
  body[data-theme="sunset"] .crud-textarea{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.5);color:var(--ink);backdrop-filter:blur(8px)}
  body[data-theme="sunset"] .crud-input:focus,
  body[data-theme="sunset"] .crud-textarea:focus{background:rgba(255,255,255,.88);border-color:var(--accent)}
  body[data-theme="sunset"] .modal-close{background:rgba(255,255,255,.6);color:var(--ink-3);backdrop-filter:blur(8px)}
  body[data-theme="sunset"] .search-box{background:rgba(255,255,255,.6);backdrop-filter:blur(8px)}
  body[data-theme="sunset"] .empty,
  body[data-theme="sunset"] .empty-hint{background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.3));border-color:rgba(255,255,255,.5);backdrop-filter:blur(8px)}
  body[data-theme="sunset"] .sidebar{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}

  /* ===== 智能体库模块样式 ===== */
  .agent-form-row{margin-bottom:12px;}
  .agent-form-row label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .agent-btn-row{display:flex;gap:10px;margin-top:12px;}
  .agent-btn-row .btn{flex:1;padding:10px;font-size:14px;font-weight:600;}
  .agent-btn-row .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* 加载动画 */
  .agent-spinner{
    width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:agentSpin .8s linear infinite;margin:0 auto;
  }
  @keyframes agentSpin{to{transform:rotate(360deg)}}
  @keyframes wsSpin{to{transform:rotate(360deg)}}

  /* 错误提示框 */
  .agent-error-box{
    background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(239,68,68,.05));
    border:1px solid rgba(239,68,68,.3);
    border-radius:10px;padding:12px 14px;
  }
  .agent-error-title{font-weight:700;color:#ef4444;margin-bottom:4px;font-size:14px;}
  .agent-error-msg{font-size:13px;color:var(--ink-2);line-height:1.5;}

  /* 结果元信息 */
  .agent-meta-row{display:flex;padding:4px 0;font-size:13px;line-height:1.6;}
  .agent-meta-label{font-weight:600;color:var(--ink-2);min-width:56px;flex-shrink:0;}
  .agent-meta-value{color:var(--ink);flex:1;}

  /* 角色卡片 */
  .agent-char-list{display:flex;flex-direction:column;gap:10px;}
  .agent-char-card{
    background:rgba(139,92,246,.06);
    border:1px solid rgba(139,92,246,.15);
    border-radius:10px;padding:12px;
  }
  .agent-char-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .agent-char-name{font-weight:700;color:var(--ink);font-size:15px;}
  .agent-char-role{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:6px;}
  .agent-copy-btn{padding:4px 10px;font-size:11px;}
  .agent-char-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .agent-tag{
    display:inline-block;padding:2px 8px;font-size:11px;font-weight:500;
    background:var(--tag-violet);color:var(--tag-violet-t);border-radius:6px;
  }
  .agent-char-prompt{
    background:rgba(255,255,255,.5);border-radius:8px;padding:8px 10px;
    font-size:12px;line-height:1.5;margin-top:6px;
  }
  .agent-char-label{font-weight:600;color:var(--ink-2);margin-bottom:4px;font-size:12px;}
  .agent-char-prompt-text{color:var(--ink);word-break:break-all;}
  .agent-char-voice{margin-top:6px;font-size:12px;color:var(--ink-2);}

  /* 分镜卡片 */
  .agent-shot-table{display:flex;flex-direction:column;gap:10px;}
  .agent-shot-card{
    background:rgba(245,158,11,.05);
    border:1px solid rgba(245,158,11,.15);
    border-radius:10px;overflow:hidden;
  }
  .agent-shot-head{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:8px 12px;background:rgba(245,158,11,.08);
    border-bottom:1px solid rgba(245,158,11,.1);
    font-size:12px;
  }
  .agent-shot-id{font-weight:700;color:var(--accent-warm);}
  .agent-shot-camera{color:var(--ink-2);}
  .agent-shot-dur{color:var(--ink-3);margin-left:auto;}
  .agent-shot-head .agent-copy-btn{margin-left:auto;}
  .agent-shot-body{padding:10px 12px;font-size:13px;}
  .agent-shot-row{display:flex;padding:3px 0;line-height:1.5;}
  .agent-shot-label{font-weight:600;color:var(--ink-2);min-width:50px;flex-shrink:0;font-size:12px;}
  .agent-shot-row > span:last-child{color:var(--ink);flex:1;}
  .agent-shot-dialogue{color:var(--accent)!important;font-style:italic;}
  .agent-shot-narration{color:var(--ink-2)!important;}
  .agent-shot-draw{
    margin-top:6px;padding:8px 10px;background:rgba(255,255,255,.5);
    border-radius:8px;font-size:12px;line-height:1.5;
  }
  .agent-shot-draw-text{color:var(--ink);word-break:break-all;margin-top:4px;}

  /* 响应式 */
  @media(max-width:768px){
    .agent-btn-row{flex-direction:column;}
    .agent-shot-head .agent-copy-btn{margin-left:0;}
  }

  /* ===== 主题选择器 ===== */
  /* ===== 新版主题选择器 ===== */
  .theme-selector-wrap{
    padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,.06);
    margin-top:auto;
  }
  .ts-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;gap:8px;
  }
  .ts-title{
    font-size:11px;font-weight:700;color:var(--side-text);
    letter-spacing:.5px;white-space:nowrap;
  }
  .ts-search{
    position:relative;flex:1;min-width:0;
    display:flex;align-items:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;padding:0 8px;
    transition:all .2s ease;
  }
  .ts-search:focus-within{
    background:rgba(255,255,255,.12);
    border-color:rgba(255,255,255,.25);
  }
  .ts-search-icon{
    font-size:11px;opacity:.6;flex-shrink:0;
    margin-right:4px;
  }
  .ts-search-input{
    flex:1;min-width:0;border:none;outline:none;
    background:transparent;color:var(--side-text);
    font-size:11px;padding:6px 0;
  }
  .ts-search-input::placeholder{color:var(--side-text-dim);opacity:.7}
  .ts-search-clear{
    font-size:10px;color:var(--side-text-dim);cursor:pointer;
    padding:2px 4px;border-radius:4px;flex-shrink:0;
    transition:all .15s ease;
  }
  .ts-search-clear:hover{color:var(--side-text);background:rgba(255,255,255,.1)}
  .ts-slider{
    position:relative;display:flex;align-items:center;gap:4px;
  }
  .ts-arrow{
    width:20px;height:28px;flex-shrink:0;
    border:none;border-radius:6px;
    background:rgba(255,255,255,.08);
    color:var(--side-text-dim);
    font-size:16px;font-weight:700;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s ease;
    padding:0;
  }
  .ts-arrow:hover{background:rgba(255,255,255,.15);color:var(--side-text)}
  .ts-arrow:disabled{opacity:.3;cursor:not-allowed}
  .ts-track{
    flex:1;display:flex;gap:10px;
    overflow-x:auto;overflow-y:hidden;
    scroll-behavior:smooth;
    padding:2px 0;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.15) transparent;
  }
  .ts-track::-webkit-scrollbar{height:3px}
  .ts-track::-webkit-scrollbar-track{background:transparent}
  .ts-track::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.15);
    border-radius:3px;transition:background .2s ease;
  }
  .ts-track::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
  .ts-swatch{
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:2px solid rgba(255,255,255,.18);
    flex-shrink:0;position:relative;
    transition:all .22s cubic-bezier(.34,1.56,.64,1);
    display:flex;align-items:center;justify-content:center;
  }
  .ts-swatch:hover{
    transform:scale(1.15);
    border-color:rgba(255,255,255,.45);
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .ts-swatch.active{
    transform:scale(1.08);
    border-color:#fff;
    box-shadow:0 0 0 2px rgba(255,255,255,.3),0 2px 10px rgba(0,0,0,.3);
  }
  .ts-swatch-check{
    color:#fff;font-size:13px;font-weight:800;opacity:0;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
    transform:scale(.6);transition:all .2s cubic-bezier(.34,1.56,.64,1);
  }
  .ts-swatch.active .ts-swatch-check{opacity:1;transform:scale(1)}
  .ts-swatch.filtered-out{
    opacity:.25;transform:scale(.85);pointer-events:none;
  }
  .ts-names{
    display:flex;gap:10px;justify-content:center;
    margin-top:8px;overflow:hidden;
  }
  .ts-names span{
    font-size:9.5px;color:var(--side-text-dim);
    width:34px;text-align:center;flex-shrink:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:opacity .2s ease,color .2s ease;
  }
  .ts-names span.active-name{color:var(--side-text);font-weight:600}

  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

  /* 分享弹窗 */
  .share-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);
    z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .share-mask.show{display:flex}
  .share-box{
    background:rgba(255,255,255,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-radius:20px;padding:24px 20px;max-width:340px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto;text-align:center;
    border:1px solid rgba(255,255,255,.6);

  .share-box h2{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px}
  .share-box .gsub{font-size:12px;color:var(--ink-3);margin-bottom:16px}
  #qrcodeBox{display:flex;justify-content:center;margin:10px auto 16px}
  #qrcodeBox img,#qrcodeBox canvas{border-radius:12px;border:1px solid var(--line)}
  .share-link-box{
    background:var(--content-bg);border-radius:12px;padding:10px 12px;margin:10px 0;
    font-size:11px;color:var(--ink-3);word-break:break-all;line-height:1.5;text-align:left;
    max-height:60px;overflow-y:auto;
  }
  .share-btns{display:flex;gap:8px;margin-top:12px}
  .share-btns button{flex:1}
  .share-close{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:none;background:var(--content-bg);color:var(--ink-2);font-size:15px;font-weight:600;cursor:pointer}
  .share-close:active{transform:scale(.97)}

  /* 连接成功提示 */
  .connect-toast{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:#fff;border-radius:20px;padding:28px 24px;max-width:320px;width:calc(100% - 40px);
    box-shadow:0 20px 60px rgba(0,0,0,.3);z-index:101;text-align:center;
    display:none;animation:pop .3s ease;
  }
  .connect-toast.show{display:block}
  .connect-toast .ct-icon{font-size:48px;margin-bottom:8px}
  .connect-toast .ct-title{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px}
  .connect-toast .ct-desc{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
  .connect-toast .ct-ws{background:var(--content-bg);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:14px}
  .connect-toast button{width:100%;padding:12px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .connect-toast button:active{transform:scale(.97)}

  .section{display:none;animation:fade .25s ease}
  .section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 空态 */
  .empty{text-align:center;padding:48px 20px;color:var(--ink-3);font-size:13px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(245,248,252,.5));border:1.5px dashed #d0dae6;transition:all .2s}
  .empty:hover{border-color:var(--accent);background:linear-gradient(135deg,rgba(248,250,255,.9),rgba(240,245,252,.7))}
  .empty .big{font-size:48px;margin-bottom:12px;filter:grayscale(.1);opacity:.9;animation:emptyBounce 2.5s ease-in-out infinite}
  .empty .empty-title{font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
  .empty .empty-desc{font-size:12px;color:var(--ink-3);line-height:1.6}
  @keyframes emptyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .empty-hint{
    text-align:center;padding:32px 20px;color:var(--ink-3);font-size:13px;
    border-radius:14px;margin:4px 0;
    background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(245,248,252,.4));
    border:1.5px dashed #d0dae6;
    position:relative;overflow:hidden;transition:all .2s;
  }
  .empty-hint:hover{border-color:var(--accent)}
  .empty-hint::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 30%,rgba(46,134,222,.06),transparent 70%);
    pointer-events:none;
  }
  .empty-hint .big{font-size:36px;margin-bottom:8px;filter:grayscale(.15);opacity:.8}
  .empty-hint .big-emoji{display:inline-block;animation:emptyWobble 4s ease-in-out infinite}

  /* CRUD 表单 */
  .crud-input{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;color:var(--ink);background:#f8fafd;outline:none;transition:border-color .15s;
    font-family:inherit;margin-bottom:8px;
  }
  .crud-input:focus{border-color:var(--accent);background:#fff}
  .crud-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;color:var(--ink);background:#f8fafd;outline:none;transition:border-color .15s;
    font-family:inherit;resize:vertical;min-height:60px;margin-bottom:8px;line-height:1.5}
  .crud-textarea:focus{border-color:var(--accent);background:#fff}
  .crud-label{font-size:12px;color:var(--ink-3);font-weight:600;display:block;margin-bottom:4px}
  .btn-sm{padding:4px 10px;font-size:11px;border-radius:8px}
  .btn-edit{background:var(--tag-blue);color:var(--tag-blue-t)}
  .btn-del{background:var(--tag-rose);color:var(--tag-rose-t)}

  /* ===== 通用列表项 ===== */
  .gitem{position:relative;overflow:hidden;border-radius:12px;margin-bottom:8px;border:1px solid var(--line);transition:box-shadow .2s,transform .2s,border-color .2s;background:var(--card)}
  .gitem:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:rgba(46,134,222,.2)}
  .swipe-content{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 12px 16px;transition:transform .25s ease;position:relative;z-index:1;touch-action:pan-y}
  .gitem.swiped .swipe-content{transform:translateX(-130px)}
  .gitem .gitem-accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;z-index:2}
  .gitem .ck{width:20px;height:20px;border-radius:6px;border:2px solid #c2cdda;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-top:1px}
  .gitem .ck.checked{background:var(--accent-2);border-color:var(--accent-2)}
  .gitem .ck.checked::after{content:"✓";color:#fff;font-size:12px;font-weight:800}
  .gitem .gbody{flex:1;min-width:0}
  .gitem .gt{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.4}
  .gitem .gt.done-t{text-decoration:line-through;color:var(--ink-3)}
  .gitem .gmeta{font-size:11px;color:var(--ink-3);margin:2px 0 0}
  .gitem .gdesc{font-size:12.5px;line-height:1.6;color:var(--ink-2);margin-top:3px}
  .gitem .gdesc.clamp{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;position:relative;padding-right:0}
  .gitem .gdesc.clamp::after{content:"展开 ⌄";position:absolute;right:0;bottom:0;background:#fff;padding:2px 8px;font-size:10px;color:var(--accent);font-weight:700;border-radius:10px;border:1px solid var(--line);box-shadow:0 1px 4px rgba(20,40,70,.08);transition:all .15s}
  .gitem .gdesc.clamp:hover::after{background:var(--accent);color:#fff;border-color:var(--accent)}
  .gitem.expanded .gdesc.clamp{-webkit-line-clamp:unset;line-clamp:unset;overflow:visible}
  .gitem.expanded .gdesc.clamp::after{content:"收起 ⌃"}
  .gitem .gfields{margin-top:4px;font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
  .gitem .gfields span b{color:var(--ink-3);font-weight:600}
  .gitem .gtags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .gitem .gcopy{margin-top:8px}
  .gitem .copy-btn{padding:5px 12px;font-size:11.5px;border-radius:16px;background:linear-gradient(135deg,#eef5ff,#e8faf2);color:var(--accent);border:1px solid #d6e6f7}
  .gitem .copy-btn:active{transform:scale(.94)}
  .prompt-clickable{cursor:pointer}
  /* 提示词详情弹窗 */
  .prompt-modal-box{
    background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + var(--safe-bottom));max-width:520px;width:100%;
    max-height:80vh;overflow-y:auto;animation:slideUp .3s ease;-webkit-overflow-scrolling:touch;
  }
  .prompt-modal-topbar{display:flex;gap:8px;margin-bottom:14px}
  .prompt-modal-topbar button{
    flex:1;padding:10px 0;border:none;border-radius:12px;font-size:13px;font-weight:700;
    cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .prompt-modal-topbar button:active{transform:scale(.97)}
  .pmt-copy{background:#eef5ff;color:var(--accent)}
  .pmt-edit{background:#f0fdf4;color:var(--accent-2)}
  .pmt-del{background:#fef0f0;color:#e74c3c}
  .prompt-modal-title{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:6px;word-break:break-word}
  .prompt-modal-tag{margin-bottom:12px}
  .prompt-modal-desc{
    font-size:13.5px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap;
    background:#f8fafc;border-radius:12px;padding:14px;border:1px solid var(--line);
    word-break:break-word;
  }
  /* 车辆图片 */
  .car-img-wrap{width:100%;height:160px;border-radius:10px;overflow:hidden;margin-bottom:8px;background:linear-gradient(135deg,#f0f4f8,#e8eef5);position:relative;display:flex;align-items:center;justify-content:center}
  .car-img-wrap img{width:100%;height:100%;object-fit:contain;display:block;padding:4px}
  .car-img-wrap .car-img-loading{font-size:28px;animation:pulse 1.5s ease-in-out infinite}
  .car-img-wrap .car-img-fallback{font-size:48px;opacity:.5}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  /* 标签筛选栏 */
  /* ===== 分类筛选器（升级版：滑动+搜索） ===== */
  .tag-filter-wrap{
    margin-bottom:12px;
  }
  .tf-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;gap:8px;
  }
  .tf-title{
    font-size:12px;font-weight:700;color:var(--ink);
    letter-spacing:.3px;display:flex;align-items:center;gap:6px;
  }
  .tf-title .count{
    font-size:10px;font-weight:500;color:var(--ink-3);
    background:var(--content-bg);padding:2px 6px;border-radius:10px;
  }
  .tf-search{
    position:relative;display:flex;align-items:center;
    background:var(--content-bg);
    border:1px solid var(--line);
    border-radius:8px;padding:0 8px;
    transition:all .2s ease;
    min-width:120px;max-width:180px;flex:1;
  }
  .tf-search:focus-within{
    border-color:var(--accent);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .tf-search-icon{
    font-size:11px;opacity:.5;flex-shrink:0;margin-right:4px;
  }
  .tf-search-input{
    flex:1;min-width:0;border:none;outline:none;
    background:transparent;color:var(--ink);
    font-size:11px;padding:5px 0;
  }
  .tf-search-input::placeholder{color:var(--ink-3);opacity:.7}
  .tf-search-clear{
    font-size:10px;color:var(--ink-3);cursor:pointer;
    padding:2px 4px;border-radius:4px;flex-shrink:0;
    transition:all .15s ease;display:none;
  }
  .tf-search-clear:hover{color:var(--ink);background:var(--line)}
  .tf-slider{
    position:relative;display:flex;align-items:stretch;gap:4px;
  }
  .tf-arrow{
    width:22px;flex-shrink:0;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    color:var(--ink-3);
    font-size:16px;font-weight:700;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .2s ease;
    padding:0;
  }
  .tf-arrow:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-hover)}
  .tf-arrow:disabled{opacity:.4;cursor:not-allowed}
  .tf-track{
    flex:1;display:flex;gap:6px;
    overflow-x:auto;overflow-y:hidden;
    scroll-behavior:smooth;
    padding:1px 0 3px;
    scrollbar-width:thin;
    scrollbar-color:color-mix(in srgb, var(--accent) 30%, transparent) transparent;
    -webkit-overflow-scrolling:touch;
  }
  .tf-track::-webkit-scrollbar{height:3px}
  .tf-track::-webkit-scrollbar-track{background:transparent}
  .tf-track::-webkit-scrollbar-thumb{
    background:color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius:3px;transition:background .2s ease;
  }
  .tf-track::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb, var(--accent) 45%, transparent)}
  .tf-btn{
    padding:5px 12px;font-size:12px;font-weight:600;
    border-radius:16px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-2);
    cursor:pointer;transition:all .18s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;flex-shrink:0;
  }
  .tf-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .tf-btn.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
    box-shadow:0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .tf-btn.filtered-out{
    opacity:.3;transform:scale(.92);pointer-events:none;
  }
  .gitem .actions{display:flex;gap:6px;flex-shrink:0;align-self:flex-start;opacity:0;transition:opacity .15s}
  .gitem:hover .actions{opacity:1}
  @media(max-width:768px){.gitem .actions{opacity:1}}
  .gitem .actions .btn-sm{padding:4px 8px}

  /* ===== 总览仪表盘 ===== */
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .ov-stat{background:#fff;border-radius:12px;padding:14px;border:1px solid var(--line);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
  .ov-stat:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .ov-stat:active{transform:scale(.98)}
  .ov-stat .ov-icon{font-size:22px;margin-bottom:6px}
  .ov-stat .ov-num{font-size:28px;font-weight:800;color:var(--ink);line-height:1}
  .ov-stat .ov-label{font-size:11px;color:var(--ink-3);margin-top:4px}
  .ov-stat .ov-bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 3px 3px 0}
  .ov-donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ov-donut-wrap svg{flex-shrink:0}
  .ov-legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
  .ov-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
  .ov-legend-item:hover{opacity:.7}
  .ov-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .ov-legend-val{margin-left:auto;font-weight:700;color:var(--ink-2)}
  .ov-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer}
  .ov-bar-row:hover{opacity:.8}
  .ov-bar-label{font-size:12px;color:var(--ink-2);width:70px;flex-shrink:0;text-align:right}
  .ov-bar-track{flex:1;height:22px;background:#f0f4f8;border-radius:6px;overflow:hidden;position:relative}
  .ov-bar-fill{height:100%;border-radius:6px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .ov-progress-ring{display:inline-block;position:relative}
  .ov-progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
  .ov-progress-text .ov-pct{font-size:20px;font-weight:800;color:var(--ink)}
  .ov-progress-text .ov-pct-label{font-size:10px;color:var(--ink-3)}
  .ov-nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .ov-nav-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);text-align:center}
  .ov-nav-btn:hover{border-color:var(--accent);background:#f8faff;transform:translateY(-3px);box-shadow:0 6px 16px rgba(46,134,222,.15)}
  .ov-nav-btn:active{transform:scale(.95)}
  .ov-nav-btn .ov-nav-ico{font-size:22px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
  .ov-nav-btn:hover .ov-nav-ico{transform:scale(1.15) rotate(-5deg)}
  .ov-nav-btn .ov-nav-name{font-size:11.5px;color:var(--ink-2);font-weight:600}
  .ov-nav-btn .ov-nav-count{font-size:10px;color:var(--ink-3)}

  /* ===== 灵感收藏卡片 ===== */
  .inspo-card{
    position:relative;border-radius:14px;margin-bottom:12px;overflow:hidden;
    background:#ffffff;
    border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(20,40,70,.04);
    transition:transform .2s,box-shadow .2s,border-color .2s;
  }
  .inspo-card:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(20,40,70,.08);
    border-color:#c9d6e5;
  }
  .inspo-card .inspo-quote{
    position:absolute;top:8px;right:12px;font-size:42px;opacity:.06;line-height:1;
    font-family:Georgia,serif;font-weight:900;pointer-events:none;
  }
  .inspo-card .inspo-body{padding:16px 16px 12px;position:relative}
  .inspo-card .inspo-title{
    font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.55;cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    padding-right:24px;
  }
  .inspo-card .inspo-desc{
    font-size:13px;line-height:1.75;color:var(--ink-2);margin-top:10px;
    cursor:pointer;position:relative;
  }
  .inspo-card .inspo-desc.clamp{
    display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .inspo-card .inspo-desc.clamp::after{
    content:"展开";position:absolute;right:0;bottom:0;
    background:linear-gradient(90deg,transparent,#fff 40%);
    padding:0 0 0 24px;font-size:11px;color:var(--accent);font-weight:700;
  }
  .inspo-card.expanded .inspo-desc.clamp{-webkit-line-clamp:unset;line-clamp:unset;overflow:visible}
  .inspo-card.expanded .inspo-desc.clamp::after{content:"收起"}
  .inspo-card .inspo-footer{
    display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;
    border-top:1px solid var(--line);
  }
  .inspo-card .inspo-tag{
    display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;
    font-size:11px;font-weight:700;cursor:pointer;
    background:var(--tag-blue-bg);color:var(--accent);
  }
  .inspo-card .inspo-time{
    font-size:11px;color:var(--ink-3);margin-left:auto;font-weight:500;
    display:flex;align-items:center;gap:3px;
  }
  .inspo-card .inspo-copy{
    display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:12px;
    font-size:11px;font-weight:600;cursor:pointer;
    background:var(--tag-mint-bg);color:var(--accent-2);
    transition:all .15s;
  }
  .inspo-card .inspo-copy:hover{filter:brightness(1.05)}
  .inspo-card .inspo-copy:active{transform:scale(.94)}
  /* 灵感卡片左滑操作 */
  .inspo-card .swipe-content{padding:0}
  .inspo-card .gitem{border-bottom:none}
  /* 灵感列表容器 */
  #inspoList .gitem{border-radius:12px;margin-bottom:8px;padding:0}

  /* 激励语动态效果 */
  .quote-ico{display:inline-block;animation:qFloat 3s ease-in-out infinite}
  @keyframes qFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(8deg)}}
  .quote-text{background:linear-gradient(90deg,var(--ink),var(--accent),var(--accent-2),var(--ink));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:qShine 5s linear infinite}

  /* 随机激励语滚动条 */
  .quote-bar{background:linear-gradient(135deg,var(--side-1),var(--side-2));border-radius:12px;padding:10px 14px;margin-bottom:14px;overflow:hidden;position:relative;display:flex;align-items:center;gap:8px;box-shadow:0 3px 12px rgba(20,40,70,.12)}
  .quote-bar .qb-ico{font-size:16px;flex-shrink:0;animation:qFloat 3s ease-in-out infinite}
  .quote-bar .qb-scroll{flex:1;overflow:hidden;position:relative;height:20px}
  .quote-bar .qb-text{position:absolute;white-space:nowrap;font-size:13px;font-weight:600;color:#e8f0fa;line-height:20px;animation:qbScroll 18s linear infinite}
  .quote-bar .qb-text .qb-from{color:var(--side-text-dim);font-size:11px;font-weight:500;margin-left:6px}
  .quote-bar.loading .qb-text{animation:none;opacity:.6}
  @keyframes qbScroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
  @keyframes qShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}

  /* ⋯ 更多操作按钮 */
  .item-more{
    width:28px;height:28px;border:none;border-radius:8px;background:transparent;
    color:var(--ink-3);font-size:18px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .12s;
  }
  .item-more:active{background:var(--line)}
  /* 弹出操作菜单 */
  .item-menu{
    position:fixed;z-index:9999;background:#fff;border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden;min-width:120px;
    opacity:0;transform:scale(.9);pointer-events:none;transition:all .12s;
  }
  .item-menu.show{opacity:1;transform:scale(1);pointer-events:auto}
  .item-menu .im-btn{
    display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;
    border:none;background:transparent;font-size:14px;color:var(--ink);
    cursor:pointer;font-family:inherit;transition:background .1s;
  }
  .item-menu .im-btn:active{background:var(--line)}
  .item-menu .im-btn.im-edit{color:#3b82f6}
  .item-menu .im-btn.im-del{color:#ef4444}
  .item-menu .im-divider{height:1px;background:var(--line)}

  /* 通用弹窗 */
  .modal-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:98;
    display:none;align-items:flex-end;justify-content:center;padding:0;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .modal-mask.show{display:flex}
  .modal-box{
    background:rgba(255,255,255,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-radius:20px 20px 0 0;padding:20px 18px calc(20px + var(--safe-bottom));max-width:460px;width:100%;
    max-height:85vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.34,1.56,.64,1);-webkit-overflow-scrolling:touch;
    border-top:1px solid rgba(255,255,255,.6);
  }
  @keyframes slideUp{from{transform:translateY(100%);opacity:.5}to{transform:translateY(0);opacity:1}}
  .modal-box h3{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .modal-box .modal-close{margin-left:auto;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,.06);border:none;font-size:16px;cursor:pointer;color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
  .modal-box .modal-close:hover{background:rgba(0,0,0,.1);transform:rotate(90deg)}
  .modal-box .modal-save{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;pointer-events:auto;position:relative;z-index:1;-webkit-tap-highlight-color:transparent;transition:all .15s;box-shadow:0 4px 12px rgba(46,134,222,.3)}
  .modal-box .modal-save:active{transform:scale(.97)}
  .modal-box .modal-save:hover{filter:brightness(1.05);box-shadow:0 6px 16px rgba(46,134,222,.4)}

  /* 点击复制 */
  .copyable{cursor:pointer;transition:background .15s;border-radius:6px;padding:2px 4px;margin:-2px -4px}
  .copyable:active{background:rgba(0,0,0,.06)}
  @keyframes cp-fade{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

  /* 语音输入 */
  .voice-row{display:flex;gap:8px;align-items:center;margin:6px 0 0}
  .btn-voice{
    flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;
    background:var(--accent);color:#fff;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .btn-voice.recording{background:#e74c3c;animation:pulse-rec 1s infinite}
  @keyframes pulse-rec{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .voice-hint{font-size:12px;color:var(--ink-3);line-height:1.4}
  .voice-hint.recording{color:#e74c3c;font-weight:700}

  /* 数据管理 */
  .data-mgr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .data-mgr .btn{font-size:12px}

  /* 云同步状态 */
  .sync-badge{
    position:fixed;top:calc(var(--safe-top,0px) + 8px);right:14px;z-index:61;
    display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;
    font-size:11px;font-weight:700;cursor:pointer;
    background:rgba(255,255,255,.15);backdrop-filter:blur(8px);color:#fff;
    transition:background .2s;
  }
  .sync-badge.off{background:rgba(255,255,255,.1);color:var(--side-text-dim)}
  .sync-badge.syncing{background:rgba(46,134,222,.3);color:#fff}
  .sync-badge.online{background:rgba(26,188,156,.25);color:#aef5e0}
  .sync-badge.error{background:rgba(231,76,60,.3);color:#ffd0c8}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
  .sync-badge.syncing .sync-dot{animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .cloud-config-row{margin-bottom:10px}
  .cloud-config-row label{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:4px}
  .cloud-status-box{padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .cloud-status-box.ok{background:var(--tag-mint);color:var(--tag-mint-t)}
  .cloud-status-box.off{background:#f1f5fa;color:var(--ink-3)}
  .cloud-status-box.err{background:var(--tag-rose);color:var(--tag-rose-t)}

  /* 移动端抽屉 */
  .menu-btn{display:none}
  .overlay{display:none}

  @media(max-width:768px){
    .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;font-size:20px;cursor:pointer}
    .sidebar{
      position:fixed;top:var(--statusbar-h);left:0;bottom:0;width:240px;z-index:60;
      transform:translateX(-100%);transition:transform .28s ease;
      box-shadow:4px 0 20px rgba(0,0,0,.18);
    }
    .sidebar.open{transform:translateX(0)}
    .overlay{position:fixed;top:var(--statusbar-h);left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:55}
    .overlay.show{display:block}
    .content-inner{padding:14px 14px calc(90px + var(--safe-bottom))}
  }

  /* ============================== */
  /* ====== 动态效果增强 ========== */
  /* ============================== */

  /* 1. 状态栏流光渐变 */
  .statusbar{
    background:linear-gradient(90deg,var(--side-1),var(--side-2),var(--side-1));
    background-size:200% 100%;
    animation:statusFlow 8s ease infinite;
  }
  @keyframes statusFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  /* 2. 侧栏背景微光呼吸 */
  @media(min-width:769px){
    .sidebar{position:relative}
    .sidebar::before{
      content:'';position:absolute;top:0;left:0;right:0;bottom:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(46,134,222,.12),transparent 60%);
      pointer-events:none;animation:sideGlow 6s ease-in-out infinite;
    }
    /* 右侧分割线 */
    .sidebar::after{
      content:'';position:absolute;top:0;right:0;bottom:0;width:1px;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.08) 20%,rgba(0,0,0,.08) 80%,transparent);
      pointer-events:none;
    }
  }
  @keyframes sideGlow{0%,100%{opacity:.4}50%{opacity:.8}}

  /* 3. 导航项激活动画 - 左侧指示条弹入 */
  .nav-item.active::before{
    animation:navBarIn .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes navBarIn{
    from{height:0;opacity:0}
    to{height:18px;opacity:1}
  }
  /* 导航项点击涟漪 */
  .nav-item{overflow:hidden;position:relative}
  .nav-item .ripple{
    position:absolute;border-radius:50%;background:rgba(255,255,255,.3);
    transform:scale(0);animation:ripple .5s ease-out;pointer-events:none;
  }
  @keyframes ripple{to{transform:scale(3);opacity:0}}

  /* 4. 卡片入场动画 */
  .card{
    animation:cardIn .4s cubic-bezier(.4,0,.2,1) both;
    transition:transform .15s,box-shadow .15s;
  }
  .card:nth-child(1){animation-delay:0s}
  .card:nth-child(2){animation-delay:.06s}
  .card:nth-child(3){animation-delay:.12s}
  .card:nth-child(4){animation-delay:.18s}
  .card:nth-child(5){animation-delay:.24s}
  .card:nth-child(6){animation-delay:.30s}
  .card:nth-child(7){animation-delay:.36s}
  .card:nth-child(8){animation-delay:.42s}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(16px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  /* 跑车弹跳动画 */
  @keyframes carBounce{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-4px) rotate(-2deg)}
    50%{transform:translateY(0) rotate(0)}
    75%{transform:translateY(-2px) rotate(1deg)}
  }
  /* 卡片悬浮微交互 */
  @media(hover:hover){
    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(20,40,70,.10),0 2px 6px rgba(20,40,70,.06);
    }
  }

  /* 5. 页面标题入场 */
  .page-head{
    animation:titleIn .4s ease both;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateX(-12px)}
    to{opacity:1;transform:translateX(0)}
  }

  /* 6. 进度条流光 */
  .progress{position:relative;overflow:hidden}
  .progress i{position:relative}
  .progress i::after{
    content:'';position:absolute;top:0;left:0;right:0;bottom:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    background-size:200% 100%;
    animation:shimmer 2s linear infinite;
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* 7. 待办勾选动画 */
  .todo-item .ck{transition:all .2s cubic-bezier(.4,0,.2,1)}
  .todo-item.done .ck{animation:checkPop .3s ease}
  @keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}

  /* 8. 按钮 ripple 涟漪 */
  .btn{position:relative;overflow:hidden}
  .btn .ripple{
    position:absolute;border-radius:50%;background:rgba(255,255,255,.35);
    transform:scale(0);animation:ripple .5s ease-out;pointer-events:none;
  }

  /* 9. 添加按钮脉冲提示 */
  .btn-accent{
    position:relative;
  }
  .btn-accent::after{
    content:'';position:absolute;inset:0;border-radius:inherit;
    box-shadow:0 0 0 0 rgba(46,134,222,.4);
    animation:btnPulse 2.5s ease-out infinite;pointer-events:none;
  }
  @keyframes btnPulse{
    0%{box-shadow:0 0 0 0 rgba(46,134,222,.3)}
    70%{box-shadow:0 0 0 8px rgba(46,134,222,0)}
    100%{box-shadow:0 0 0 0 rgba(46,134,222,0)}
  }

  /* 10. 签到日历格子动画 */
  .cal-grid .d.checked{animation:checkPop .3s ease}

  /* 11. 弹窗入场增强 */
  .modal-box{animation:modalIn .3s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes modalIn{
    from{opacity:0;transform:translateY(30px) scale(.9)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* 12. 浮动菜单按钮呼吸光晕 */
  .menu-fab{
    animation:fabGlow 3s ease-in-out infinite;
  }
  @keyframes fabGlow{
    0%,100%{box-shadow:0 4px 18px rgba(46,134,222,.45)}
    50%{box-shadow:0 4px 28px rgba(46,134,222,.65),0 0 0 6px rgba(46,134,222,.08)}
  }

  /* 13. 头像渐变旋转光 */
  .side-head .avatar{
    position:relative;
  }
  .side-head .avatar::before{
    content:'';position:absolute;inset:-3px;border-radius:inherit;
    background:conic-gradient(from 0deg,var(--accent),var(--accent-2),var(--accent-warm),var(--accent));
    animation:avatarSpin 4s linear infinite;z-index:-1;
    filter:blur(2px);opacity:.6;
  }
  @keyframes avatarSpin{to{transform:rotate(360deg)}}

  /* 14. 列表项滑入 */
  .gitem{
    animation:itemSlideIn .3s ease both;
  }
  .gitem:nth-child(1){animation-delay:0s}
  .gitem:nth-child(2){animation-delay:.04s}
  .gitem:nth-child(3){animation-delay:.08s}
  .gitem:nth-child(4){animation-delay:.12s}
  .gitem:nth-child(5){animation-delay:.16s}
  .gitem:nth-child(6){animation-delay:.20s}
  .gitem:nth-child(7){animation-delay:.24s}
  .gitem:nth-child(8){animation-delay:.28s}
  @keyframes itemSlideIn{
    from{opacity:0;transform:translateX(10px)}
    to{opacity:1;transform:translateX(0)}
  }

  /* 15. 标签 pill 微弹入 */
  .pill{animation:pillIn .3s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pillIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

  /* 16. 内容区域切换淡入 */
  .content-inner{
    animation:contentFade .35s ease forwards;
    min-height:100%;
  }
  @keyframes contentFade{
    from{opacity:0}
    to{opacity:1}
  }

  /* 17. ⋯ 菜单弹出增强 */
  .item-menu{
    transform-origin:top right;
  }
  .item-menu.show{
    animation:menuPop .18s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes menuPop{
    from{opacity:0;transform:scale(.85) translateY(-4px)}
    to{opacity:1;transform:scale(1) translateY(0)}
  }

  /* 18. 空状态提示动画 */
  .empty-hint{animation:emptyFloat 3.5s ease-in-out infinite}
  @keyframes emptyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes emptyWobble{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-5deg) scale(1.05)}75%{transform:rotate(5deg) scale(1.05)}}

  /* 19. 连接成功提示增强 */
  .connect-toast{animation:connectPop .4s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes connectPop{
    from{opacity:0;transform:translate(-50%,-50%) scale(.8)}
    to{opacity:1;transform:translate(-50%,-50%) scale(1)}
  }

  /* 20. 侧栏浮粒子 */
  .sidebar-particles{
    position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;
  }
  .sidebar-particles span{
    position:absolute;width:4px;height:4px;border-radius:50%;
    background:rgba(255,255,255,.12);
    animation:particleFloat linear infinite;
  }
  @keyframes particleFloat{
    from{transform:translateY(100vh) translateX(0);opacity:0}
    10%{opacity:1}
    90%{opacity:1}
    to{transform:translateY(-20px) translateX(15px);opacity:0}
  }

  /* 减少动画偏好 */
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>

    {title:'角色对话模拟',desc:'请扮演以下角色与我对话：\n\n角色名：[输入角色名]\n角色设定：[如 一个毒舌但热心的前辈/一个傲娇的搭档]\n场景：[如 刚搞砸了项目/准备辞职]\n我的身份：[如 新人同事]\n\n要求：\n1. 完全进入角色，用该角色的语气说话\n2. 每次回复不超过3句话\n3. 保持角色性格一致\n4. 根据我的回复自然推进对话\n请先用角色身份跟我打招呼。',tag:'人物角色板'},
    {title:'故事大纲生成',desc:'请帮我生成一个故事大纲：\n\n类型：[如 悬疑/爱情/科幻/冒险]\n主题：[如 复仇/成长/救赎]\n预计篇幅：[如 短篇/中篇/长篇]\n\n请输出：\n1. 一句话简介（30字以内）\n2. 核心冲突（主角想要什么，什么阻止他）\n3. 三幕式结构：\n   - 开端（设定+激励事件）\n   - 发展（3个递进的障碍）\n   - 高潮与结局\n4. 主要人物列表（含动机）\n5. 故事的主题升华',tag:'分镜故事版'},
    {title:'情节脑暴器',desc:'我正在写一个故事，卡住了，请帮我脑暴接下来的情节：\n\n当前情况：[描述故事进展到哪里]\n主角的目标：[描述]\n已出现的关键道具/线索：[列出]\n想要的基调：[如 紧张/温馨/反转]\n\n请给出5个不同的情节走向，每个包含：\n1. 简要描述（2句话）\n2. 带来的戏剧张力\n3. 意外程度（1-5星）\n4. 对后续走向的影响',tag:'分镜故事版'},

    {title:'手绘线稿-调度分镜故事板·人物从冰箱取食材到烹饪到端菜上桌的连贯动作调度图',desc:'【类型】手绘线稿-调度分镜故事板\n【标题】人物从冰箱取食材到烹饪到端菜上桌的连贯动作调度图\n【布局】3×2（共6格）\n【风格】\n· 美术风格：手绘草稿速写风\n· 线条风格：松散随性草稿线，黑白单色线稿\n· 角色风格：火柴人表示人物角色\n· 标注方式：少量彩色手绘箭头标注运动轨迹\n· 文字规则：分镜图例下方图例说明\n【要求】\n· 线条质量：简单铅笔线条勾勒，不追求精细光影和色彩\n· 核心重点：突出角色动作与镜头节奏，高效传递人物和场景关系\n· 标记含义：\n  - X_marker：固定点或关键站位，如冰箱、灶台、餐桌位置\n  - perspective_box：用带消失点的方框表明厨房转角、灶台或餐厅一角，体现空间感\n· 箭头含义：\n  - red_arrow：机位运动\n  - blue_arrow：角色运动轨迹\n  - green_mark：互动关系\n  - orange_mark：效果/冲击力\n  - purple_mark：音效/标注\n\n【分镜镜头（共6个）】\n▶ P01 / 远景/推拉 / 从冰箱取食材\n  画面：火柴人站在冰箱前，打开冰箱门取出食材，红色箭头标示机位推拉，蓝色箭头标示手部取物轨迹，X标记冰箱位置\n▶ P02 / 中景/跟拍 / 从冰箱走向灶台\n  画面：火柴人怀抱食材向灶台移动，蓝色箭头标示行进路径，透视框标示厨房转角空间，X标记灶台位置\n▶ P03 / 中近景/固定 / 食材下锅烹饪\n  画面：火柴人站在灶台前将食材放入锅中，绿色标记标示手与锅的互动关系，橙色标记标示热气或油花冲击力，紫色标记标示滋啦声\n▶ P04 / 特写/推镜 / 烹饪完成装盘\n  画面：火柴人用锅铲将菜盛入盘中，红色箭头标示镜头推进，蓝色箭头标示装盘动作轨迹，X标记灶台与餐盘位置\n▶ P05 / 中景/跟拍 / 端菜走向餐桌\n  画面：火柴人双手端盘向餐桌移动，蓝色箭头标示移动轨迹，透视框标示餐厅一角，X标记餐桌位置\n▶ P06 / 中景/固定 / 将菜摆上餐桌\n  画面：火柴人将菜盘放上餐桌，绿色标记标示手与餐桌的互动，紫色标记标示放盘音效，X标记餐桌固定位置\n\n【图例说明】\n· red_arrow：机位运动\n· blue_arrow：角色运动轨迹\n· green_mark：互动关系\n· orange_mark：效果/冲击力\n· purple_mark：音效/标注\n· x_marker：固定点/关键站位',tag:'分镜故事版'},
    {title:'手绘线稿-动作分镜故事板·UFC八角笼两位格斗选手激烈搏斗',desc:'【类型】手绘线稿-动作分镜故事板\n【标题】UFC八角笼两位格斗选手激烈搏斗\n【布局】4×3（共12格）\n【风格】\n· 美术风格：铅笔手绘草稿速写风\n· 线条风格：快速粗犷的铅笔线条，少量彩色手绘线条\n· 角色风格：拳法格斗家与腿法格斗家，突出骨肉碰撞冲击力与肌肉紧绷爆发力\n· 标注方式：彩色箭头标注引导线\n【要求】\n· 线条质量：快速粗犷，不追求精细光影和色彩\n· 核心重点：突出角色动作张力与镜头节奏，传递八角笼内贴身肉搏的窒息感和爆发力\n· 镜头标注：每个镜头标注镜头类型、表演提示、音效说明\n· 箭头含义：\n  - red_arrow：身体运动/攻击与受击的动势方向\n  - blue_arrow：摄影机运动\n  - green_mark：取景/构图笔记\n  - orange_mark：灯光方向（擂台顶灯、笼网反光）\n  - purple_mark：声音（拳套击打声、观众呐喊声）/痛感反馈强调\n  - black_text：简短镜头笔记和面板标签\n\n【分镜镜头（共12个）】\n▶ P01 / 手持镜头/广角 / 回合开始对峙\n  画面：两人位于笼心对峙，红色箭头标出拳法家前压动势，蓝色箭头标示手持镜头轻微晃动，橙色标记笼顶灯光方向\n  表演：拳法格斗家沉步逼近，腿法格斗家侧向移动试探\n  音效：观众低吼、笼内脚步声\n▶ P02 / 快速推拉/中景 / 拳法家重拳破防\n  画面：红色箭头标示出拳动势与受击方向，紫色标记击打声与痛感反馈，蓝色箭头标示镜头快速前推\n  表演：拳法家后手重拳击穿腿法家防守\n  音效：拳套击打闷响\n▶ P03 / 过肩镜头 / 腿法家低扫反击\n  画面：绿色框构图突出扫腿路径，红色箭头标示腿部动势，橙色标记笼网反光方向\n  表演：腿法家借笼网反弹低扫拳法家前腿\n  音效：扫踢撞击声\n▶ P04 / 动态倾斜镜头 / 腿法家凌空飞踢\n  画面：红色箭头标示飞踢轨迹与受击方向，蓝色箭头标示镜头倾斜跟随，紫色标记命中音效\n  表演：腿法家蹬地起跳，凌空飞踢拳法家头部\n  音效：破空声+命中声\n▶ P05 / 打击瞬间特写 / 上勾拳命中下巴\n  画面：红色箭头标示上勾拳动势与头部后仰方向，橙色标记灯光，紫色标记痛感反馈\n  表演：拳法家沉身蓄力后上勾拳击中腿法家下巴\n  音效：骨肉碰撞脆响\n▶ P06 / 低角度仰拍 / 腿法家笼网借力反弹\n  画面：蓝色箭头标示摄影机上摇，红色箭头标示反弹前冲动势，绿色框突出笼网构图\n  表演：腿法家被推至笼网，踏网反弹前冲\n  音效：笼网震动声\n▶ P07 / 手持跟拍/中近景 / 拳法家连续重拳压制\n  画面：红色箭头标示连续出拳动势，紫色标记连续打击声，黑色文本标注连击节奏\n  表演：拳法家连续左右重拳轰击对手躯干\n  音效：连续击打闷响\n▶ P08 / 快速摇移 / 腿法家后旋踢反击\n  画面：蓝色箭头标示镜头快速摇移跟随旋踢，红色箭头标示旋踢轨迹，绿色框取景旋踢范围\n  表演：腿法家突然后旋踢扫向拳法家头部\n  音效：破空声+落空\n▶ P09 / 特写/打击瞬间 / 膝撞命中腹部\n  画面：红色箭头标示膝撞动势与受击方向，橙色标记灯光，紫色标记痛感反馈\n  表演：拳法家箍颈顶膝重创腿法家腹部\n  音效：膝撞闷响+痛呼\n▶ P10 / 过肩镜头/中景 / 腿法家抱摔反击\n  画面：红色箭头标示抱摔轨迹，蓝色箭头标示镜头下沉跟随，绿色框突出抱摔构图\n  表演：腿法家下潜抱腿将拳法家摔向地面\n  音效：身体砸地声\n▶ P11 / 地面缠斗特写 / 地面压制与肘击\n  画面：红色箭头标示肘击动势，橙色标记地面反光，紫色标记肘击声与观众声\n  表演：拳法家上位压制，地面肘击腿法家\n  音效：肘击声+观众呐喊\n▶ P12 / 广角/拉镜 / 回合结束铃响\n  画面：蓝色箭头标示镜头后拉，红色箭头标示两人分离动势，紫色标记铃声，黑色文本标注回合结束\n  表演：两人分开，筋疲力尽靠笼而立\n  音效：回合结束铃声\n\n【图例说明】\n· red_arrow：身体运动/攻击与受击的动势方向\n· blue_arrow：摄影机运动\n· green_mark：取景/构图笔记\n· orange_mark：灯光方向\n· purple_mark：声音（打击声）/痛感反馈',tag:'分镜故事版'},

    {title:'手绘线稿-导演轨道故事板·导演轨道分镜故事板模板',desc:'【类型】手绘线稿-导演轨道故事板\n【标题】导演轨道分镜故事板模板\n【风格】\n【要求】\n【场景包】\n· premise：（场景前提，一句话说明情境）\n· location：（环境描述，包含地形、建筑、光线等）\n· start_end：（起始状态）->（关键动作转折点）->（结束状态）\n· action_chain：（按时间顺序列出关键动作节点，用->连接）\n· props_fx_state：（核心道具状态）；（特效表现规则）\n· must_read：（核心动作逻辑/视觉规则）\n【角色设定】\n· C1 （主角名）：（体型、轮廓、标志性特征、动作方式）\n· C2 （对手名）：（体型、轮廓、标志性特征、动作方式）\n【身份一致性】所提供的参考图为角色外观的唯一依据。本分镜调度、动作、镜头朝向、视线、道具位置等，切勿根据分镜中的示意图来重新设计、合并、复制。\n【纯净度规则】\n· 风格：中性的编辑类速写风格：线条简洁，轮廓细致（铅笔/墨水质感），大量留白，仅少量浅灰调用于景深\n· 标题栏：分镜编号、情节节点名称及镜头参数标签须置于上方的标题栏内\n· 禁止：画面内部禁止：文字、箭头、标签、对话框、LOGO、水印、UI、残影、重叠身形、色块、彩色渲染、厚重阴影或高完成度渲染图\n【情感曲线】（情绪/张力递进词链，如：瞬间碰撞 -> 识别 -> 加速 -> 僵持 -> 恢复 -> 突击 -> 反击 -> 重置）\n【风格锁定】\n· art_style：（美术风格描述）\n· style_forbidden：（负面清单）\n· fx：（特效类型与表现方式）\n· fx_forbidden：（负面清单）\n· environment：（环境特征）\n· environment_avoid：（偏差方向）\n【空间连续性】\n· character_orientation：（主角）位于（方向），（对手）位于（方向）；保持180度轴线关系\n· reused_references：（关键场景元素列表）\n· allowed_variations：（摄像机角度/距离/特效形态等可变项）\n· accumulated_traces：（仅在指定分镜后出现的特定痕迹）\n【导演轨道】\n· （轨道名称）：底部的动态分镜条与分镜格列对齐。仅使用（N）条图形轨道。（轨道名称）使用（水平色块/垂直柱状/曲线），并配以微型紧凑标签。每个单元格均为小型图形块、柱状图或曲线，绝不使用段落文本。',tag:'分镜故事版'},
    {title:'手绘线稿-3D白模故事板·3D白模分镜板模板',desc:'【类型】手绘线稿-3D白模故事板\n【标题】3D白模分镜板模板\n【布局】4列×3行（共格）\n【风格】\n【要求】\n\n【分镜镜头（共1个）】\n▶ P01 /  / \n  画面：[画面描述]\n【页眉】\n· 主标题：[主标题]\n· 副标题：[副标题]\n【视觉风格】\n· style_type：明亮的黏土模型风格3D预演画面\n· material：哑光浅黏土质感的无纹理体块模型\n· colors：仅使用柔和白与浅暖灰，背景明亮\n· lighting：高亮柔光，空间关系清晰\n· character_style：无面部特征的空白人体模型；无面部细节或特定人物肖像特征\n· fx_style：特效仅用中性符号（如拖尾、爆发、尘埃、冲击波、气势轮廓）\n· 禁止：无插画风格、照片级写实、高饱和色彩、精细纹理\n【参考说明】提供角色A、角色B的剪影或设定图作为外观唯一依据。本模板不限定具体特征，请自行替换。角色外观由参考图唯一决定。\n【一致性】角色、场景元素、朝向及空间布局全局一致。每格为定格瞬间，每个角色仅一种姿态。主攻方向与对手方向可自定义，保持轴线连续。\n【文字规则】可见文字仅限页眉两行标题及分镜格标题。分镜格内部绝无任何文字、标签、箭头、图标、注释、叠层、插图、底色、重复形象等。',tag:'分镜故事版'},
    {title:'手绘线稿-场景概览故事板·古代热闹坊市或庙会鸟瞰图',desc:'【类型】手绘线稿-场景概览故事板\n【标题】古代热闹坊市或庙会鸟瞰图\n【风格】\n· 美术风格：铅笔手绘草稿速写风\n· 线条风格：松散随性草稿线\n· 色彩：完全平面，无光影，无明暗，无色彩，白色背景\n· 建筑风格：建筑草图风格，以单色线条表现街道骨架和建筑轮廓\n【要求】\n· 核心：一个核心中心广场，四周延伸出数条坊市小巷\n· 街道元素：广场和街道上分布着摊位、戏台、遮阳伞、马车等古代街景静物\n· 远景建筑：远处有寺庙建筑轮廓和城楼\n· 平面要求：完全平面，无光影，无明暗，无色彩\n· 质量要求：细节丰富、构图清晰、布局合理',tag:'分镜故事版'},
    {title:'手绘线稿-场景规划故事板·办公室平面视图',desc:'【类型】手绘线稿-场景规划故事板\n【标题】办公室平面视图\n【风格】\n· 美术风格：黑白线条工程图风格\n· 色彩：纯白背景，黑线条，无任何色彩，无阴影，无渲染，无网格\n【要求】\n· 功能分区：\n  - 前台接待区：L型接待台、沙发组、背景墙标识\n  - 开放式办公区：多排工位、显示器、办公椅、文件柜\n  - 独立办公室：老板桌、书柜、单人沙发、落地灯\n  - 会议室：长条会议桌、多把办公椅、投影幕布、白板\n  - 茶水间：吧台、饮水机、咖啡机、微波炉、高脚凳\n  - 卫生间：洗手台、镜子、坐便器、隔断门',tag:'分镜故事版'},

    /* --- 影视级角色设定 --- */
    {title:'影视级角色总设定卡（完整版）',desc:'# 影视级角色总设定卡（Character Reference Sheet）\n\n## 人物基础档案\n姓名：【自行填写】\n性别：【男/女】\n年龄：【自行填写】\n身高：【自行填写】\n体重：【自行填写】\n身份职业：【自行填写】\n时代背景：【现代/民国/古风/仙侠/未来】\n人物气质：【自行填写】\n性格关键词：【填写4个核心关键词】\n特殊外貌识别特征：【专属固定标记，无则留白】\n\n## 核心设计总则（强制生效）\n严格统一人物本体：同一张脸、同一骨相五官、同一年龄、同一身材比例、同一核心发型，全视图人物高度统一，无换模、无变脸、无体型偏差。\n根据人物身份、阶层、时代、性格、气质定制专属五官、脸型、妆容、穿搭体系，拒绝流水线网红脸，强化个人专属辨识度，特殊外貌特征为终身固定识别点。\n整体风格克制高级、影视写实质感、真人标准人体比例，完全对标专业影视剧组人设参考标准。\n\n## 固定版式·竖版专业美术设定表\n• 底色：纯净象牙白/暖白无杂质背景\n• 排版：高端杂志网格布局、极细分割线、极简装饰、专业标准化版式\n• 整体定位：影视前期美术设定、AAA游戏建模参考图、专业服化道参考素材\n\n页面七大固定分区：\n1. 左侧人物信息区：角色设定表标题、完整人物档案、3-4句人物性格简介、6个人物核心标签、身高比例刻度、人物全身剪影\n2. 中央基础造型四视图：统一造型的正面、3/4侧、侧面、背面四视图，全套造型完全统一无变动\n3. 右上色彩&表情系统：6组人物专属固定主色卡；8种标准化表情（平静、沉思、浅笑、惊讶、无奈、专注、疏离、温柔），五官完全固定，仅微调眼神与面部肌肉状态\n4. 中部精细细节展示：发型细节（正面、侧颜、半背、背面多角度高清细节）；面部细节（正脸/侧脸特写，标注5项核心五官识别特征）\n5. 职业姿态参考：6组专属人设动作（工作状态、日常站立、行走姿态、职业道具握持、思考状态、设备使用姿态）\n6. 底部服化道细节：服装细节（5-6处核心剪裁、面料、设计工艺细节展示）；配饰细节（全套首饰、道具、数码产品、职业专属配件高清细节）；鞋履细节（完整鞋型、材质、版型特写细节）\n7. 氛围素材区：5-6组人物动态剪影、5张适配人物世界观的整体氛围参考图\n\n## 通用正向视觉关键词（完整版）\n超写实真人摄影，影视级角色美术设定，AAA游戏人物参考手册，真实亚洲人五官，原生自然皮肤纹理，极致发丝细节，精准标准人体比例，低饱和高级色调，柔和专业棚拍柔光，高清对焦，无磨皮，无滤镜，极简杂志排版，干净纯白背景，专业版式设计，高端时尚质感，8K超清，超精细细节，影视剧组建模标准图\n\n## 绝对禁止负面规则（防崩坏核心）\n禁止变脸、改脸型、改发型、改年龄、改身材比例、多人物入镜、多余杂物\n禁止动漫、卡通、二次元、手绘、Q版、夸张畸形五官肢体\n禁止裁切人物、缺手缺脚、错误透视、模糊五官、过度磨皮、网红滤镜\n禁止高饱和艳色、潮牌大logo、奇装异服、杂乱背景、文字遮挡人物\n禁止夸张怪异表情、服装随机变色、不符合人设的穿搭造型',tag:'人物'},
