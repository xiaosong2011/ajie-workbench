<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小松工作台">
<meta name="theme-color" content="#15273b">
<meta name="format-detection" content="telephone=no">
<title>小松的工作台 · 男生版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<style>
  :root{
    --side-1:#15273b; --side-2:#1e3349; --side-active:#2b4a6b;
    --side-text:#c4d4e3; --side-text-dim:#7d92a6;
    --content-bg:#eef2f7; --card:#ffffff;
    --accent:#2e86de; --accent-2:#1abc9c; --accent-warm:#e67e22;
    --ink:#1f2d3d; --ink-2:#51637a; --ink-3:#8a9bb0;
    --line:#e3e9f0; --tag-blue:#dbeafe; --tag-blue-t:#1d6fb8;
    --tag-mint:#d4f1e4; --tag-mint-t:#128a6a;
    --tag-amber:#fde8d0; --tag-amber-t:#c4771a;
    --tag-violet:#e6dcf7; --tag-violet-t:#6b3fa0;
    --tag-rose:#fbdde6; --tag-rose-t:#b83d63;
    --shadow:0 6px 20px rgba(20,40,70,.08);
    --radius:16px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --statusbar-h:calc(38px + var(--safe-top));
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{height:100%;touch-action:manipulation;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Roboto,sans-serif;
    background:#0f1a26; color:var(--ink); overflow:hidden;
    -webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;
  }
  .device{
    width:100%; height:100vh; height:100dvh; max-width:1180px; margin:0 auto;
    display:flex; flex-direction:column; background:var(--content-bg);
    position:relative;
  }
  /* ===== 顶部状态栏（适配全面屏安全区）===== */
  .statusbar{
    height:var(--statusbar-h); padding-top:var(--safe-top);
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding-left:18px; padding-right:18px;
    font-size:14px; font-weight:600; color:#fff;
    background:linear-gradient(90deg,var(--side-1),var(--side-2));
  }
  .statusbar .left{display:flex;align-items:center;gap:8px}
  .statusbar .center{width:120px;height:26px;background:#000;border-radius:14px}
  .statusbar .right{display:flex;align-items:center;gap:6px;font-size:12px}
  .statusbar .right svg{width:16px;height:11px}
  .bat{display:inline-flex;align-items:center;gap:2px}
  .bat-body{width:22px;height:11px;border:1.4px solid #fff;border-radius:3px;position:relative;padding:1.2px}
  .bat-body i{display:block;height:100%;width:67%;background:#fff;border-radius:1px}
  .bat-tip{width:2px;height:5px;background:#fff;border-radius:0 2px 2px 0}

  /* ===== 主体分栏 ===== */
  .main{flex:1; display:flex; overflow:hidden; min-height:0}

  /* ===== 左侧导航 ===== */
  .sidebar{
    width:188px; flex-shrink:0; background:linear-gradient(180deg,var(--side-1),var(--side-2));
    display:flex; flex-direction:column; overflow:hidden;
  }
  .side-head{padding:14px 16px 10px}
  .side-head .ws-name{color:#fff;font-size:16px;font-weight:700;letter-spacing:.5px}
  .side-head .ws-sub{color:var(--side-text-dim);font-size:11px;margin-top:3px;display:flex;align-items:center;gap:4px}
  .side-head .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:inline-flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
  .nav-scroll{flex:1;overflow-y:auto;padding:4px 8px 16px;-webkit-overflow-scrolling:touch}
  .nav-scroll::-webkit-scrollbar{width:0}
  .nav-item{
    display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;
    color:var(--side-text);font-size:13px;cursor:pointer;margin:2px 0;
    transition:background .18s,color .18s; position:relative; user-select:none;
  }
  .nav-item .ico{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:rgba(255,255,255,.08)}
  .nav-item:hover{background:rgba(255,255,255,.07)}
  .nav-item.active{background:var(--side-active);color:#fff}
  .nav-item.active .ico{background:rgba(255,255,255,.18)}
  .nav-item.active::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent-2);border-radius:0 3px 3px 0}
  .nav-item .badge{margin-left:auto;background:#e74c3c;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .nav-group{font-size:10px;font-weight:700;color:var(--side-text-dim);letter-spacing:1px;padding:14px 10px 4px;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.06);margin-top:6px}
  .nav-group:first-child{border-top:none;margin-top:2px}

  /* ===== 右侧内容 ===== */
  .content{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--content-bg)}
  .content::-webkit-scrollbar{width:6px}
  .content::-webkit-scrollbar-thumb{background:#c5d2e0;border-radius:3px}
  .content-inner{padding:16px 20px calc(80px + var(--safe-bottom));max-width:760px}

  .page-head{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .page-head .bow{font-size:18px}
  .page-head h1{font-size:22px;font-weight:800;color:var(--ink)}
  .page-head .sub{font-size:13px;color:var(--ink-3);font-weight:500;margin-bottom:2px}

  /* 每日激励滚动条 */
  .daily-quote-bar{
    background:linear-gradient(90deg,var(--side-1),var(--side-2));
    border-radius:12px;padding:10px 16px;margin-bottom:14px;
    overflow:hidden;position:relative;display:flex;align-items:center;gap:10px;
  }
  .daily-quote-bar .quote-icon{font-size:16px;flex-shrink:0}
  .daily-quote-bar .quote-track{
    overflow:hidden;flex:1;position:relative;height:20px;
  }
  .daily-quote-bar .quote-text{
    white-space:nowrap;font-size:13px;font-weight:600;color:#c4d4e3;
    position:absolute;animation:quoteScroll 22s linear infinite;
  }
  @keyframes quoteScroll{
    0%{transform:translateX(100%)}
    100%{transform:translateX(-100%)}
  }

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .card.tint-blue{background:linear-gradient(135deg,#dbeefe,#eaf4ff)}
  .card.tint-mint{background:linear-gradient(135deg,#d5f1e6,#e8faf2)}
  .card.tint-amber{background:linear-gradient(135deg,#fdecd6,#fff5e8)}
  .card.tint-violet{background:linear-gradient(135deg,#e8def7,#f3edfc)}
  .card.tint-slate{background:linear-gradient(135deg,#e2eaf3,#eef3f9)}
  .card-h{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px;flex-wrap:wrap}
  .card-h .right-ml{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3)}
  .card-h .btn{margin-left:auto}
  .txt{font-size:13px;line-height:1.7;color:var(--ink-2)}
  .txt b{color:var(--ink)}

  /* ===== 每日计划 - 快捷导航网格 ===== */
  .nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px}
  .nav-grid-item{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;
    border-radius:14px;cursor:pointer;transition:transform .12s,box-shadow .15s;
    text-align:center;user-select:none;position:relative;overflow:hidden;
  }
  .nav-grid-item:active{transform:scale(.92)}
  .nav-grid-item .ng-ico{
    width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;transition:transform .15s;
  }
  .nav-grid-item:active .ng-ico{transform:scale(1.1)}
  .nav-grid-item .ng-name{font-size:11px;font-weight:600;color:var(--ink-2);line-height:1.3;word-break:break-all}
  .nav-grid-item .ng-badge{
    position:absolute;top:6px;right:8px;background:#e74c3c;color:#fff;font-size:9px;font-weight:700;
    min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  /* 分组色系 */
  .ng-group-label{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:1px;margin:14px 0 2px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .ng-group-label::after{content:'';flex:1;height:1px;background:var(--line)}
  .ng-core{background:linear-gradient(135deg,#fff5e8,#fffaf3)}
  .ng-core .ng-ico{background:linear-gradient(135deg,#fdecd6,#f5d8b0)}
  .ng-finance{background:linear-gradient(135deg,#e8faf2,#f0fdf7)}
  .ng-finance .ng-ico{background:linear-gradient(135deg,#d5f1e6,#a8e6cf)}
  .ng-learn{background:linear-gradient(135deg,#eaf4ff,#f0f7ff)}
  .ng-learn .ng-ico{background:linear-gradient(135deg,#dbeefe,#b3d9f7)}
  .ng-life{background:linear-gradient(135deg,#f3edfc,#faf8fe)}
  .ng-life .ng-ico{background:linear-gradient(135deg,#e8def7,#d4c5f0)}
  .ng-sys{background:linear-gradient(135deg,#e2eaf3,#eef3f9)}
  .ng-sys .ng-ico{background:linear-gradient(135deg,#e2eaf3,#c5d2e0)}
  @media(max-width:380px){.nav-grid{grid-template-columns:repeat(3,1fr)}}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:transform .1s,filter .15s;font-family:inherit}
  .btn:active{transform:scale(.95)}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-mint{background:var(--accent-2);color:#fff}
  .btn-ghost{background:#f1f5fa;color:var(--ink-2)}
  .btn:hover{filter:brightness(1.06)}

  /* 待办 */
  .todo-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .progress{flex:1;height:6px;background:#eaeff5;border-radius:3px;overflow:hidden;min-width:60px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:3px;transition:width .3s}
  .todo-item{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}
  .todo-item:last-child{border-bottom:none}
  .todo-item .ck{width:20px;height:20px;border-radius:6px;border:2px solid #c2cdda;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
  .todo-item.done .ck{background:var(--accent-2);border-color:var(--accent-2)}
  .todo-item.done .ck::after{content:"✓";color:#fff;font-size:12px;font-weight:800}
  .todo-item.done .label{text-decoration:line-through;color:var(--ink-3)}
  .todo-item .del{margin-left:auto;color:#c2cdda;cursor:pointer;font-size:14px;opacity:0;transition:opacity .15s}
  .todo-item:hover .del{opacity:1}

  /* 日历 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head .mon{font-size:14px;font-weight:700}
  .cal-head .nav-btn{cursor:pointer;color:var(--ink-3);font-size:16px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:8px}
  .cal-head .nav-btn:hover{background:#eef3f9}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal-grid .wh{font-size:11px;color:var(--ink-3);padding:4px 0;font-weight:600}
  .cal-grid .d{font-size:12px;padding:6px 0;border-radius:8px;cursor:pointer;position:relative;color:var(--ink-2)}
  .cal-grid .d.dim{color:#c2cdda}
  .cal-grid .d.today{border:1.5px solid var(--accent);font-weight:700;color:var(--accent)}
  .cal-grid .d.checked{background:var(--accent-2);color:#fff;font-weight:700}
  .cal-grid .d.checked::after{content:"";display:block;width:4px;height:4px;background:#fff;border-radius:50%;margin:1px auto 0}
  .cal-legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--ink-3)}
  .cal-legend span{display:flex;align-items:center;gap:4px}

  /* 资源条目 */
  .res{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .res:last-child{border-bottom:none}
  .res .num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5aa9e6);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .res .num.amber{background:linear-gradient(135deg,var(--accent-warm),#f0a957)}
  .res .num.violet{background:linear-gradient(135deg,#7e57c2,#a78bda)}
  .res .body{flex:1}
  .res .t{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:4px}
  .res .t .ext{color:var(--ink-3);font-size:12px}
  .res .meta{font-size:11px;color:var(--ink-3);margin:2px 0 4px}
  .res .desc{font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .res .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}

  /* 时间线 */
  .tl{position:relative;padding-left:18px}
  .tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 14px 14px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:"";position:absolute;left:-14px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 0 0 2px var(--accent)}
  .tl-item.mint::before{background:var(--accent-2);box-shadow:0 0 0 2px var(--accent-2)}
  .tl-item.amber::before{background:var(--accent-warm);box-shadow:0 0 0 2px var(--accent-warm)}
  .tl-item .tm{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
  .tl-item .ti{font-size:13px;font-weight:700;color:var(--ink)}
  .tl-item .td{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.5}

  /* 子表格 */
  .sub-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .sub-tbl th{text-align:left;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  .sub-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--ink-2)}
  .sub-tbl td b{color:var(--ink)}

  /* 浮动按钮 */
  .fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-bottom));width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-3);cursor:pointer;z-index:50;border:none}
  .fab:hover{color:var(--accent)}

  /* ===== 浮动菜单按钮（手机端 + PWA 始终可见）===== */
  .menu-fab{display:none}
  @media(max-width:768px){
    .menu-fab{
      display:flex;position:fixed;left:16px;bottom:calc(16px + var(--safe-bottom));
      width:54px;height:54px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff;align-items:center;justify-content:center;
      font-size:26px;cursor:pointer;z-index:62;border:none;
      box-shadow:0 4px 18px rgba(46,134,222,.5);
      user-select:none;
    }
    .menu-fab:active{transform:scale(.9)}
  }

  /* 分享弹窗 */
  .share-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);
    z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .share-mask.show{display:flex}
  .share-box{
    background:#fff;border-radius:20px;padding:24px 20px;max-width:340px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .3s ease;max-height:90vh;overflow-y:auto;text-align:center;
  }
  .share-box h2{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px}
  .share-box .gsub{font-size:12px;color:var(--ink-3);margin-bottom:16px}
  #qrcodeBox{display:flex;justify-content:center;margin:10px auto 16px}
  #qrcodeBox img,#qrcodeBox canvas{border-radius:12px;border:1px solid var(--line)}
  .share-link-box{
    background:var(--content-bg);border-radius:12px;padding:10px 12px;margin:10px 0;
    font-size:11px;color:var(--ink-3);word-break:break-all;line-height:1.5;text-align:left;
    max-height:60px;overflow-y:auto;
  }
  .share-btns{display:flex;gap:8px;margin-top:12px}
  .share-btns button{flex:1}
  .share-close{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:none;background:var(--content-bg);color:var(--ink-2);font-size:15px;font-weight:600;cursor:pointer}
  .share-close:active{transform:scale(.97)}

  /* 连接成功提示 */
  .connect-toast{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:#fff;border-radius:20px;padding:28px 24px;max-width:320px;width:calc(100% - 40px);
    box-shadow:0 20px 60px rgba(0,0,0,.3);z-index:101;text-align:center;
    display:none;animation:pop .3s ease;
  }
  .connect-toast.show{display:block}
  .connect-toast .ct-icon{font-size:48px;margin-bottom:8px}
  .connect-toast .ct-title{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px}
  .connect-toast .ct-desc{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
  .connect-toast .ct-ws{background:var(--content-bg);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:14px}
  .connect-toast button{width:100%;padding:12px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .connect-toast button:active{transform:scale(.97)}

  .section{display:none;animation:fade .25s ease}
  .section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 空态 */
  .empty{text-align:center;padding:30px 16px;color:var(--ink-3);font-size:13px}
  .empty .big{font-size:40px;margin-bottom:8px}
  .empty-hint{text-align:center;padding:24px 16px;color:var(--ink-3);font-size:13px}
  .empty-hint .big{font-size:36px;margin-bottom:6px}

  /* CRUD 表单 */
  .crud-input{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;color:var(--ink);background:#f8fafd;outline:none;transition:border-color .15s;
    font-family:inherit;margin-bottom:8px;
  }
  .crud-input:focus{border-color:var(--accent);background:#fff}
  .crud-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;color:var(--ink);background:#f8fafd;outline:none;transition:border-color .15s;
    font-family:inherit;resize:vertical;min-height:60px;margin-bottom:8px;line-height:1.5}
  .crud-textarea:focus{border-color:var(--accent);background:#fff}
  .crud-label{font-size:12px;color:var(--ink-3);font-weight:600;display:block;margin-bottom:4px}
  .btn-sm{padding:4px 10px;font-size:11px;border-radius:8px}
  .btn-edit{background:var(--tag-blue);color:var(--tag-blue-t)}
  .btn-del{background:var(--tag-rose);color:var(--tag-rose-t)}

  /* ===== 通用列表项 ===== */
  .gitem{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .gitem:last-child{border-bottom:none}
  .gitem .ck{width:20px;height:20px;border-radius:6px;border:2px solid #c2cdda;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-top:1px}

  /* ⋯ 更多操作按钮 */

  }
  .item-menu .im-btn:active{background:var(--line)}
  .item-menu .im-btn.im-edit{color:#3b82f6}
  .item-menu .im-btn.im-del{color:#ef4444}

  /* 通用弹窗 */

  /* 数据管理 */
  .data-mgr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  /* 云同步状态 */
  .sync-badge{
    position:fixed;top:calc(var(--safe-top,0px) + 8px);right:14px;z-index:61;
    display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;
    font-size:11px;font-weight:700;cursor:pointer;

    transition:background .2s;
  }
  .sync-badge.off{background:rgba(255,255,255,.1);color:var(--side-text-dim)}
  .sync-badge.syncing{background:rgba(46,134,222,.3);color:#fff}
  .sync-badge.online{background:rgba(26,188,156,.25);color:#aef5e0}
  .sync-badge.error{background:rgba(231,76,60,.3);color:#ffd0c8}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}

  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .cloud-status-box{padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

  .cloud-status-box.off{background:#f1f5fa;color:var(--ink-3)}

  /* 移动端抽屉 */

      position:fixed;top:var(--statusbar-h);left:0;bottom:0;width:240px;z-index:60;
      transform:translateX(-100%);transition:transform .28s ease;
      box-shadow:4px 0 20px rgba(0,0,0,.18);
    }
    .sidebar.open{transform:translateX(0)}
    .overlay{position:fixed;top:var(--statusbar-h);left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:55}
    .overlay.show{display:block}
    .content-inner{padding:14px 14px calc(90px + var(--safe-bottom))}
  }

  /* ============================== */
  /* ====== 动态效果增强 ========== */
  /* ============================== */

  /* 1. 状态栏流光渐变 */
  .statusbar{
    background:linear-gradient(90deg,var(--side-1),var(--side-2),var(--side-1));
    background-size:200% 100%;
    animation:statusFlow 8s ease infinite;
  }
  @keyframes statusFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  /* 2. 侧栏背景微光呼吸 */
  @media(min-width:769px){
    .sidebar{position:relative}
    .sidebar::before{
      content:'';position:absolute;top:0;left:0;right:0;bottom:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(46,134,222,.12),transparent 60%);
      pointer-events:none;animation:sideGlow 6s ease-in-out infinite;
    }
  }
  @keyframes sideGlow{0%,100%{opacity:.4}50%{opacity:.8}}

  /* 3. 导航项激活动画 - 左侧指示条弹入 */
  .nav-item.active::before{
    animation:navBarIn .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes navBarIn{
    from{height:0;opacity:0}
    to{height:18px;opacity:1}
  }
  /* 导航项点击涟漪 */
  .nav-item{overflow:hidden;position:relative}
  .nav-item .ripple{
    position:absolute;border-radius:50%;background:rgba(255,255,255,.3);
    transform:scale(0);animation:ripple .5s ease-out;pointer-events:none;
  }
  @keyframes ripple{to{transform:scale(3);opacity:0}}

  /* 4. 卡片入场动画 */
  .card{
    animation:cardIn .4s cubic-bezier(.4,0,.2,1) both;
    transition:transform .15s,box-shadow .15s;
  }
  .card:nth-child(1){animation-delay:0s}
  .card:nth-child(2){animation-delay:.06s}
  .card:nth-child(3){animation-delay:.12s}
  .card:nth-child(4){animation-delay:.18s}
  .card:nth-child(5){animation-delay:.24s}
  .card:nth-child(6){animation-delay:.30s}
  .card:nth-child(7){animation-delay:.36s}
  .card:nth-child(8){animation-delay:.42s}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(16px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  /* 卡片悬浮微交互 */
  @media(hover:hover){
    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 28px rgba(20,40,70,.12);
    }
  }

  /* 5. 页面标题入场 */
  .page-head{
    animation:titleIn .4s ease both;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateX(-12px)}
    to{opacity:1;transform:translateX(0)}
  }

  /* 6. 进度条流光 */
  .progress{position:relative;overflow:hidden}
  .progress i{position:relative}
  .progress i::after{
    content:'';position:absolute;top:0;left:0;right:0;bottom:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    background-size:200% 100%;
    animation:shimmer 2s linear infinite;
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* 7. 待办勾选动画 */
  .todo-item .ck{transition:all .2s cubic-bezier(.4,0,.2,1)}
  .todo-item.done .ck{animation:checkPop .3s ease}
  @keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}

  /* 8. 按钮 ripple 涟漪 */
  .btn{position:relative;overflow:hidden}
  .btn .ripple{
    position:absolute;border-radius:50%;background:rgba(255,255,255,.35);
    transform:scale(0);animation:ripple .5s ease-out;pointer-events:none;
  }

  /* 9. 添加按钮脉冲提示 */
  .btn-accent{
    position:relative;
  }
  .btn-accent::after{
    content:'';position:absolute;inset:0;border-radius:inherit;
    box-shadow:0 0 0 0 rgba(46,134,222,.4);
    animation:btnPulse 2.5s ease-out infinite;pointer-events:none;
  }
  @keyframes btnPulse{
    0%{box-shadow:0 0 0 0 rgba(46,134,222,.3)}
    70%{box-shadow:0 0 0 8px rgba(46,134,222,0)}
    100%{box-shadow:0 0 0 0 rgba(46,134,222,0)}
  }

  /* 10. 签到日历格子动画 */
  .cal-grid .d.checked{animation:checkPop .3s ease}

  /* 11. 弹窗入场增强 */
  .modal-box{animation:modalIn .3s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes modalIn{
    from{opacity:0;transform:translateY(30px) scale(.9)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* 12. 浮动菜单按钮呼吸光晕 */
  .menu-fab{
    animation:fabGlow 3s ease-in-out infinite;
  }
  @keyframes fabGlow{
    0%,100%{box-shadow:0 4px 18px rgba(46,134,222,.45)}
    50%{box-shadow:0 4px 28px rgba(46,134,222,.65),0 0 0 6px rgba(46,134,222,.08)}
  }

  /* 13. 头像渐变旋转光 */
  .side-head .avatar{
    position:relative;
  }
  .side-head .avatar::before{
    content:'';position:absolute;inset:-3px;border-radius:inherit;
    background:conic-gradient(from 0deg,var(--accent),var(--accent-2),var(--accent-warm),var(--accent));
    animation:avatarSpin 4s linear infinite;z-index:-1;
    filter:blur(2px);opacity:.6;
  }
  @keyframes avatarSpin{to{transform:rotate(360deg)}}

  /* 14. 列表项滑入 */
  .gitem{
    animation:itemSlideIn .3s ease both;
  }
  .gitem:nth-child(1){animation-delay:0s}
  .gitem:nth-child(2){animation-delay:.04s}
  .gitem:nth-child(3){animation-delay:.08s}
  .gitem:nth-child(4){animation-delay:.12s}
  .gitem:nth-child(5){animation-delay:.16s}
  .gitem:nth-child(6){animation-delay:.20s}
  .gitem:nth-child(7){animation-delay:.24s}
  .gitem:nth-child(8){animation-delay:.28s}
  @keyframes itemSlideIn{
    from{opacity:0;transform:translateX(10px)}
    to{opacity:1;transform:translateX(0)}
  }

  /* 15. 标签 pill 微弹入 */
  .pill{animation:pillIn .3s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pillIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

  /* 16. 内容区域切换淡入 */
  .content-inner{
    animation:contentFade .35s ease forwards;
    min-height:100%;
  }
  @keyframes contentFade{
    from{opacity:0}
    to{opacity:1}
  }

  /* 17. ⋯ 菜单弹出增强 */
  .item-menu{
    transform-origin:top right;
  }
  .item-menu.show{
    animation:menuPop .18s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes menuPop{
    from{opacity:0;transform:scale(.85) translateY(-4px)}
    to{opacity:1;transform:scale(1) translateY(0)}
  }

  /* 18. 空状态提示动画 */
  .empty-hint{animation:emptyFloat 3s ease-in-out infinite}
  @keyframes emptyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* 19. 连接成功提示增强 */
  .connect-toast{animation:connectPop .4s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes connectPop{
    from{opacity:0;transform:translate(-50%,-50%) scale(.8)}
    to{opacity:1;transform:translate(-50%,-50%) scale(1)}
  }

  /* 20. 侧栏浮粒子 */
  .sidebar-particles{
    position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;
  }
  .sidebar-particles span{
    position:absolute;width:4px;height:4px;border-radius:50%;

    animation:particleFloat linear infinite;
  }
  @keyframes particleFloat{
    from{transform:translateY(100vh) translateX(0);opacity:0}
    10%{opacity:1}
    90%{opacity:1}
    to{transform:translateY(-20px) translateX(15px);opacity:0}
  }

  /* 减少动画偏好 */
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>

const STORE_KEY='ajie_workbench_data';
const CLOUD_KEY='ajie_cloud_config';

/* --- 默认云端配置（调试用，用户可覆盖） --- */

/* --- 云端配置 --- */
function loadCloudConfig(){
  try{
    const saved=JSON.parse(localStorage.getItem(CLOUD_KEY));
    if(saved&&saved.url&&saved.anonKey&&saved.workspaceId) return saved;
    /* 没有已保存配置时，使用默认配置 */
    return Object.assign({},DEFAULT_CLOUD_CFG);
  }catch(e){ return Object.assign({},DEFAULT_CLOUD_CFG); }
}
function saveCloudConfig(cfg){
  localStorage.setItem(CLOUD_KEY,JSON.stringify(cfg));
}
let CLOUD_CFG=loadCloudConfig();
let sbClient=null;       // Supabase 客户端实例
let sbChannel=null;      // 实时订阅通道
let syncTimer=null;      // 防抖定时器
let isRemoteUpdate=false;// 标记：当前更新是否来自远端（避免循环同步）

/* --- 初始化 Supabase 客户端 --- */
function initSupabase(){
  if(!CLOUD_CFG.url||!CLOUD_CFG.anonKey||!CLOUD_CFG.workspaceId){
    sbClient=null; updateSyncBadge('off','本地模式'); return false;
  }
  try{
    sbClient=supabase.createClient(CLOUD_CFG.url,CLOUD_CFG.anonKey);
    updateSyncBadge('online','已连接');
    return true;
  }catch(e){
    sbClient=null; updateSyncBadge('error','连接失败'); return false;
  }
}

/* --- 同步状态徽章 --- */
function updateSyncBadge(state,text){
  const badge=document.getElementById('syncBadge');
  const txt=document.getElementById('syncText');
  if(!badge)return;
  badge.className='sync-badge '+state;
  if(txt)txt.textContent=text;
}

/* --- 从云端加载数据 --- */
let lastSyncError='';
async function loadFromCloud(){
  if(!sbClient)return null;
  try{
    updateSyncBadge('syncing','同步中…');
    const {data,error}=await sbClient.from('workbench_data')
      .select('data,updated_at')
      .eq('workspace_id',CLOUD_CFG.workspaceId)
      .maybeSingle();
    if(error){
      lastSyncError=error.message||JSON.stringify(error);
      updateSyncBadge('error','加载失败');
      console.error('[Supabase] 加载失败:',lastSyncError);
      return null;
    }
    if(!data){updateSyncBadge('online','已连接');return null;}
    updateSyncBadge('online','已连接');
    lastSyncError='';
    if(data.updated_at){
      lastCloudSaveTime=new Date(data.updated_at).getTime();
    }
    return data.data;
  }catch(e){
    lastSyncError=e.message||String(e);
    updateSyncBadge('error','网络错误');
    console.error('[Supabase] 网络异常:',lastSyncError);
    return null;
  }
}

/* --- 保存到云端（防抖 + 自动重试） --- */
let saveRetryCount=0;
function saveToCloud(){
  if(!sbClient)return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    updateSyncBadge('syncing','同步中…');
    try{
      const {error}=await sbClient.from('workbench_data')
        .upsert({
          workspace_id:CLOUD_CFG.workspaceId,
          data:DB,
          updated_at:new Date().toISOString()
        });
      if(error){
        saveRetryCount++;
        if(saveRetryCount<=3){
          updateSyncBadge('error','重试中('+saveRetryCount+'/3)');
          setTimeout(()=>saveToCloud(),2000*saveRetryCount);
        }else{
          updateSyncBadge('error','保存失败');
          saveRetryCount=0;
        }
      }else{
        saveRetryCount=0;
        lastCloudSaveTime=Date.now();
        updateSyncBadge('online','已连接');
      }
    }catch(e){
      saveRetryCount++;
      if(saveRetryCount<=3){
        updateSyncBadge('error','重试中('+saveRetryCount+'/3)');
        setTimeout(()=>saveToCloud(),2000*saveRetryCount);
      }else{
        updateSyncBadge('error','网络错误');
        saveRetryCount=0;
      }
    }
  },500);
}

/* --- 定期同步（每30秒检查一次云端是否有更新） --- */
let pollTimer=null;
function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    if(!sbClient||isRemoteUpdate)return;
    try{
      const {data,error}=await sbClient.from('workbench_data')
        .select('data,updated_at')
        .eq('workspace_id',CLOUD_CFG.workspaceId)
        .maybeSingle();
      if(!error&&data&&data.data){
        const cloudTime=new Date(data.updated_at).getTime();
        const localTime=lastCloudSaveTime||0;
        if(cloudTime>localTime){
          isRemoteUpdate=true;
          DB=data.data;
          ensureKeys();
          localStorage.setItem(STORE_KEY,JSON.stringify(DB));
          const cur=document.querySelector('.nav-item.active');
          if(cur)switchSection(cur.dataset.id);
          isRemoteUpdate=false;
          lastCloudSaveTime=cloudTime;
        }
      }
    }catch(e){}
  },30000);
}

let lastCloudSaveTime=0;

/* --- 实时订阅 --- */
function subscribeCloud(){
  if(!sbClient||!CLOUD_CFG.workspaceId)return;
  if(sbChannel)sbClient.removeChannel(sbChannel);
  sbChannel=sbClient.channel('workbench-sync')
    .on('postgres_changes',{
      event:'*',schema:'public',table:'workbench_data',
      filter:'workspace_id=eq.'+CLOUD_CFG.workspaceId
    },(payload)=>{
      if(payload.eventType==='DELETE')return;
      const newData=payload.new&&payload.new.data;
      if(newData&&!isRemoteUpdate){
        isRemoteUpdate=true;
        DB=newData;
        ensureKeys();
        localStorage.setItem(STORE_KEY,JSON.stringify(DB));
        const cur=document.querySelector('.nav-item.active');
        if(cur)switchSection(cur.dataset.id);
        isRemoteUpdate=false;
      }
    })
    .subscribe();
}

/* ========== HTML 转义 ========== */
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ========== 标签颜色 ========== */
const TAG_COLORS=[
  ['var(--tag-blue)','var(--tag-blue-t)'],
  ['var(--tag-mint)','var(--tag-mint-t)'],
  ['var(--tag-amber)','var(--tag-amber-t)'],
  ['var(--tag-violet)','var(--tag-violet-t)'],
  ['var(--tag-rose)','var(--tag-rose-t)'],
];
function tagColor(text){
  let h=0; for(let i=0;i<text.length;i++) h=text.charCodeAt(i)+((h<<5)-h);
  const c=TAG_COLORS[Math.abs(h)%TAG_COLORS.length];
  return 'background:'+c[0]+';color:'+c[1];
}

/* ========== 通用列表 CRUD ========== */
function renderList(listKey){
  const config=LISTS[listKey];
  if(!config) return;
  const container=document.getElementById('lc_'+listKey);
  if(!container) return;
  const items=DB[config.dbKey]||[];
  if(items.length===0){
    container.innerHTML='<div class="empty-hint"><div class="big">'+config.icon+'</div>暂无内容，点击"+ 新增"添加</div>';
    return;
  }
  let html='';
  items.forEach((item,i)=>{ html+=renderListItem(listKey,item,i); });
  container.innerHTML=html;
}

function renderListItem(listKey,item,i){
  const config=LISTS[listKey];
  let hasCheckbox=false, checkboxChecked=false;
  let titleParts=[],metaParts=[],descParts=[],tagParts=[],fieldParts=[],linkUrl='';
  config.fields.forEach(f=>{
    const as=f.as||'field';
    if(as==='checkbox'){
      hasCheckbox=true;
      checkboxChecked=!!item[f.key];
      return;
    }
    const val=item[f.key];
    if(val===undefined||val===null||val==='') return;
    let text=String(val);
    /* 日期格式化显示 */
    if(f.type==='date'&&/^\d{4}-\d{2}-\d{2}$/.test(text)){
      const d=new Date(text);
      text=(d.getMonth()+1)+'月'+d.getDate()+'日';
    }else if(f.type==='month'&&/^\d{4}-\d{2}$/.test(text)){
      const parts=text.split('-');
      text=parts[0]+'年'+parseInt(parts[1])+'月';
    }
    if(as==='title') titleParts.push(text);
    else if(as==='meta') metaParts.push(text);
    else if(as==='desc') descParts.push(text);
    else if(as==='tag') tagParts.push('<span class="pill" style="'+tagColor(text)+'">'+escapeHtml(text)+'</span>');
    else if(as==='link'){ linkUrl=text; }
    else fieldParts.push('<span><b>'+escapeHtml(f.label)+'：</b>'+escapeHtml(text)+'</span>');
  });
  let html='<div class="gitem">';
  if(hasCheckbox){
    html+='<div class="ck'+(checkboxChecked?' checked':'')+'" onclick="toggleListCheck(\''+listKey+'\','+i+')"></div>';
  }
  html+='<div class="gbody">';
  if(titleParts.length){
    const titleText=escapeHtml(titleParts.join(' · '));
    if(linkUrl){
      const href=linkUrl.match(/^https?:\/\//)?linkUrl:'https://'+linkUrl;
      html+='<div class="gt'+(checkboxChecked?' done-t':'')+'"><a href="'+escapeHtml(href)+'" target="_blank" rel="noopener">'+titleText+'</a><span class="link-ico">🔗</span></div>';
    }else{
      html+='<div class="gt'+(checkboxChecked?' done-t':'')+'">'+titleText+'</div>';
    }
  }
  if(metaParts.length) html+='<div class="gmeta">'+escapeHtml(metaParts.join(' · '))+'</div>';
  if(descParts.length) html+='<div class="gdesc">'+escapeHtml(descParts.join(' '))+'</div>';
  if(linkUrl){
    const href=linkUrl.match(/^https?:\/\//)?linkUrl:'https://'+linkUrl;
    const displayUrl=linkUrl.length>50?linkUrl.slice(0,47)+'...':linkUrl;
    html+='<a class="glink" href="'+escapeHtml(href)+'" target="_blank" rel="noopener">🔗 '+escapeHtml(displayUrl)+'</a>';
  }
  if(fieldParts.length) html+='<div class="gfields">'+fieldParts.join('')+'</div>';
  if(tagParts.length) html+='<div class="gtags">'+tagParts.join('')+'</div>';
  html+='</div>';
  html+='<button class="item-more" onclick="showItemMenu(event,\''+listKey+'\','+i+')">⋯</button>';
  html+='</div>';
  return html;
}

/* ========== ⋯ 操作菜单 ========== */
let _itemMenu=null;
function _ensureMenu(){
  if(_itemMenu) return _itemMenu;
  _itemMenu=document.createElement('div');
  _itemMenu.className='item-menu';
  _itemMenu.innerHTML='';
  document.body.appendChild(_itemMenu);
  document.addEventListener('click',function(e){
    if(_itemMenu&&!_itemMenu.contains(e.target)&&!e.target.classList.contains('item-more')){
      _itemMenu.classList.remove('show');
    }
  });
  window.addEventListener('scroll',function(){if(_itemMenu)_itemMenu.classList.remove('show');},true);
  window.addEventListener('resize',function(){if(_itemMenu)_itemMenu.classList.remove('show');});
  return _itemMenu;
}
function _positionMenu(menu,btn){
  const r=btn.getBoundingClientRect();
  let x=r.right-120, y=r.bottom+4;
  if(x<8) x=8;
  if(y+100>window.innerHeight) y=r.top-104;
  if(y<8) y=8;
  menu.style.left=x+'px';
  menu.style.top=y+'px';
}
function showItemMenu(e,listKey,i){
  e.stopPropagation();
  const menu=_ensureMenu();
  const config=LISTS[listKey];
  menu.innerHTML=
    '<button class="im-btn im-edit" onclick="_menuEdit(\''+listKey+'\','+i+')">✏️ 编辑</button>'+
    '<div class="im-divider"></div>'+
    '<button class="im-btn im-del" onclick="_menuDel(\''+listKey+'\','+i+')">🗑️ 删除</button>';
  _positionMenu(menu,e.currentTarget);
  menu.classList.add('show');
}
function _menuEdit(listKey,i){
  _itemMenu.classList.remove('show');
  openListModal(listKey,i);
}
function _menuDel(listKey,i){
  _itemMenu.classList.remove('show');
  delListItem(listKey,i);
}
function showInspoMenu(e,i){
  e.stopPropagation();
  const menu=_ensureMenu();
  menu.innerHTML=
    '<button class="im-btn im-edit" onclick="_menuInspoEdit('+i+')">✏️ 编辑</button>'+
    '<div class="im-divider"></div>'+
    '<button class="im-btn im-del" onclick="_menuInspoDel('+i+')">🗑️ 删除</button>';
  _positionMenu(menu,e.currentTarget);
  menu.classList.add('show');
}
function _menuInspoEdit(i){ _itemMenu.classList.remove('show'); editInspo(i); }
function _menuInspoDel(i){ _itemMenu.classList.remove('show'); delInspo(i); }

function toggleListCheck(listKey,i){

function openListModal(listKey,index){
  const config=LISTS[listKey];
  const editing=index!==undefined&&index!==null;
  const item=editing?Object.assign({},DB[config.dbKey][index]):{};
  let formHtml='';
  config.fields.forEach(f=>{
    const raw=item[f.key];
    const val=(f.type==='checkbox')?(raw!==undefined?raw:false):(raw!==undefined?raw:'');
    formHtml+='<label class="crud-label">'+escapeHtml(f.label)+'</label>';
    if(f.type==='textarea'){
      formHtml+='<textarea class="crud-textarea" id="fld_'+f.key+'" placeholder="'+escapeHtml(f.placeholder||'')+'">'+escapeHtml(val)+'</textarea>';
    }else if(f.type==='select'){
      formHtml+='<select class="crud-input" id="fld_'+f.key+'" style="margin-bottom:8px">';
      let hasVal=f.options.indexOf(val)>=0;
      if(!hasVal&&val) formHtml+='<option value="'+escapeHtml(val)+'" selected>'+escapeHtml(val)+'</option>';
      f.options.forEach(opt=>{
        formHtml+='<option value="'+escapeHtml(opt)+'"'+(val===opt?' selected':'')+'>'+escapeHtml(opt)+'</option>';
      });
      formHtml+='</select>';
    }else if(f.type==='checkbox'){
      formHtml+='<label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;cursor:pointer">'+
        '<input type="checkbox" id="fld_'+f.key+'" '+(val?'checked':'')+' style="width:20px;height:20px;cursor:pointer"> '+
        escapeHtml(f.placeholder||'已完成')+'</label>';
    }else if(f.type==='date'){
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="date" value="'+escapeHtml(val)+'" style="margin-bottom:8px">';
    }else if(f.type==='month'){
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="month" value="'+escapeHtml(val)+'" style="margin-bottom:8px">';
    }else{
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="'+(f.inputType||'text')+'" placeholder="'+escapeHtml(f.placeholder||'')+'" value="'+escapeHtml(val)+'">';
    }
  });
  showModal(config.icon+' '+(editing?'编辑':'新增')+config.title, formHtml, ()=>{
    const newItem={};
    config.fields.forEach(f=>{
      const el=document.getElementById('fld_'+f.key);
      if(!el) return;
      if(f.type==='checkbox'){ newItem[f.key]=el.checked; }
      else { newItem[f.key]=el.value.trim(); }
    });
    /* 校验：至少有一个非空非布尔字段 */
    const hasContent=config.fields.some(f=>{
      const v=newItem[f.key];
      return v!==false&&v!==''&&v!==undefined&&v!==null;
    });
    if(!hasContent){ customAlert('请至少填写一项内容'); return false; }
    if(editing){ DB[config.dbKey][index]=newItem; }
    else { DB[config.dbKey].push(newItem); }
    saveData();
    renderList(listKey);
    return true;
  });
}

function delListItem(listKey,index){
  const config=LISTS[listKey];
  customConfirm('🗑️ 确认删除','确定删除这条「'+config.title+'」记录吗？',function(){
    DB[config.dbKey].splice(index,1);

let calYear=2026,calMonth=7;
function renderCal(){
  const grid=document.getElementById('calGrid');if(!grid)return;
  const monEl=document.getElementById('calMon');
  if(monEl) monEl.textContent=calYear+'年'+(calMonth+1)+'月';
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  let html='';
  ['日','一','二','三','四','五','六'].forEach(w=>html+='<div class="wh">'+w+'</div>');
  for(let i=first-1;i>=0;i--) html+='<div class="d dim">'+(prevDays-i)+'</div>';
  for(let d=1;d<=days;d++){
    let cls='d';
    if(calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate()) cls+=' today';

var _speechRec=null;
var _speechActive=false;

/* 打开语音录入弹窗 */
function openVoiceInspoModal(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    /* 浏览器不支持语音识别，回退到普通录入 */
    customAlert('⚠️ 当前浏览器不支持语音识别，请使用 Chrome、Edge 或 Safari。已为您打开手动录入。');
    openInspoModal();
    return;
  }
  showModal('🎤 语音录入灵感',
    '<div style="text-align:center;padding:10px 0">'+
      '<div id="voiceStatus" style="font-size:14px;color:var(--ink-3);margin-bottom:12px">点击下方按钮开始说话</div>'+
      '<button class="btn btn-accent" id="voiceRecBtn" onclick="toggleVoiceRec()" style="width:80px;height:80px;border-radius:50%;font-size:32px;display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer">🎤</button>'+
      '<div id="voiceLiveText" style="margin-top:12px;padding:12px;border-radius:10px;background:var(--bg-2);min-height:60px;font-size:14px;line-height:1.6;text-align:left;color:var(--ink-3);max-height:120px;overflow-y:auto"></div>'+
    '</div>'+
    '<div id="voiceResultWrap" style="display:none">'+
      '<label class="crud-label">原始语音文字</label>'+
      '<textarea class="crud-textarea" id="voiceRawText" style="font-size:13px;color:var(--ink-3)" readonly></textarea>'+
      '<label class="crud-label" style="margin-top:10px">✨ 智能整理结果</label>'+
      '<label class="crud-label" style="font-size:12px;color:var(--ink-3)">标题</label>'+
      '<input class="crud-input" id="ipTitle" placeholder="一句话总结">'+
      '<label class="crud-label" style="font-size:12px;color:var(--ink-3)">描述</label>'+
      '<textarea class="crud-textarea" id="ipDesc" placeholder="详细说明..."></textarea>'+
      '<label class="crud-label" style="font-size:12px;color:var(--ink-3)">标签</label>'+
      '<input class="crud-input" id="ipTag" placeholder="如：产品想法、金句、工具">'+
    '</div>',
    function(){
      var title=document.getElementById('ipTitle');
      var desc=document.getElementById('ipDesc');
      var tag=document.getElementById('ipTag');
      if(!title||!title.value.trim()){ customAlert('请先录音或输入内容'); return false; }
      var obj={title:title.value.trim(),desc:desc?desc.value.trim():'',tag:tag?tag.value.trim():''};
      DB.inspos.push(obj);
      saveData(); renderInspos();
      return true;
    }
  );
  /* 初始化语音识别 */
  _speechRec=new SR();
  _speechRec.lang='zh-CN';
  _speechRec.continuous=true;
  _speechRec.interimResults=true;
  var fullText='';
  _speechRec.onresult=function(event){
    var interim='';
    for(var i=event.resultIndex;i<event.results.length;i++){
      if(event.results[i].isFinal){
        fullText+=event.results[i][0].transcript;
      }else{
        interim+=event.results[i][0].transcript;
      }
    }
    var live=document.getElementById('voiceLiveText');
    if(live) live.textContent=fullText+interim;
  };
  _speechRec.onend=function(){
    _speechActive=false;
    var btn=document.getElementById('voiceRecBtn');
    if(btn) btn.textContent='🎤';
    if(fullText.trim()){
      var status=document.getElementById('voiceStatus');
      if(getZhipuKey()){
        /* 有智谱API Key，使用AI总结 */
        if(status) status.textContent='🧠 正在调用智谱GLM大模型总结...';
        summarizeWithZhipu(fullText.trim(),function(result,err){
          if(result&&result.title){
            /* AI总结成功 */
            var wrap=document.getElementById('voiceResultWrap');
            if(wrap) wrap.style.display='block';
            var rawEl=document.getElementById('voiceRawText');
            if(rawEl) rawEl.value=fullText.trim();
            var titleEl=document.getElementById('ipTitle');
            var descEl=document.getElementById('ipDesc');
            var tagEl=document.getElementById('ipTag');
            if(titleEl) titleEl.value=result.title;
            if(descEl) descEl.value=result.desc||'';
            if(tagEl) tagEl.value=result.tag||'';
            if(status) status.textContent='✅ AI总结完成！请检查并修改后保存';
            if(btn){btn.style.background='';btn.style.color='';}
          }else{
            /* AI总结失败，回退本地算法 */
            if(status) status.textContent='⚠️ AI总结失败('+err+')，已使用本地算法整理';
            processVoiceText(fullText.trim());
          }
        });
      }else{
        /* 未配置智谱Key，使用本地算法 */
        if(status) status.textContent='正在整理...（未配置智谱API Key，使用本地算法）';
        processVoiceText(fullText.trim());
      }
    }
  };
  _speechRec.onerror=function(event){
    _speechActive=false;
    var btn=document.getElementById('voiceRecBtn');
    if(btn) btn.textContent='🎤';
    var status=document.getElementById('voiceStatus');
    if(status) status.textContent='⚠️ 语音识别出错：'+(event.error||'未知错误');
  };
}

/* 本地文本整理算法 - 去废话、提取重点、分段落 */
function processVoiceText(rawText){
  var wrap=document.getElementById('voiceResultWrap');
  if(wrap) wrap.style.display='block';
  var rawEl=document.getElementById('voiceRawText');
  if(rawEl) rawEl.value=rawText;

  /* 1. 去除口语废话词 */
  var fillerWords=[
    '嗯','啊','呃','哦','呢','吧','嘛','哈','嘿','诶',
    '就是','那个','然后','所以说','其实','怎么说呢',
    '我觉得','我认为','对吧','是不是','你知道吗',
    '比如说','比如','的话','一下','一下子','就这么',
    '对','是啊','是的','嗯嗯','好好好','这样说吧'
  ];
  var cleaned=rawText;
  fillerWords.forEach(function(w){
    cleaned=cleaned.replace(new RegExp(w,'g'),'');
  });

  /* 2. 合并多余标点和空格 */
  cleaned=cleaned.replace(/[，,]{2,}/g,'，');
  cleaned=cleaned.replace(/[。.]{2,}/g,'。');
  cleaned=cleaned.replace(/[！!]{2,}/g,'！');
  cleaned=cleaned.replace(/[？?]{2,}/g,'？');
  cleaned=cleaned.replace(/\s{2,}/g,' ');
  cleaned=cleaned.replace(/^[，,。.！!？?\s]+/,'');
  cleaned=cleaned.replace(/[，,。.！!？?\s]+$/,'');

  /* 3. 按句号/问号/感叹号分段 */
  var sentences=cleaned.split(/[。！？\n]+/).map(function(s){
    return s.trim();
  }).filter(function(s){
    return s.length>2;
  });

  /* 4. 提取标题：取第一个完整短句，截断到30字以内 */
  var title='';
  if(sentences.length>0){
    title=sentences[0];
    if(title.length>30) title=title.substring(0,30)+'...';
  }else{
    title=cleaned.substring(0,30);
  }

  /* 5. 生成描述：所有句子整理成编号列表 */
  var desc='';
  if(sentences.length>1){
    desc=sentences.map(function(s,i){
      return (i+1)+'. '+s;
    }).join('\n');
  }else if(sentences.length===1){
    desc=sentences[0];
  }else{
    desc=cleaned;
  }

  /* 6. 智能推荐标签 */
  var tag='';
  var tagRules=[
    {kw:['想法','idea','点子','创意','设计'],tag:'产品想法'},
    {kw:['金句','名言','说得好','很喜欢这句话'],tag:'金句'},
    {kw:['工具','软件','app','网站','插件'],tag:'工具'},
    {kw:['会议','讨论','沟通','汇报'],tag:'工作'},
    {kw:['学习','课程','教程','看书','读书'],tag:'学习'},
    {kw:['问题','bug','错误','故障','修复'],tag:'待解决'},
    {kw:['计划','安排','目标','todo','任务'],tag:'计划'},
    {kw:['灵感','创意','突然想到','想到一个'],tag:'灵感'}
  ];
  var lowerText=rawText.toLowerCase();
  for(var i=0;i<tagRules.length;i++){
    for(var j=0;j<tagRules[i].kw.length;j++){
      if(lowerText.indexOf(tagRules[i].kw[j])>=0){
        tag=tagRules[i].tag;
        break;
      }
    }
    if(tag) break;
  }

  /* 7. 填入表单 */
  var titleEl=document.getElementById('ipTitle');
  var descEl=document.getElementById('ipDesc');
  var tagEl=document.getElementById('ipTag');
  if(titleEl) titleEl.value=title;
  if(descEl) descEl.value=desc;
  if(tagEl) tagEl.value=tag;

  /* 8. 更新状态提示 */
  var status=document.getElementById('voiceStatus');
  if(status) status.textContent='✅ 整理完成！请检查并修改后保存';
  var btn=document.getElementById('voiceRecBtn');
  if(btn){btn.style.background='';btn.style.color='';}
}

function renderLedger(){
  const list=document.getElementById('ledgerList');
  if(!list)return;
  const total=DB.ledger.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const budget=DB.budget||6000;
  const pct=budget>0?Math.round(total/budget*100):0;
  const summary=document.getElementById('ledgerSummary');
  const bar=document.getElementById('ledgerBar');
  const hint=document.getElementById('ledgerHint');
  if(summary) summary.innerHTML='¥ '+total.toLocaleString()+' <span style="font-size:13px;font-weight:500;color:var(--ink-3)">/ '+budget.toLocaleString()+'</span>';
  if(bar) bar.style.width=Math.min(pct,100)+'%';
  if(hint) hint.textContent=DB.ledger.length===0?'还没有记账，点击"记一笔"开始。':
    pct<50?'已用 '+pct+'%，节奏不错。':
    pct<80?'已用 '+pct+'%，注意控制。':
    pct<100?'已用 '+pct+'%，预算快满了！':'已超支 '+(pct-100)+'%！';
  if(DB.ledger.length===0){
    list.innerHTML='<div class="empty-hint"><div class="big">📊</div>还没有记账记录</div>';
    return;
  }
  let html='<table class="sub-tbl"><tr><th>类别</th><th>金额</th><th>占比</th><th></th></tr>';
  DB.ledger.slice().reverse().forEach((e,idx)=>{
    const i=DB.ledger.length-1-idx;
    const cat=LEDGER_CATS.find(c=>c.name===e.cat);
    const icon=cat?cat.icon:'👤';
    html+='<tr><td>'+icon+' '+escapeHtml(e.cat)+'</td><td>¥'+escapeHtml(e.amount)+'</td><td>'+(total>0?Math.round(e.amount/total*100):0)+'%</td>'+
      '<td><span style="cursor:pointer;color:#e74c3c;font-size:13px" onclick="delLedger('+i+')">✕</span></td></tr>';
  });
  html+='</table>';

  if(chartEl){
    var catMap={};

      var cat=e.cat||'其他';

    });
    var cats=Object.keys(catMap);
    if(cats.length>0){
      var pieColors=['#2e86de','#1abc9c','#e67e22','#9b59b6','#e74c3c','#f1c40f','#3498db','#1abc9c'];
      var segs=cats.map(function(c,i){
        return {label:c,v:catMap[c],color:pieColors[i%pieColors.length]};
      });
      var totalAll=segs.reduce(function(s,r){return s+r.v;},0);
      chartEl.innerHTML=
        svgDonut(segs,{centerText:'¥'+Math.round(totalAll),centerSub:'总支出',size:130})+
        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center">'+
        segs.map(function(s){
          return '<div style="display:flex;align-items:center;gap:6px;font-size:12px">'+
            '<span style="width:10px;height:10px;border-radius:3px;background:'+s.color+'"></span>'+
            '<span style="color:var(--ink-2)">'+s.label+'</span>'+
            '<span style="font-weight:700;color:var(--ink)">¥'+Math.round(s.v)+'</span>'+

    }else{
      chartEl.innerHTML='<div class="empty-hint" style="padding:12px"><div class="big">📈</div>记账后自动生成支出分析图</div>';
    }

/* 调用智谱GLM-4-Flash进行智能总结 */
function summarizeWithZhipu(rawText, callback){
  var apiKey=getZhipuKey();
  if(!apiKey){
    callback(null,'未配置智谱API Key');
    return;
  }
  var prompt='请将以下语音转文字内容进行智能整理总结。要求：\n'+
    '1. 去除口语废话词（嗯、啊、那个、就是等）\n'+
    '2. 提取核心意思，生成一个简洁的标题（15字以内）\n'+
    '3. 将内容整理成条理清晰的描述（如果有多个要点，用编号列表）\n'+
    '4. 根据内容推荐一个标签（从以下选择：产品想法、金句、工具、工作、学习、待解决、计划、灵感、其他）\n'+
    '5. 严格返回JSON格式，不要其他任何文字\n\n'+
    '语音文字内容：'+rawText+'\n\n'+
    '返回格式：{"title":"标题","desc":"描述","tag":"标签"}';

  var apiUrl='https://open.bigmodel.cn/api/paas/v4/chat/completions';
  var payload={
    model:'glm-4-flash',
    messages:[{role:'user',content:prompt}],
    temperature:0.3,
    max_tokens:500
  };

  /* 尝试直接调用，如果CORS失败则通过代理 */
  function tryDirect(){
    return fetch(apiUrl,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+apiKey
      },
      body:JSON.stringify(payload)
    }).then(function(r){return r.json();});
  }
  function tryProxy(){
    var proxyUrl='https://corsproxy.io/?url='+encodeURIComponent(apiUrl);
    return fetch(proxyUrl,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+apiKey
      },
      body:JSON.stringify(payload)
    }).then(function(r){return r.json();});
  }

  tryDirect()
    .then(function(data){
      if(data&&data.choices&&data.choices.length>0){
        var content=data.choices[0].message.content;
        /* 尝试从返回内容中提取JSON */
        var m=content.match(/\{[\s\S]*\}/);
        if(m){
          try{
            var result=JSON.parse(m[0]);
            callback(result,null);
            return;
          }catch(e){}
        }
        /* JSON解析失败，尝试手动提取 */
        callback(null,'AI返回格式异常');
      }else{
        callback(null,data.error?data.error.message:'AI返回为空');
      }
    })
    .catch(function(err){
      /* 直接调用失败（可能是CORS），尝试代理 */
      tryProxy()
        .then(function(data){
          if(data&&data.choices&&data.choices.length>0){
            var content=data.choices[0].message.content;
            var m=content.match(/\{[\s\S]*\}/);
            if(m){
              try{
                var result=JSON.parse(m[0]);
                callback(result,null);
                return;
              }catch(e){}
            }
            callback(null,'AI返回格式异常');
          }else{
            callback(null,data.error?data.error.message:'AI返回为空');
          }
        })
        .catch(function(err2){
          callback(null,'网络请求失败: '+err2.message);
        });
    });
}

function saveCloudCfg(){
  let url=document.getElementById('cfgUrl').value.trim().replace(/\/+$/,'');
  const anonKey=document.getElementById('cfgKey').value.trim();
  const workspaceId=document.getElementById('cfgWs').value.trim();
  if(!url||!anonKey||!workspaceId){
    customAlert('请填写完整的 Supabase URL、Anon Key 和工作区 ID');return;
  }
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(url)){
    customAlert('URL格式不正确，应该是 https://xxxxxxxx.supabase.co 格式（不要有末尾斜杠）');return;
  }
  CLOUD_CFG={url,anonKey,workspaceId};
  saveCloudConfig(CLOUD_CFG);
  if(initSupabase()){
    customAlert('云同步配置已保存！正在测试连接…');
    (async()=>{
      const d=await loadFromCloud();
      if(d){
        DB=d;ensureKeys();saveData();switchSection('data');
        subscribeCloud();
        startPolling();
        customAlert('✅ 连接成功！数据已从云端加载。\n工作区: '+workspaceId+'\n\n数据会自动同步，无需手动操作。');
      }else if(lastSyncError){
        customAlert('❌ 连接失败：'+lastSyncError+'\n\n请检查：\n1. 是否已在Supabase运行建表SQL\n2. 是否运行了GRANT权限语句\n3. URL和Key是否正确');
      }else{
        subscribeCloud();
        startPolling();
        customAlert('✅ 已连接！工作区为空，数据将在保存时自动上传。\n工作区: '+workspaceId+'\n\n数据会自动同步，无需手动操作。');
      }
    })();
  }else{
    customAlert('连接失败，请检查 URL 和 Key 是否正确');
  }
}
function disconnectCloud(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(sbChannel){sbClient.removeChannel(sbChannel);sbChannel=null;}
  sbClient=null;
  CLOUD_CFG={};
  saveCloudConfig({});
  updateSyncBadge('off','本地模式');
  customAlert('已断开云同步，回到本地模式。');
  switchSection('data');
}
async function syncNow(){
  if(!sbClient){customAlert('请先启用云同步');return;}
  updateSyncBadge('syncing','同步中…');
  const {error}=await sbClient.from('workbench_data')
    .upsert({workspace_id:CLOUD_CFG.workspaceId,data:DB,updated_at:new Date().toISOString()});

/* ========== 通用 SVG 图表 ========== */
function svgBarChart(data,opts){
  opts=opts||{};
  const w=opts.w||320,h=opts.h||140,pad=opts.pad||24;
  const barW=Math.max(8,(w-pad*2)/data.length*0.6);
  const gap=(w-pad*2)/data.length;
  const maxV=Math.max.apply(null,data.map(function(d){return d.v||0;}))||1;
  const colors=opts.colors||['#2e86de','#1abc9c','#e67e22','#9b59b6','#e74c3c','#f1c40f','#3498db'];
  let bars='';
  data.forEach(function(d,i){
    const bh=maxV>0?Math.max(2,(d.v/maxV)*(h-pad*2-20)):0;
    const x=pad+i*gap+gap*0.2;
    const y=h-pad-bh;
    const c=colors[i%colors.length];
    bars+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="3" fill="'+c+'" opacity="0.85"/>';
    bars+='<text x="'+(x+barW/2)+'" y="'+(y-4)+''+'" text-anchor="middle" font-size="10" fill="#51637a" font-weight="600">'+(d.v>0?d.v:'')+'</text>';
    bars+='<text x="'+(x+barW/2)+'" y="'+(h-pad+12)+''+'" text-anchor="middle" font-size="9" fill="#8a9bb0">'+(d.label||'')+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto"><rect x="0" y="0" width="'+w+'" height="'+h+'" fill="transparent"/>'+bars+'</svg>';
}

function svgDonut(segments,opts){
  opts=opts||{};
  const size=opts.size||140,stroke=opts.stroke||18,r=(size-stroke)/2,cx=size/2,cy=size/2;
  const total=segments.reduce(function(s,d){return s+(d.v||0);},0)||1;
  const circumference=2*Math.PI*r;
  let offset=0,html='<svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px">';
  segments.forEach(function(d){
    const pct=(d.v||0)/total;
    const len=pct*circumference;
    html+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+stroke+'" stroke-dasharray="'+len+' '+(circumference-len)+'" stroke-dashoffset="'+(-offset)+''+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset+=len;
  });
  html+='<text x="'+cx+'" y="'+(cy-4)+''+'" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2d3d">'+(opts.centerText||'')+'</text>';
  html+='<text x="'+cx+'" y="'+(cy+12)+''+'" text-anchor="middle" font-size="10" fill="#8a9bb0">'+(opts.centerSub||'')+'</text>';
  html+='</svg>';
  return html;
}

function svgRing(pct,opts){
  opts=opts||{};
  const size=opts.size||120,stroke=opts.stroke||12,r=(size-stroke)/2,cx=size/2,cy=size/2;
  const circumference=2*Math.PI*r;
  const len=Math.min(pct/100,1)*circumference;
  const color=opts.color||'#2e86de';
  return '<svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#e3e9f0" stroke-width="'+stroke+'"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-dasharray="'+len+' '+(circumference-len)+'" stroke-linecap="round" transform="rotate(-90 '+cx+' '+cy+')"/>'+
    '<text x="'+cx+'" y="'+(cy+2)+''+'" text-anchor="middle" font-size="18" font-weight="800" fill="#1f2d3d">'+pct+'%</text>'+
    '<text x="'+cx+'" y="'+(cy+18)+''+'" text-anchor="middle" font-size="10" fill="#8a9bb0">'+(opts.label||'')+'</text>'+
    '</svg>';
}

function renderSalaryCharts(){
  var el=document.getElementById('salaryCharts');
  if(!el)return;
  var html='';
  /* 收入趋势柱状图 */
  var incomes=(DB.salaryIncome||[]).map(function(r){
    var m=r.month||'';
    return {label:m?parseInt(m.slice(5))+'月':'?',v:parseFloat(r.amount)||0};
  }).filter(function(r){return r.v>0;});
  if(incomes.length>0){
    html+='<div style="margin-bottom:16px">'+
      '<div style="font-size:12px;color:var(--ink-3);margin-bottom:6px">📈 月度收入趋势</div>'+
      svgBarChart(incomes,{h:130})+
      '<div style="text-align:center;margin-top:6px;font-size:12px;color:var(--ink-2)">平均月收入 <b style="color:var(--accent)">¥'+Math.round(incomes.reduce(function(s,r){return s+r.v;},0)/incomes.length)+'</b></div>'+
      '</div>';
  }
  /* 储蓄目标进度环 */
  var goals=DB.salaryGoal||[];
  if(goals.length>0){
    html+='<div style="font-size:12px;color:var(--ink-3);margin-bottom:6px">🎯 储蓄目标进度</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center">';
    var ringColors=['#2e86de','#1abc9c','#e67e22','#9b59b6'];
    goals.forEach(function(g,i){
      var target=parseFloat(g.target)||1;
      var current=parseFloat(g.current)||0;
      var pct=Math.min(100,Math.round(current/target*100));
      var label=g.title||'目标';
      if(label.length>6)label=label.slice(0,6)+'…';
      html+='<div style="text-align:center">'+
        svgRing(pct,{size:100,stroke:10,color:ringColors[i%ringColors.length],label:label})+
        '<div style="font-size:11px;color:var(--ink-2);margin-top:2px">¥'+Math.round(current)+' / ¥'+Math.round(target)+'</div>'+
        '</div>';
    });
    html+='</div>';
  }
  /* 资金分配饼图 */
  var allocs=DB.salaryAlloc||[];
  if(allocs.length>0){
    var allocColors=['#2e86de','#1abc9c','#e67e22','#9b59b6','#e74c3c'];
    var segs=allocs.map(function(a,i){
      var raw=a.amount||'';
      var num=parseFloat(raw.replace(/[^\d.]/g,''))||0;
      return {label:a.category||'?',v:num,color:allocColors[i%allocColors.length]};
    }).filter(function(s){return s.v>0;});
    if(segs.length>0){
      var totalAlloc=segs.reduce(function(s,r){return s+r.v;},0);
      html+='<div style="margin-top:16px;font-size:12px;color:var(--ink-3);margin-bottom:6px">🥧 资金分配比例</div>';
      html+='<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center">';
      html+=svgDonut(segs,{centerText:'¥'+Math.round(totalAlloc),centerSub:'月分配',size:120});
      html+='<div style="display:flex;flex-direction:column;gap:5px">';
      segs.forEach(function(s){
        html+='<div style="display:flex;align-items:center;gap:8px;font-size:12px">'+
          '<span style="width:10px;height:10px;border-radius:3px;background:'+s.color+'"></span>'+
          '<span style="color:var(--ink-2)">'+s.label+'</span>'+
          '<span style="font-weight:700;color:var(--ink)">¥'+Math.round(s.v)+'</span>'+
          '<span style="color:var(--ink-3);font-size:10px">('+(s.v/totalAlloc*100).toFixed(0)+'%)</span>'+
          '</div>';
      });
      html+='</div></div>';
    }
  }
  el.innerHTML=html||'<div class="empty-hint" style="padding:12px"><div class="big">📊</div>记录收入和储蓄目标后自动生成图表</div>';
}

/* 城市名转省份名 */
var CITY_TO_PROVINCE={
  '长沙':'湖南','株洲':'湖南','湘潭':'湖南','衡阳':'湖南','武汉':'湖北',
  '广州':'广东','深圳':'广东','杭州':'浙江','宁波':'浙江','南京':'江苏','苏州':'江苏',
  '成都':'四川','西安':'陕西','郑州':'河南','济南':'山东','合肥':'安徽',
  '福州':'福建','南昌':'江西','昆明':'云南','贵阳':'贵州','兰州':'甘肃',
  '海口':'海南','太原':'山西','沈阳':'辽宁','长春':'吉林','哈尔滨':'黑龙江',
  '石家庄':'河北','呼和浩特':'内蒙古','乌鲁木齐':'新疆','银川':'宁夏',
  '西宁':'青海','拉萨':'西藏','南宁':'广西','北京':'北京','上海':'上海',
  '天津':'天津','重庆':'重庆'
};

function normalizeProvince(prov){
  for(var city in CITY_TO_PROVINCE){
    if(prov.indexOf(city)>=0) return CITY_TO_PROVINCE[city];
  }
  return prov;
}

/* 通过CORS代理从金投网获取油价（用于GitHub Pages等静态托管环境） */
function fetchOilPriceCORS(prov){
  prov=normalizeProvince(prov);
  var regionId=CNGOLD_REGION_MAP[prov]||CNGOLD_REGION_MAP['湖南'];
  var targetUrl='https://datacenter.cngold.org/city_oil/price_history/?regionId='+regionId;
  /* 使用多个CORS代理，依次尝试 */
  var proxies=[
    'https://corsproxy.io/?url='+encodeURIComponent(targetUrl),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(targetUrl),
    'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(targetUrl)
  ];
  function tryProxy(idx){
    if(idx>=proxies.length) return Promise.reject(new Error('所有CORS代理均失败'));
    return fetch(proxies[idx])
      .then(function(r){return r.json();})
      .then(function(data){
        if(data&&data.data&&data.data.length>0){
          var latest=data.data[0];
          return {
            prices:{
              p92:latest.price92||'',
              p95:latest.price95||'',
              p98:latest.price98||'',
              p0:latest.price0||''
            },
            province:prov,
            source:'金投网(CORS)'
          };
        }
        throw new Error('数据格式异常');
      })
      .catch(function(){return tryProxy(idx+1);});
  }
  return tryProxy(0);
}

/* 统一的油价获取函数 */
function fetchOilPriceData(prov){
  var doubaoKey=getDoubaoKey();
  if(isLocalServer()){
    /* 本地环境：使用Python后端代理 */
    var apiUrl='/api/oilprice?prov='+encodeURIComponent(prov);
    if(doubaoKey) apiUrl+='&doubao_key='+encodeURIComponent(doubaoKey);
    return fetch(apiUrl).then(function(r){return r.json();});
  }else{
    /* GitHub Pages等静态环境：使用CORS代理 */
    if(doubaoKey){
      /* 尝试通过CORS代理调用豆包API */
      var doubaoUrl='https://ark.cn-beijing.volces.com/api/v3/responses';
      var proxyUrl='https://corsproxy.io/?url='+encodeURIComponent(doubaoUrl);
      var payload={
        model:'doubao-seed-2-1-pro-260628',
        tools:[{type:'web_search',max_keyword:3}],
        input:[{role:'user',content:[{type:'input_text',text:'请搜索'+normalizeProvince(prov)+'今日最新油价，返回JSON：{"p92":"x","p95":"x","p98":"x","p0":"x"}'}]}]
      };
      return fetch(proxyUrl,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+doubaoKey},
        body:JSON.stringify(payload)
      }).then(function(r){return r.json();})
        .then(function(d){
          /* 尝试从豆包响应中解析油价 */
          var text='';
          try{text=d.output.content[0].text||d.output||JSON.stringify(d);}catch(e){text=JSON.stringify(d);}
          var m=text.match(/\{[^}]*p92[^}]*\}/);
          if(m){
            var prices=JSON.parse(m[0]);
            return {prices:prices,province:normalizeProvince(prov),source:'豆包大模型'};
          }
          throw new Error('豆包响应解析失败');
        })
        .catch(function(){
          /* 豆包失败，回退到金投网CORS */
          return fetchOilPriceCORS(prov);
        });
    }
    /* 无豆包Key，直接用金投网CORS */
    return fetchOilPriceCORS(prov);
  }
}

/* 自动刷新油价（静默，进入页面时触发，每天最多自动获取一次） */
function autoRefreshOilPrice(){
  var today=new Date().toISOString().slice(0,10);
  var last=DB.oilPrices&&DB.oilPrices.lastUpdate?DB.oilPrices.lastUpdate:'';
  if(last===today) return;
  var prov=DB.oilPrices&&DB.oilPrices.prov?DB.oilPrices.prov:'湖南';
  fetchOilPriceData(prov)
    .then(function(d){
      if(d&&d.prices){
        DB.oilPrices={
          p92:d.prices.p92||DB.oilPrices.p92,
          p95:d.prices.p95||DB.oilPrices.p95,
          p98:d.prices.p98||DB.oilPrices.p98,
          p0:d.prices.p0||DB.oilPrices.p0,
          prov:d.province||prov,
          lastUpdate:today,
          source:d.source||''
        };
        saveData();
        renderOilPrice();
      }
    })
    .catch(function(){});
}

function refreshOilPrice(){
  const btn=event.target;
  const oldText=btn.textContent;
  btn.textContent='⏳ 获取中...';
  btn.disabled=true;
  var prov=DB.oilPrices&&DB.oilPrices.prov?DB.oilPrices.prov:'湖南';
  fetchOilPriceData(prov)
    .then(function(d){
      if(d&&d.prices){
        DB.oilPrices={
          p92:d.prices.p92||DB.oilPrices.p92,
          p95:d.prices.p95||DB.oilPrices.p95,
          p98:d.prices.p98||DB.oilPrices.p98,
          p0:d.prices.p0||DB.oilPrices.p0,
          prov:d.province||prov,
          lastUpdate:new Date().toISOString().slice(0,10),
          source:d.source||''
        };
        saveData();
        renderOilPrice();
        renderFavStation();
        var srcLabel=d.source?('（'+d.source+'）'):'';
        btn.textContent='✅ 已更新'+srcLabel;
        setTimeout(function(){btn.textContent=oldText;btn.disabled=false;},3000);
      }else{throw new Error(d&&d.error||'API error');}
    })
    .catch(function(err){
      btn.textContent='❌ 获取失败';
      setTimeout(function(){btn.textContent=oldText;btn.disabled=false;},2000);
      var grid=document.getElementById('oilPriceGrid');
      if(grid){
        var old=grid.querySelector('.oil-fetch-hint');
        if(old)old.remove();
        var div=document.createElement('div');
        div.className='oil-fetch-hint';
        div.style.cssText='grid-column:1/-1;text-align:center;padding:8px;font-size:12px;color:var(--ink-3);background:#fff4e6;border-radius:8px';
        div.textContent='⚠️ 在线获取失败（'+(err&&err.message||'网络错误')+'），请点击「✏️ 编辑」手动更新油价';
        grid.appendChild(div);
      }
    });
}

/* ========== 自定义确认/提示（替代 confirm/alert） ========== */
function customConfirm(title,msg,onYes,btnText){
  var old=document.getElementById('confirmModal');
  if(old) old.remove();
  var mask=document.createElement('div');
  mask.className='modal-mask show';
  mask.id='confirmModal';
  mask.onclick=function(e){ if(e.target===mask) mask.remove(); };
  mask.innerHTML='<div class="modal-box" style="max-width:380px">'+
    '<h3>'+title+'<button class="modal-close" onclick="this.closest(\'.modal-mask\').remove()">✕</button></h3>'+
    '<div style="text-align:center;padding:14px 0;font-size:14px;color:var(--ink-2);line-height:1.6">'+escapeHtml(msg)+'</div>'+
    '<div style="display:flex;gap:10px;margin-top:8px">'+
    '<button class="modal-save" style="background:#f1f5fa;color:var(--ink-2);flex:1" onclick="this.closest(\'.modal-mask\').remove()">取消</button>'+
    '<button class="modal-save" style="flex:1" id="confirmYesBtn">'+(btnText||'确认')+'</button>'+
    '</div></div>';
  document.body.appendChild(mask);
  document.getElementById('confirmYesBtn').onclick=function(){ mask.remove(); onYes(); };
}
function customAlert(msg){
  var old=document.getElementById('alertToast');
  if(old) old.remove();
  var toast=document.createElement('div');
  toast.id='alertToast';
  toast.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,30,45,.95);color:#fff;padding:16px 24px;border-radius:14px;font-size:14px;font-weight:600;z-index:10002;max-width:80vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3);white-space:pre-line;line-height:1.6';
  toast.textContent=msg;
  document.body.appendChild(toast);
  setTimeout(function(){
    toast.style.transition='opacity .3s';
    toast.style.opacity='0';
    setTimeout(function(){ toast.remove(); },300);
  },2000);
}

/* ========== 通用弹窗 ========== */
function showModal(title,formHtml,onSave){
  const old=document.getElementById('crudModal');
  if(old) old.remove();
  const mask=document.createElement('div');
  mask.className='modal-mask show';
  mask.id='crudModal';
  mask.onclick=e=>{ if(e.target===mask) mask.remove(); };
  mask.innerHTML='<div class="modal-box">'+
    '<h3>'+title+'<button class="modal-close" onclick="this.closest(\'.modal-mask\').remove()">✕</button></h3>'+
    formHtml+
    '<button class="modal-save" id="modalSaveBtn">保存</button>'+
    '</div>';
  document.body.appendChild(mask);
  document.getElementById('modalSaveBtn').onclick=()=>{
    const ok=onSave();
    if(ok!==false) mask.remove();
  };
}
function closeModal(){ const m=document.getElementById('crudModal'); if(m) m.remove(); }

/* ========== URL 参数自动配置 ========== */
function autoConfigFromURL(){
  const params=new URLSearchParams(window.location.search);
  /* 自动配置智谱API Key */
  const zhipuKey=params.get('zhipu_key');
  if(zhipuKey){
    localStorage.setItem('ajie_zhipu_key',zhipuKey);
  }
  /* 自动配置豆包API Key */
  const doubaoKey=params.get('doubao_key');
  if(doubaoKey){
    localStorage.setItem('ajie_doubao_key',doubaoKey);
  }
  /* 自动配置Supabase */
  const wsUrl=params.get('url');
  const wsKey=params.get('key');
  const wsId=params.get('ws');
  if(wsUrl&&wsKey&&wsId){
    const cfg={url:wsUrl.replace(/\/+$/,''),anonKey:wsKey,workspaceId:wsId};
    CLOUD_CFG=cfg;
    saveCloudConfig(cfg);
    return true;
  }
  return false;
}
function showConnectToast(){
  const toast=document.getElementById('connectToast');
  const wsName=document.getElementById('ctWsName');
  if(toast&&wsName&&CLOUD_CFG.workspaceId){
    wsName.textContent='☁️ 工作区：'+CLOUD_CFG.workspaceId;
    toast.classList.add('show');
  }
}
function generateShareLink(){
  if(!CLOUD_CFG.url||!CLOUD_CFG.anonKey||!CLOUD_CFG.workspaceId){
    customAlert('请先启用云同步，再生成分享链接');
    return '';
  }
  const base='https://xiaosong2011.github.io/ajie-workbench/';
  const params=new URLSearchParams({
    url:CLOUD_CFG.url,
    key:CLOUD_CFG.anonKey,
    ws:CLOUD_CFG.workspaceId
  });
  return base+'?'+params.toString();
}

(async function(){
  if(sbClient){
    const cloudData=await loadFromCloud();
    if(cloudData&&typeof cloudData==='object'){
      isRemoteUpdate=true;
      DB=cloudData;
      ensureKeys();
      localStorage.setItem(STORE_KEY,JSON.stringify(DB));
      const cur=document.querySelector('.nav-item.active');
      if(cur)switchSection(cur.dataset.id);
      isRemoteUpdate=false;
    }
    subscribeCloud();
    startPolling();
    /* 如果是通过分享链接打开的，显示连接成功提示 */
    if(fromURL){
      setTimeout(showConnectToast,500);
    }
  }
})();

  var btn=e.target.closest('.btn');
  if(!btn) return;
  var rect=btn.getBoundingClientRect();
  var size=Math.max(rect.width,rect.height);
  var ripple=document.createElement('span');
  ripple.className='ripple';
  ripple.style.width=ripple.style.height=size+'px';
  ripple.style.left=(e.clientX-rect.left-size/2)+'px';
  ripple.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.appendChild(ripple);
  setTimeout(function(){ripple.remove();},500);
},true);
