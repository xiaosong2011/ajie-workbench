n- 展示领型、肩线、袖型、门襟、收省、拼接、衣摆和闭合方式。\n- 标明面料、纹理、厚度感、里外层关系与主要工艺。\n\n### 裤子或裙子\n\n- 展示腰头、褶量、裤线或裙褶、开衩、收口、下摆与活动余量。\n- 只呈现参考图中的实际下装类型。\n\n### 披风\n\n- 展示领部固定点、肩部覆盖、长度、开口、垂坠和内外层材质。\n- 参考图无披风时只标注“无此结构”。\n\n### 鞋子\n\n- 展示鞋面、鞋头、鞋帮、鞋底、鞋跟、系带或扣合结构。\n- 至少包含外侧轮廓和关键工艺局部，保持左右鞋设计一致。\n\n### 腰带\n\n- 展示带身、扣具、孔位、压边、挂点、层叠顺序与连接方式。\n- 腰封、束带和硬质腰带须按参考图准确分类，不得混用。\n\n### 护甲\n\n- 展示甲片分区、重叠方向、活动关节、固定带、铆钉或系结方式。\n- 区分金属、皮革、硬质织物及其他材料的表面反射。\n- 参考图无护甲时只标注“无此结构”。\n\n### 配件\n\n- 拆解参考图中存在的扣件、挂件、护腕、手套、首饰、包袋或功能附件。\n- 标明材质、位置、固定方式和与主服装的比例关系。\n\n## 图案与工艺拆解\n\n### 纹样\n\n- 放大展示纹样单元、重复规律、方向、边界和在服装上的准确位置。\n- 不补齐参考图中不可见的复杂纹样，不改变图案比例和密度。\n\n### 刺绣\n\n- 展示针脚方向、线材粗细感、色线层次、起伏厚度和边缘收针。\n- 区分平绣、盘绣、贴布、珠绣或参考图可见的其他工艺；无法判断时标注“工艺待确认”。\n\n### 面料\n\n- 为每种主要面料提供独立材质样片。\n- 描述纤维或材料类型、织法、表面纹理、厚薄、软硬、垂坠、粗糙度、光泽与透光特征。\n- 不用抽象的“高级感”“电影感”代替具体物理属性。\n\n### 缝线\n\n- 放大展示针距感、单双线、压线位置、包边、锁边、拼缝和加固点。\n- 缝线颜色、粗细和走向必须服从参考图，不得添加装饰性走线。\n\n### 制作工艺\n\n- 标注裁片拼接、褶裥、压褶、包边、滚边、铆接、系结、扣合、染色、印花或旧化等可见工艺。\n- 无法从参考图确认的内容标注“待确认”，不得编造确定结论。\n\n## 材质与颜色参考\n\n- 从参考图提取主要面料、辅料、金属、皮革或其他材质的独立样片。\n- 每个材质样片使用近距离纹理展示，并保留真实的经纬、颗粒、划痕、磨损或反射特征。\n- 颜色参考使用整齐排列的色块，按主色、辅色、点缀色和金属色分类。\n- 使用简体中文颜色名称和相对明度、饱和度描述，不使用十六进制色值。\n- 颜色样片必须来自参考图，不得擅自调成另一套配色。\n\n## 中文标注规范\n\n所有标注使用简体中文，至少包含：\n\n- 服装名称\n- 部件名称\n- 材质\n- 纹理\n- 工艺\n\n标注要求：\n\n- 使用短句和引导线，文字不得覆盖服装、纹样或材质样片。\n- 引导线必须准确指向对应结构，不得交叉混乱。\n- 字体大小、字重和对齐方式保持统一。\n- 不得出现英文替代、乱码、错别字、虚构品牌或无依据的专有名词。\n- 图像模型生成文字不清晰时，继续修正，不得交付明显乱码版本。\n\n## 标准版式\n\n采用专业 Costume Sheet 排版：\n\n- 使用横向大画布和纯白背景。\n- 左侧或中央设置正面、侧面、背面三个等高全身视图。\n- 右侧与下方设置整体服装说明、部件拆解、局部放大、材质样片和颜色样片。\n- 正侧背人物脚底对齐同一基线，人物尺度一致。\n- 局部放大至少覆盖服装闭合结构、代表性纹样或刺绣、缝线以及关键配件。\n- 各模块之间保留清晰留白，不得拼贴重叠或裁切。\n- 画面使用均匀柔和的影棚主光与克制的接触阴影，忠实呈现颜色和材质。\n- 禁止剧情背景、环境道具、海报构图、水印、签名和无关装饰。\n\n## 默认生成指令\n\n根据所附角色参考图，生成专业角色服装设定图。参考图是服装设计的唯一视觉标准，严格保持同一人物身份、身体比例、发型、服装整体轮廓、叠穿顺序、色彩、材质、纹样、刺绣、缝线、配件和艺术风格。采用横向 Costume Sheet 布局、纯白背景、均匀柔和的影棚光照。完整展示正面、标准侧面、背面三个等高全身视图，并拆解整体服装、上衣、实际存在的裤子或裙子、披风、鞋子、腰带、护甲、纹样、刺绣、面料、缝线和配件；加入关键局部放大、材质样片与颜色样片。使用简体中文准确标注服装名称、部件名称、材质、纹理和工艺。参考图没有的披风、护甲、刺绣或其他部件只标注“无此结构”或“无此工艺”，绝不新增。严禁重新设计、换款、改变配色、改变材质、增删装饰、虚构背面纹样、换脸、比例漂移、文字乱码、结构穿插、剧情背景、水印和签名。\n\n## 生成后质检\n\n交付前逐项检查：\n\n- 是否忠实还原参考图，而非生成相似风格的新服装。\n- 正面、侧面和背面是否为同一角色、同一比例和同一套服装。\n- 服装轮廓、长度、层级、闭合方式和配件数量是否一致。\n- 正侧背的腰带、滚边、纹样、接缝和披风固定点是否连续对齐。\n- 是否擅自新增或删除披风、护甲、口袋、扣件、刺绣或配件。\n- 上衣、下装、鞋履、腰带、护甲和配件拆解是否与整体视图对应。\n- 面料、金属、皮革、刺绣和缝线是否具有可辨认的物理差异。\n- 局部放大是否来自整体服装的真实位置，而非独立的新设计。\n- 材质样片和颜色样片是否忠实来自参考图。\n- 所有中文标签是否准确、清晰，并正确指向对应结构。\n- 是否存在错字、乱码、穿模、部件粘连、正反面矛盾或画面裁切。\n\n任一关键项不合格时，继续定向修正，不得把明显改款、配色漂移、隐藏结构乱造、标签错误或前后不一致的图片作为最终结果。\n\n## 安全边界\n\n- 未成年角色只保留符合年龄的原始服装设计，严禁性化改造。\n- 不加入暴露、血腥、伤口或与服装拆解无关的刺激元素。\n- 不将普通角色替换成现实公众人物或受版权保护角色。',tag:'小逻角色'},
    {title:'小逻-角色表情设定',desc:'# 小逻-角色表情设定\n\n## 核心目标\n\n根据用户提供的角色参考图，生成一张专业的角色表情设定图（Animation Expression Sheet）。\n\n参考图是角色唯一视觉标准。十二种表情只能改变面部表演及必要的轻微头部动态，不得重新设计人物。\n\n必须完整继承：\n\n- 人物身份、年龄感、性别呈现与人种特征\n- 头骨轮廓、脸型、五官比例与面部不对称特征\n- 眉形、眼型、虹膜颜色、鼻形、唇形、耳形与皮肤特征\n- 发际线、发型结构、发色、发丝质感与发饰\n- 身材可见比例、服装、配饰、材质与艺术风格\n- 固定机位、透视关系、背景、光源方向、曝光与白平衡\n\n严禁换脸、过度美化、年龄漂移、五官重塑、服装变化、发型变化、光照漂移或画风漂移。\n\n## 输入门槛\n\n1. 必须获得至少一张清晰的角色参考图，再执行生成。\n2. 若没有参考图，停止生成，并只请求用户上传角色参考图。\n3. 若存在多张参考图，先判断是否属于同一角色；若外观互相冲突，请用户指定唯一主参考图。\n4. 必须实际查看参考图，识别人物身份锚点、服装、发型、配饰、画风和光照，不得仅依据文件名或用户概述推断。\n5. 参考图只显示局部时，保持可见信息不变；不得擅自补造会影响人物身份的关键特征。\n\n## 执行流程\n\n1. 查看参考图，提炼角色不可变视觉锚点。\n2. 调用可用的图像生成或图像编辑能力，并在每轮生成或修改时持续携带原始参考图。\n3. 生成一张包含十二个独立表情单元的完整设定板。\n4. 检查身份、表情差异、解剖结构、标签文字、排版和裁切。\n5. 发现问题时进行定向修改；修改单个问题时不得破坏已经正确的身份与版式。\n6. 默认只交付最终图像；仅在缺少参考图、输入冲突或工具受限时简短说明。\n\n## 身份一致性锁定\n\n将以下内容视为不可变资产：\n\n- 头骨宽窄、颧骨位置、下颌转折、下巴长度\n- 双眼间距、眼裂走向、上下眼睑厚度、虹膜颜色\n- 眉峰位置、眉毛浓淡与左右天然差异\n- 鼻梁高度、鼻翼宽度、鼻尖形态\n- 人中长度、唇峰、上下唇厚度、嘴角天然走向\n- 肤色、皮肤纹理、痣、雀斑、疤痕等稳定识别点\n- 发际线、刘海分区、发束走向、发长、发色与发饰\n- 服装版型、领口、面料、纹样、颜色与配饰\n\n每一格都必须能被判断为同一角色在同一时刻完成的表演测试。不得通过更换妆容、发型、服装、首饰或环境来表达情绪。\n\n## 固定拍摄标准\n\n- 采用统一的头肩像或胸像裁切，默认正面视角；若参考图只能支持四分之三视角，则十二格统一使用相同角度。\n- 十二格保持相同焦段感、透视、头部大小、眼线高度、肩线位置和留白比例。\n- 使用纯白影棚背景或中性灰背景，不得出现剧情场景、环境道具或装饰性背景。\n- 使用同一光源方向、光比、色温、曝光、阴影软硬和眼神光位置。\n- 表情变化以眼神、眉毛、眼睑、鼻翼、嘴型、下颌和面部肌肉为核心。\n- 默认保持头部角度一致；只有“疑惑”或“羞涩”允许极轻微偏转，但不得改变构图与人物识别。\n- 不得加入手势、手部、全身姿势或与表情无关的肢体动作。\n\n## 十二表情标准\n\n严格按以下顺序和差异生成：\n\n### ① 平静\n\n- 视线自然聚焦，眼睑处于正常开合状态。\n- 双眉舒展，眉间无明显挤压。\n- 双唇自然闭合或保留极窄唇缝，嘴角不抬不坠。\n- 下颌、鼻翼和面颊肌肉放松。\n\n### ② 微笑\n\n- 目光柔和，眼睑轻微收窄，但不得挤成大笑状态。\n- 两侧嘴角小幅上扬，双唇默认闭合。\n- 面颊只有轻微抬升，鼻翼和下颌保持放松。\n- 表演强度必须低于“开心”。\n\n### ③ 开心\n\n- 眼神明亮，眼睑明显收窄，面颊向上抬升。\n- 嘴角充分上扬，可轻微露齿，但不得张口大笑。\n- 鼻唇沟比“微笑”更清晰，眉毛自然舒展。\n- 表演强度高于“微笑”、低于“大笑”。\n\n### ④ 悲伤\n\n- 眉头内侧上提，眉尾轻微下压。\n- 上眼睑沉重，下眼睑轻度绷紧，眼中可有薄层湿润感。\n- 嘴角轻微下坠，下唇产生克制的紧张或细微颤动。\n- 不出现连续泪痕，强度必须低于“哭泣”。\n\n### ⑤ 愤怒\n\n- 双眉向内、向下压紧，眉间形成明确纵向褶皱。\n- 视线锁定前方，上下眼睑收紧。\n- 鼻翼轻微张开，咬肌和下颌收紧。\n- 双唇紧抿，或只露出极少牙齿；不得夸张扭曲面部。\n\n### ⑥ 害怕\n\n- 双眉上提并向眉心聚拢，额头产生横向与中央褶皱。\n- 上眼睑大幅抬起，下眼睑紧绷，瞳孔视线集中。\n- 嘴角横向拉开，嘴唇微张，下颌略向后收。\n- 与“惊讶”的区别是眉心聚拢、下眼睑紧张和嘴角横向拉伸。\n\n### ⑦ 惊讶\n\n- 双眉整体高抬但不过度聚拢，额头横纹较均匀。\n- 双眼圆睁，下眼睑不出现“害怕”式强烈紧绷。\n- 下颌自然下落，嘴型呈清晰圆形或椭圆形。\n- 与“害怕”的区别是面部张力更开放，眉心与嘴角不向中央拉扯。\n\n### ⑧ 疑惑\n\n- 一侧眉毛上挑，另一侧眉毛轻微下压，形成明确不对称。\n- 一侧眼睑微眯，视线带有重新判断目标的停顿。\n- 一侧嘴角轻微收紧或偏移。\n- 可出现极轻微头部偏斜，但人物比例与机位保持一致。\n\n### ⑨ 羞涩\n\n- 视线轻微下垂或侧移，眼睑柔和收窄。\n- 双眉放松，嘴角呈克制的小幅上扬。\n- 面颊可出现自然、轻微的暖色变化，不得使用夸张腮红符号。\n- 头部可轻微偏转，不得性化表演或加入手部遮挡。\n\n### ⑩ 冷漠\n\n- 视线平直或略微下压，上眼睑比“平静”更低。\n- 双眉趋于平直，眉间无显著动作。\n- 双唇水平闭合，面颊和嘴角保持低活动状态。\n- 与“平静”的区别是眼睑更沉、视线更疏离、口周肌肉更克制。\n\n### ⑪ 哭泣\n\n- 眉头内侧明显上提，眉尾下压，眼睑出现细微颤动。\n- 眼眶积泪并形成自然泪痕，泪水遵循重力和皮肤表面走向。\n- 鼻翼轻张，鼻尖可轻微泛红。\n- 下唇颤动或嘴角下拉，面部仍需保持角色身份，不得扭曲成陌生脸。\n- 与“悲伤”的区别是出现明确泪水和更强烈的眼睑、鼻翼、口周肌肉反应。\n\n### ⑫ 大笑\n\n- 眼睑明显收窄，眼角产生与年龄相符的自然纹理。\n- 面颊高抬，鼻唇沟清晰。\n- 下颌张开，嘴角充分上扬；牙齿、牙龈和舌头必须符合人体结构。\n- 与“开心”的区别是张口幅度、面颊抬升和眼轮匝肌参与更明显。\n\n## 表情强度与差异锁定\n\n- 微笑 ＜ 开心 ＜ 大笑。\n- 平静与冷漠必须通过眼睑、视线和口周肌肉活动量区分。\n- 悲伤与哭泣必须通过泪水及面部应激强度区分。\n- 惊讶与害怕必须通过眉心聚拢、下眼睑紧张和嘴角方向区分。\n- 十二格不得出现重复表情、近似复制、镜像复制或只改变嘴型而忽略眉眼肌肉的情况。\n\n## 标准版式\n\n采用专业 Animation Expression Sheet 布局：\n\n- 单张完整设定板，四列三行，十二个等尺寸单元格。\n- 第一行：平静、微笑、开心、悲伤。\n- 第二行：愤怒、害怕、惊讶、疑惑。\n- 第三行：羞涩、冷漠、哭泣、大笑。\n- 每格使用相同头肩像比例、相同眼线、相同视角与相同背景。\n- 每格下方标注对应的简体中文表情名称。\n- 标签必须准确、清晰、无乱码、无错别字，不得出现英文替代标签。\n- 四周保留安全边距，任何发梢、下巴、肩部或标签不得被裁切。\n- 可使用细而克制的分隔线，不得加入复杂边框、剧情元素、装饰图案或海报式标题。\n\n## 默认生成指令\n\n根据所附角色参考图，生成专业角色表情设定图。参考图是人物唯一视觉标准，严格保持同一人物身份、面部骨相、五官比例、肤色、发型发色、服装、配饰、材质表现、艺术风格、固定机位与固定光照。画面采用纯白影棚背景或中性灰背景，统一头肩像裁切，正面固定视角，四列三行 Animation Expression Sheet 布局。依次展示并以简体中文准确标注：平静、微笑、开心、悲伤、愤怒、害怕、惊讶、疑惑、羞涩、冷漠、哭泣、大笑。每种表情必须通过眼神、眉毛、眼睑、鼻翼、嘴型、下颌与面部肌肉变化清晰区分。严禁换脸、五官漂移、年龄漂移、发型变化、服装变化、配饰变化、光照变化、重复表情、错误文字、乱码、拼贴错位、剧情背景、手部、道具、水印和签名。\n\n## 生成后质检\n\n交付前逐项检查：\n\n- 是否恰好十二格，且顺序与版式一致。\n- 十二格是否均为同一人物，而非相似人物或不同年龄版本。\n- 面部骨相、五官比例、皮肤特征、发际线与发型是否稳定。\n- 服装、配饰、背景、构图、透视和光照是否完全一致。\n- 每种表情是否同时体现眼神、眉毛、嘴型和面部肌肉变化。\n- 四组易混表情是否具有明确、可解释的物理差异。\n- 牙齿、舌头、泪水、眼球、眼睑和下颌结构是否自然。\n- 是否存在重复五官、重影、额外眼睛、面部粘连或边缘溶解。\n- 十二个中文标签是否准确、清晰、位置统一。\n- 所有头部、肩部和标签是否完整落在画布安全区内。\n\n任一关键项不合格时，继续定向修正，不得把明显换脸、错字、重复表情或结构异常的图片作为最终结果。\n\n## 安全边界\n\n- 未成年角色只生成符合年龄的自然表情与服装表现，严禁性化。\n- 不加入血腥伤口、虐待痕迹或其他与表情设定无关的刺激元素。\n- 不将普通角色替换成现实公众人物或受版权保护角色。',tag:'小逻角色'},
    {title:'小逻-角色设定图',desc:'# 小逻-角色设定图\n\n根据参考图生成专业角色设定图。参考图是角色唯一视觉标准；文字说明只用于限定任务范围，不得覆盖参考图中可见的视觉事实。\n\n默认交付一张完整角色设定板，不输出创作解释。用户明确要求拆分图、无字版或单独视图时，再增加对应交付物。\n\n## 前置条件\n\n- 必须存在至少一张清晰角色参考图。\n- 缺少参考图时，停止生成并请用户上传；不得仅凭文字擅自设计人物。\n- 参考图无法看清面部、全身或服装时，先使用现有信息完成可确认部分；只有缺失内容会实质改变角色时才询问用户。\n- 多张参考图存在冲突时，以用户明确指定的主参考图为准。用户未指定且冲突会改变角色身份时，必须请用户选择主参考图。\n- 开始生成前完整查看参考图。参考图为本地文件时先进行视觉检查；参考图来自对话时，确保图像被一同传入图像生成或编辑工具。\n\n## 工具工作流\n\n1. 读取并遵守可用的图像生成技能。\n2. 使用图像生成或图像编辑工具制作设定图，不用纯代码重绘人物。\n3. 把原始参考图作为每轮生成和修订的视觉依据，不得只把上一轮结果作为新参考。\n4. 生成后逐项检查人物一致性、视图方向、版面、文字和裁切。\n5. 存在关键错误时，携带原始参考图与当前结果进行定向修订，直到硬校验通过。\n\n## 参考图锁定\n\n必须完整继承：\n\n- 人物身份、年龄观感、性别呈现与地域面孔。\n- 脸型、额头、眉骨、眉形、眼型、瞳色、眼距、鼻梁、鼻翼、唇形、颧骨、下颌、耳形和皮肤纹理。\n- 发际线、分缝、刘海、束发结构、头发长度、发色、卷曲度、发量和发丝质地。\n- 肤色、身材比例、肩宽、腰线、四肢长度、头身比和站姿习惯。\n- 服装廓形、内外层次、领型、袖型、腰线、下摆、颜色、纹样、接缝、扣件和磨损。\n- 鞋履、首饰、眼镜、帽饰、护具、腰带、挂件及其他配饰。\n- 布料、皮革、金属、塑料、木材、毛发和皮肤的材质表现。\n- 原图的写实、绘画、动画、三维渲染或其他艺术风格。\n- 原图的光源方向、软硬关系、色温、对比度和高光性质。\n\n严禁：\n\n- 美化、幼化、老化、瘦脸、增肌、改变身材或更换人种特征。\n- 改变五官比例、瞳色、肤色、发型、发色、服装颜色、服装结构和配饰数量。\n- 把写实角色改成插画，把插画改成写实，或混入第二种艺术风格。\n- 添加参考图中不存在的纹样、徽章、文字、首饰、武器、伤疤或超自然器官。\n- 删除参考图中清晰可见的痣、疤痕、纹样、扣件、饰品和非对称设计。\n- 使用现实公众人物或其他角色替换参考人物。\n\n## 不可见区域补全\n\n- 只根据参考图中的接缝走向、材质厚度、服装对称性、发束结构和正常人体构造补全背面与遮挡区域。\n- 参考图存在明确非对称设计时，延续非对称关系，不得强行镜像。\n- 无法确认的背部结构使用最保守、最少装饰、最符合正侧面结构的方案。\n- 不得在背面擅自增加图案、开口、披风、背包、挂件或发饰。\n- 被手臂遮挡的服装接缝应按上下可见线段平滑连接，不创造新的裁片。\n\n## 设定板固定内容\n\n完整设定板必须包含以下九项，并使用清晰中文标题：\n\n1. `角色肖像`：肩部以上或胸像，使用与参考图一致的面部角度和表情基调，清楚展示五官与皮肤。\n2. `正面`：全身正面，中立站姿，双脚完整，双臂与躯干保持轻微间隔，避免遮挡腰线和侧缝。\n3. `左侧面`：全身正交左侧视图，展示角色左侧轮廓，鼻尖朝画面右侧，不得误生成右侧面。\n4. `背面`：全身正交背面，与正面保持相同身高、头顶线、脚底线和身体比例。\n5. `发型结构`：至少展示发型正面、左侧与背面的小型结构视图，标明分缝、束发点、层次和发尾方向。\n6. `面部细节`：正面与三分之二面部近景，突出眉眼、鼻唇、肤质、痣、疤痕和妆容。\n7. `服装细节`：展示领口、袖口、腰部、扣件、接缝、纹样和鞋履等关键局部。\n8. `材质参考`：提取角色实际存在的主要材质色板，展示布料织纹、皮革、金属、毛发或其他表面。\n9. `中文设计标注`：使用简短准确的中文标注说明结构、材质、颜色和功能，标注线不得穿过面部。\n\n## 三视图标准\n\n- 正面、左侧面和背面使用同一角色、同一服装、同一配饰、同一发型、同一身体比例。\n- 三视图使用近似正交投影或长焦低畸变视角，不使用广角透视。\n- 三视图的头顶、眼线、肩线、腰线、膝线和脚底线必须水平对齐。\n- 三视图保持同一缩放比例，不得一大一小。\n- 使用中立自然站姿或轻微标准站姿，不使用剧情动作、战斗姿势、奔跑、扭腰或夸张透视。\n- 双腿自然分开，双脚方向符合对应视角，不得交叉。\n- 手掌自然放松，手指结构完整；双臂与躯干保持间隙，便于观察服装侧缝。\n- 背面只能看到后脑、背部和后侧肢体，不得回头露出正脸。\n- 左侧面只能呈现单一左侧轮廓，不得出现双眼同时可见的三分之二角度。\n\n## 面部一致性\n\n- 所有视图必须保留相同的颅骨宽度、脸长、颧骨位置、下颌角度和五官间距。\n- 肖像、面部细节和三视图使用相同瞳色、眉形、鼻型、唇形、耳形和皮肤标记。\n- 不得因侧面或背面视图改变年龄观感。\n- 原图为自然脸部不对称时，保留不对称；不得自动磨皮或对称化。\n- 面部细节必须保持原图的毛孔、雀斑、痣、疤痕、妆容边界和皮肤反射。\n\n## 发型一致性\n\n- 固定发际线、分缝、刘海数量、束发点位置、发束粗细和发尾长度。\n- 发型正面、左侧和背面必须在空间结构上互相对应。\n- 长发在三视图中保持相同长度，不得忽长忽短。\n- 发饰的数量、位置、角度和材质必须一致。\n- 遮挡背部服装的长发可在发型结构小图中轻微分开展示，但不得改变发型设计。\n\n## 服装与材质一致性\n\n- 固定服装裁片数量、叠穿关系、左右开合、扣件位置、接缝走向、纹样方向与旧化位置。\n- 正面看见的侧缝、腰带、披挂和衣摆必须在侧面及背面正确延续。\n- 配饰不得在不同视图中消失、复制、换边或改变大小。\n- 材质参考只能提取参考图中真实存在的材质，不增加无关色板。\n- 布料表现纤维、垂坠与折痕；皮革表现毛孔、压纹与磨损；金属表现粗糙度、边缘反射与氧化；毛发表现发束与细丝层次。\n- 原图中手持物不放入三视图手中；如属于角色核心设计，单独放入服装细节区展示。\n\n## 版面规范\n\n- 使用影视或游戏制作常见的横向角色设定板，默认采用宽幅横版。\n- 中央区域放置正面、左侧面和背面三视图，占据最大视觉面积。\n- 左侧区域放置角色肖像、面部细节和发型结构。\n- 右侧区域放置服装细节、材质参考和中文设计标注。\n- 版面使用严格网格、统一边距和稳定留白，不做随意拼贴。\n- 默认使用纯白无缝影棚背景；参考图在纯白背景上轮廓不清时使用中性浅灰背景。\n- 背景只能是纯色，不得生成街道、房间、森林、战场、天空、烟雾或其他剧情环境。\n- 灯光保持均匀、低戏剧性，确保正侧背材质与颜色可直接比较。\n- 所有视图完整入画，不裁切头顶、发尾、手指、鞋底、衣摆或配饰。\n\n## 中文标注\n\n- 标题与标注全部使用简体中文。\n- 推荐固定标题：`角色肖像`、`正面`、`左侧面`、`背面`、`发型结构`、`面部细节`、`服装细节`、`材质参考`。\n- 标注内容控制在二至十个汉字，使用具体词语，如“磨砂牛皮”“双层斜襟”“暗金氧化”“后脑束发点”。\n- 不使用无意义段落、英文占位符、乱码、伪汉字、随机数字或装饰性文字。\n- 标注线使用细直线或折线，端点准确指向对应结构，不穿过人物面部与主要轮廓。\n- 生成后逐字检查标题与标注。出现错字、乱码、重复文字或不可辨识字形时必须修订，不得直接交付。\n\n## 输出要求\n\n- 默认输出一张高分辨率完整角色设定板。\n- 保持参考图的横竖笔触、渲染方式、颗粒、边缘处理和颜色空间观感。\n- 只展示同一个角色，不得出现替代人物、第二角色或不同年龄版本。\n- 不生成剧情背景、剧情动作、气氛特效、镜头运动、海报标题、品牌标识、签名或水印。\n- 用户没有要求角色变装时，不生成额外服装版本。\n- 用户没有要求表情表时，不添加表情九宫格。\n- 用户明确指定白色或中性灰背景时严格遵循；未指定时默认纯白。\n\n## 交付前硬校验\n\n逐项静默检查：\n\n- 参考图已被实际加载并作为本轮生成依据。\n- 角色肖像、正面、左侧面、背面、发型结构、面部细节、服装细节、材质参考和中文标注全部存在。\n- 正面、左侧面和背面属于同一人物，身高、眼线、头身比和服装完全一致。\n- 左侧面鼻尖朝画面右侧，且没有误用右侧面或三分之二角度。\n- 背面没有回头露出正脸。\n- 面部骨相、瞳色、肤色、发型、发色、身材比例与参考图一致。\n- 服装裁片、纹样、接缝、配饰和材质没有增删、换边或漂移。\n- 非对称特征没有被错误镜像。\n- 手指、双脚、头顶、发尾、衣摆和配饰完整，没有裁切、融合或重复。\n- 所有中文标题与标注正确、清晰、可读。\n- 背景为纯白或中性灰，没有剧情环境。\n- 版面采用明确网格，不是无序拼贴。\n- 最终结果不包含额外人物、额外服装、标识、签名或水印。',tag:'小逻角色'},
    {title:'小逻-角色道具设定',desc:'# 小逻-角色道具设定\n\n## 核心目标\n\n根据用户提供的角色参考图，生成专业的影视游戏角色道具设定图（Prop Design Sheet），完整盘点、还原和拆解角色已经拥有的全部道具。\n\n参考图是道具外观的唯一视觉标准。只允许整理、分离、旋转、放大、拆解和标注参考图中已经存在的设计信息，禁止重新设计或擅自增加道具。\n\n必须继承：\n\n- 道具整体轮廓、用途、时代属性、世界观风格与制作逻辑\n- 长宽厚比例、部件数量、连接位置与佩戴位置\n- 材质、颜色、表面纹理、磨损、反射和透明特征\n- 纹样、雕刻、镶嵌、铭文、缠绕、扣合与装配方式\n- 武器、法器、背包、首饰、发饰、戒指、耳环、项链、腰饰、挂件和特殊装备\n- 参考图的线条语言、渲染方式、光影与艺术风格\n\n## 输入门槛\n\n1. 必须获得至少一张清晰、能辨认角色道具的参考图，再执行生成。\n2. 若没有参考图，停止生成，并只请求用户上传参考图。\n3. 必须实际查看参考图，逐项盘点所有可见道具，不得仅依据文件名或文字概述推断。\n4. 若多个道具重叠、被手部遮挡或仅露出局部，标记为“部分可见”；不得把猜测当成确定结构。\n5. 若多张参考图中的同一道具外观互相冲突，请用户指定唯一主参考或明确不同版本。\n6. 若用户要求内部结构、背面或展开状态，但参考图未提供，优先请求补充视图；用户明确允许保守补全时，只能延续可见结构和制造逻辑，不得增加新的功能或装饰。\n\n## 执行流程\n\n1. 查看参考图，建立道具清单与不可变视觉锚点。\n2. 将道具分为主要道具、穿戴型道具和小型饰品。\n3. 区分“清晰可见”“部分可见”“不可见”和“无此道具”。\n4. 确认每件道具的数量、左右关系、佩戴位置和与角色的相对比例。\n5. 调用可用的图像生成或图像编辑能力，并在每轮生成或修改时持续携带原始参考图。\n6. 生成完整的整体视图、多视图、结构拆解、尺寸比例、材质、颜色、纹样和中文标注。\n7. 若道具过多导致信息拥挤，拆分为连续编号的多张设定板；所有设定板保持同一版式、光照和标注体系。\n8. 检查道具数量、造型一致性、结构逻辑、材质、文字和裁切；不合格时继续定向修正。\n9. 默认只交付最终图像；仅在缺少参考图、隐藏结构无法确认或输入冲突时简短说明。\n\n## 道具清单规则\n\n逐类核验，但只展示参考图中实际存在的项目：\n\n- 武器：刀、剑、枪、弓、杖、盾、暗器及其鞘套、箭袋或收纳结构。\n- 法器：符印、法杖、法盘、铃、镜、珠、卷轴、容器及其他仪式性器物。\n- 背包：包体、背带、扣具、口袋、封口和外挂系统。\n- 首饰：手镯、臂环、胸针、头饰、颈饰及其他佩戴型装饰。\n- 发饰：发簪、发冠、发夹、发带、珠串及固定结构。\n- 戒指：数量、佩戴手指、戒面、戒托、镶嵌和内圈。\n- 耳环：单只或成对关系、耳针、耳扣、吊坠和活动连接。\n- 项链：链节、连接扣、坠饰、长度关系和佩戴层级。\n- 腰饰：腰牌、玉佩、香囊、工具袋、链饰和腰部挂接件。\n- 挂件：坠件、绳结、流苏、铭牌、护符及与主体的连接方式。\n- 特殊装备：护目、机关、容器、仪器、通讯、能源或世界观特有装备。\n\n参考图没有某一类别时，标注“无此道具”，不得为填充版面而新增。\n\n## 禁止重新设计\n\n- 不改变道具轮廓、比例、颜色、材质和装饰密度。\n- 不增加或删除刀刃、握柄、护手、扣件、挂环、宝石、链节、口袋和功能结构。\n- 不把普通饰品改造成武器、机关或法器。\n- 不擅自加入发光、悬浮、变形、展开、组合或机械运动状态。\n- 不虚构参考图中不可见的内部机械、能源核心、机关传动和背面纹样。\n- 不把磨损道具修成全新，也不把洁净道具增加做旧、裂纹或污渍。\n- 不借用现实品牌标识、公众人物专属物件或受版权保护角色的标志性道具。\n- 不通过夸张透视和戏剧性动作改变道具真实结构。\n\n## 多视图标准\n\n### 整体视图\n\n- 每件主要道具先展示完整主体，轮廓清楚，无遮挡，无手部握持。\n- 使用标准正面或最能说明结构的主视图。\n- 道具全部落在安全区内，刀尖、流苏、链条和背带不得被裁切。\n\n### 正面、侧面与背面\n\n- 武器、法器、背包和特殊装备默认展示主视图、标准侧视和背视。\n- 三个视图保持相同尺度、相同朝向逻辑和接近正投影的中长焦透视。\n- 侧视准确体现厚度、层叠和凸起，背视准确体现固定、闭合和佩戴结构。\n- 小型首饰至少展示正面、侧面和连接结构；无需机械复制大型道具版式。\n\n### 拆解视图\n\n- 沿真实装配顺序排列可分离部件，并用细引导线说明连接关系。\n- 只拆解参考图能确认的外部结构。\n- 不展示无依据的内部剖面、虚构齿轮、线路或能源核心。\n- 无法确认拆卸方式时，改用“外部结构分区”，并标注“内部结构待确认”。\n\n### 局部放大\n\n- 放大展示关键连接点、扣具、握柄、刃口、镶嵌、纹样、雕刻、缠绕、链节或磨损。\n- 局部必须能在整体视图中找到准确对应位置。\n- 不得在局部放大中新增整体视图不存在的花纹和零件。\n\n## 尺寸与比例\n\n- 优先使用角色参考图中的身体、手掌、腰宽或头部作为相对比例依据。\n- 使用统一的比例标尺、简化轮廓或无品牌的中性尺寸参照，不展示完整人物。\n- 用户提供真实尺寸时，准确使用用户数值。\n- 用户未提供真实尺寸时，只标注“相对尺寸”“角色佩戴比例”或部件间比例，不虚构厘米、重量或容量。\n- 成对饰品保持相同尺寸；左右不对称设计必须有参考图依据。\n- 主视图、侧视、背视和拆解图中的同一部件不得忽大忽小。\n\n## 材质拆解\n\n为参考图中每种主要材质制作独立样片，并描述具体物理属性：\n\n- 金属：锻造、铸造、拉丝、抛光、氧化、锈蚀、刃口磨痕和反射清晰度。\n- 木材：木纹方向、导管、漆层、磨损、开裂和边缘包浆。\n- 皮革：粒面、压纹、厚度、油蜡感、折痕、缝边和磨耗。\n- 织物：纤维、织法、绒毛、粗糙度、垂坠、透光和染色不均。\n- 石材或玉质：颗粒、纹理、通透度、内部棉絮、边缘高光和打磨方式。\n- 玻璃或晶体：透明度、折射、内含物、切面和边缘反射。\n- 骨、陶、漆器或其他材料：按参考图表现表面孔隙、釉面、裂纹、层次和光泽。\n\n不得用“高级感”“电影感”“神秘材质”等抽象词替代可见的物理特征。\n\n## 颜色参考\n\n- 从参考图提取主色、辅色、点缀色、金属色和发光色。\n- 使用整齐排列的色块，并以简体中文颜色名称标注。\n- 描述相对明度、饱和度、冷暖和表面光泽，不使用十六进制色值。\n- 同一材料的主视图、侧视、背视和局部放大必须保持同一颜色。\n- 不擅自优化配色、增加渐变或替换成另一套色彩方案。\n\n## 纹样与装饰\n\n- 放大展示纹样单元、雕刻深浅、重复规律、方向和边界。\n- 标明纹样位于道具的准确区域以及与结构线的关系。\n- 镶嵌物需展示底座、卡爪、包边或其他可见固定方式。\n- 绳结、流苏、链条和珠串需展示数量、连接顺序与重力方向。\n- 参考图无法确认文字或铭文内容时，标注“铭文内容待确认”，不得生成乱码充当原文。\n\n## 中文标注规范\n\n所有标注使用简体中文，按需包含：\n\n- 道具名称\n- 道具类别\n- 部件名称\n- 结构与连接方式\n- 相对尺寸\n- 材质\n- 颜色\n- 纹理与纹样\n- 表面工艺\n\n标注要求：\n\n- 使用短句和细引导线，文字不得覆盖道具主体和材质样片。\n- 引导线准确指向目标，避免交叉和错误连接。\n- 字体大小、字重、间距和对齐保持统一。\n- 不得出现英文替代、乱码、错别字、虚构品牌或无依据的专有名词。\n- 图像模型生成文字不清晰时，继续修正，不得交付明显乱码版本。\n\n## 标准版式\n\n采用影视游戏 Prop Design Sheet 排版：\n\n- 使用横向大画布、纯白或极浅中性灰背景。\n- 左侧或中央放置主要道具的整体视图、侧视、背视和拆解视图。\n- 右侧使用规则网格展示背包、首饰、发饰、戒指、耳环、项链、腰饰、挂件和特殊装备。\n- 下方设置局部放大、材质样片、颜色样片和比例参照。\n- 主要道具与小型饰品必须分区，不能按实际尺寸硬塞在同一缩放层级。\n- 每件道具留有独立安全区；尖端、链条、流苏、背带和标签不得跨区或裁切。\n- 使用均匀柔和的影棚顶侧光和克制的接触阴影，清楚显示形体与材质。\n- 禁止人物、手部、剧情背景、环境道具、海报构图、水印、签名和无关装饰。\n- 道具数量过多时分为“主要道具”“穿戴装备”“首饰与挂件”等连续编号设定板，不牺牲可读性。\n\n## 默认生成指令\n\n根据所附角色参考图，生成专业影视游戏 Prop Design Sheet。参考图是道具外观的唯一视觉标准，完整盘点并忠实还原角色实际拥有的武器、法器、背包、首饰、发饰、戒指、耳环、项链、腰饰、挂件和特殊装备。采用横向大画布、纯白或极浅中性灰背景、均匀柔和的影棚顶侧光；主要道具展示完整主视图、标准侧视、背视、外部结构拆解和关键局部放大，小型饰品使用独立网格展示正面、侧面和连接结构。加入相对尺寸参照、材质样片、颜色样片与细节纹样放大，并使用简体中文准确标注道具名称、类别、部件、结构、相对尺寸、材质、颜色、纹理和工艺。参考图没有的类别只标注“无此道具”，绝不新增。严禁重新设计、改变比例、改变材质、优化配色、增删零件、虚构内部结构、生成额外道具、错误文字、乱码、结构穿插、人物、手部、剧情背景、水印和签名。\n\n## 生成后质检\n\n交付前逐项检查：\n\n- 是否完整盘点参考图中所有可见道具，数量和类别是否准确。\n- 是否擅自增加参考图不存在的武器、法器、首饰或特殊装备。\n- 同一道具的主视图、侧视、背视、拆解图和局部放大是否为同一设计。\n- 长宽厚比例、部件数量、左右关系和连接位置是否一致。\n- 武器刃口、护手、握柄、鞘套以及背包带、扣具、口袋是否结构合理。\n- 成对耳环、戒指、发饰和其他饰品是否数量正确、造型一致。\n- 材质样片和颜色样片是否忠实来自参考图。\n- 纹样、雕刻、镶嵌、链节、绳结和磨损是否与整体视图对应。\n- 是否虚构无依据的内部机械、功能状态、数值尺寸或铭文。\n- 所有中文标签是否准确、清晰，并正确指向对应结构。\n- 是否存在错字、乱码、零件粘连、链条断裂、透视矛盾或裁切。\n\n任一关键项不合格时，继续定向修正，不得把明显改款、道具遗漏、比例漂移、结构乱造、标签错误或多视图不一致的图片作为最终结果。\n\n## 安全边界\n\n- 武器只作为静态设计资产展示，不表现攻击、伤口、血液或受害对象。\n- 不为未成年角色新增危险装备或性化饰品。\n- 不将普通角色道具替换成现实公众人物或受版权保护角色的标志性物件。',tag:'小逻角色'},

/* ========== 数据层：localStorage + Supabase 云同步 ========== */
const STORE_KEY='ajie_workbench_data';
const CLOUD_KEY='ajie_cloud_config';

/* 默认 Supabase 配置（硬编码，分享链接自动连接） */
const DEFAULT_SB_URL='https://aofcpsdmdzvzsfdvisxu.supabase.co';
const DEFAULT_SB_KEY='sb_publishable_fPeWq7ZPmMAGhNtEIgKqAg_l4oiZK7Y';
const DEFAULT_WS_ID='ajie-team';

/* --- 云端配置 --- */
function loadCloudConfig(){
  try{
    let cfg=JSON.parse(localStorage.getItem(CLOUD_KEY))||{};
    if(!cfg.url||!cfg.anonKey){
      cfg={url:DEFAULT_SB_URL,anonKey:DEFAULT_SB_KEY,workspaceId:DEFAULT_WS_ID};
      localStorage.setItem(CLOUD_KEY,JSON.stringify(cfg));
    }
    return cfg;
  }catch(e){return{url:DEFAULT_SB_URL,anonKey:DEFAULT_SB_KEY,workspaceId:DEFAULT_WS_ID};}
}
function saveCloudConfig(cfg){
  localStorage.setItem(CLOUD_KEY,JSON.stringify(cfg));
}
let CLOUD_CFG=loadCloudConfig();
let sbClient=null;       // Supabase 客户端实例
let sbChannel=null;      // 实时订阅通道
let syncTimer=null;      // 防抖定时器
let _cloudSaveInProgress=false;  // 云端保存进行中标志
let isRemoteUpdate=false;// 标记：当前更新是否来自远端（避免循环同步）

/* --- 初始化 Supabase 客户端 --- */
function initSupabase(){
  if(!CLOUD_CFG.url||!CLOUD_CFG.anonKey||!CLOUD_CFG.workspaceId){
    sbClient=null; updateSyncBadge('off','本地模式'); return false;
  }
  try{
    sbClient=supabase.createClient(CLOUD_CFG.url,CLOUD_CFG.anonKey);
    updateSyncBadge('online','已连接');
    return true;
  }catch(e){
    sbClient=null; updateSyncBadge('error','连接失败'); return false;
  }
}

/* --- 同步状态徽章 --- */
function updateSyncBadge(state,text){
  const badge=document.getElementById('syncBadge');
  const txt=document.getElementById('syncText');
  if(!badge)return;
  badge.className='sync-badge '+state;
  if(txt)txt.textContent=text;
}

/* --- 从云端加载数据 --- */
let lastSyncError='';
async function loadFromCloud(){
  if(!sbClient)return null;
  try{
    updateSyncBadge('syncing','同步中…');
    const {data,error}=await sbClient.from('workbench_data')
      .select('data,updated_at')
      .eq('workspace_id',CLOUD_CFG.workspaceId)
      .maybeSingle();
    if(error){
      lastSyncError=error.message||JSON.stringify(error);
      updateSyncBadge('error','加载失败');
      console.error('[Supabase] 加载失败:',lastSyncError);
      return null;
    }
    if(!data){updateSyncBadge('online','已连接');return null;}
    updateSyncBadge('online','已连接');
    lastSyncError='';
    if(data.updated_at){
      lastCloudSaveTime=new Date(data.updated_at).getTime();
    }
    return data.data;
  }catch(e){
    lastSyncError=e.message||String(e);
    updateSyncBadge('error','网络错误');
    console.error('[Supabase] 网络异常:',lastSyncError);
    return null;
  }
}

/* --- 保存到云端（防抖 + 自动重试） --- */
let saveRetryCount=0;
let lastSaveTimestamp=null;  // 记录本次保存的时间戳，用于识别自己保存的回声
function saveToCloud(){
  if(!sbClient)return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    syncTimer=null;  // 清空定时器引用，让订阅/轮询可以正常工作
    _cloudSaveInProgress=true;  // 标记云端保存进行中
    updateSyncBadge('syncing','同步中…');
    const ts=new Date().toISOString();
    try{
      const {error}=await sbClient.from('workbench_data')
        .upsert({
          workspace_id:CLOUD_CFG.workspaceId,
          data:DB,
          updated_at:ts
        });
      if(error){
        saveRetryCount++;
        if(saveRetryCount<=3){
          updateSyncBadge('error','重试中('+saveRetryCount+'/3)');
          setTimeout(()=>saveToCloud(),2000*saveRetryCount);
        }else{
          updateSyncBadge('error','保存失败');
          saveRetryCount=0;
        }
      }else{
        saveRetryCount=0;
        lastCloudSaveTime=Date.now();
        lastSaveTimestamp=ts;
        updateSyncBadge('online','已连接');
      }
    }catch(e){
      saveRetryCount++;
      if(saveRetryCount<=3){
        updateSyncBadge('error','重试中('+saveRetryCount+'/3)');
        setTimeout(()=>saveToCloud(),2000*saveRetryCount);
      }else{
        updateSyncBadge('error','网络错误');
        saveRetryCount=0;
      }
    }finally{
      _cloudSaveInProgress=false;
    }
  },500);
}

/* --- 定期同步（每30秒检查一次云端是否有更新） --- */
let pollTimer=null;
function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    if(!sbClient||isRemoteUpdate)return;
    /* 如果有未执行的保存或正在保存，跳过覆盖以避免丢失本地新增数据 */
    if(syncTimer||_cloudSaveInProgress)return;
    try{
      const {data,error}=await sbClient.from('workbench_data')
        .select('data,updated_at')
        .eq('workspace_id',CLOUD_CFG.workspaceId)
        .maybeSingle();
      if(!error&&data&&data.data){
        const cloudTime=new Date(data.updated_at).getTime();
        const localTime=lastCloudSaveTime||0;
        if(cloudTime>localTime){
          try{
            isRemoteUpdate=true;
            DB=data.data;
            ensureKeys();
            localStorage.setItem(STORE_KEY,JSON.stringify(DB));
            /* 弹窗打开时仅更新数据，不触发页面重渲染（避免干扰表单操作） */
            if(isModalOpen()){
              _pendingCloudRender=true;
            }else{
              const cur=document.querySelector('.nav-item.active');
              if(cur)switchSection(cur.dataset.id);
            }
          }catch(e){
            console.error('[Sync] 轮询处理异常:',e);
          }finally{
            isRemoteUpdate=false;
            lastCloudSaveTime=cloudTime;
          }
        }
      }
    }catch(e){}
  },30000);
}

let lastCloudSaveTime=0;

/* --- 实时订阅 --- */
let _initGracePeriod=true;  /* 初始化保护期，防止订阅回声导致闪屏 */
function subscribeCloud(){
  if(!sbClient||!CLOUD_CFG.workspaceId)return;
  if(sbChannel)sbClient.removeChannel(sbChannel);
  sbChannel=sbClient.channel('workbench-sync')
    .on('postgres_changes',{
      event:'*',schema:'public',table:'workbench_data',
      filter:'workspace_id=eq.'+CLOUD_CFG.workspaceId
    },(payload)=>{
      if(payload.eventType==='DELETE')return;
      /* 初始化保护期内跳过所有订阅事件，避免闪屏 */
      if(_initGracePeriod)return;
      const newData=payload.new&&payload.new.data;
      const cloudTs=payload.new&&payload.new.updated_at;
      /* 跳过自己保存的回声：避免覆盖本地未同步的新增数据 */
      if(cloudTs&&lastSaveTimestamp&&new Date(cloudTs).getTime()===new Date(lastSaveTimestamp).getTime()){
        lastSaveTimestamp=null;
        return;
      }
      if(newData&&!isRemoteUpdate){
        /* 如果有未执行的保存或正在保存，跳过覆盖以避免丢失本地新增数据 */
        if(syncTimer||_cloudSaveInProgress){
          return;
        }
        try{
          isRemoteUpdate=true;
          DB=newData;
          ensureKeys();
          localStorage.setItem(STORE_KEY,JSON.stringify(DB));
          /* 弹窗打开时仅更新数据，不触发页面重渲染（避免干扰表单操作） */
          if(isModalOpen()){
            _pendingCloudRender=true;
          }else{
            const cur=document.querySelector('.nav-item.active');
            if(cur)switchSection(cur.dataset.id);
          }
        }catch(e){
          console.error('[Sync] 订阅处理异常:',e);
        }finally{
          isRemoteUpdate=false;
        }
      }
    })
    .subscribe();
}

/* --- localStorage 持久化 --- */
function loadData(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ return {}; }
}
function saveData(){
  localStorage.setItem(STORE_KEY,JSON.stringify(DB));
  if(sbClient&&!isRemoteUpdate)saveToCloud();
}

/* --- 临时生成缓存（5分钟TTL，防止刷新/退出丢失生成结果） --- */
var TEMP_CACHE_KEY='ajie_temp_cache';
var TEMP_CACHE_TTL=5*60*1000; /* 5分钟 */
/* 保存生成结果到临时缓存 */
function saveTempCache(type,data,extra){
  try{
    var cache={
      type:type,
      data:data,
      extra:extra||{},
      timestamp:Date.now()
    };
    localStorage.setItem(TEMP_CACHE_KEY,JSON.stringify(cache));
  }catch(e){ console.warn('临时缓存保存失败:',e); }
}
/* 从临时缓存恢复（超过5分钟返回null） */
function loadTempCache(){
  try{
    var raw=localStorage.getItem(TEMP_CACHE_KEY);
    if(!raw) return null;
    var cache=JSON.parse(raw);
    if(!cache||!cache.timestamp) return null;
    var elapsed=Date.now()-cache.timestamp;
    if(elapsed>TEMP_CACHE_TTL){
      localStorage.removeItem(TEMP_CACHE_KEY);
      return null;
    }
    return cache;
  }catch(e){ return null; }
}
/* 清除临时缓存 */
function clearTempCache(){
  localStorage.removeItem(TEMP_CACHE_KEY);
}
/* 获取临时缓存剩余时间（秒） */
function getTempCacheRemaining(){
  var cache=loadTempCache();
  if(!cache) return 0;
  var elapsed=Date.now()-cache.timestamp;
  return Math.max(0,Math.ceil((TEMP_CACHE_TTL-elapsed)/1000));
}
function ensureKeys(){
  if(!Array.isArray(DB.todos))DB.todos=[];
  if(!Array.isArray(DB.inspos))DB.inspos=[];
  if(!Array.isArray(DB.ledger))DB.ledger=[];

/* ========== HTML 转义 ========== */
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ========== 点击复制 ========== */
function copyText(el,customText){
  const text=customText!==undefined?customText:el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>_showCopyTip(el));
  }else{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy');_showCopyTip(el);}catch(e){}
    document.body.removeChild(ta);
  }
}
/* 通用复制到剪贴板（带toast提示） */
function copyToClipboard(text){
  if(!text) return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板','success'));
  }else{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy');showToast('已复制到剪贴板','success');}catch(e){showToast('复制失败','error');}
    document.body.removeChild(ta);
  }
}

/* ========== 标签颜色 ========== */
const TAG_COLORS=[
  ['var(--tag-blue)','var(--tag-blue-t)'],
  ['var(--tag-mint)','var(--tag-mint-t)'],
  ['var(--tag-amber)','var(--tag-amber-t)'],
  ['var(--tag-violet)','var(--tag-violet-t)'],
  ['var(--tag-rose)','var(--tag-rose-t)'],
];
function tagColor(text){
  let h=0; for(let i=0;i<text.length;i++) h=text.charCodeAt(i)+((h<<5)-h);
  const c=TAG_COLORS[Math.abs(h)%TAG_COLORS.length];
  return 'background:'+c[0]+';color:'+c[1];
}
function tagAccentColor(text){
  if(!text) return '#cbd5e1';
  let h=0; for(let i=0;i<text.length;i++) h=text.charCodeAt(i)+((h<<5)-h);
  const c=TAG_COLORS[Math.abs(h)%TAG_COLORS.length];
  return c[1];
}

/* ========== Toast 提示系统 ========== */
function showToast(msg,type){
  const container=document.getElementById('toastContainer');
  if(!container) return;
  const toast=document.createElement('div');
  const t=type||'';
  const icons={success:'✓',error:'✕',warn:'!','':''};
  toast.className='toast '+t;
  toast.innerHTML=(icons[t]?'<span style="font-size:15px;font-weight:700">'+icons[t]+'</span>':'')+escapeHtml(msg);
  container.appendChild(toast);
  setTimeout(()=>toast.remove(),2600);
}

const THEMES={

  'ocean':  {name:'雾屿蓝',color:'#162235',isDark:false},
  'moss':   {name:'抹茶绿',color:'#1e2a1d',isDark:false},
  'dark':   {name:'极夜灰',color:'#0d1220',isDark:true},

const THEME_KEY='app-theme';

function initTheme(){
  let saved=localStorage.getItem(THEME_KEY);
  if(!saved||!THEMES[saved]){
    /* 首次访问检测系统深色模式偏好 */
    if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){
      saved='dark';
    }else{
      saved='ocean'; /* 默认雾屿蓝，最接近原风格 */
    }
  }
  switchTheme(saved,true);
}

function switchTheme(themeName,silent){
  if(!THEMES[themeName]) return;
  const body=document.body;
  
  /* 移除旧的 theme-dark 类（兼容旧代码） */
  body.classList.remove('theme-dark');
  
  /* 设置 data-theme 属性 */
  body.setAttribute('data-theme',themeName);
  
  /* 更新新版选择器激活状态 */
  document.querySelectorAll('.ts-swatch').forEach(el=>{
    el.classList.toggle('active',el.dataset.theme===themeName);
  });
  
  /* 更新名称高亮 */
  const nameSpans=document.querySelectorAll('#tsNames span');
  const themeKeys=['default','ocean','moss','dark','wine','sunset'];
  nameSpans.forEach((span,i)=>{
    span.classList.toggle('active-name',themeKeys[i]===themeName);
  });
  
  /* 更新 theme-color meta */
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content',THEMES[themeName].color);
  
  /* 保存到 localStorage */
  localStorage.setItem(THEME_KEY,themeName);
  
  /* 切换后清空搜索 */
  if(!silent){
    clearThemeSearch();
    showToast('已切换至 '+THEMES[themeName].name+' 主题','success');
  }
}

/* ========== 主题搜索与滑动 ========== */
function filterThemes(keyword){
  keyword=(keyword||'').trim().toLowerCase();
  const swatches=document.querySelectorAll('.ts-swatch');
  const nameSpans=document.querySelectorAll('#tsNames span');
  const clearBtn=document.getElementById('tsSearchClear');
  
  if(clearBtn) clearBtn.style.display=keyword?'flex':'none';
  
  swatches.forEach((swatch,i)=>{
    const kw=(swatch.dataset.keywords||'').toLowerCase();
    const name=(swatch.dataset.name||'').toLowerCase();
    const match=!keyword || kw.includes(keyword) || name.includes(keyword);
    swatch.classList.toggle('filtered-out',!match);
    if(nameSpans[i]){
      nameSpans[i].style.opacity=match?'1':'.25';
      nameSpans[i].style.pointerEvents=match?'auto':'none';
    }
  });
}

function scrollThemes(dir){
  const track=document.getElementById('tsTrack');
  if(!track) return;
  const step=track.clientWidth*0.6;
  track.scrollBy({left:dir*step,behavior:'smooth'});
  setTimeout(updateThemeArrows,300);

  leftBtn.disabled=track.scrollLeft<=2;

/* ========== 全局搜索 ========== */
let searchSelectedIndex=-1;
function openSearch(){
  const mask=document.getElementById('searchMask');
  const input=document.getElementById('searchInput');
  if(mask) mask.classList.add('show');
  if(input){ input.value=''; input.focus(); }
  document.getElementById('searchResults').innerHTML='<div class="search-empty">输入关键词开始搜索</div>';
  searchSelectedIndex=-1;
}
function closeSearch(){
  const mask=document.getElementById('searchMask');
  if(mask) mask.classList.remove('show');
}
function doSearch(query){
  const resultsEl=document.getElementById('searchResults');
  if(!query||!query.trim()){
    resultsEl.innerHTML='<div class="search-empty">输入关键词开始搜索</div>';
    searchSelectedIndex=-1;
    return;
  }
  const q=query.trim().toLowerCase();
  const results=[];
  
  /* 1. 搜索菜单 */
  NAV.forEach(n=>{
    if(n.name.toLowerCase().includes(q)||(n.group&&n.group.toLowerCase().includes(q))){
      results.push({type:'nav',ico:n.ico,title:n.name,desc:n.group||'',group:'功能菜单',id:n.id});
    }
  });
  
  /* 2. 搜索我的提示词 */
  if(Array.isArray(DB.myPrompts)){
    DB.myPrompts.forEach((p,i)=>{
      if((p.title&&p.title.toLowerCase().includes(q))||(p.desc&&p.desc.toLowerCase().includes(q))||(p.tag&&p.tag.toLowerCase().includes(q))){
        results.push({type:'prompt',ico:'📝',title:p.title||'未命名',desc:(p.tag?p.tag+' · ':'')+(p.desc||'').slice(0,40),group:'我的提示词',listKey:'myPrompts',index:i});
      }
    });
  }
  
  /* 3. 搜索灵感收藏 */
  if(Array.isArray(DB.inspos)){
    DB.inspos.forEach((p,i)=>{
      if((p.title&&p.title.toLowerCase().includes(q))||(p.desc&&p.desc.toLowerCase().includes(q))){
        results.push({type:'inspo',ico:'⭐',title:p.title||'未命名',desc:(p.desc||'').slice(0,40),group:'灵感收藏',section:'inspo',index:i});
      }
    });
  }
  
  /* 4. 搜索账本 */
  if(Array.isArray(DB.ledger)){
    DB.ledger.forEach((p,i)=>{
      if((p.title&&p.title.toLowerCase().includes(q))||(p.desc&&p.desc.toLowerCase().includes(q))||(p.tag&&p.tag.toLowerCase().includes(q))){
        results.push({type:'ledger',ico:'📊',title:p.title||'未命名',desc:(p.tag?p.tag+' · ':'')+(p.amount?'¥'+p.amount:''),group:'小账本',section:'ledger',index:i});
      }
    });
  }
  
  /* 5. 搜索AI提示词库 */
  if(Array.isArray(DB.aiPrompts)){
    DB.aiPrompts.forEach((p,i)=>{
      if((p.title&&p.title.toLowerCase().includes(q))||(p.desc&&p.desc.toLowerCase().includes(q))||(p.tag&&p.tag.toLowerCase().includes(q))){
        results.push({type:'prompt',ico:'💬',title:p.title||'未命名',desc:(p.tag?p.tag+' · ':'')+(p.desc||'').slice(0,40),group:'AI提示词库',listKey:'aiPrompts',index:i});
      }
    });
  }
  
  /* 渲染结果 */
  if(results.length===0){
    resultsEl.innerHTML='<div class="search-empty">🔍 没有找到相关结果</div>';
    searchSelectedIndex=-1;
    return;
  }
  
  searchSelectedIndex=0;
  resultsEl.innerHTML=results.slice(0,20).map((r,i)=>
    '<div class="search-result-item '+(i===0?'selected':'')+'" data-index="'+i+'" onclick="handleSearchResult('+i+')">'
      +'<div class="sr-ico">'+r.ico+'</div>'
      +'<div class="sr-info">'
        +'<div class="sr-title">'+escapeHtml(r.title)+'</div>'
        +'<div class="sr-desc">'+escapeHtml(r.desc)+'</div>'
      +'</div>'
      +'<span class="sr-group">'+escapeHtml(r.group)+'</span>'
    +'</div>'
  ).join('');
  
  /* 保存结果供键盘操作使用 */
  window._searchResults=results.slice(0,20);
}
function handleSearchResult(index){
  const r=window._searchResults&&window._searchResults[index];
  if(!r) return;
  closeSearch();
  if(r.type==='nav'){
    switchSection(r.id);
  }else if(r.type==='prompt'){
    switchSection(r.listKey==='myPrompts'?'myprompts':'ai');
    showToast('已定位到提示词：'+r.title,'success');
  }else if(r.type==='inspo'){
    switchSection('inspo');
    showToast('已定位到灵感收藏','success');
  }else if(r.type==='ledger'){
    switchSection('ledger');
    showToast('已定位到账本记录','success');
  }
}
/* 搜索键盘操作 */
document.addEventListener('keydown',function(e){
  const mask=document.getElementById('searchMask');
  if(!mask||!mask.classList.contains('show')){
    /* Ctrl+K / Cmd+K 打开搜索 */
    if((e.ctrlKey||e.metaKey)&&e.key==='k'){
      e.preventDefault();
      openSearch();
    }
    return;
  }
  if(e.key==='Escape'){ closeSearch(); }
  else if(e.key==='ArrowDown'){
    e.preventDefault();
    const items=document.querySelectorAll('.search-result-item');
    if(items.length===0) return;
    if(searchSelectedIndex<items.length-1) searchSelectedIndex++;
    items.forEach((el,i)=>el.classList.toggle('selected',i===searchSelectedIndex));
    items[searchSelectedIndex].scrollIntoView({block:'nearest'});
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    const items=document.querySelectorAll('.search-result-item');
    if(items.length===0) return;
    if(searchSelectedIndex>0) searchSelectedIndex--;
    items.forEach((el,i)=>el.classList.toggle('selected',i===searchSelectedIndex));
    items[searchSelectedIndex].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'){
    e.preventDefault();
    if(searchSelectedIndex>=0) handleSearchResult(searchSelectedIndex);
  }
});

  if(id==='inspo') renderInspos();
  if(id==='ledger') renderLedger();
  if(id==='agent') initAgentSection();
  if(id==='workshop') wsInitWorkshop();

  /* 初始化分类筛选器箭头状态 */
  setTimeout(function(){ initAllTagFilters(); },50);
  if(window.innerWidth<=768) toggleSidebar(false);
  /* 重新触发卡片入场动画 */
  var cards=content.querySelectorAll('.card');
  cards.forEach(function(c){
    c.style.animation='none';
    c.offsetHeight; /* force reflow */
    c.style.animation='';
  });
  /* 重新触发内容淡入 */
  content.style.animation='none';
  content.offsetHeight;
  content.style.animation='';
  /* 激励语动态效果：给💡开头的标题加动画类 */
  content.querySelectorAll('.card-h').forEach(function(h){
    if(h.textContent.trim().indexOf('💡')===0){
      var txt=h.innerHTML;
      h.innerHTML=txt.replace('💡','<span class="quote-ico">💡</span>');
      h.querySelectorAll('.txt').forEach(function(t){
        if(!t.classList.contains('quote-text')) t.classList.add('quote-text');
      });
      var card=h.closest('.card');
      if(card) card.querySelectorAll('.txt').forEach(function(t){
        if(!t.classList.contains('quote-text')&&!t.closest('.card-h')) t.classList.add('quote-text');
      });
    }
  });
}

/* ========== 通用列表 CRUD ========== */
var LIST_TAG_FILTER={};
function filterListByTag(listKey,tag){
  LIST_TAG_FILTER[listKey]=tag;
  var track=document.getElementById('filter_'+listKey);
  if(!track) return;
  var btns=track.querySelectorAll('.tf-btn');
  btns.forEach(function(b){b.classList.toggle('active',b.textContent.replace(/^[^\u4e00-\u9fa5a-zA-Z]+/,'').trim()===tag||b.textContent.trim()===tag);});
  renderList(listKey);
}

/* ========== 分类筛选器：搜索 + 滑动 ========== */
function filterTags(listKey,keyword){
  keyword=(keyword||'').trim().toLowerCase();
  var track=document.getElementById('filter_'+listKey);
  if(!track) return;
  var btns=track.querySelectorAll('.tf-btn');
  var wrap=track.closest('.tag-filter-wrap');
  var clearBtn=wrap?wrap.querySelector('.tf-search-clear'):null;
  
  if(clearBtn) clearBtn.style.display=keyword?'flex':'none';
  
  var visibleCount=0;
  btns.forEach(function(btn){
    var text=btn.textContent.toLowerCase();
    var match=!keyword || text.includes(keyword);
    btn.classList.toggle('filtered-out',!match);
    if(match) visibleCount++;
  });
  
  // 更新计数
  var countEl=document.getElementById('count_'+listKey);
  if(countEl) countEl.textContent=keyword?(visibleCount+' / '+btns.length+' 个'):(btns.length+' 个分类');
}

function clearTagSearch(listKey){
  var wrap=document.querySelector('#filter_'+listKey)?.closest('.tag-filter-wrap');
  if(!wrap) return;
  var input=wrap.querySelector('.tf-search-input');
  if(input){ input.value=''; filterTags(listKey,''); }
}

function scrollTags(listKey,dir){
  var track=document.getElementById('filter_'+listKey);
  if(!track) return;
  var step=track.clientWidth*0.6;
  track.scrollBy({left:dir*step,behavior:'smooth'});
  setTimeout(function(){ updateTagArrows(listKey); },300);
}

function updateTagArrows(listKey){
  var track=document.getElementById('filter_'+listKey);
  if(!track) return;
  var slider=track.closest('.tf-slider');
  if(!slider) return;
  var leftBtn=slider.querySelector('.tf-arrow-left');
  var rightBtn=slider.querySelector('.tf-arrow-right');
  if(leftBtn) leftBtn.disabled=track.scrollLeft<=2;
  if(rightBtn) rightBtn.disabled=track.scrollLeft+track.clientWidth>=track.scrollWidth-2;
}

/* 初始化所有分类筛选器的箭头状态 */
function initAllTagFilters(){
  ['aiPrompts','myPrompts','aitechPrompts'].forEach(function(key){
    var track=document.getElementById('filter_'+key);
    if(!track) return;
    updateTagArrows(key);
    track.addEventListener('scroll',function(){ updateTagArrows(key); });
  });
}
function renderList(listKey){
  const config=LISTS[listKey];
  if(!config) return;
  const container=document.getElementById('lc_'+listKey);
  if(!container) return;
  let items=(DB[config.dbKey]||[]).map((item,i)=>({item,i}));
  const filter=LIST_TAG_FILTER[listKey];
  if(filter&&filter!=='全部'){
    items=items.filter(x=>x.item.tag===filter);
  }
  if(items.length===0){
    container.innerHTML='<div class="empty-hint"><div class="big"><span class="big-emoji">'+config.icon+'</span></div>'+(filter&&filter!=='全部'?'该分类暂无内容':'暂无内容，点击"+ 新增"添加')+'</div>';
    return;
  }
  let html='';
  items.forEach((x)=>{
    const item=x.item, i=x.i;
    html+=renderListItem(listKey,item,i);
  });
  container.innerHTML=html;
}

function renderListItem(listKey,item,i){
  const config=LISTS[listKey];
  let hasCheckbox=false, checkboxChecked=false;
  let titleParts=[],metaParts=[],descParts=[],tagParts=[],fieldParts=[];
  config.fields.forEach(f=>{
    const as=f.as||'field';
    if(as==='checkbox'){
      hasCheckbox=true;
      checkboxChecked=!!item[f.key];
      return;
    }
    const val=item[f.key];
    if(val===undefined||val===null||val==='') return;
    const text=String(val);
    if(as==='title') titleParts.push(text);
    else if(as==='meta') metaParts.push(text);
    else if(as==='desc') descParts.push(text);
    else if(as==='tag') tagParts.push('<span class="pill" style="'+tagColor(text)+'">'+escapeHtml(text)+'</span>');
    else fieldParts.push('<span><b>'+escapeHtml(f.label)+'：</b>'+escapeHtml(text)+'</span>');
  });
  let html='<div class="gitem">';
  var _accentTag=item.tag||item.title||'';
  html+='<div class="gitem-accent-bar" style="background:'+tagAccentColor(_accentTag)+'"></div>';
  html+='<div class="swipe-content">';
  if(hasCheckbox){
    html+='<div class="ck'+(checkboxChecked?' checked':'')+'" onclick="toggleListCheck(\''+listKey+'\','+i+')"></div>';
  }
  const cc=config.clickCopy?' copyable" onclick="copyText(this)" title="点击复制':'';
  html+='<div class="gbody">';
  /* 车辆信息添加品牌图片 */
  if(listKey==='carInfo'&&titleParts.length){
    var carTitle=titleParts.join(' ');
    var carItem=DB.carInfo&&DB.carInfo[i]?DB.carInfo[i]:{};
    var customImg=carItem.customImg||'';
    if(customImg){
      html+='<div class="car-img-wrap" id="carImgWrap_'+i+'" style="position:relative"><img src="'+escapeHtml(customImg)+'" style="width:100%;height:100%;object-fit:contain;padding:4px"><button class="btn btn-ghost" style="position:absolute;top:6px;right:6px;font-size:11px;padding:4px 10px;background:rgba(255,255,255,.85);backdrop-filter:blur(4px)" onclick="uploadCarImage('+i+')">📷 更换</button></div>';
    } else {
      html+='<div class="car-img-wrap" id="carImgWrap_'+i+'"><div class="car-img-loading">🚗</div></div>';
      setTimeout(function(){loadCarImage(carTitle,'carImgWrap_'+i);},50);
      html+='<div style="text-align:right;margin-top:-4px;margin-bottom:4px"><button class="btn btn-ghost" style="font-size:11px;padding:4px 10px" onclick="uploadCarImage('+i+')">📷 添加图片</button></div>';
    }
  }
  if(titleParts.length) html+='<div class="gt'+(checkboxChecked?' done-t':'')+(config.copyField?' prompt-clickable" onclick="openPromptDetail(\''+listKey+'\','+i+')':'')+'">'+escapeHtml(titleParts.join(' · '))+'</div>';
  if(metaParts.length) html+='<div class="gmeta">'+escapeHtml(metaParts.join(' · '))+'</div>';
  if(descParts.length){
    if(config.copyField){
      html+='<div class="gdesc clamp" style="white-space:pre-wrap" onclick="openPromptDetail(\''+listKey+'\','+i+')" title="点击查看详情">'+escapeHtml(descParts.join(' ')).replace(/\\n/g,'<br>')+'</div>';
    } else {
      html+='<div class="gdesc'+cc+'" style="white-space:pre-wrap">'+escapeHtml(descParts.join(' ')).replace(/\\n/g,'<br>')+'</div>';
    }
  }
  if(fieldParts.length) html+='<div class="gfields">'+fieldParts.join('')+'</div>';
  if(tagParts.length) html+='<div class="gtags">'+tagParts.join('')+'</div>';
  if(config.copyField){
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-light)">';
    html+='<span style="font-size:11px;color:var(--ink-3)">点击卡片查看完整提示词</span>';
    html+='<button class="btn btn-mint" style="padding:4px 10px;font-size:11px" onclick="event.stopPropagation();quickCopyPrompt(\''+listKey+'\','+i+')">📋 一键复制</button>';
    html+='</div>';
  }
  html+='</div>';
  html+='<button class="item-more" onclick="showItemMenu(event,\''+listKey+'\','+i+')">⋯</button>';
  html+='</div></div>';
  return html;
}

/* ========== ⋯ 操作菜单 ========== */
let _itemMenu=null;
function _ensureMenu(){
  if(_itemMenu) return _itemMenu;
  _itemMenu=document.createElement('div');
  _itemMenu.className='item-menu';
  _itemMenu.innerHTML='';
  document.body.appendChild(_itemMenu);
  document.addEventListener('click',function(e){
    if(_itemMenu&&!_itemMenu.contains(e.target)&&!e.target.classList.contains('item-more')){
      _itemMenu.classList.remove('show');
    }
  });
  window.addEventListener('scroll',function(){if(_itemMenu)_itemMenu.classList.remove('show');},true);
  window.addEventListener('resize',function(){if(_itemMenu)_itemMenu.classList.remove('show');});
  return _itemMenu;
}
function _positionMenu(menu,btn){
  const r=btn.getBoundingClientRect();
  let x=r.right-120, y=r.bottom+4;
  if(x<8) x=8;
  if(y+100>window.innerHeight) y=r.top-104;
  if(y<8) y=8;
  menu.style.left=x+'px';
  menu.style.top=y+'px';
}
function showItemMenu(e,listKey,i){
  e.stopPropagation();
  const menu=_ensureMenu();
  const config=LISTS[listKey];
  menu.innerHTML=
    '<button class="im-btn im-edit" onclick="_menuEdit(\''+listKey+'\','+i+')">✏️ 编辑</button>'+
    '<div class="im-divider"></div>'+
    '<button class="im-btn im-del" onclick="_menuDel(\''+listKey+'\','+i+')">🗑️ 删除</button>';
  _positionMenu(menu,e.currentTarget);
  menu.classList.add('show');
}

function openListModal(listKey,index){
  const config=LISTS[listKey];
  const editing=index!==undefined&&index!==null;
  const item=editing?Object.assign({},DB[config.dbKey][index]):{};
  let formHtml='';
  config.fields.forEach(f=>{
    const raw=item[f.key];
    const val=(f.type==='checkbox')?(raw!==undefined?raw:false):(raw!==undefined?raw:'');
    formHtml+='<label class="crud-label">'+escapeHtml(f.label)+'</label>';
    if(f.type==='textarea'){
      formHtml+='<textarea class="crud-textarea" id="fld_'+f.key+'" placeholder="'+escapeHtml(f.placeholder||'')+'">'+escapeHtml(val)+'</textarea>';
    }else if(f.type==='select'){
      formHtml+='<select class="crud-input" id="fld_'+f.key+'" style="margin-bottom:8px">';
      let hasVal=f.options.indexOf(val)>=0;
      if(!hasVal&&val) formHtml+='<option value="'+escapeHtml(val)+'" selected>'+escapeHtml(val)+'</option>';
      f.options.forEach(opt=>{
        formHtml+='<option value="'+escapeHtml(opt)+'"'+(val===opt?' selected':'')+'>'+escapeHtml(opt)+'</option>';
      });
      formHtml+='</select>';
    }else if(f.type==='checkbox'){
      formHtml+='<label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;cursor:pointer">'+
        '<input type="checkbox" id="fld_'+f.key+'" '+(val?'checked':'')+' style="width:20px;height:20px;cursor:pointer"> '+
        escapeHtml(f.placeholder||'已完成')+'</label>';
    }else if(f.type==='month'){
      /* 月份选择器：兼容 "2026年8月" 和 "2026-08" 格式 */
      var monthVal=val||'';
      if(monthVal){
        var mm=monthVal.match(/(\d{4})[^\d]*(\d{1,2})/);
        if(mm) monthVal=mm[1]+'-'+String(mm[2]).padStart(2,'0');
      }
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="month" value="'+escapeHtml(monthVal)+'" style="margin-bottom:8px">';
    }else if(f.type==='date'){
      /* 日期选择器：兼容 "2026-08-20" 和 "2026年8月20日" 格式 */
      var dateVal=val||'';
      if(dateVal){
        var dm=dateVal.match(/(\d{4})[^\d]*(\d{1,2})[^\d]*(\d{1,2})/);
        if(dm) dateVal=dm[1]+'-'+String(dm[2]).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0');
      }
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="date" value="'+escapeHtml(dateVal)+'" style="margin-bottom:8px">';
    }else{
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="'+(f.inputType||'text')+'" placeholder="'+escapeHtml(f.placeholder||'')+'" value="'+escapeHtml(val)+'">';
    }
  });
  showModal(config.icon+' '+(editing?'编辑':'新增')+config.title, formHtml, ()=>{
    const newItem={};
    config.fields.forEach(f=>{
      const el=document.getElementById('fld_'+f.key);
      if(!el) return;
      if(f.type==='checkbox'){ newItem[f.key]=el.checked; }
    else if(f.type==='month'){
      /* 将 "2026-08" 转成 "2026年8月" */
      var mv=el.value;
      if(mv){
        var parts=mv.split('-');
        newItem[f.key]=parts[0]+'年'+parseInt(parts[1],10)+'月';
      } else newItem[f.key]='';
    }
    else if(f.type==='date'){
      /* 将 "2026-08-20" 转成 "2026年8月20日" */
      var dv=el.value;
      if(dv){
        var parts=dv.split('-');
        newItem[f.key]=parts[0]+'年'+parseInt(parts[1],10)+'月'+parseInt(parts[2],10)+'日';
      } else newItem[f.key]='';
    }
    else { newItem[f.key]=el.value.trim(); }
    });
    /* 校验：至少有一个非空非布尔字段 */
    const hasContent=config.fields.some(f=>{
      const v=newItem[f.key];
      return v!==false&&v!==''&&v!==undefined&&v!==null;
    });
    if(!hasContent){ alert('请至少填写一项内容'); return false; }
    if(editing){ DB[config.dbKey][index]=newItem; }
    else { DB[config.dbKey].push(newItem); }
    saveData();
    renderList(listKey);
    /* 刷新每日计划的目标跑车卡片 */
    if(config.dbKey==='salaryGoal') renderGoalCar();
    return true;
  });
}

  }
  /* 检测是否为网易云音乐链接 */
  var urlMatch=text.match(/(https?:\/\/(?:163cn\.tv\/\w+|music\.163\.com\/(?:playlist|album|song)[^\s]*))/i);
  if(urlMatch){
    preview.innerHTML='<div style="color:var(--accent);font-size:13px;padding:8px">⏳ 正在从网易云音乐获取歌单…</div>';
    btn.disabled=true; btn.style.opacity=.5;
    fetchNeteasePlaylist(urlMatch[1],listKey);
    return;
  }
  /* 手动文本解析，清除已获取的歌单缓存 */
  _fetchedPlaylistSongs=null;

    btn.disabled=true; btn.style.opacity=.5;

  }

}

/* 从网易云音乐获取歌单 — 通过本地代理服务器 */
var _fetchedPlaylistSongs=null;
async function fetchNeteasePlaylist(url,listKey){
  var preview=document.getElementById('batchPreview');
  var btn=document.getElementById('batchConfirmBtn');
  _fetchedPlaylistSongs=null;
  try{
    /* 调用本地代理服务器获取歌单数据 */
    var proxyUrl='http://localhost:8080/api/playlist?url='+encodeURIComponent(url);
    var resp=await fetch(proxyUrl);
    var data=await resp.json();

    if(!data||!data.success){
      var errMsg=(data&&data.error)?data.error:'未知错误';
      preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">⚠️ 获取歌单失败：'+escapeHtml(errMsg)+'<br>请直接粘贴歌曲列表<br>格式：歌曲名 - 歌手名（每行一首）</div>';
      btn.disabled=true; btn.style.opacity=.5;
      return;
    }

    var songs=data.songs||[];
    if(songs.length===0){
      preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">⚠️ 未获取到歌曲数据，请直接粘贴歌曲列表</div>';
      btn.disabled=true; btn.style.opacity=.5;
      return;
    }

    _fetchedPlaylistSongs=songs;
    _renderBatchPreview(songs,btn);
    var statusDiv=document.createElement('div');
    statusDiv.style.cssText='font-size:12px;color:#52c41a;padding:4px 8px 0';
    var playlistName=data.playlist_name||'';
    statusDiv.innerHTML='✅ 从网易云音乐获取到 '+songs.length+' 首歌曲'+(playlistName?'<br>📋 歌单：'+escapeHtml(playlistName):'');
    preview.insertBefore(statusDiv,preview.firstChild);
  }catch(e){
    preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">⚠️ 网络请求失败：'+escapeHtml(e.message||String(e))+'<br><br>可能是代理服务器未启动，请检查服务器状态。<br>也可直接粘贴歌曲列表（每行一首）<br>格式：歌曲名 - 歌手名</div>';
    btn.disabled=true; btn.style.opacity=.5;
  }
}

  songs.forEach(function(s,i){

      '<span style="font-weight:600;flex:1">'+escapeHtml(s.title||'未知歌曲')+'</span>'+
      '<span style="color:var(--accent);font-size:12px">'+escapeHtml(s.singer||'')+'</span>'+

function parseSongs(text){
  var lines=text.split(/\r?\n/);
  var songs=[];
  lines.forEach(function(line){
    line=line.trim();
    if(!line) return;
    /* 去掉序号前缀：1. / 1) / 1、 / - 1. 等 */
    line=line.replace(/^\s*[-]*\s*\d+\s*[.、)]\s*/,'');
    if(!line) return;
    var title='',singer='',note='';
    var matched=false;

    /* 格式1: 歌曲 - 歌手 (备注)  或  歌曲 -- 歌手 */
    var m=line.match(/^(.+?)\s*-{2,}\s*(.+)$/);
    if(!m) m=line.match(/^(.+?)\s+-\s+(.+)$/);
    if(m){
      title=m[1].trim();
      var rest=m[2].trim();
      /* 检查备注：括号或后面的文字 */
      var nm=rest.match(/^(.+?)\s*[（(](.+)[）)]\s*$/);
      if(nm){
        singer=nm[1].trim();
        note=nm[2].trim();
      }else{
        /* 歌手后面可能有备注，用空格分隔 */
        var parts=rest.split(/\s{2,}/);
        singer=parts[0].trim();
        if(parts.length>1) note=parts.slice(1).join(' ').trim();
      }
      matched=true;
    }

    /* 格式2: 歌曲（歌手）或 歌曲(歌手) */
    if(!matched){
      var m2=line.match(/^(.+?)[（(](.+?)[）)]\s*$/);
      if(m2){
        title=m2[1].trim();
        singer=m2[2].trim();
        matched=true;
      }
    }

    /* 格式3: 歌曲【歌手】 */
    if(!matched){
      var m3=line.match(/^(.+?)\[(.+?)\]\s*$/);
      if(m3){
        title=m3[1].trim();
        singer=m3[2].trim();
        matched=true;
      }
    }

    /* 格式4: 只有歌名，无歌手 */
    if(!matched){
      title=line;
    }

    /* 清理 title 两端的引号 */
    title=title.replace(/^[""''「『]+/,'').replace(/[""」』]+$/,'').trim();
    if(title) songs.push({title:title,singer:singer,note:note});
  });
  return songs;
}

function confirmBatchImport(listKey){
  /* 优先使用从网易云音乐获取的歌曲数据 */
  var songs=_fetchedPlaylistSongs;
  if(!songs||songs.length===0){
    var text=document.getElementById('batchInput').value.trim();
    if(!text) return;
    songs=parseSongs(text);
  }
  if(!songs||songs.length===0) return;
  var config=LISTS[listKey];
  var added=0;
  songs.forEach(function(s){
    var item={};
    config.fields.forEach(function(f){
      if(f.key==='title') item[f.key]=s.title||'';
      else if(f.key==='singer') item[f.key]=s.singer||'';
      else if(f.key==='note') item[f.key]=s.note||'';
      else if(f.key==='desc') item[f.key]=s.note||'';
      else item[f.key]='';
    });
    /* 至少有歌名才添加 */
    if(item.title){
      DB[config.dbKey].push(item);
      added++;
    }
  });
  saveData();
  renderList(listKey);
  _fetchedPlaylistSongs=null;
  var mask=document.getElementById('batchModal');
  if(mask){ mask.remove(); _afterModalClose(); }
  /* 显示成功提示 */
  var toast=document.createElement('div');
  toast.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,51,73,.95);color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:99999;animation:connectPop .4s ease both';
  toast.textContent='✅ 成功导入 '+added+' 首歌曲';
  document.body.appendChild(toast);
  setTimeout(function(){ toast.remove(); },1800);
}

/* 日历 */
let calYear=2026,calMonth=7;
function renderCal(){
  const grid=document.getElementById('calGrid');if(!grid)return;
  const monEl=document.getElementById('calMon');
  if(monEl) monEl.textContent=calYear+'年'+(calMonth+1)+'月';
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  let html='';
  ['日','一','二','三','四','五','六'].forEach(w=>html+='<div class="wh">'+w+'</div>');
  for(let i=first-1;i>=0;i--) html+='<div class="d dim">'+(prevDays-i)+'</div>';
  for(let d=1;d<=days;d++){
    let cls='d';
    if(calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate()) cls+=' today';
    if(DB.checkedDays.includes(d)&&calYear===2026&&calMonth===7) cls+=' checked';
    html+='<div class="'+cls+'" onclick="toggleCheck('+d+')">'+d+'</div>';
  }
  grid.innerHTML=html;
}
function toggleCheck(d){
  if(calYear!==2026||calMonth!==7)return;
  const idx=DB.checkedDays.indexOf(d);
  if(idx>=0) DB.checkedDays.splice(idx,1);
  else DB.checkedDays.push(d);
  saveData(); renderCal();
}
function calNav(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCal();
}

/* 渲染目标跑车卡片 */
function renderGoalCar(){
  var box=document.getElementById('goalCarContent');
  if(!box) return;
  /* 取第一个进行中的储蓄目标 */
  var goals=DB.salaryGoal||[];
  var goal=goals.find(function(g){return g.status==='进行中';})||goals[0];
  if(!goal){
    box.innerHTML='<div style="font-size:36px">🏁</div>'+
      '<div style="font-size:13px;color:var(--ink-3);margin-top:8px">还没有储蓄目标，去「工资储蓄」添加一个吧</div>';
    return;
  }
  var target=parseFloat(goal.target)||0;
  var current=parseFloat(goal.current)||0;
  var diff=target-current;
  var percent=target>0?Math.min(100,Math.round(current/target*100)):0;
  var carEmoji=percent>=100?'🏆':percent>=75?'🏎️':'🚗';

  var html='';
  html+='<div style="font-size:42px;line-height:1;animation:carBounce 2s ease-in-out infinite">'+carEmoji+'</div>';
  html+='<div style="margin-top:6px;font-size:14px;font-weight:700;color:var(--ink)">'+escapeHtml(goal.title||'目标')+'</div>';
  if(diff>0){
    html+='<div style="margin-top:4px;font-size:18px;font-weight:800;color:var(--accent-warm)">离目标还差 ¥'+diff.toLocaleString()+'</div>';
    html+='<div style="margin-top:2px;font-size:12px;color:var(--ink-3)">已存 ¥'+current.toLocaleString()+' / 目标 ¥'+target.toLocaleString()+'</div>';
  }else{
    html+='<div style="margin-top:4px;font-size:18px;font-weight:800;color:var(--accent-2)">🎉 目标已达成！</div>';
    html+='<div style="margin-top:2px;font-size:12px;color:var(--ink-3)">累计 ¥'+current.toLocaleString()+'</div>';
  }
  /* 进度条跑道 */
  html+='<div style="margin-top:10px;position:relative;height:8px;background:#f0e6d0;border-radius:4px;overflow:hidden">';
  html+='<div style="position:absolute;left:0;top:0;height:100%;width:'+percent+'%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transition:width .6s ease"></div>';
  html+='</div>';
  html+='<div style="margin-top:4px;font-size:11px;color:var(--ink-3)">完成度 '+percent+'%</div>';
  box.innerHTML=html;
}

/* 从车型名称识别品牌 */
function getCarBrand(title){
  if(!title) return null;
  var text=String(title).toLowerCase();
  for(var i=0;i<CAR_BRANDS.length;i++){
    var b=CAR_BRANDS[i];
    for(var j=0;j<b.keys.length;j++){
      if(text.indexOf(b.keys[j].toLowerCase())>=0){
        return b;
      }
    }
  }
  return null;
}

/* 加载车辆图片 */
var _carImgCache={};
function loadCarImage(title,wrapId){
  var wrap=document.getElementById(wrapId);
  if(!wrap) return;
  var brand=getCarBrand(title);
  if(!brand){
    wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
    return;
  }
  /* 优先使用本地自定义图片 */
  if(brand.localImg){
    _setCarImg(wrap,brand.localImg,brand);
    return;
  }
  /* 检查内存缓存 */
  if(_carImgCache[brand.wiki]){
    _setCarImg(wrap,_carImgCache[brand.wiki],brand);
    return;
  }
  /* 检查 localStorage 缓存 */
  var cacheKey='carImg_'+brand.wiki;
  try{
    var cached=localStorage.getItem(cacheKey);
    if(cached){
      _carImgCache[brand.wiki]=cached;
      _setCarImg(wrap,cached,brand);
      return;
    }
  }catch(e){}
  /* 显示加载中 */
  wrap.innerHTML='<div class="car-img-loading">🚗</div>';
  /* 从维基百科 REST API 获取图片 */
  var apiUrl='https://en.wikipedia.org/api/rest_v1/page/summary/'+brand.wiki;
  fetch(apiUrl,{headers:{'Accept':'application/json'}})
    .then(function(r){return r.json();})
    .then(function(data){
      var imgSrc='';
      if(data.originalimage&&data.originalimage.source){
        imgSrc=data.originalimage.source;
      }else if(data.thumbnail&&data.thumbnail.source){
        imgSrc=data.thumbnail.source;
      }
      if(imgSrc){
        _carImgCache[brand.wiki]=imgSrc;
        try{localStorage.setItem(cacheKey,imgSrc);}catch(e){}
        _setCarImg(wrap,imgSrc,brand);
      }else{
        wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
      }
    })
    .catch(function(){
      /* 尝试中文维基百科 */
      var cnApiUrl='https://zh.wikipedia.org/api/rest_v1/page/summary/'+brand.wiki;
      fetch(cnApiUrl,{headers:{'Accept':'application/json'}})
        .then(function(r){return r.json();})
        .then(function(data){
          var imgSrc='';
          if(data.originalimage&&data.originalimage.source){
            imgSrc=data.originalimage.source;
          }else if(data.thumbnail&&data.thumbnail.source){
            imgSrc=data.thumbnail.source;
          }
          if(imgSrc){
            _carImgCache[brand.wiki]=imgSrc;
            try{localStorage.setItem(cacheKey,imgSrc);}catch(e){}
            _setCarImg(wrap,imgSrc,brand);
          }else{
            wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
          }
        })
        .catch(function(){
          wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
        });
    });
}

function _setCarImg(wrap,src,brand){
  var img=new Image();
  img.loading='lazy';
  img.alt=brand.wiki;
  img.style.width='100%';
  img.style.height='100%';
  img.style.objectFit=brand.localImg?'contain':'cover';
  img.style.padding=brand.localImg?'4px':'0';
  img.onerror=function(){
    wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
  };
  img.onload=function(){
    wrap.innerHTML='';
    wrap.appendChild(img);
  };
  img.src=src;
}
/* 用户上传自定义车辆图片，自动抠图 */
function uploadCarImage(i){
  var input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.onchange=function(e){
    var file=e.target.files[0];
    if(!file)return;
    /* 显示抠图进度 */
    var toast=document.createElement('div');
    toast.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:20px 32px;border-radius:16px;font-size:14px;z-index:99999;text-align:center';
    toast.innerHTML='<div style="margin-bottom:8px">📸 正在处理图片...</div><div style="font-size:12px;opacity:.7">自动抠图中，请稍候</div>';
    document.body.appendChild(toast);
    
    var reader=new FileReader();
    reader.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var canvas=document.createElement('canvas');
        var maxW=800,maxH=600;
        var w=img.width,h=img.height;
        if(w>maxW){h=h*maxW/w;w=maxW;}
        if(h>maxH){w=w*maxH/h;h=maxH;}
        canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        
        /* 自动抠图：基于边缘颜色采样 + 色差移除 */
        try{
          autoRemoveBg(ctx,w,h);
        }catch(err){
          console.warn('抠图失败，使用原图:',err);
        }
        
        var dataUrl=canvas.toDataURL('image/png');
        if(!DB.carInfo)DB.carInfo=[];
        if(!DB.carInfo[i])DB.carInfo[i]={};
        DB.carInfo[i].customImg=dataUrl;
        saveData();
        
        toast.remove();
        renderList('carInfo');
      };
      img.onerror=function(){ toast.remove(); alert('图片加载失败'); };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* 纯Canvas自动抠图：边缘采样 + 色差移除 + 边缘羽化 */
function autoRemoveBg(ctx,w,h){
  var imageData=ctx.getImageData(0,0,w,h);
  var data=imageData.data;
  
  /* 1. 采样四条边的像素颜色 */
  var samples=[];
  var step=Math.max(2,Math.floor(Math.min(w,h)/30));
  for(var x=0;x<w;x+=step){
    var idxTL=(0*w+x)*4; samples.push([data[idxTL],data[idxTL+1],data[idxTL+2]]);
    var idxBL=((h-1)*w+x)*4; samples.push([data[idxBL],data[idxBL+1],data[idxBL+2]]);
  }
  for(var y=0;y<h;y+=step){
    var idxLT=(y*w+0)*4; samples.push([data[idxLT],data[idxLT+1],data[idxLT+2]]);
    var idxRT=(y*w+(w-1))*4; samples.push([data[idxRT],data[idxRT+1],data[idxRT+2]]);
  }
  
  /* 2. 聚类找主背景色：用简单色彩量化 */
  var bgColors=[];
  samples.forEach(function(s){
    var qr=Math.round(s[0]/32)*32, qg=Math.round(s[1]/32)*32, qb=Math.round(s[2]/32)*32;
    var key=qr+','+qg+','+qb;
    var found=bgColors.find(function(c){return c.key===key;});
    if(found){found.count++;}
    else{bgColors.push({key:key,r:qr,qg:qg,qb:qb,count:1,rs:0,gs:0,bs:0});}
    if(found){found.rs+=s[0]; found.gs+=s[1]; found.bs+=s[2]; found.count++;}
    else{bgColors[bgColors.length-1].rs=s[0]; bgColors[bgColors.length-1].gs=s[1]; bgColors[bgColors.length-1].bs=s[2];}
  });
  
  /* 取出现最多的颜色作为背景 */
  bgColors.sort(function(a,b){return b.count-a.count;});
  var bg=bgColors[0];
  var bgR=bg.rs/bg.count, bgG=bg.gs/bg.count, bgB=bg.bs/bg.count;
  
  /* 3. 如果有多个主要边缘色，取前2个 */
  var bgList=[{r:bgR,g:bgG,b:bgB}];
  if(bgColors.length>1 && bgColors[1].count>bgColors[0].count*0.3){
    var bg2=bgColors[1];
    bgList.push({r:bg2.rs/bg2.count,g:bg2.gs/bg2.count,b:bg2.bs/bg2.count});
  }
  
  /* 4. 遍历像素，与背景色比较 */
  var threshold=45;  /* 完全透明的色差阈值 */
  var feather=25;    /* 羽化范围 */
  
  for(var i=0;i<data.length;i+=4){
    var r=data[i],g=data[i+1],b=data[i+2];
    var minDist=999999;
    for(var bi=0;bi<bgList.length;bi++){
      var bgc=bgList[bi];
      var dist=Math.sqrt((r-bgc.r)*(r-bgc.r)+(g-bgc.g)*(g-bgc.g)+(b-bgc.b)*(b-bgc.b));
      if(dist<minDist)minDist=dist;
    }
    if(minDist<threshold){
      data[i+3]=0; /* 完全透明 */
    } else if(minDist<threshold+feather){
      /* 边缘羽化 */
      var alpha=(minDist-threshold)/feather;
      data[i+3]=Math.round(alpha*255);
    }
  }
  
  ctx.putImageData(imageData,0,0);
}

/* 生成进度环 SVG */
function makeProgressRing(pct,size){
  var r=(size/2)-6;

  var offset=circ-(pct/100)*circ;
  return '<svg width="'+size+'" height="'+size+'">'
    +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#e8eef5" stroke-width="5"/>'
    +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" '
      +'stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/>'
    +'<foreignObject x="0" y="0" width="'+size+'" height="'+size+'">'
      +'<div xmlns="http://www.w3.org/1999/xhtml" class="ov-progress-text">'
        +'<div class="ov-pct">'+pct+'%</div>'

/* 生成环形饼图 */
function makeDonut(groups,totalCount){
  if(totalCount===0){
    return '<div style="text-align:center;padding:20px;color:var(--ink-3);font-size:13px">暂无数据，去各模块添加内容吧</div>';
  }
  var cx=80,cy=80,r=60,rInner=38;
  var svg='<div class="ov-donut-wrap"><svg width="160" height="160">';
  var legend='';
  var startAngle=-90;
  groups.forEach(function(g,idx){
    var gCount=0;
    g.sections.forEach(function(s){gCount+=s.count;});
    if(gCount===0) return;
    var pct=gCount/totalCount;
    var angle=pct*360;
    var endAngle=startAngle+angle;
    if(idx===groups.length-1) endAngle=270; /* 最后一块闭合 */
    var color=OV_COLORS[idx%OV_COLORS.length];
    var path=arcPath(cx,cy,r,rInner,startAngle,endAngle);
    svg+='<path d="'+path+'" fill="'+color+'" opacity="0.9" style="cursor:pointer" onclick="switchSection(\''+g.sections[0].id+'\')"><title>'+g.name+': '+gCount+'条 ('+Math.round(pct*100)+'%)</title></path>';
    legend+='<div class="ov-legend-item" onclick="switchSection(\''+g.sections[0].id+'\')">'
      +'<span class="ov-legend-dot" style="background:'+color+'"></span>'
      +'<span>'+g.name+'</span>'
      +'<span class="ov-legend-val">'+gCount+'条</span>'
    +'</div>';
    startAngle=endAngle;
  });
  svg+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="22" font-weight="800" fill="#1a202c">'+totalCount+'</text>';
  svg+='<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="10" fill="#94a3b8">总数据</text>';
  svg+='</svg><div class="ov-legend">'+legend+'</div></div>';
  return svg;
}

/* 环形扇形路径 */
function arcPath(cx,cy,rOuter,rInner,startDeg,endDeg){
  var sRad=startDeg*Math.PI/180;
  var eRad=endDeg*Math.PI/180;
  var x1=cx+rOuter*Math.cos(sRad), y1=cy+rOuter*Math.sin(sRad);
  var x2=cx+rOuter*Math.cos(eRad), y2=cy+rOuter*Math.sin(eRad);
  var x3=cx+rInner*Math.cos(eRad), y3=cy+rInner*Math.sin(eRad);
  var x4=cx+rInner*Math.cos(sRad), y4=cy+rInner*Math.sin(sRad);
  var large=(endDeg-startDeg)>180?1:0;
  return 'M'+x1+' '+y1+' A'+rOuter+' '+rOuter+' 0 '+large+' 1 '+x2+' '+y2
    +' L'+x3+' '+y3+' A'+rInner+' '+rInner+' 0 '+large+' 0 '+x4+' '+y4+' Z';
}

/* 生成横向柱状图 */
function makeBars(groups,totalCount){
  if(totalCount===0) return '<div style="text-align:center;padding:16px;color:var(--ink-3);font-size:13px">暂无数据</div>';
  var maxCount=1;
  groups.forEach(function(g){
    g.sections.forEach(function(s){ if(s.count>maxCount)maxCount=s.count; });
  });
  var html='';
  groups.forEach(function(g,idx){
    var color=OV_COLORS[idx%OV_COLORS.length];
    g.sections.forEach(function(s){
      var w=maxCount>0?Math.round(s.count/maxCount*100):0;
      html+='<div class="ov-bar-row" onclick="switchSection(\''+s.id+'\')">';
      html+='<div class="ov-bar-label">'+s.name+'</div>';
      html+='<div class="ov-bar-track"><div class="ov-bar-fill" style="width:'+w+'%;background:'+color+'">'+(s.count>0?s.count:'')+'</div></div>';
      html+='</div>';
    });
  });
  return html;
}

function formatInspoTime(ts){
  if(!ts)return '';
  const d=new Date(ts);
  const now=new Date();
  const diff=now-d;
  if(diff<60000)return '刚刚';
  if(diff<3600000)return Math.floor(diff/60000)+'分钟前';
  if(diff<86400000)return Math.floor(diff/3600000)+'小时前';
  if(diff<86400000*7)return Math.floor(diff/86400000)+'天前';
  return (d.getMonth()+1)+'/'+d.getDate();
}

/* ========== 语音输入（Web Speech API） ========== */
let _voiceRec=null;
let _voiceTargetId=null;
let _voiceBtnEl=null;
let _voiceAccumText=''; // 累积已识别的文本

function toggleVoice(targetId,btnEl){
  // 如果正在录音，停止
  if(_voiceRec&&_voiceTargetId===targetId){
    _voiceRec.stop();
    return;
  }
  // 如果在录别的字段，先停掉
  if(_voiceRec){
    _voiceRec.stop();
  }

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    alert('当前浏览器不支持语音识别，请使用 Chrome、Edge 或 Safari 浏览器');
    return;
  }

  _voiceRec=new SR();
  _voiceRec.lang='zh-CN';
  _voiceRec.continuous=true;
  _voiceRec.interimResults=true;

  const target=document.getElementById(targetId);
  if(!target)return;

  _voiceTargetId=targetId;
  _voiceBtnEl=btnEl;
  _voiceAccumText=target.value||'';

  btnEl.classList.add('recording');
  btnEl.textContent='🔴';

  const hintId=targetId==='ipTitle'?'voiceHintTitle':'voiceHintDesc';
  const hint=document.getElementById(hintId);
  if(hint){hint.classList.add('recording');hint.textContent='正在录音…说完后点击按钮停止';}

  let finalText='';

  _voiceRec.onresult=function(event){
    let interim='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t=event.results[i][0].transcript;
      if(event.results[i].isFinal){
        finalText+=t;
      }else{
        interim+=t;
      }
    }
    target.value=_voiceAccumText+finalText+interim;
  };

  _voiceRec.onerror=function(event){
    console.error('语音识别错误:',event.error);
    let msg='语音识别出错';
    if(event.error==='not-allowed'||event.error==='service-not-allowed'){
      msg='麦克风权限被拒绝，请允许浏览器使用麦克风';
    }else if(event.error==='no-speech'){
      msg='没有检测到语音，请再试一次';
    }else if(event.error==='network'){
      msg='网络错误，语音识别需要网络连接';
    }
    alert(msg);
    _stopVoiceUI();
  };

  _voiceRec.onend=function(){
    // 录音结束，把最终文本写入
    if(finalText){
      target.value=_voiceAccumText+finalText;
    }
    _stopVoiceUI();
  };

  try{
    _voiceRec.start();
  }catch(e){
    alert('无法启动语音识别：'+e.message);
    _stopVoiceUI();
  }
}

function _stopVoiceUI(){
  if(_voiceBtnEl){
    _voiceBtnEl.classList.remove('recording');
    _voiceBtnEl.textContent='🎤';
  }
  const h1=document.getElementById('voiceHintTitle');
  const h2=document.getElementById('voiceHintDesc');
  if(h1){h1.classList.remove('recording');h1.textContent='点麦克风语音输入标题';}
  if(h2){h2.classList.remove('recording');h2.textContent='点麦克风语音输入描述';}
  _voiceRec=null;
  _voiceTargetId=null;
  _voiceBtnEl=null;
  _voiceAccumText='';
}

function saveCloudCfg(){
  let url=document.getElementById('cfgUrl').value.trim().replace(/\/+$/,'');
  const anonKey=document.getElementById('cfgKey').value.trim();
  const workspaceId=document.getElementById('cfgWs').value.trim();
  if(!url||!anonKey||!workspaceId){
    alert('请填写完整的 Supabase URL、Anon Key 和工作区 ID');return;
  }
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(url)){
    alert('URL格式不正确，应该是 https://xxxxxxxx.supabase.co 格式（不要有末尾斜杠）');return;
  }
  CLOUD_CFG={url,anonKey,workspaceId};
  saveCloudConfig(CLOUD_CFG);
  if(initSupabase()){
    alert('云同步配置已保存！正在测试连接…');
    (async()=>{
      const d=await loadFromCloud();
      if(d){
        DB=d;ensureKeys();saveData();switchSection('data');
        subscribeCloud();
        startPolling();
        alert('✅ 连接成功！数据已从云端加载。\n工作区: '+workspaceId+'\n\n数据会自动同步，无需手动操作。');
      }else if(lastSyncError){
        alert('❌ 连接失败：'+lastSyncError+'\n\n请检查：\n1. 是否已在Supabase运行建表SQL\n2. 是否运行了GRANT权限语句\n3. URL和Key是否正确');
      }else{
        subscribeCloud();
        startPolling();
        alert('✅ 已连接！工作区为空，数据将在保存时自动上传。\n工作区: '+workspaceId+'\n\n数据会自动同步，无需手动操作。');
      }

function exportData(){

function exportModule(dbKey,moduleName){
  const data=DB[dbKey];
  if(data===undefined||(Array.isArray(data)&&data.length===0)){
    showToast(moduleName+'暂无数据可导出','warn');
    return;
  }
  const exportObj={module:dbKey,name:moduleName,exportDate:new Date().toISOString(),data:data};
  const blob=new Blob([JSON.stringify(exportObj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='xiaosong-'+dbKey+'-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast(moduleName+' 导出成功！','success');
}
function importData(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        /* 判断是否为单模块导出 */
        if(data.module&&data.data!==undefined){
          const moduleName=data.name||data.module;
          if(!confirm('检测到「'+moduleName+'」单模块数据，导入后将合并到当前数据中。确认导入？')) return;
          if(Array.isArray(data.data)&&Array.isArray(DB[data.module])){
            DB[data.module]=data.data.concat(DB[data.module]);
          }else{
            DB[data.module]=data.data;
          }
          ensureKeys(); saveData();
          showToast(moduleName+' 导入成功！','success');
          switchSection('data');
        }else{
          if(confirm('导入会覆盖当前所有数据，确定继续？')){
            DB=data; ensureKeys(); saveData();
            showToast('数据导入成功！','success');
            switchSection('data');
          }
        }
      }catch(err){ showToast('导入失败：文件格式错误','error'); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function resetData(){
  if(confirm('确定清空所有数据？此操作不可撤销！建议先导出备份。')){
    if(confirm('再次确认：真的要清空全部数据吗？')){
      DB={};
      ensureKeys();
      saveData();
      showToast('已清空所有数据','warn');
      switchSection('data');
    }
  }
}

        b.className='btn btn-ghost';

  /* 填充预设 */

  var modelEl=document.getElementById('agentApiModel');
  if(urlEl) urlEl.value=preset.baseUrl;
  if(modelEl) modelEl.value=preset.model;

  const custom=document.getElementById('agentStyleCustom');
  if(!sel) return '';
  if(sel.value==='__custom__') return custom?custom.value.trim():'未指定';
  return sel.value;
}

/* 获取当前题材值 */
function getAgentGenre(){
  const sel=document.getElementById('agentGenre');
  const custom=document.getElementById('agentGenreCustom');
  if(!sel) return '';
  if(sel.value==='__custom__') return custom?custom.value.trim():'未指定';
  return sel.value;
}

/* 调用大模型API */
function callAgentLLM(systemPrompt, userMessage, isTest){
  const s=DB.apiSettings||{};
  let baseUrl=s.apiBaseUrl||'';
  const apiKey=s.apiKey||'';
  const model=s.model||(isTest?'gpt-4o-mini':'gpt-4o');
  if(!baseUrl||!apiKey){
    return Promise.reject(new Error('API 地址或 Key 未设置，请先在上方「API 设置」中填写并保存'));
  }
  /* 规范化 baseUrl，智能识别版本号 */
  baseUrl=baseUrl.replace(/\/+$/,'');
  if(baseUrl.endsWith('/chat/completions')){
    /* 已经是完整地址，直接用 */
  }else if(/\/v\d+$/.test(baseUrl)){
    /* 已经包含版本号（如/v1,/v4），直接补/chat/completions */
  }else{
    /* 默认加 /v1 */
    baseUrl=baseUrl+'/v1';
  }
  const url=baseUrl+'/chat/completions';

  return fetch(url,{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+apiKey
    },
    body:JSON.stringify({
      model: model,
      messages:[
        {role:'system',content:systemPrompt},
        {role:'user',content:userMessage}
      ],
      temperature:0.8,
      max_tokens:8192,
      response_format:{type:'json_object'}
    })
  }).then(r=>{
    if(!r.ok){
      return r.text().then(t=>{
        let msg='HTTP '+r.status;
        try{ const e=JSON.parse(t); if(e.error&&e.error.message) msg+='：'+e.error.message; }catch(_){}
        throw new Error(msg);
      });
    }
    return r.json();
  }).then(data=>{
    const content=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
    if(!content) throw new Error('API 返回内容为空');
    return content;
  });
}

/* 从文本中提取JSON（容错处理） */
function extractJsonFromText(text){
  if(!text) return null;
  /* 先尝试直接解析 */
  try{ return JSON.parse(text); }catch(_){}
  /* 尝试提取第一个 { 到最后一个 } */
  const first=text.indexOf('{');
  const last=text.lastIndexOf('}');
  if(first>-1&&last>-1&&last>first){
    try{ return JSON.parse(text.substring(first,last+1)); }catch(_){}
  }
  /* 尝试用正则匹配 JSON 对象 */
  const match=text.match(/\{[\s\S]*\}/);
  if(match){
    try{ return JSON.parse(match[0]); }catch(_){}
  }
  return null;
}

/* 生成漫剧剧本 */
function generateManhuaScript(){
  const style=getAgentStyle();
  const genre=getAgentGenre();
  const idea=document.getElementById('agentIdea').value.trim();
  const mode=getAgentOutputMode();
  const isStoryboard=mode==='storyboard';
  const isCharacter=mode==='character';
  const isPipeline=mode==='pipeline';

  /* 角色模式不强制要求故事灵感，但需要画风 */
  if(!isCharacter && !idea){
    showAgentError(mode==='pipeline'?'请输入短剧剧本或故事梗概':'请填写故事灵感，描述你的核心想法');
    return;
  }
  if(!style){
    showAgentError('请选择画风');
    return;
  }
  if(!isCharacter && !genre){
    showAgentError('请选择题材类型');
    return;
  }

  const s=DB.apiSettings||{};
  if(!s.apiBaseUrl||!s.apiKey){
    showAgentError('请先在上方「API 设置」中填写 API 地址和 Key 并保存');
    return;
  }

  hideAgentError();
  
  let loadingText='AI 正在创作漫剧剧本，请稍候…';
  if(isStoryboard) loadingText='AI 正在生成分镜故事板，请稍候…';
  if(isPipeline) loadingText='AI 正在生成全流程资产，请稍候…';
  if(isCharacter){
    const charType=getAgentCharType();
    if(charType==='reference') loadingText='AI 正在生成角色设定卡，请稍候…';
    else if(charType==='wardrobe') loadingText='AI 正在生成10套剧情衣橱，请稍候…';
    else loadingText='AI 正在生成角色全套设定，请稍候…';
  }
  showAgentLoading(loadingText);
  setAgentButtonsDisabled(true);

  let systemPrompt,userMsg;
  if(isPipeline){
    systemPrompt=PIPELINE_SYSTEM_PROMPT;
    userMsg=`请根据以下短剧剧本/故事梗概，生成全套AI短剧分镜与资产：
【画风】${style}
${genre?`【题材类型】${genre}`:''}
【剧本/故事梗概】${idea}

请严格按照指定的 JSON 格式输出完整的全流程资产数据，包含：
1. analysis：剧本解析（题材、美术风格、梗概、角色清单、场景清单、关键冲突）
2. character_assets：角色资产库（每个角色含基础档案+三版提示词）
3. scene_assets：场景资产库（每个场景含环境描述+三版提示词）
4. storyboard：分镜故事板（3×2布局6格，国漫写实手绘草稿速写风）
5. video_prompts：分镜视频生成提示词（每格分镜对应正向+负面）

所有提示词要可直接复制，角色板锁脸锁人设，故事板带分镜标记符号。`;
  } else if(isCharacter){
    const charInfo=getAgentCharInfo();
    const charType=getAgentCharType();
    const typeNameMap={reference:'角色设定卡',wardrobe:'10套剧情衣橱',both:'角色设定卡+10套衣橱全套'};
    systemPrompt=CHARACTER_SYSTEM_PROMPT;
    userMsg=`请根据以下信息生成一份专业的影视级角色设定：
【画风】${style}
【生成类型】${typeNameMap[charType]||'角色设定卡'}
【角色姓名】${charInfo.name||'未命名'}
【性别】${charInfo.gender}
【年龄】${charInfo.age||'未指定'}
【时代背景】${charInfo.era}
【身份职业】${charInfo.job||'未指定'}
【人物气质】${charInfo.temperament||'未指定'}
【特殊外貌特征】${charInfo.feature||'无'}
${idea?`【补充描述】${idea}`:''}

请严格按照指定的 JSON 格式输出完整的角色设定数据。
${charType==='reference'?'输出角色设定卡模式（character_reference）。':''}
${charType==='wardrobe'?'输出衣橱设定模式（character_wardrobe），包含10套完全差异化的穿搭。':''}
${charType==='both'?'输出全套模式（character_both），同时包含 reference 和 wardrobe 两部分。':''}
每个绘图提示词都必须包含人物固定特征（脸型、五官、肤色、年龄、核心发型）以保证人物一致性。`;
  } else if(isStoryboard){
    const sbStyle=getAgentStoryboardStyle();
    const styleNameMap={
      sketch:'手绘草稿速写风',
      pencil:'铅笔单线条稿（脸部留白十字线）',
      action:'动作分镜（快速粗犷）',
      director:'导演轨道故事板',
      '3dwhite':'3D白模（黏土风格）',
      scenemap:'场景平面视图'
    };
    const styleName=styleNameMap[sbStyle]||'手绘草稿速写风';
    systemPrompt=STORYBOARD_SYSTEM_PROMPT;
    userMsg=`请根据以下信息生成一份专业的分镜故事板：
【画风】${style}
【题材类型】${genre}
【故事板风格】${styleName}
【故事灵感】${idea}

请严格按照指定的 JSON 格式输出完整的分镜故事板，包含标题、类型、风格、布局、角色列表、图例和分镜镜头列表（panels）。
每个镜头必须包含：panel_id、shot_type、action、description、draw_prompt。`;
  } else {
    systemPrompt=MANHUA_SYSTEM_PROMPT;
    userMsg=`请根据以下信息创作一部完整的漫剧剧本：
【画风】${style}
【题材类型】${genre}
【故事灵感】${idea}

请严格按照指定的 JSON 格式输出完整的漫剧剧本，包含标题、题材、梗概、画风、角色列表和分镜镜头。`;
  }

  callAgentLLM(systemPrompt, userMsg, false)
    .then(content=>{
      const data=extractJsonFromText(content);
      if(!data){
        throw new Error('无法解析返回的 JSON 数据，请重试或调整提示词');
      }
      /* 数据校验 */
      if(isPipeline){
        if(!data.output_mode||!data.analysis){
          throw new Error('返回数据格式不完整（缺少 output_mode 或 analysis）');
        }
      } else if(isCharacter){
        if(!data.output_mode){
          throw new Error('返回数据格式不完整（缺少 output_mode）');
        }
      } else if(isStoryboard){
        if(!data.title||!Array.isArray(data.panels)){
          throw new Error('返回数据格式不完整（缺少 title 或 panels）');
        }
      } else {
        if(!data.title||!Array.isArray(data.characters)||!Array.isArray(data.shots)){
          throw new Error('返回数据格式不完整（缺少 title、characters 或 shots）');
        }
      }
      _currentManhuaScript=data;
      renderAgentResult(data);
      hideAgentLoading();
      let successMsg='漫剧剧本生成成功！';
      if(isStoryboard) successMsg='分镜故事板生成成功！';
      if(isPipeline) successMsg='全流程资产生成成功！';
      if(isCharacter){
        const ct=getAgentCharType();
        if(ct==='reference') successMsg='角色设定卡生成成功！';
        else if(ct==='wardrobe') successMsg='10套衣橱生成成功！';
        else successMsg='角色全套设定生成成功！';
      }
      showToast(successMsg,'success');
      /* 保存到临时缓存（5分钟内刷新可恢复） */
      saveTempCache('agent',data,{output_mode:data.output_mode||'manhua'});
      /* 启用修改按钮 */
      const btn=document.getElementById('btnModifyScript');
      if(btn) btn.disabled=false;
    })
    .catch(err=>{
      hideAgentLoading();
      showAgentError('生成失败：'+(err.message||err));
    })
    .finally(()=>{
      setAgentButtonsDisabled(false);
    });
}
