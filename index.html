<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小松工作台">
<meta name="theme-color" content="#15273b">
<meta name="format-detection" content="telephone=no">
<title>小松的工作台 · 男生版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<style>
  :root{
    --side-1:#15273b; --side-2:#1e3349; --side-active:#2b4a6b;
    --side-text:#c4d4e3; --side-text-dim:#7d92a6;
    --content-bg:#eceff4; --card:#ffffff;
    --accent:#2e86de; --accent-2:#1abc9c; --accent-warm:#e67e22;
    --ink:#1f2d3d; --ink-2:#51637a; --ink-3:#8a9bb0;
    --line:#e3e9f0; --tag-blue:#dbeafe; --tag-blue-t:#1d6fb8;
    --tag-mint:#d4f1e4; --tag-mint-t:#128a6a;
    --tag-amber:#fde8d0; --tag-amber-t:#c4771a;
    --tag-violet:#e6dcf7; --tag-violet-t:#6b3fa0;
    --tag-rose:#fbdde6; --tag-rose-t:#b83d63;
    --shadow:0 4px 16px rgba(20,40,70,.06),0 1px 3px rgba(20,40,70,.04);
    --radius:16px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --statusbar-h:calc(38px + var(--safe-top));
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{height:100%;touch-action:manipulation;overscroll-behavior:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Roboto,sans-serif;
    background:#0f1a26; color:var(--ink); overflow:hidden;
    -webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;
  }
  .device{
    width:100%; height:100vh; height:100dvh; max-width:1180px; margin:0 auto;
    display:flex; flex-direction:column; background:var(--content-bg);
    position:relative;
  }
  /* ===== 顶部状态栏（适配全面屏安全区）===== */
  .statusbar{
    height:var(--statusbar-h); padding-top:var(--safe-top);
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding-left:18px; padding-right:18px;
    font-size:14px; font-weight:600; color:#fff;
    background:linear-gradient(90deg,var(--side-1),var(--side-2));
  }
  .statusbar .left{display:flex;align-items:center;gap:8px}
  .statusbar .center{width:120px;height:26px;background:#000;border-radius:14px}
  .statusbar .right{display:flex;align-items:center;gap:6px;font-size:12px}
  .statusbar .right svg{width:16px;height:11px}
  .bat{display:inline-flex;align-items:center;gap:2px}
  .bat-body{width:22px;height:11px;border:1.4px solid #fff;border-radius:3px;position:relative;padding:1.2px}
  .bat-body i{display:block;height:100%;width:67%;background:#fff;border-radius:1px}
  .bat-tip{width:2px;height:5px;background:#fff;border-radius:0 2px 2px 0}

  /* ===== 主体分栏 ===== */
  .main{flex:1; display:flex; overflow:hidden; min-height:0}

  /* ===== 左侧导航 ===== */
  .sidebar{
    width:188px; flex-shrink:0; background:linear-gradient(180deg,var(--side-1),var(--side-2));
    display:flex; flex-direction:column; overflow:hidden;
  }
  .side-head{padding:14px 16px 10px}
  .side-head .ws-name{color:#fff;font-size:16px;font-weight:700;letter-spacing:.5px}
  .side-head .ws-sub{color:var(--side-text-dim);font-size:11px;margin-top:3px;display:flex;align-items:center;gap:4px}
  .side-head .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:inline-flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
  .nav-scroll{flex:1;overflow-y:auto;padding:4px 8px 16px;-webkit-overflow-scrolling:touch}
  .nav-scroll::-webkit-scrollbar{width:0}
  .nav-item{
    display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:11px;
    color:var(--side-text);font-size:13px;cursor:pointer;margin:2px 0;
    transition:background .18s,color .18s; position:relative; user-select:none;
  }
  .nav-item .ico{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:rgba(255,255,255,.08)}
  .nav-item:hover{background:rgba(255,255,255,.07)}
  .nav-item.active{background:var(--side-active);color:#fff}
  .nav-item.active .ico{background:rgba(255,255,255,.18)}
  .nav-item.active::before{content:"";position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent-2);border-radius:3px 0 0 3px}
  .nav-item .badge{margin-left:auto;background:#e74c3c;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .nav-group{font-size:10px;font-weight:700;color:var(--side-text-dim);letter-spacing:1px;padding:14px 10px 4px;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.06);margin-top:6px}
  .nav-group:first-child{border-top:none;margin-top:2px}

  /* ===== 右侧内容 ===== */
  .content{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:var(--content-bg)}
  .content::-webkit-scrollbar{width:6px}
  .content::-webkit-scrollbar-thumb{background:#c5d2e0;border-radius:3px}
  .content-inner{padding:16px 20px calc(80px + var(--safe-bottom));max-width:760px}

  .page-head{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .page-head .bow{font-size:18px}
  .page-head h1{font-size:22px;font-weight:800;color:var(--ink)}
  .page-head .sub{font-size:13px;color:var(--ink-3);font-weight:500;margin-bottom:2px}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
  .card.tint-blue{background:linear-gradient(135deg,#e8f2fc,#f0f7ff);border-color:#d6e8f7}
  .card.tint-mint{background:linear-gradient(135deg,#e4f7ef,#eefaf4);border-color:#d0eee0}
  .card.tint-amber{background:linear-gradient(135deg,#fdf0dc,#fff8ec);border-color:#f5e0c4}
  .card.tint-violet{background:linear-gradient(135deg,#efe6f8,#f7f0fd);border-color:#e0d2f0}
  .card.tint-slate{background:linear-gradient(135deg,#e8eef5,#f0f5fa);border-color:#dae4ef}
  .card-h{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px;flex-wrap:wrap}
  .card-h .right-ml{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3)}
  .card-h .btn{margin-left:auto}
  .txt{font-size:13px;line-height:1.7;color:var(--ink-2)}
  .txt b{color:var(--ink)}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:none;transition:transform .1s,filter .15s;font-family:inherit}
  .btn:active{transform:scale(.95)}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-mint{background:var(--accent-2);color:#fff}
  .btn-ghost{background:#f1f5fa;color:var(--ink-2);border:1px solid var(--line)}
  .btn:hover{filter:brightness(1.06)}

  /* 待办 */
  .todo-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .progress{flex:1;height:6px;background:#eaeff5;border-radius:3px;overflow:hidden;min-width:60px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:3px;transition:width .3s}
  .todo-item{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px}
  .todo-item:last-child{border-bottom:none}
  .todo-item .ck{width:20px;height:20px;border-radius:6px;border:2px solid #c2cdda;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
  .todo-item.done .ck{background:var(--accent-2);border-color:var(--accent-2)}
  .todo-item.done .ck::after{content:"✓";color:#fff;font-size:12px;font-weight:800}
  .todo-item.done .label{text-decoration:line-through;color:var(--ink-3)}
  .todo-item .del{margin-left:auto;color:#c2cdda;cursor:pointer;font-size:14px;opacity:0;transition:opacity .15s}
  .todo-item:hover .del{opacity:1}

  /* 日历 */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head .mon{font-size:14px;font-weight:700}
  .cal-head .nav-btn{cursor:pointer;color:var(--ink-3);font-size:16px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:8px}
  .cal-head .nav-btn:hover{background:#eef3f9}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal-grid .wh{font-size:11px;color:var(--ink-3);padding:4px 0;font-weight:600}
  .cal-grid .d{font-size:12px;padding:6px 0;border-radius:8px;cursor:pointer;position:relative;color:var(--ink-2)}
  .cal-grid .d.dim{color:#c2cdda}
  .cal-grid .d.today{border:1.5px solid var(--accent);font-weight:700;color:var(--accent)}
  .cal-grid .d.checked{background:var(--accent-2);color:#fff;font-weight:700}
  .cal-grid .d.checked::after{content:"";display:block;width:4px;height:4px;background:#fff;border-radius:50%;margin:1px auto 0}
  .cal-legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--ink-3)}
  .cal-legend span{display:flex;align-items:center;gap:4px}

  /* 资源条目 */
  .res{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .res:last-child{border-bottom:none}
  .res .num{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5aa9e6);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .res .num.amber{background:linear-gradient(135deg,var(--accent-warm),#f0a957)}
  .res .num.violet{background:linear-gradient(135deg,#7e57c2,#a78bda)}
  .res .body{flex:1}
  .res .t{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:4px}
  .res .t .ext{color:var(--ink-3);font-size:12px}
  .res .meta{font-size:11px;color:var(--ink-3);margin:2px 0 4px}
  .res .desc{font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .res .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}

  /* 时间线 */
  .tl{position:relative;padding-left:18px}
  .tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 14px 14px}
  .tl-item:last-child{padding-bottom:0}
  .tl-item::before{content:"";position:absolute;left:-14px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 0 0 2px var(--accent)}
  .tl-item.mint::before{background:var(--accent-2);box-shadow:0 0 0 2px var(--accent-2)}
  .tl-item.amber::before{background:var(--accent-warm);box-shadow:0 0 0 2px var(--accent-warm)}
  .tl-item .tm{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
  .tl-item .ti{font-size:13px;font-weight:700;color:var(--ink)}
  .tl-item .td{font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.5}

  /* 子表格 */
  .sub-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .sub-tbl th{text-align:left;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  .sub-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--ink-2)}
  .sub-tbl td b{color:var(--ink)}

  /* 浮动按钮 */
  .fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-bottom));width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-3);cursor:pointer;z-index:50;border:none}
  .fab:hover{color:var(--accent)}

  /* ===== 浮动菜单按钮（手机端 + PWA 始终可见）===== */
  .menu-fab{display:none}
  @media(max-width:768px){
    .menu-fab{
      display:flex;position:fixed;left:16px;bottom:calc(16px + var(--safe-bottom));
      width:54px;height:54px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff;align-items:center;justify-content:center;
      font-size:26px;cursor:pointer;z-index:62;border:none;
      box-shadow:0 4px 18px rgba(46,134,222,.5);
      user-select:none;
    }
    .menu-fab:active{transform:scale(.9)}
  }

  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

  /* 分享弹窗 */
  .share-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);
    z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .share-mask.show{display:flex}
  .share-box{
    background:#fff;border-radius:20px;padding:24px 20px;max-width:340px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .3s ease;max-height:90vh;overflow-y:auto;text-align:center;
  }
  .share-box h2{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px}
  .share-box .gsub{font-size:12px;color:var(--ink-3);margin-bottom:16px}
  #qrcodeBox{display:flex;justify-content:center;margin:10px auto 16px}
  #qrcodeBox img,#qrcodeBox canvas{border-radius:12px;border:1px solid var(--line)}
  .share-link-box{
    background:var(--content-bg);border-radius:12px;padding:10px 12px;margin:10px 0;
    font-size:11px;color:var(--ink-3);word-break:break-all;line-height:1.5;text-align:left;
    max-height:60px;overflow-y:auto;
  }
  .share-btns{display:flex;gap:8px;margin-top:12px}
  .share-btns button{flex:1}
  .share-close{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:none;background:var(--content-bg);color:var(--ink-2);font-size:15px;font-weight:600;cursor:pointer}
  .share-close:active{transform:scale(.97)}

  /* 连接成功提示 */
  .connect-toast{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:#fff;border-radius:20px;padding:28px 24px;max-width:320px;width:calc(100% - 40px);
    box-shadow:0 20px 60px rgba(0,0,0,.3);z-index:101;text-align:center;
    display:none;animation:pop .3s ease;
  }
  .connect-toast.show{display:block}
  .connect-toast .ct-icon{font-size:48px;margin-bottom:8px}
  .connect-toast .ct-title{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px}
  .connect-toast .ct-desc{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
  .connect-toast .ct-ws{background:var(--content-bg);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:14px}
  .connect-toast button{width:100%;padding:12px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .connect-toast button:active{transform:scale(.97)}

  .section{display:none;animation:fade .25s ease}
  .section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 空态 */
  .empty{text-align:center;padding:36px 16px;color:var(--ink-3);font-size:13px;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(245,248,252,.3));border:1.5px dashed #d0dae6}
  .empty .big{font-size:40px;margin-bottom:10px;filter:grayscale(.15);opacity:.8}
  .empty-hint{
    text-align:center;padding:28px 16px;color:var(--ink-3);font-size:13px;
    border-radius:14px;margin:4px 0;
    background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(245,248,252,.4));
    border:1.5px dashed #d0dae6;
    position:relative;overflow:hidden;
  }
  .empty-hint::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 30%,rgba(46,134,222,.06),transparent 70%);
    pointer-events:none;
  }
  .empty-hint .big{font-size:36px;margin-bottom:8px;filter:grayscale(.15);opacity:.8}
  .empty-hint .big-emoji{display:inline-block;animation:emptyWobble 4s ease-in-out infinite}

  /* CRUD 表单 */
  .crud-input{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;color:var(--ink);background:#f8fafd;outline:none;transition:border-color .15s;
    font-family:inherit;margin-bottom:8px;
  }
  .crud-input:focus{border-color:var(--accent);background:#fff}
  .crud-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;color:var(--ink);background:#f8fafd;outline:none;transition:border-color .15s;
    font-family:inherit;resize:vertical;min-height:60px;margin-bottom:8px;line-height:1.5}
  .crud-textarea:focus{border-color:var(--accent);background:#fff}
  .crud-label{font-size:12px;color:var(--ink-3);font-weight:600;display:block;margin-bottom:4px}
  .btn-sm{padding:4px 10px;font-size:11px;border-radius:8px}
  .btn-edit{background:var(--tag-blue);color:var(--tag-blue-t)}
  .btn-del{background:var(--tag-rose);color:var(--tag-rose-t)}

  /* ===== 通用列表项 ===== */
  .gitem{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .swipe-content{display:flex;align-items:flex-start;gap:10px;padding:12px 0;transition:transform .25s ease;background:var(--content-bg);position:relative;z-index:1;touch-action:pan-y}
  .gitem.swiped .swipe-content{transform:translateX(-130px)}
  .swipe-actions{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:2px;padding:0 6px 0 14px;z-index:0}
  .swipe-btn{width:56px;height:36px;border:none;border-radius:8px;font-size:13px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;transition:transform .12s}
  .swipe-edit{background:var(--accent)}
  .swipe-del{background:#e74c3c}
  .swipe-btn:active{transform:scale(.92)}
  .gitem:last-child{border-bottom:none}
  .gitem .ck{width:20px;height:20px;border-radius:6px;border:2px solid #c2cdda;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-top:1px}
  .gitem .ck.checked{background:var(--accent-2);border-color:var(--accent-2)}
  .gitem .ck.checked::after{content:"✓";color:#fff;font-size:12px;font-weight:800}
  .gitem .gbody{flex:1;min-width:0}
  .gitem .gt{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.4}
  .gitem .gt.done-t{text-decoration:line-through;color:var(--ink-3)}
  .gitem .gmeta{font-size:11px;color:var(--ink-3);margin:2px 0 0}
  .gitem .gdesc{font-size:12.5px;line-height:1.6;color:var(--ink-2);margin-top:3px}
  .gitem .gdesc.clamp{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;position:relative}
  .gitem .gdesc.clamp::after{content:"展开";position:absolute;right:0;bottom:0;background:linear-gradient(90deg,transparent,var(--content-bg) 30%);padding:0 4px;font-size:11px;color:var(--accent);font-weight:600}
  .gitem.expanded .gdesc.clamp{-webkit-line-clamp:unset;line-clamp:unset;overflow:visible}
  .gitem.expanded .gdesc.clamp::after{content:"收起"}
  .gitem .gfields{margin-top:4px;font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
  .gitem .gfields span b{color:var(--ink-3);font-weight:600}
  .gitem .gtags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .gitem .gcopy{margin-top:8px}
  .gitem .copy-btn{padding:5px 12px;font-size:11.5px;border-radius:16px;background:linear-gradient(135deg,#eef5ff,#e8faf2);color:var(--accent);border:1px solid #d6e6f7}
  .gitem .copy-btn:active{transform:scale(.94)}
  /* 车辆图片 */
  .car-img-wrap{width:100%;height:160px;border-radius:10px;overflow:hidden;margin-bottom:8px;background:linear-gradient(135deg,#f0f4f8,#e8eef5);position:relative;display:flex;align-items:center;justify-content:center}
  .car-img-wrap img{width:100%;height:100%;object-fit:contain;display:block;padding:4px}
  .car-img-wrap .car-img-loading{font-size:28px;animation:pulse 1.5s ease-in-out infinite}
  .car-img-wrap .car-img-fallback{font-size:48px;opacity:.5}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  /* 标签筛选栏 */
  .tag-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tf-btn{padding:5px 12px;font-size:12px;font-weight:600;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink-2);cursor:pointer;transition:all .15s}
  .tf-btn:hover{border-color:var(--accent);color:var(--accent)}
  .tf-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .gitem .actions{display:flex;gap:6px;flex-shrink:0;align-self:flex-start;opacity:0;transition:opacity .15s}
  .gitem:hover .actions{opacity:1}
  @media(max-width:768px){.gitem .actions{opacity:1}}
  .gitem .actions .btn-sm{padding:4px 8px}

  /* ===== 总览仪表盘 ===== */
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .ov-stat{background:#fff;border-radius:12px;padding:14px;border:1px solid var(--line);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
  .ov-stat:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .ov-stat:active{transform:scale(.98)}
  .ov-stat .ov-icon{font-size:22px;margin-bottom:6px}
  .ov-stat .ov-num{font-size:28px;font-weight:800;color:var(--ink);line-height:1}
  .ov-stat .ov-label{font-size:11px;color:var(--ink-3);margin-top:4px}
  .ov-stat .ov-bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 3px 3px 0}
  .ov-donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ov-donut-wrap svg{flex-shrink:0}
  .ov-legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px}
  .ov-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
  .ov-legend-item:hover{opacity:.7}
  .ov-legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .ov-legend-val{margin-left:auto;font-weight:700;color:var(--ink-2)}
  .ov-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer}
  .ov-bar-row:hover{opacity:.8}
  .ov-bar-label{font-size:12px;color:var(--ink-2);width:70px;flex-shrink:0;text-align:right}
  .ov-bar-track{flex:1;height:22px;background:#f0f4f8;border-radius:6px;overflow:hidden;position:relative}
  .ov-bar-fill{height:100%;border-radius:6px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .ov-progress-ring{display:inline-block;position:relative}
  .ov-progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
  .ov-progress-text .ov-pct{font-size:20px;font-weight:800;color:var(--ink)}
  .ov-progress-text .ov-pct-label{font-size:10px;color:var(--ink-3)}
  .ov-nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .ov-nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:10px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:all .15s;text-align:center}
  .ov-nav-btn:hover{border-color:var(--accent);background:#f8faff}
  .ov-nav-btn:active{transform:scale(.95)}
  .ov-nav-btn .ov-nav-ico{font-size:20px}
  .ov-nav-btn .ov-nav-name{font-size:11px;color:var(--ink-2);font-weight:600}
  .ov-nav-btn .ov-nav-count{font-size:10px;color:var(--ink-3)}

  /* ===== 灵感收藏卡片 ===== */
  .inspo-card{
    position:relative;border-radius:14px;margin-bottom:12px;overflow:hidden;
    background:#ffffff;
    border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(20,40,70,.04);
    transition:transform .2s,box-shadow .2s,border-color .2s;
  }
  .inspo-card:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(20,40,70,.08);
    border-color:#c9d6e5;
  }
  .inspo-card .inspo-quote{
    position:absolute;top:8px;right:12px;font-size:42px;opacity:.06;line-height:1;
    font-family:Georgia,serif;font-weight:900;pointer-events:none;
  }
  .inspo-card .inspo-body{padding:16px 16px 12px;position:relative}
  .inspo-card .inspo-title{
    font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.55;cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    padding-right:24px;
  }
  .inspo-card .inspo-desc{
    font-size:13px;line-height:1.75;color:var(--ink-2);margin-top:10px;
    cursor:pointer;position:relative;
  }
  .inspo-card .inspo-desc.clamp{
    display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .inspo-card .inspo-desc.clamp::after{
    content:"展开";position:absolute;right:0;bottom:0;
    background:linear-gradient(90deg,transparent,#fff 40%);
    padding:0 0 0 24px;font-size:11px;color:var(--accent);font-weight:700;
  }
  .inspo-card.expanded .inspo-desc.clamp{-webkit-line-clamp:unset;line-clamp:unset;overflow:visible}
  .inspo-card.expanded .inspo-desc.clamp::after{content:"收起"}
  .inspo-card .inspo-footer{
    display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;
    border-top:1px solid var(--line);
  }
  .inspo-card .inspo-tag{
    display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;
    font-size:11px;font-weight:700;cursor:pointer;
    background:var(--tag-blue-bg);color:var(--accent);
  }
  .inspo-card .inspo-time{
    font-size:11px;color:var(--ink-3);margin-left:auto;font-weight:500;
    display:flex;align-items:center;gap:3px;
  }
  .inspo-card .inspo-copy{
    display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:12px;
    font-size:11px;font-weight:600;cursor:pointer;
    background:var(--tag-mint-bg);color:var(--accent-2);
    transition:all .15s;
  }
  .inspo-card .inspo-copy:hover{filter:brightness(1.05)}
  .inspo-card .inspo-copy:active{transform:scale(.94)}
  /* 灵感卡片左滑操作 */
  .inspo-card .swipe-content{background:transparent;padding:0}
  .inspo-card .swipe-actions{padding:0 6px 0 10px}
  .inspo-card .gitem{border-bottom:none}
  /* 灵感列表容器 */
  #inspoList .gitem{border-bottom:none;padding:0;background:none}

  /* 激励语动态效果 */
  .quote-ico{display:inline-block;animation:qFloat 3s ease-in-out infinite}
  @keyframes qFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(8deg)}}
  .quote-text{background:linear-gradient(90deg,var(--ink),var(--accent),var(--accent-2),var(--ink));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:qShine 5s linear infinite}

  /* 随机激励语滚动条 */
  .quote-bar{background:linear-gradient(135deg,var(--side-1),var(--side-2));border-radius:12px;padding:10px 14px;margin-bottom:14px;overflow:hidden;position:relative;display:flex;align-items:center;gap:8px;box-shadow:0 3px 12px rgba(20,40,70,.12)}
  .quote-bar .qb-ico{font-size:16px;flex-shrink:0;animation:qFloat 3s ease-in-out infinite}
  .quote-bar .qb-scroll{flex:1;overflow:hidden;position:relative;height:20px}
  .quote-bar .qb-text{position:absolute;white-space:nowrap;font-size:13px;font-weight:600;color:#e8f0fa;line-height:20px;animation:qbScroll 18s linear infinite}
  .quote-bar .qb-text .qb-from{color:var(--side-text-dim);font-size:11px;font-weight:500;margin-left:6px}
  .quote-bar.loading .qb-text{animation:none;opacity:.6}
  @keyframes qbScroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
  @keyframes qShine{0%{background-position:0% 50%}100%{background-position:300% 50%}}

  /* ⋯ 更多操作按钮 */
  .gitem .gitem-actions{
    display:flex;gap:8px;margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .gitem .gact-btn{
    flex:1;padding:7px 0;border:none;border-radius:8px;
    font-size:12px;cursor:pointer;transition:all .12s;
    background:#f5f8fc;color:var(--ink-2);
  }
  .gitem .gact-btn:active{transform:scale(.96)}
  .gitem .gact-edit:hover{background:#eef5ff;color:var(--accent)}
  .gitem .gact-del:hover{background:#fef0f0;color:#e74c3c}
  .item-more{
    width:28px;height:28px;border:none;border-radius:8px;background:transparent;
    color:var(--ink-3);font-size:18px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .12s;
  }
  .item-more:active{background:var(--line)}
  /* 弹出操作菜单 */
  .item-menu{
    position:fixed;z-index:9999;background:#fff;border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden;min-width:120px;
    opacity:0;transform:scale(.9);pointer-events:none;transition:all .12s;
  }
  .item-menu.show{opacity:1;transform:scale(1);pointer-events:auto}
  .item-menu .im-btn{
    display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;
    border:none;background:transparent;font-size:14px;color:var(--ink);
    cursor:pointer;font-family:inherit;transition:background .1s;
  }
  .item-menu .im-btn:active{background:var(--line)}
  .item-menu .im-btn.im-edit{color:#3b82f6}
  .item-menu .im-btn.im-del{color:#ef4444}
  .item-menu .im-divider{height:1px;background:var(--line)}

  /* 通用弹窗 */
  .modal-mask{
    position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:98;
    display:none;align-items:flex-end;justify-content:center;padding:0;
  }
  .modal-mask.show{display:flex}
  .modal-box{
    background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + var(--safe-bottom));max-width:460px;width:100%;
    max-height:85vh;overflow-y:auto;animation:slideUp .3s ease;-webkit-overflow-scrolling:touch;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-box h3{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .modal-box .modal-close{margin-left:auto;width:28px;height:28px;border-radius:8px;background:#f1f5fa;border:none;font-size:16px;cursor:pointer;color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .modal-box .modal-save{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;pointer-events:auto;position:relative;z-index:1;-webkit-tap-highlight-color:transparent}
  .modal-box .modal-save:active{transform:scale(.97)}

  /* 点击复制 */
  .copyable{cursor:pointer;transition:background .15s;border-radius:6px;padding:2px 4px;margin:-2px -4px}
  .copyable:active{background:rgba(0,0,0,.06)}
  @keyframes cp-fade{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

  /* 语音输入 */
  .voice-row{display:flex;gap:8px;align-items:center;margin:6px 0 0}
  .btn-voice{
    flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;
    background:var(--accent);color:#fff;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .btn-voice.recording{background:#e74c3c;animation:pulse-rec 1s infinite}
  @keyframes pulse-rec{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  .voice-hint{font-size:12px;color:var(--ink-3);line-height:1.4}
  .voice-hint.recording{color:#e74c3c;font-weight:700}

  /* 数据管理 */
  .data-mgr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .data-mgr .btn{font-size:12px}

  /* 云同步状态 */
  .sync-badge{
    position:fixed;top:calc(var(--safe-top,0px) + 8px);right:14px;z-index:61;
    display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;
    font-size:11px;font-weight:700;cursor:pointer;
    background:rgba(255,255,255,.15);backdrop-filter:blur(8px);color:#fff;
    transition:background .2s;
  }
  .sync-badge.off{background:rgba(255,255,255,.1);color:var(--side-text-dim)}
  .sync-badge.syncing{background:rgba(46,134,222,.3);color:#fff}
  .sync-badge.online{background:rgba(26,188,156,.25);color:#aef5e0}
  .sync-badge.error{background:rgba(231,76,60,.3);color:#ffd0c8}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
  .sync-badge.syncing .sync-dot{animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .cloud-config-row{margin-bottom:10px}
  .cloud-config-row label{display:block;font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:4px}
  .cloud-status-box{padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .cloud-status-box.ok{background:var(--tag-mint);color:var(--tag-mint-t)}
  .cloud-status-box.off{background:#f1f5fa;color:var(--ink-3)}
  .cloud-status-box.err{background:var(--tag-rose);color:var(--tag-rose-t)}

  /* 移动端抽屉 */
  .menu-btn{display:none}
  .overlay{display:none}

  @media(max-width:768px){
    .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;font-size:20px;cursor:pointer}
    .sidebar{
      position:fixed;top:var(--statusbar-h);left:0;bottom:0;width:240px;z-index:60;
      transform:translateX(-100%);transition:transform .28s ease;
      box-shadow:4px 0 20px rgba(0,0,0,.18);
    }
    .sidebar.open{transform:translateX(0)}
    .overlay{position:fixed;top:var(--statusbar-h);left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:55}
    .overlay.show{display:block}
    .content-inner{padding:14px 14px calc(90px + var(--safe-bottom))}
  }

  /* ============================== */
  /* ====== 动态效果增强 ========== */
  /* ============================== */

  /* 1. 状态栏流光渐变 */
  .statusbar{
    background:linear-gradient(90deg,var(--side-1),var(--side-2),var(--side-1));
    background-size:200% 100%;
    animation:statusFlow 8s ease infinite;
  }
  @keyframes statusFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  /* 2. 侧栏背景微光呼吸 */
  @media(min-width:769px){
    .sidebar{position:relative}
    .sidebar::before{
      content:'';position:absolute;top:0;left:0;right:0;bottom:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(46,134,222,.12),transparent 60%);
      pointer-events:none;animation:sideGlow 6s ease-in-out infinite;
    }
    /* 右侧分割线 */
    .sidebar::after{
      content:'';position:absolute;top:0;right:0;bottom:0;width:1px;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.08) 20%,rgba(0,0,0,.08) 80%,transparent);
      pointer-events:none;
    }
  }
  @keyframes sideGlow{0%,100%{opacity:.4}50%{opacity:.8}}

  /* 3. 导航项激活动画 - 左侧指示条弹入 */
  .nav-item.active::before{
    animation:navBarIn .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes navBarIn{
    from{height:0;opacity:0}
    to{height:18px;opacity:1}
  }
  /* 导航项点击涟漪 */
  .nav-item{overflow:hidden;position:relative}
  .nav-item .ripple{
    position:absolute;border-radius:50%;background:rgba(255,255,255,.3);
    transform:scale(0);animation:ripple .5s ease-out;pointer-events:none;
  }
  @keyframes ripple{to{transform:scale(3);opacity:0}}

  /* 4. 卡片入场动画 */
  .card{
    animation:cardIn .4s cubic-bezier(.4,0,.2,1) both;
    transition:transform .15s,box-shadow .15s;
  }
  .card:nth-child(1){animation-delay:0s}
  .card:nth-child(2){animation-delay:.06s}
  .card:nth-child(3){animation-delay:.12s}
  .card:nth-child(4){animation-delay:.18s}
  .card:nth-child(5){animation-delay:.24s}
  .card:nth-child(6){animation-delay:.30s}
  .card:nth-child(7){animation-delay:.36s}
  .card:nth-child(8){animation-delay:.42s}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(16px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  /* 跑车弹跳动画 */
  @keyframes carBounce{
    0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-4px) rotate(-2deg)}
    50%{transform:translateY(0) rotate(0)}
    75%{transform:translateY(-2px) rotate(1deg)}
  }
  /* 卡片悬浮微交互 */
  @media(hover:hover){
    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(20,40,70,.10),0 2px 6px rgba(20,40,70,.06);
    }
  }

  /* 5. 页面标题入场 */
  .page-head{
    animation:titleIn .4s ease both;
  }
  @keyframes titleIn{
    from{opacity:0;transform:translateX(-12px)}
    to{opacity:1;transform:translateX(0)}
  }

  /* 6. 进度条流光 */
  .progress{position:relative;overflow:hidden}
  .progress i{position:relative}
  .progress i::after{
    content:'';position:absolute;top:0;left:0;right:0;bottom:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    background-size:200% 100%;
    animation:shimmer 2s linear infinite;
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* 7. 待办勾选动画 */
  .todo-item .ck{transition:all .2s cubic-bezier(.4,0,.2,1)}
  .todo-item.done .ck{animation:checkPop .3s ease}
  @keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}

  /* 8. 按钮 ripple 涟漪 */
  .btn{position:relative;overflow:hidden}
  .btn .ripple{
    position:absolute;border-radius:50%;background:rgba(255,255,255,.35);
    transform:scale(0);animation:ripple .5s ease-out;pointer-events:none;
  }

  /* 9. 添加按钮脉冲提示 */
  .btn-accent{
    position:relative;
  }
  .btn-accent::after{
    content:'';position:absolute;inset:0;border-radius:inherit;
    box-shadow:0 0 0 0 rgba(46,134,222,.4);
    animation:btnPulse 2.5s ease-out infinite;pointer-events:none;
  }
  @keyframes btnPulse{
    0%{box-shadow:0 0 0 0 rgba(46,134,222,.3)}
    70%{box-shadow:0 0 0 8px rgba(46,134,222,0)}
    100%{box-shadow:0 0 0 0 rgba(46,134,222,0)}
  }

  /* 10. 签到日历格子动画 */
  .cal-grid .d.checked{animation:checkPop .3s ease}

  /* 11. 弹窗入场增强 */
  .modal-box{animation:modalIn .3s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes modalIn{
    from{opacity:0;transform:translateY(30px) scale(.9)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* 12. 浮动菜单按钮呼吸光晕 */
  .menu-fab{
    animation:fabGlow 3s ease-in-out infinite;
  }
  @keyframes fabGlow{
    0%,100%{box-shadow:0 4px 18px rgba(46,134,222,.45)}
    50%{box-shadow:0 4px 28px rgba(46,134,222,.65),0 0 0 6px rgba(46,134,222,.08)}
  }

  /* 13. 头像渐变旋转光 */
  .side-head .avatar{
    position:relative;
  }
  .side-head .avatar::before{
    content:'';position:absolute;inset:-3px;border-radius:inherit;

/* --- 云端配置 --- */
function loadCloudConfig(){

      cfg={url:DEFAULT_SB_URL,anonKey:DEFAULT_SB_KEY,workspaceId:DEFAULT_WS_ID};

let CLOUD_CFG=loadCloudConfig();
let sbClient=null;       // Supabase 客户端实例
let sbChannel=null;      // 实时订阅通道
let syncTimer=null;      // 防抖定时器
let _cloudSaveInProgress=false;  // 云端保存进行中标志
let isRemoteUpdate=false;// 标记：当前更新是否来自远端（避免循环同步）

/* --- 初始化 Supabase 客户端 --- */
function initSupabase(){
  if(!CLOUD_CFG.url||!CLOUD_CFG.anonKey||!CLOUD_CFG.workspaceId){
    sbClient=null; updateSyncBadge('off','本地模式'); return false;
  }
  try{
    sbClient=supabase.createClient(CLOUD_CFG.url,CLOUD_CFG.anonKey);
    updateSyncBadge('online','已连接');
    return true;
  }catch(e){
    sbClient=null; updateSyncBadge('error','连接失败'); return false;
  }
}

/* --- 同步状态徽章 --- */
function updateSyncBadge(state,text){
  const badge=document.getElementById('syncBadge');
  const txt=document.getElementById('syncText');
  if(!badge)return;
  badge.className='sync-badge '+state;
  if(txt)txt.textContent=text;
}

/* --- 从云端加载数据 --- */
let lastSyncError='';
async function loadFromCloud(){
  if(!sbClient)return null;
  try{
    updateSyncBadge('syncing','同步中…');
    const {data,error}=await sbClient.from('workbench_data')
      .select('data,updated_at')
      .eq('workspace_id',CLOUD_CFG.workspaceId)
      .maybeSingle();
    if(error){
      lastSyncError=error.message||JSON.stringify(error);
      updateSyncBadge('error','加载失败');
      console.error('[Supabase] 加载失败:',lastSyncError);
      return null;
    }
    if(!data){updateSyncBadge('online','已连接');return null;}
    updateSyncBadge('online','已连接');
    lastSyncError='';
    if(data.updated_at){
      lastCloudSaveTime=new Date(data.updated_at).getTime();
    }
    return data.data;
  }catch(e){
    lastSyncError=e.message||String(e);
    updateSyncBadge('error','网络错误');
    console.error('[Supabase] 网络异常:',lastSyncError);
    return null;
  }
}

/* --- 保存到云端（防抖 + 自动重试） --- */
let saveRetryCount=0;
let lastSaveTimestamp=null;  // 记录本次保存的时间戳，用于识别自己保存的回声
function saveToCloud(){
  if(!sbClient)return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    syncTimer=null;  // 清空定时器引用，让订阅/轮询可以正常工作
    _cloudSaveInProgress=true;  // 标记云端保存进行中
    updateSyncBadge('syncing','同步中…');
    const ts=new Date().toISOString();
    try{
      const {error}=await sbClient.from('workbench_data')
        .upsert({
          workspace_id:CLOUD_CFG.workspaceId,
          data:DB,
          updated_at:ts
        });
      if(error){
        saveRetryCount++;
        if(saveRetryCount<=3){
          updateSyncBadge('error','重试中('+saveRetryCount+'/3)');
          setTimeout(()=>saveToCloud(),2000*saveRetryCount);
        }else{
          updateSyncBadge('error','保存失败');
          saveRetryCount=0;
        }
      }else{
        saveRetryCount=0;
        lastCloudSaveTime=Date.now();
        lastSaveTimestamp=ts;
        updateSyncBadge('online','已连接');
      }
    }catch(e){
      saveRetryCount++;
      if(saveRetryCount<=3){
        updateSyncBadge('error','重试中('+saveRetryCount+'/3)');
        setTimeout(()=>saveToCloud(),2000*saveRetryCount);
      }else{
        updateSyncBadge('error','网络错误');
        saveRetryCount=0;
      }
    }finally{
      _cloudSaveInProgress=false;
    }
  },500);
}

/* --- 定期同步（每30秒检查一次云端是否有更新） --- */
let pollTimer=null;
function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    if(!sbClient||isRemoteUpdate)return;
    /* 如果有未执行的保存或正在保存，跳过覆盖以避免丢失本地新增数据 */
    if(syncTimer||_cloudSaveInProgress)return;
    try{
      const {data,error}=await sbClient.from('workbench_data')
        .select('data,updated_at')
        .eq('workspace_id',CLOUD_CFG.workspaceId)
        .maybeSingle();
      if(!error&&data&&data.data){
        const cloudTime=new Date(data.updated_at).getTime();
        const localTime=lastCloudSaveTime||0;
        if(cloudTime>localTime){
          try{
            isRemoteUpdate=true;
            DB=data.data;
            ensureKeys();
            localStorage.setItem(STORE_KEY,JSON.stringify(DB));
            /* 弹窗打开时仅更新数据，不触发页面重渲染（避免干扰表单操作） */
            if(isModalOpen()){
              _pendingCloudRender=true;
            }else{
              const cur=document.querySelector('.nav-item.active');
              if(cur)switchSection(cur.dataset.id);
            }
          }catch(e){
            console.error('[Sync] 轮询处理异常:',e);
          }finally{
            isRemoteUpdate=false;
            lastCloudSaveTime=cloudTime;
          }
        }
      }
    }catch(e){}
  },30000);
}

let lastCloudSaveTime=0;

/* --- 实时订阅 --- */
let _initGracePeriod=true;  /* 初始化保护期，防止订阅回声导致闪屏 */
function subscribeCloud(){
  if(!sbClient||!CLOUD_CFG.workspaceId)return;
  if(sbChannel)sbClient.removeChannel(sbChannel);
  sbChannel=sbClient.channel('workbench-sync')
    .on('postgres_changes',{
      event:'*',schema:'public',table:'workbench_data',
      filter:'workspace_id=eq.'+CLOUD_CFG.workspaceId
    },(payload)=>{
      if(payload.eventType==='DELETE')return;
      /* 初始化保护期内跳过所有订阅事件，避免闪屏 */
      if(_initGracePeriod)return;
      const newData=payload.new&&payload.new.data;
      const cloudTs=payload.new&&payload.new.updated_at;
      /* 跳过自己保存的回声：避免覆盖本地未同步的新增数据 */
      if(cloudTs&&lastSaveTimestamp&&new Date(cloudTs).getTime()===new Date(lastSaveTimestamp).getTime()){
        lastSaveTimestamp=null;
        return;
      }
      if(newData&&!isRemoteUpdate){
        /* 如果有未执行的保存或正在保存，跳过覆盖以避免丢失本地新增数据 */
        if(syncTimer||_cloudSaveInProgress){
          return;
        }
        try{
          isRemoteUpdate=true;
          DB=newData;
          ensureKeys();
          localStorage.setItem(STORE_KEY,JSON.stringify(DB));
          /* 弹窗打开时仅更新数据，不触发页面重渲染（避免干扰表单操作） */
          if(isModalOpen()){
            _pendingCloudRender=true;
          }else{
            const cur=document.querySelector('.nav-item.active');
            if(cur)switchSection(cur.dataset.id);
          }
        }catch(e){
          console.error('[Sync] 订阅处理异常:',e);
        }finally{
          isRemoteUpdate=false;
        }
      }
    })
    .subscribe();
}

/* ========== HTML 转义 ========== */
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ========== 点击复制 ========== */
function copyText(el,customText){
  const text=customText!==undefined?customText:el.innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>_showCopyTip(el));
  }else{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{document.execCommand('copy');_showCopyTip(el);}catch(e){}
    document.body.removeChild(ta);
  }
}
/* 复制列表项的某个字段 */
function copyListItemField(btn,listKey,i,fieldKey){
  const config=LISTS[listKey];
  if(!config) return;
  const items=DB[config.dbKey]||[];
  const item=items[i];
  if(!item||item[fieldKey]===undefined||item[fieldKey]===null) return;
  copyText(btn,String(item[fieldKey]));
}
function _showCopyTip(el){
  const tip=document.createElement('div');
  tip.textContent='已复制 ✓';
  tip.style.cssText='position:fixed;z-index:9999;background:#333;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;pointer-events:none;animation:cp-fade 1.2s ease forwards';
  const rect=el.getBoundingClientRect();
  tip.style.left=(rect.left+rect.width/2-30)+'px';
  tip.style.top=(rect.top-8)+'px';
  document.body.appendChild(tip);
  setTimeout(()=>tip.remove(),1200);
}

  ['var(--tag-violet)','var(--tag-violet-t)'],
  ['var(--tag-rose)','var(--tag-rose-t)'],
];
function tagColor(text){
  let h=0; for(let i=0;i<text.length;i++) h=text.charCodeAt(i)+((h<<5)-h);
  const c=TAG_COLORS[Math.abs(h)%TAG_COLORS.length];
  return 'background:'+c[0]+';color:'+c[1];
}

/* ========== 左滑操作 ========== */
function _closeSwipe(el){
  var item=el.closest('.gitem');
  if(item) item.classList.remove('swiped');
}
function _closeAllSwiped(except){
  document.querySelectorAll('.gitem.swiped').forEach(function(g){ if(g!==except) g.classList.remove('swiped'); });
}
function initSwipe(){
  document.querySelectorAll('.gitem').forEach(function(item){
    if(item._swipeInit) return;
    item._swipeInit=true;
    var content=item.querySelector('.swipe-content');
    if(!content) return;
    var sx=0,sy=0,cx=0,drag=false,moved=false;
    content.addEventListener('touchstart',function(e){
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; cx=0; drag=true; moved=false;
      content.style.transition='none';
    },{passive:true});
    content.addEventListener('touchmove',function(e){
      if(!drag) return;
      var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){
        moved=true; e.preventDefault();
        var base=item.classList.contains('swiped')?-130:0;
        cx=Math.max(-130,Math.min(0,base+dx));
        content.style.transform='translateX('+cx+'px)';
      }
    },{passive:false});
    content.addEventListener('touchend',function(){
      if(!drag) return;
      drag=false; content.style.transition=''; content.style.transform='';
      if(moved){
        if(cx<-60){ _closeAllSwiped(item); item.classList.add('swiped'); }
        else item.classList.remove('swiped');
        var sc=function(ev){ ev.preventDefault(); ev.stopPropagation(); content.removeEventListener('click',sc,true); };
        content.addEventListener('click',sc,true);
        setTimeout(function(){ content.removeEventListener('click',sc,true); },300);
      }else if(item.classList.contains('swiped')){
        item.classList.remove('swiped');
        var sc2=function(ev){ ev.preventDefault(); ev.stopPropagation(); content.removeEventListener('click',sc2,true); };
        content.addEventListener('click',sc2,true);
        setTimeout(function(){ content.removeEventListener('click',sc2,true); },300);
      }
    },{passive:false});
  });
  if(!window._swipeDocInit){
    window._swipeDocInit=true;
    document.addEventListener('click',function(e){
      if(!e.target.closest('.gitem.swiped')&&!e.target.closest('.swipe-actions')){
        _closeAllSwiped();
      }
    });
  }
}

  document.body.appendChild(_itemMenu);

}
function _positionMenu(menu,btn){

  let x=r.right-120, y=r.bottom+4;
  if(x<8) x=8;
  if(y+100>window.innerHeight) y=r.top-104;
  if(y<8) y=8;
  menu.style.left=x+'px';
  menu.style.top=y+'px';
}

function openListModal(listKey,index){
  const config=LISTS[listKey];
  const editing=index!==undefined&&index!==null;
  const item=editing?Object.assign({},DB[config.dbKey][index]):{};
  let formHtml='';
  config.fields.forEach(f=>{
    const raw=item[f.key];
    const val=(f.type==='checkbox')?(raw!==undefined?raw:false):(raw!==undefined?raw:'');
    formHtml+='<label class="crud-label">'+escapeHtml(f.label)+'</label>';
    if(f.type==='textarea'){
      formHtml+='<textarea class="crud-textarea" id="fld_'+f.key+'" placeholder="'+escapeHtml(f.placeholder||'')+'">'+escapeHtml(val)+'</textarea>';
    }else if(f.type==='select'){
      formHtml+='<select class="crud-input" id="fld_'+f.key+'" style="margin-bottom:8px">';
      let hasVal=f.options.indexOf(val)>=0;
      if(!hasVal&&val) formHtml+='<option value="'+escapeHtml(val)+'" selected>'+escapeHtml(val)+'</option>';
      f.options.forEach(opt=>{
        formHtml+='<option value="'+escapeHtml(opt)+'"'+(val===opt?' selected':'')+'>'+escapeHtml(opt)+'</option>';
      });
      formHtml+='</select>';
    }else if(f.type==='checkbox'){
      formHtml+='<label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;cursor:pointer">'+
        '<input type="checkbox" id="fld_'+f.key+'" '+(val?'checked':'')+' style="width:20px;height:20px;cursor:pointer"> '+
        escapeHtml(f.placeholder||'已完成')+'</label>';
    }else if(f.type==='month'){
      /* 月份选择器：兼容 "2026年8月" 和 "2026-08" 格式 */
      var monthVal=val||'';
      if(monthVal){
        var mm=monthVal.match(/(\d{4})[^\d]*(\d{1,2})/);
        if(mm) monthVal=mm[1]+'-'+String(mm[2]).padStart(2,'0');
      }
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="month" value="'+escapeHtml(monthVal)+'" style="margin-bottom:8px">';
    }else if(f.type==='date'){
      /* 日期选择器：兼容 "2026-08-20" 和 "2026年8月20日" 格式 */
      var dateVal=val||'';
      if(dateVal){
        var dm=dateVal.match(/(\d{4})[^\d]*(\d{1,2})[^\d]*(\d{1,2})/);
        if(dm) dateVal=dm[1]+'-'+String(dm[2]).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0');
      }
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="date" value="'+escapeHtml(dateVal)+'" style="margin-bottom:8px">';
    }else{
      formHtml+='<input class="crud-input" id="fld_'+f.key+'" type="'+(f.inputType||'text')+'" placeholder="'+escapeHtml(f.placeholder||'')+'" value="'+escapeHtml(val)+'">';
    }
  });
  showModal(config.icon+' '+(editing?'编辑':'新增')+config.title, formHtml, ()=>{
    const newItem={};
    config.fields.forEach(f=>{
      const el=document.getElementById('fld_'+f.key);
      if(!el) return;
      if(f.type==='checkbox'){ newItem[f.key]=el.checked; }
    else if(f.type==='month'){
      /* 将 "2026-08" 转成 "2026年8月" */
      var mv=el.value;
      if(mv){
        var parts=mv.split('-');
        newItem[f.key]=parts[0]+'年'+parseInt(parts[1],10)+'月';
      } else newItem[f.key]='';
    }
    else if(f.type==='date'){
      /* 将 "2026-08-20" 转成 "2026年8月20日" */
      var dv=el.value;
      if(dv){
        var parts=dv.split('-');
        newItem[f.key]=parts[0]+'年'+parseInt(parts[1],10)+'月'+parseInt(parts[2],10)+'日';
      } else newItem[f.key]='';
    }
    else { newItem[f.key]=el.value.trim(); }
    });
    /* 校验：至少有一个非空非布尔字段 */
    const hasContent=config.fields.some(f=>{
      const v=newItem[f.key];
      return v!==false&&v!==''&&v!==undefined&&v!==null;
    });
    if(!hasContent){ alert('请至少填写一项内容'); return false; }
    if(editing){ DB[config.dbKey][index]=newItem; }
    else { DB[config.dbKey].push(newItem); }
    saveData();
    renderList(listKey);
    /* 刷新每日计划的目标跑车卡片 */
    if(config.dbKey==='salaryGoal') renderGoalCar();
    return true;
  });
}

  /* 检测是否为网易云音乐链接 */
  var urlMatch=text.match(/(https?:\/\/(?:163cn\.tv\/\w+|music\.163\.com\/(?:playlist|album|song)[^\s]*))/i);
  if(urlMatch){
    preview.innerHTML='<div style="color:var(--accent);font-size:13px;padding:8px">⏳ 正在从网易云音乐获取歌单…</div>';

/* 从网易云音乐获取歌单 — 通过本地代理服务器 */
var _fetchedPlaylistSongs=null;
async function fetchNeteasePlaylist(url,listKey){
  var preview=document.getElementById('batchPreview');
  var btn=document.getElementById('batchConfirmBtn');
  _fetchedPlaylistSongs=null;
  try{
    /* 调用本地代理服务器获取歌单数据 */
    var proxyUrl='http://localhost:8080/api/playlist?url='+encodeURIComponent(url);
    var resp=await fetch(proxyUrl);
    var data=await resp.json();

    if(!data||!data.success){
      var errMsg=(data&&data.error)?data.error:'未知错误';
      preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">⚠️ 获取歌单失败：'+escapeHtml(errMsg)+'<br>请直接粘贴歌曲列表<br>格式：歌曲名 - 歌手名（每行一首）</div>';
      btn.disabled=true; btn.style.opacity=.5;
      return;
    }

    var songs=data.songs||[];
    if(songs.length===0){
      preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">⚠️ 未获取到歌曲数据，请直接粘贴歌曲列表</div>';
      btn.disabled=true; btn.style.opacity=.5;
      return;
    }

    _fetchedPlaylistSongs=songs;
    _renderBatchPreview(songs,btn);
    var statusDiv=document.createElement('div');
    statusDiv.style.cssText='font-size:12px;color:#52c41a;padding:4px 8px 0';
    var playlistName=data.playlist_name||'';
    statusDiv.innerHTML='✅ 从网易云音乐获取到 '+songs.length+' 首歌曲'+(playlistName?'<br>📋 歌单：'+escapeHtml(playlistName):'');
    preview.insertBefore(statusDiv,preview.firstChild);
  }catch(e){
    preview.innerHTML='<div style="color:#e74c3c;font-size:12px;padding:8px">⚠️ 网络请求失败：'+escapeHtml(e.message||String(e))+'<br><br>可能是代理服务器未启动，请检查服务器状态。<br>也可直接粘贴歌曲列表（每行一首）<br>格式：歌曲名 - 歌手名</div>';
    btn.disabled=true; btn.style.opacity=.5;
  }
}

  songs.forEach(function(s,i){

      '<span style="font-weight:600;flex:1">'+escapeHtml(s.title||'未知歌曲')+'</span>'+

function parseSongs(text){
  var lines=text.split(/\r?\n/);
  var songs=[];
  lines.forEach(function(line){
    line=line.trim();
    if(!line) return;
    /* 去掉序号前缀：1. / 1) / 1、 / - 1. 等 */
    line=line.replace(/^\s*[-]*\s*\d+\s*[.、)]\s*/,'');
    if(!line) return;
    var title='',singer='',note='';
    var matched=false;

    /* 格式1: 歌曲 - 歌手 (备注)  或  歌曲 -- 歌手 */
    var m=line.match(/^(.+?)\s*-{2,}\s*(.+)$/);
    if(!m) m=line.match(/^(.+?)\s+-\s+(.+)$/);
    if(m){
      title=m[1].trim();
      var rest=m[2].trim();
      /* 检查备注：括号或后面的文字 */
      var nm=rest.match(/^(.+?)\s*[（(](.+)[）)]\s*$/);
      if(nm){
        singer=nm[1].trim();
        note=nm[2].trim();
      }else{
        /* 歌手后面可能有备注，用空格分隔 */
        var parts=rest.split(/\s{2,}/);
        singer=parts[0].trim();
        if(parts.length>1) note=parts.slice(1).join(' ').trim();
      }
      matched=true;
    }

    /* 格式2: 歌曲（歌手）或 歌曲(歌手) */
    if(!matched){
      var m2=line.match(/^(.+?)[（(](.+?)[）)]\s*$/);
      if(m2){
        title=m2[1].trim();
        singer=m2[2].trim();
        matched=true;
      }
    }

    /* 格式3: 歌曲【歌手】 */
    if(!matched){
      var m3=line.match(/^(.+?)\[(.+?)\]\s*$/);
      if(m3){
        title=m3[1].trim();
        singer=m3[2].trim();
        matched=true;
      }
    }

    /* 格式4: 只有歌名，无歌手 */
    if(!matched){
      title=line;
    }

    /* 清理 title 两端的引号 */
    title=title.replace(/^[""''「『]+/,'').replace(/[""」』]+$/,'').trim();
    if(title) songs.push({title:title,singer:singer,note:note});
  });
  return songs;
}

function confirmBatchImport(listKey){
  /* 优先使用从网易云音乐获取的歌曲数据 */
  var songs=_fetchedPlaylistSongs;
  if(!songs||songs.length===0){
    var text=document.getElementById('batchInput').value.trim();
    if(!text) return;
    songs=parseSongs(text);
  }
  if(!songs||songs.length===0) return;
  var config=LISTS[listKey];
  var added=0;
  songs.forEach(function(s){
    var item={};
    config.fields.forEach(function(f){
      if(f.key==='title') item[f.key]=s.title||'';
      else if(f.key==='singer') item[f.key]=s.singer||'';
      else if(f.key==='note') item[f.key]=s.note||'';
      else if(f.key==='desc') item[f.key]=s.note||'';
      else item[f.key]='';
    });
    /* 至少有歌名才添加 */
    if(item.title){
      DB[config.dbKey].push(item);
      added++;
    }
  });
  saveData();
  renderList(listKey);
  _fetchedPlaylistSongs=null;
  var mask=document.getElementById('batchModal');
  if(mask){ mask.remove(); _afterModalClose(); }
  /* 显示成功提示 */
  var toast=document.createElement('div');
  toast.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,51,73,.95);color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:99999;animation:connectPop .4s ease both';
  toast.textContent='✅ 成功导入 '+added+' 首歌曲';
  document.body.appendChild(toast);
  setTimeout(function(){ toast.remove(); },1800);
}

/* 日历 */
let calYear=2026,calMonth=7;
function renderCal(){
  const grid=document.getElementById('calGrid');if(!grid)return;
  const monEl=document.getElementById('calMon');
  if(monEl) monEl.textContent=calYear+'年'+(calMonth+1)+'月';
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const today=new Date();
  let html='';
  ['日','一','二','三','四','五','六'].forEach(w=>html+='<div class="wh">'+w+'</div>');
  for(let i=first-1;i>=0;i--) html+='<div class="d dim">'+(prevDays-i)+'</div>';
  for(let d=1;d<=days;d++){
    let cls='d';
    if(calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate()) cls+=' today';
    if(DB.checkedDays.includes(d)&&calYear===2026&&calMonth===7) cls+=' checked';
    html+='<div class="'+cls+'" onclick="toggleCheck('+d+')">'+d+'</div>';
  }
  grid.innerHTML=html;
}
function toggleCheck(d){
  if(calYear!==2026||calMonth!==7)return;
  const idx=DB.checkedDays.indexOf(d);
  if(idx>=0) DB.checkedDays.splice(idx,1);
  else DB.checkedDays.push(d);
  saveData(); renderCal();
}
function calNav(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCal();
}

/* 渲染目标跑车卡片 */
function renderGoalCar(){
  var box=document.getElementById('goalCarContent');
  if(!box) return;
  /* 取第一个进行中的储蓄目标 */
  var goals=DB.salaryGoal||[];
  var goal=goals.find(function(g){return g.status==='进行中';})||goals[0];
  if(!goal){
    box.innerHTML='<div style="font-size:36px">🏁</div>'+
      '<div style="font-size:13px;color:var(--ink-3);margin-top:8px">还没有储蓄目标，去「工资储蓄」添加一个吧</div>';
    return;
  }
  var target=parseFloat(goal.target)||0;
  var current=parseFloat(goal.current)||0;
  var diff=target-current;
  var percent=target>0?Math.min(100,Math.round(current/target*100)):0;
  var carEmoji=percent>=100?'🏆':percent>=75?'🏎️':'🚗';

  var html='';
  html+='<div style="font-size:42px;line-height:1;animation:carBounce 2s ease-in-out infinite">'+carEmoji+'</div>';
  html+='<div style="margin-top:6px;font-size:14px;font-weight:700;color:var(--ink)">'+escapeHtml(goal.title||'目标')+'</div>';
  if(diff>0){
    html+='<div style="margin-top:4px;font-size:18px;font-weight:800;color:var(--accent-warm)">离目标还差 ¥'+diff.toLocaleString()+'</div>';
    html+='<div style="margin-top:2px;font-size:12px;color:var(--ink-3)">已存 ¥'+current.toLocaleString()+' / 目标 ¥'+target.toLocaleString()+'</div>';
  }else{
    html+='<div style="margin-top:4px;font-size:18px;font-weight:800;color:var(--accent-2)">🎉 目标已达成！</div>';
    html+='<div style="margin-top:2px;font-size:12px;color:var(--ink-3)">累计 ¥'+current.toLocaleString()+'</div>';
  }
  /* 进度条跑道 */
  html+='<div style="margin-top:10px;position:relative;height:8px;background:#f0e6d0;border-radius:4px;overflow:hidden">';
  html+='<div style="position:absolute;left:0;top:0;height:100%;width:'+percent+'%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transition:width .6s ease"></div>';
  html+='</div>';
  html+='<div style="margin-top:4px;font-size:11px;color:var(--ink-3)">完成度 '+percent+'%</div>';
  box.innerHTML=html;
}

/* 从车型名称识别品牌 */
function getCarBrand(title){
  if(!title) return null;
  var text=String(title).toLowerCase();
  for(var i=0;i<CAR_BRANDS.length;i++){
    var b=CAR_BRANDS[i];
    for(var j=0;j<b.keys.length;j++){
      if(text.indexOf(b.keys[j].toLowerCase())>=0){
        return b;
      }
    }
  }
  return null;
}

/* 加载车辆图片 */
var _carImgCache={};
function loadCarImage(title,wrapId){
  var wrap=document.getElementById(wrapId);
  if(!wrap) return;
  var brand=getCarBrand(title);
  if(!brand){
    wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
    return;
  }
  /* 优先使用本地自定义图片 */
  if(brand.localImg){
    _setCarImg(wrap,brand.localImg,brand);
    return;
  }
  /* 检查内存缓存 */
  if(_carImgCache[brand.wiki]){
    _setCarImg(wrap,_carImgCache[brand.wiki],brand);
    return;
  }
  /* 检查 localStorage 缓存 */
  var cacheKey='carImg_'+brand.wiki;
  try{
    var cached=localStorage.getItem(cacheKey);
    if(cached){
      _carImgCache[brand.wiki]=cached;
      _setCarImg(wrap,cached,brand);
      return;
    }
  }catch(e){}
  /* 显示加载中 */
  wrap.innerHTML='<div class="car-img-loading">🚗</div>';
  /* 从维基百科 REST API 获取图片 */
  var apiUrl='https://en.wikipedia.org/api/rest_v1/page/summary/'+brand.wiki;
  fetch(apiUrl,{headers:{'Accept':'application/json'}})
    .then(function(r){return r.json();})
    .then(function(data){
      var imgSrc='';
      if(data.originalimage&&data.originalimage.source){
        imgSrc=data.originalimage.source;
      }else if(data.thumbnail&&data.thumbnail.source){
        imgSrc=data.thumbnail.source;
      }
      if(imgSrc){
        _carImgCache[brand.wiki]=imgSrc;
        try{localStorage.setItem(cacheKey,imgSrc);}catch(e){}
        _setCarImg(wrap,imgSrc,brand);
      }else{
        wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
      }
    })
    .catch(function(){
      /* 尝试中文维基百科 */
      var cnApiUrl='https://zh.wikipedia.org/api/rest_v1/page/summary/'+brand.wiki;
      fetch(cnApiUrl,{headers:{'Accept':'application/json'}})
        .then(function(r){return r.json();})
        .then(function(data){
          var imgSrc='';
          if(data.originalimage&&data.originalimage.source){
            imgSrc=data.originalimage.source;
          }else if(data.thumbnail&&data.thumbnail.source){
            imgSrc=data.thumbnail.source;
          }
          if(imgSrc){
            _carImgCache[brand.wiki]=imgSrc;
            try{localStorage.setItem(cacheKey,imgSrc);}catch(e){}
            _setCarImg(wrap,imgSrc,brand);
          }else{
            wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
          }
        })
        .catch(function(){
          wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
        });
    });
}

function _setCarImg(wrap,src,brand){
  var img=new Image();
  img.loading='lazy';
  img.alt=brand.wiki;
  img.style.width='100%';
  img.style.height='100%';
  img.style.objectFit=brand.localImg?'contain':'cover';
  img.style.padding=brand.localImg?'4px':'0';
  img.onerror=function(){
    wrap.innerHTML='<div class="car-img-fallback">🚗</div>';
  };
  img.onload=function(){
    wrap.innerHTML='';
    wrap.appendChild(img);
  };
  img.src=src;
}

/* 生成进度环 SVG */

    +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#e8eef5" stroke-width="5"/>'

      +'stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/>'
    +'<foreignObject x="0" y="0" width="'+size+'" height="'+size+'">'

/* 生成环形饼图 */
function makeDonut(groups,totalCount){
  if(totalCount===0){
    return '<div style="text-align:center;padding:20px;color:var(--ink-3);font-size:13px">暂无数据，去各模块添加内容吧</div>';
  }
  var cx=80,cy=80,r=60,rInner=38;
  var svg='<div class="ov-donut-wrap"><svg width="160" height="160">';
  var legend='';
  var startAngle=-90;
  groups.forEach(function(g,idx){
    var gCount=0;
    g.sections.forEach(function(s){gCount+=s.count;});
    if(gCount===0) return;
    var pct=gCount/totalCount;
    var angle=pct*360;
    var endAngle=startAngle+angle;
    if(idx===groups.length-1) endAngle=270; /* 最后一块闭合 */
    var color=OV_COLORS[idx%OV_COLORS.length];
    var path=arcPath(cx,cy,r,rInner,startAngle,endAngle);
    svg+='<path d="'+path+'" fill="'+color+'" opacity="0.9" style="cursor:pointer" onclick="switchSection(\''+g.sections[0].id+'\')"><title>'+g.name+': '+gCount+'条 ('+Math.round(pct*100)+'%)</title></path>';
    legend+='<div class="ov-legend-item" onclick="switchSection(\''+g.sections[0].id+'\')">'
      +'<span class="ov-legend-dot" style="background:'+color+'"></span>'
      +'<span>'+g.name+'</span>'
      +'<span class="ov-legend-val">'+gCount+'条</span>'
    +'</div>';
    startAngle=endAngle;
  });
  svg+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="22" font-weight="800" fill="#1a202c">'+totalCount+'</text>';
  svg+='<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="10" fill="#94a3b8">总数据</text>';
  svg+='</svg><div class="ov-legend">'+legend+'</div></div>';
  return svg;
}

/* 环形扇形路径 */
function arcPath(cx,cy,rOuter,rInner,startDeg,endDeg){
  var sRad=startDeg*Math.PI/180;
  var eRad=endDeg*Math.PI/180;
  var x1=cx+rOuter*Math.cos(sRad), y1=cy+rOuter*Math.sin(sRad);
  var x2=cx+rOuter*Math.cos(eRad), y2=cy+rOuter*Math.sin(eRad);
  var x3=cx+rInner*Math.cos(eRad), y3=cy+rInner*Math.sin(eRad);
  var x4=cx+rInner*Math.cos(sRad), y4=cy+rInner*Math.sin(sRad);
  var large=(endDeg-startDeg)>180?1:0;
  return 'M'+x1+' '+y1+' A'+rOuter+' '+rOuter+' 0 '+large+' 1 '+x2+' '+y2
    +' L'+x3+' '+y3+' A'+rInner+' '+rInner+' 0 '+large+' 0 '+x4+' '+y4+' Z';
}

/* 生成横向柱状图 */
function makeBars(groups,totalCount){
  if(totalCount===0) return '<div style="text-align:center;padding:16px;color:var(--ink-3);font-size:13px">暂无数据</div>';
  var maxCount=1;
  groups.forEach(function(g){
    g.sections.forEach(function(s){ if(s.count>maxCount)maxCount=s.count; });
  });
  var html='';
  groups.forEach(function(g,idx){
    var color=OV_COLORS[idx%OV_COLORS.length];
    g.sections.forEach(function(s){
      var w=maxCount>0?Math.round(s.count/maxCount*100):0;
      html+='<div class="ov-bar-row" onclick="switchSection(\''+s.id+'\')">';
      html+='<div class="ov-bar-label">'+s.name+'</div>';
      html+='<div class="ov-bar-track"><div class="ov-bar-fill" style="width:'+w+'%;background:'+color+'">'+(s.count>0?s.count:'')+'</div></div>';
      html+='</div>';
    });
  });
  return html;
}

function copyInspoFull(i){
  const item=DB.inspos[i];

  if(item.tag) text+='\n\n🏷️ '+item.tag;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>_showCopyTip(document.getElementById('inspoCard_'+i)));
  }else{
    const ta=document.createElement('textarea');

function formatInspoTime(ts){
  if(!ts)return '';
  const d=new Date(ts);
  const now=new Date();
  const diff=now-d;
  if(diff<60000)return '刚刚';
  if(diff<3600000)return Math.floor(diff/60000)+'分钟前';
  if(diff<86400000)return Math.floor(diff/3600000)+'小时前';
  if(diff<86400000*7)return Math.floor(diff/86400000)+'天前';
  return (d.getMonth()+1)+'/'+d.getDate();
}

/* ========== 语音输入（Web Speech API） ========== */
let _voiceRec=null;
let _voiceTargetId=null;
let _voiceBtnEl=null;
let _voiceAccumText=''; // 累积已识别的文本

function toggleVoice(targetId,btnEl){
  // 如果正在录音，停止
  if(_voiceRec&&_voiceTargetId===targetId){
    _voiceRec.stop();
    return;
  }
  // 如果在录别的字段，先停掉
  if(_voiceRec){
    _voiceRec.stop();
  }

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    alert('当前浏览器不支持语音识别，请使用 Chrome、Edge 或 Safari 浏览器');
    return;
  }

  _voiceRec=new SR();
  _voiceRec.lang='zh-CN';
  _voiceRec.continuous=true;
  _voiceRec.interimResults=true;

  const target=document.getElementById(targetId);
  if(!target)return;

  _voiceTargetId=targetId;
  _voiceBtnEl=btnEl;
  _voiceAccumText=target.value||'';

  btnEl.classList.add('recording');
  btnEl.textContent='🔴';

  const hintId=targetId==='ipTitle'?'voiceHintTitle':'voiceHintDesc';
  const hint=document.getElementById(hintId);
  if(hint){hint.classList.add('recording');hint.textContent='正在录音…说完后点击按钮停止';}

  let finalText='';

  _voiceRec.onresult=function(event){
    let interim='';
    for(let i=event.resultIndex;i<event.results.length;i++){
      const t=event.results[i][0].transcript;
      if(event.results[i].isFinal){
        finalText+=t;
      }else{
        interim+=t;
      }
    }
    target.value=_voiceAccumText+finalText+interim;
  };

  _voiceRec.onerror=function(event){
    console.error('语音识别错误:',event.error);
    let msg='语音识别出错';
    if(event.error==='not-allowed'||event.error==='service-not-allowed'){
      msg='麦克风权限被拒绝，请允许浏览器使用麦克风';
    }else if(event.error==='no-speech'){
      msg='没有检测到语音，请再试一次';
    }else if(event.error==='network'){
      msg='网络错误，语音识别需要网络连接';
    }
    alert(msg);
    _stopVoiceUI();
  };

  _voiceRec.onend=function(){
    // 录音结束，把最终文本写入
    if(finalText){
      target.value=_voiceAccumText+finalText;
    }
    _stopVoiceUI();
  };

  try{
    _voiceRec.start();
  }catch(e){
    alert('无法启动语音识别：'+e.message);
    _stopVoiceUI();
  }
}

function _stopVoiceUI(){
  if(_voiceBtnEl){
    _voiceBtnEl.classList.remove('recording');
    _voiceBtnEl.textContent='🎤';
  }
  const h1=document.getElementById('voiceHintTitle');
  const h2=document.getElementById('voiceHintDesc');
  if(h1){h1.classList.remove('recording');h1.textContent='点麦克风语音输入标题';}
  if(h2){h2.classList.remove('recording');h2.textContent='点麦克风语音输入描述';}
  _voiceRec=null;
  _voiceTargetId=null;
  _voiceBtnEl=null;
  _voiceAccumText='';
}

function saveCloudCfg(){
  let url=document.getElementById('cfgUrl').value.trim().replace(/\/+$/,'');
  const anonKey=document.getElementById('cfgKey').value.trim();
  const workspaceId=document.getElementById('cfgWs').value.trim();
  if(!url||!anonKey||!workspaceId){
    alert('请填写完整的 Supabase URL、Anon Key 和工作区 ID');return;
  }
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(url)){
    alert('URL格式不正确，应该是 https://xxxxxxxx.supabase.co 格式（不要有末尾斜杠）');return;
  }
  CLOUD_CFG={url,anonKey,workspaceId};
  saveCloudConfig(CLOUD_CFG);
  if(initSupabase()){
    alert('云同步配置已保存！正在测试连接…');
    (async()=>{
      const d=await loadFromCloud();
      if(d){
        DB=d;ensureKeys();saveData();switchSection('data');
        subscribeCloud();
        startPolling();
        alert('✅ 连接成功！数据已从云端加载。\n工作区: '+workspaceId+'\n\n数据会自动同步，无需手动操作。');
      }else if(lastSyncError){
        alert('❌ 连接失败：'+lastSyncError+'\n\n请检查：\n1. 是否已在Supabase运行建表SQL\n2. 是否运行了GRANT权限语句\n3. URL和Key是否正确');
      }else{
        subscribeCloud();
        startPolling();
        alert('✅ 已连接！工作区为空，数据将在保存时自动上传。\n工作区: '+workspaceId+'\n\n数据会自动同步，无需手动操作。');
      }
    })();
  }else{
    alert('连接失败，请检查 URL 和 Key 是否正确');
  }
}
function disconnectCloud(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(sbChannel){sbClient.removeChannel(sbChannel);sbChannel=null;}
  sbClient=null;
  CLOUD_CFG={};
  saveCloudConfig({});
  updateSyncBadge('off','本地模式');
  alert('已断开云同步，回到本地模式。');
  switchSection('data');
}
async function syncNow(){
  if(!sbClient){alert('请先启用云同步');return;}
  updateSyncBadge('syncing','同步中…');
  const {error}=await sbClient.from('workbench_data')
    .upsert({workspace_id:CLOUD_CFG.workspaceId,data:DB,updated_at:new Date().toISOString()});
  if(error){
    updateSyncBadge('error','同步失败');
    alert('同步失败: '+error.message+'\n\n常见原因:\n1. 表未创建或权限未设置\n2. URL或Key不正确\n3. 需要在Supabase运行GRANT语句');
  }
  else{updateSyncBadge('online','已连接');alert('同步成功！');}
}

function importData(){

  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(confirm('导入会覆盖当前所有数据，确定继续？')){
          DB=data; ensureKeys(); saveData();
          alert('导入成功！'); switchSection('data');

    };
    reader.readAsText(file);
  };

function showModal(title,formHtml,onSave){
  const old=document.getElementById('crudModal');
  if(old) old.remove();
  const mask=document.createElement('div');
  mask.className='modal-mask show';
  mask.id='crudModal';
  mask.onclick=e=>{ if(e.target===mask){ mask.remove(); _afterModalClose(); } };
  mask.innerHTML='<div class="modal-box">'+
    '<h3>'+title+'<button class="modal-close" onclick="var m=this.closest(\'.modal-mask\'); if(m){m.remove(); _afterModalClose();}">✕</button></h3>'+
    formHtml+
    '<button class="modal-save" id="modalSaveBtn" type="button">保存</button>'+
    '</div>';
  document.body.appendChild(mask);
  const saveBtn=document.getElementById('modalSaveBtn');
  if(!saveBtn){
    console.error('[Modal] 保存按钮未找到，无法绑定事件');
    return;
  }
  saveBtn.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    try{
      const ok=onSave();
      if(ok!==false){
        mask.remove();
        _afterModalClose();
      }
    }catch(err){
      console.error('[Modal] 保存时出错:',err);
      alert('保存时出现错误：'+(err&&err.message?err.message:String(err)));
    }
  });

}

/* ========== 初始化 ========== */
/* 检查 URL 参数是否包含云同步配置 */
const fromURL=autoConfigFromURL();
/* 初始化 Supabase（如果有配置） */
initSupabase();

/* 初始渲染标志：确保只渲染一次，避免闪屏 */
let _initialRendered=false;
function initialRender(sectionId){
  if(_initialRendered)return;
  _initialRendered=true;
  switchSection(sectionId);
}

(async function(){
  if(sbClient){
    /* 等待云端数据，最多等 1.2 秒，超时则用本地数据先渲染 */
    let cloudData=null;
    try{
      cloudData=await Promise.race([
        loadFromCloud(),
        new Promise(r=>setTimeout(()=>r(null),1200))
      ]);
    }catch(e){
      console.error('[Sync] 初始加载异常:',e);
    }
    if(cloudData&&typeof cloudData==='object'){
      try{
        isRemoteUpdate=true;
        DB=cloudData;
        ensureKeys();
        /* 恢复精选提示词：云端条数少于初始条数时用初始数据补齐 */
        if(!Array.isArray(DB.aitechPrompts)||DB.aitechPrompts.length<INITIAL.aitechPrompts.length){
          DB.aitechPrompts=INITIAL.aitechPrompts;
        }
        localStorage.setItem(STORE_KEY,JSON.stringify(DB));
      }catch(e){
        console.error('[Sync] 初始化加载异常:',e);
      }finally{
        isRemoteUpdate=false;
      }
    }
    /* 只渲染一次：云端数据已就绪（或超时），用最终数据渲染 */
    initialRender('overview');
    subscribeCloud();
    startPolling();
    /* 3秒后解除初始化保护期，让实时订阅正常工作 */
    setTimeout(function(){ _initGracePeriod=false; },3000);
    /* 如果是通过分享链接打开的，显示连接成功提示 */
    if(fromURL){
      setTimeout(showConnectToast,500);
    }
  }else{
    /* 无云同步，直接渲染 */
    initialRender('overview');
  }
})();

/* ====== 边缘滑动手势：从屏幕左侧向右滑打开导航，从右向左滑关闭 ====== */
(function(){
  var startX=0,startY=0,swiping=false,edgeWidth=30;
  document.addEventListener('touchstart',function(e){
    if(window.innerWidth>768) return; /* 仅移动端 */
    var t=e.touches[0];
    var sb=document.getElementById('sidebar');
    var isOpen=sb&&sb.classList.contains('open');
    if(isOpen){
      /* 导航已打开，任何位置向左滑可关闭 */
      startX=t.clientX; startY=t.clientY; swiping='close';
    }else if(t.clientX<=edgeWidth){
      /* 导航关闭，从左边缘向右滑打开 */
      startX=t.clientX; startY=t.clientY; swiping='open';
    }else{
      swiping=false;
    }
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!swiping) return;
    var t=e.touches[0];
    var dx=t.clientX-startX;
    var dy=t.clientY-startY;
    if(swiping==='open'&&dx>20&&Math.abs(dx)>Math.abs(dy)*1.5){
      toggleSidebar(true);
      swiping=false;
    }else if(swiping==='close'&&dx<-20&&Math.abs(dx)>Math.abs(dy)*1.5){
      toggleSidebar(false);
      swiping=false;
    }
  },{passive:true});

  document.addEventListener('touchend',function(){
    swiping=false;
  },{passive:true});
})();

/* ========== 动态效果 JS ========== */
/* 按钮涟漪效果 */
document.addEventListener('click',function(e){
  var btn=e.target.closest('.btn');
  if(!btn) return;
  var rect=btn.getBoundingClientRect();
  var size=Math.max(rect.width,rect.height);
  var ripple=document.createElement('span');
  ripple.className='ripple';
  ripple.style.width=ripple.style.height=size+'px';
  ripple.style.left=(e.clientX-rect.left-size/2)+'px';
  ripple.style.top=(e.clientY-rect.top-size/2)+'px';
  btn.appendChild(ripple);
  setTimeout(function(){ripple.remove();},500);
},true);

/* 导航项涟漪 */
document.addEventListener('click',function(e){
  var item=e.target.closest('.nav-item');
  if(!item) return;
  var rect=item.getBoundingClientRect();
  var size=Math.max(rect.width,rect.height);
  var ripple=document.createElement('span');
  ripple.className='ripple';
  ripple.style.width=ripple.style.height=size+'px';
  ripple.style.left=(e.clientX-rect.left-size/2)+'px';
  ripple.style.top=(e.clientY-rect.top-size/2)+'px';
  item.appendChild(ripple);
  setTimeout(function(){ripple.remove();},500);
},true);

/* 侧栏浮粒子 */
(function(){
  var sidebar=document.querySelector('.sidebar');
  if(!sidebar) return;
  var container=document.createElement('div');
  container.className='sidebar-particles';
  sidebar.appendChild(container);
  var count=12;
  for(var i=0;i<count;i++){
    var p=document.createElement('span');
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*12)+'s';
    p.style.animationDelay=(Math.random()*10)+'s';
    p.style.opacity=(0.3+Math.random()*0.5);
    p.style.width=p.style.height=(2+Math.random()*4)+'px';
    container.appendChild(p);
  }
})();
</script>
