name: 同步飞书漫剧数据

on:
  schedule:
    # 每小时执行一次（北京时间每小时整点）
    - cron: '0 * * * *'
  # 支持手动触发
  workflow_dispatch:
  # 推送 main 分支时也执行一次
  push:
    branches:
      - main
    paths:
      - 'scripts/sync_feishu_manju.py'
      - '.github/workflows/sync-feishu.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 同步飞书数据
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          OUTPUT_FILE: feishu-manju.json
        run: python scripts/sync_feishu_manju.py

      - name: 提交并推送更新
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add feishu-manju.json
          # 只有文件有变化才提交
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "自动同步：飞书漫剧数据更新"
            git push
          fi
