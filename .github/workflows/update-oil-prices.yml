name: 自动更新油价数据

on:
  schedule:
    # 每6小时执行一次（北京时间 2/8/14/20 点）
    - cron: '0 1,7,13,19 * * *'
  # 支持手动触发
  workflow_dispatch:
  # 推送脚本修改时也执行一次
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch_oil_prices.py'
      - '.github/workflows/update-oil-prices.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 抓取最新油价数据
        run: python scripts/fetch_oil_prices.py

      - name: 提交并推送更新
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add oil-data.json
          # 只有文件有变化才提交
          if git diff --cached --quiet; then
            echo "油价数据无变化，跳过提交"
          else
            git commit -m "自动更新：全国油价数据 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
